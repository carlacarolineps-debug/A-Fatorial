  /* === MÓDULO 05 (Blindagem Financeira) — Administração Financeira & Mercado === */
  {
    id:'financas-admin', icon:'💵', glyph:'🏦', group:'financas',
    title:'Administração Financeira & Mercado',
    short:'O que é finanças, como o dinheiro circula no mercado e quem regula tudo isso — a base para decidir com o bolso.',
    tags:['Finanças','Mercado financeiro','Captação & Alocação'],
    xpReward:160,
    mentor:"Empresa não quebra por falta de vontade — quebra por falta de caixa. Entender finanças não é virar contador: é saber de onde o dinheiro vem, para onde vai e a que custo. Quem domina isso decide com clareza; quem não domina, decide no escuro.",
    steps:[
      {id:'fa1', kind:'conceito', title:'O que é finanças e administração financeira', body:`
        <p>Finanças, em poucas palavras, é a <b>arte e a ciência de gerir o dinheiro</b> (Gitman): os processos, instituições e instrumentos ligados à transferência de recursos entre pessoas, empresas e governo.</p>
        <p>A <b>administração financeira</b> tem uma função central: garantir o melhor processo de <b>captação</b> (financiamento — de onde vem o dinheiro) e de <b>alocação</b> (investimento — para onde ele vai) dos recursos de capital. O objetivo final é <b>criar valor</b> — e isso vale até para organizações sem fins lucrativos, que criam valor ao cumprir sua missão de forma sustentável.</p>
        <div class="callout"><span class="ic">🧭</span><div>A área de finanças se divide em três frentes: <b>mercado financeiro</b>, <b>finanças corporativas</b> (a empresa) e <b>finanças pessoais</b>. Aqui o foco é o dinheiro do seu negócio.</div></div>
      `},
      {id:'fa2', kind:'conceito', title:'O mercado financeiro e quem regula', body:`
        <p>O mercado financeiro é, de forma simples, o "lugar" onde a moeda é negociada. Ele se divide em quatro:</p>
        <ul>
          <li><b>Monetário</b> (open market) — operações de curtíssimo prazo (dias), como um depósito bancário.</li>
          <li><b>Crédito</b> — conecta quem precisa de recursos a quem tem (crédito para capital de giro, aquisição de bens, imobiliário).</li>
          <li><b>Capitais</b> — onde se negociam ações, debêntures e papéis; o investidor vira sócio e participa de lucros (ou prejuízos).</li>
          <li><b>Câmbio</b> — compra e venda de moeda estrangeira, regulado pelo Banco Central.</li>
        </ul>
        <h4>Instituição financeira e os órgãos reguladores</h4>
        <p>A instituição financeira é o <b>intermediário</b>: capta de quem tem dinheiro sobrando (agente superavitário) e empresta a quem precisa (agente deficitário). Para isso ser seguro, existem os reguladores: <b>CMN</b> (órgão superior, define a política da moeda e do crédito), <b>Bacen</b> (zela pela estabilidade da moeda e controla o crédito) e <b>CVM</b> (regula o mercado de capitais).</p>
      `},
      {id:'fa3', kind:'pratica', title:'Onde o seu negócio se posiciona', body:`
        <p>Traga para a sua realidade:</p>
        <ul>
          <li><b>Você é agente deficitário ou superavitário hoje?</b> Precisa captar recursos ou tem caixa para investir?</li>
          <li><b>Qual mercado/instrumento você usa?</b> Crédito para capital de giro? Aplicação no mercado monetário? Cada um tem custo e prazo diferentes.</li>
          <li><b>Você decide com base em número ou no "achismo"?</b> Saber de onde vem e para onde vai o dinheiro muda o jogo.</li>
        </ul>
        <div class="callout"><span class="ic">📅</span><div>Anote no <b>Plano 30d</b>: sua posição (capta ou investe), o instrumento que usa hoje e uma decisão financeira que estava no "achismo" e agora você vai basear em dados.</div></div>
      `}
    ],
    quiz:[
      {q:'A função central da administração financeira é:', a:['Apenas pagar contas em dia','Garantir o melhor processo de captação (financiamento) e alocação (investimento) de recursos, criando valor','Vender o máximo possível','Reduzir a equipe para cortar custos'], correct:1, why:'Administração financeira cuida da captação e da alocação de recursos com o objetivo de criar valor.'},
      {q:'O mercado financeiro se divide em quatro. Qual é o de curtíssimo prazo, também chamado de open market?', a:['Mercado de capitais','Mercado de câmbio','Mercado monetário','Mercado de crédito'], correct:2, why:'O mercado monetário (open market) concentra as operações de curtíssimo prazo, como um depósito bancário.'},
      {q:'Numa instituição financeira, o agente DEFICITÁRIO é aquele que:', a:['Tem dinheiro sobrando para investir','Precisa de recursos (toma emprestado)','Regula o sistema','Emite ações'], correct:1, why:'O agente deficitário precisa de recursos; o superavitário tem recursos sobrando. O banco intermedeia os dois.'},
      {q:'Qual órgão regula especificamente o mercado de capitais (ações, debêntures)?', a:['CMN','Bacen','CVM','Receita Federal'], correct:2, why:'A CVM (Comissão de Valores Mobiliários) regula e fiscaliza o mercado de capitais no Brasil.'}
    ],
    challenge:'Responda em 3 frases: hoje meu negócio é agente ___ (deficitário/superavitário); o instrumento financeiro que mais uso é ___; a decisão financeira que vou tirar do achismo é ___. Salve no Plano 30d.'
  },

  /* === MÓDULO 05 (Blindagem Financeira) — Demonstrações Financeiras === */
  {
    id:'financas-demonstracoes', icon:'📊', glyph:'📑', group:'financas',
    title:'Demonstrações Financeiras',
    short:'Ler o balanço, o resultado e o caixa do seu negócio — e projetar cenários antes de decidir.',
    tags:['Balanço','DRE','Fluxo de Caixa'],
    xpReward:170,
    mentor:"Os números não mentem — mas só falam com quem sabe ouvir. Balanço, DRE e fluxo de caixa contam três histórias diferentes do mesmo negócio. Quem lê as três decide com fato; quem não lê, decide com sorte.",
    steps:[
      {id:'fd1', kind:'conceito', title:'Informação que vira decisão', body:`
        <p>Gerir é decidir, e decidir exige <b>informação</b>. Para servir à decisão, a informação gerencial precisa de três qualidades: <b>confiabilidade</b> (refletir a realidade), <b>abrangência</b> (dar a visão completa) e <b>tempestividade</b> (chegar na hora certa).</p>
        <p>Entre todas as informações de um negócio, as <b>demonstrações financeiras</b> são as principais. Elas evidenciam como o lucro foi formado, onde a empresa investe e como ela se financia.</p>
        <div class="callout"><span class="ic">⚖️</span><div>Por lei (6.404/76, estendida pela 11.638/07), sociedades por ações e empresas de grande porte são obrigadas a publicar demonstrações. Mesmo sem ser obrigado, todo negócio deveria ter as suas — é assim que se enxerga a saúde real.</div></div>
      `},
      {id:'fd2', kind:'conceito', title:'As principais demonstrações', body:`
        <p>Cada demonstração conta uma parte da história:</p>
        <ul>
          <li><b>Balanço Patrimonial (BP)</b> — a "foto" do negócio numa data: o <b>ativo</b> (bens e direitos = onde o recurso está aplicado) e o <b>passivo</b> (obrigações = de onde o recurso veio), mais o patrimônio líquido.</li>
          <li><b>DRE (Resultado do Exercício)</b> — o "filme" do período: receitas menos custos e despesas, revelando o <b>lucro ou prejuízo</b>.</li>
          <li><b>DFC (Fluxo de Caixa)</b> — como o dinheiro de fato entrou e saiu (recebimentos e pagamentos). Lucro não é caixa: dá para ter lucro no papel e faltar dinheiro.</li>
          <li><b>DLPA</b> e <b>DVA</b> — variações do lucro acumulado e a riqueza gerada e distribuída pela empresa.</li>
        </ul>
      `},
      {id:'fd3', kind:'pratica', title:'Projetar antes de decidir', body:`
        <p>As <b>demonstrações projetadas</b> usam os mesmos procedimentos das reais — a diferença é que as reais olham o passado (o que ocorreu) e as projetadas olham o <b>futuro possível</b> (o que pode ocorrer se as metas forem cumpridas).</p>
        <p>Projetar uma DRE, por exemplo, mostra qual seria o lucro ao fim do ano se o plano der certo — e permite <b>comparar estratégias</b> antes de gastar o dinheiro de verdade.</p>
        <div class="callout"><span class="ic">📅</span><div>Escolha <b>uma</b> das três demonstrações (BP, DRE ou caixa) que hoje você não acompanha e comprometa-se a montar a sua neste mês. Salve no <b>Plano 30d</b>.</div></div>
      `}
    ],
    quiz:[
      {q:'O Balanço Patrimonial apresenta o ativo e o passivo. O ATIVO representa:', a:['As obrigações da empresa','Os bens e direitos (onde os recursos estão aplicados)','Apenas o lucro do período','As vendas do mês'], correct:1, why:'No balanço, o ativo reúne bens e direitos (aplicações de recursos); o passivo são as obrigações (origens dos recursos).'},
      {q:'Qual demonstração revela o lucro ou prejuízo do período, a partir de receitas, custos e despesas?', a:['Balanço Patrimonial','DRE (Demonstração do Resultado do Exercício)','DFC (Fluxo de Caixa)','DVA'], correct:1, why:'A DRE apura o lucro ou prejuízo do exercício com base em receitas, custos e despesas.'},
      {q:'Por que lucro não é a mesma coisa que caixa?', a:['Porque lucro é sempre maior que o caixa','Porque o fluxo de caixa mostra o dinheiro que de fato entrou e saiu; é possível ter lucro no papel e faltar dinheiro','Porque caixa só existe em grandes empresas','Não há diferença entre os dois'], correct:1, why:'A DRE registra o resultado pelo regime de competência; o caixa (DFC) mostra a movimentação real. Dá para ter lucro e faltar caixa.'},

  {id:'equilibrio', icon:'🎯', mod:'financas', title:'Calculadora de Ponto de Equilíbrio',
   desc:'Informe faturamento e custos — a ferramenta diz quanto você precisa vender só para não ter prejuízo.',
   intro:'Em 3 números, descubra o seu ponto de equilíbrio: o faturamento mínimo para o negócio se pagar.',
   steps:[
     {k:'receita',type:'number',q:'Faturamento mensal médio (R$)',ph:'Ex.: 30000'},
     {k:'cvar',type:'number',q:'Custos variáveis mensais (R$)',ph:'Ex.: 12000',hint:'Matéria-prima, comissões, taxas de cartão — o que varia com as vendas.'},
     {k:'cfix',type:'number',q:'Custos fixos mensais (R$)',ph:'Ex.: 10000',hint:'Aluguel, salários, contas fixas.'}
   ],
   build:(d)=>{
     const rec=+d.receita||0,cv=+d.cvar||0,cf=+d.cfix||0;
     if(rec<=0||rec<=cv) return '<p>Informe um faturamento maior que os custos variáveis para calcular.</p>';
     const imc=(rec-cv)/rec; const pe=cf/imc; const folga=rec-pe;
     return `<h4>🎯 Ponto de equilíbrio</h4>
     <div class="metric"><b>Margem de contribuição</b><span>${(imc*100).toFixed(0)}%</span></div>
     <div class="metric"><b>Ponto de equilíbrio (mês)</b><span class="big" style="font-size:18px">${tgMoney(pe)}</span></div>
     <div class="metric"><span>Seu faturamento hoje</span><b>${tgMoney(rec)}</b></div>
     <div class="tg-flag ${folga>=0?'good':'warn'}">${folga>=0?`Você está ACIMA do equilíbrio — sobram ${tgMoney(folga)} depois de cobrir os custos. 👏`:`Você está ABAIXO do equilíbrio. Faltam ${tgMoney(-folga)} de faturamento por mês só para empatar. Foque em vender mais ou cortar custo fixo.`}</div>
     <p class="tg-hint">Margem = (faturamento − custos variáveis) ÷ faturamento. Ponto de equilíbrio = custo fixo ÷ margem.</p>`;
   }}

const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const el = (t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};

let saveTimer=null;
async function save(){ clearTimeout(saveTimer); saveTimer=setTimeout(async()=>{ await Store.set(KEY, JSON.stringify(S)); if(window.OB) OB.push(S); }, 250); }

function levelForXp(xp){ let lv=1; for(let i=0;i<LEVELS.length;i++){ if(xp>=LEVELS[i]) lv=i+1; } return Math.min(lv, LEVELS.length); }
function xpInLevel(xp){ const lv=levelForXp(xp); const lo=LEVELS[lv-1]??0; const hi=LEVELS[lv]??(lo+1000); return {lo,hi,pct: Math.min(100, Math.round(((xp-lo)/(hi-lo))*100))}; }

function addXp(amount, label){
  const before=S.level;
  S.xp+=amount;
  const lv=levelForXp(S.xp);
  S.log.unshift({t:Date.now(), type:'xp', label:`+${amount} XP — ${label}`});
  if(lv>before){ S.level=lv; setTimeout(()=>levelUpModal(lv), 400); }
  S.level=lv;
  toast('✨', `+${amount} XP`, label);
  checkTrophies();
  save(); renderTop();
}

function grantTrophy(id){
  if(S.trophies[id]) return false;
  S.trophies[id]=Date.now();
  const t=TROPHIES.find(x=>x.id===id);
  S.log.unshift({t:Date.now(), type:'trophy', label:`Conquista: ${t.title}`});
  pushNotif(t.em, 'Conquista desbloqueada', t.title);
  setTimeout(()=>toast(t.em, 'Conquista desbloqueada!', t.title), 700);
  save();
  return true;
}

function pushNotif(em,title,sub){
  S.notifs.unshift({t:Date.now(), em, title, sub, read:false});
  if(S.notifs.length>40) S.notifs.length=40;
  renderTop();
}

function checkTrophies(){
  const doneModules = MODULES.filter(m=>S.modules[m.id]?.completed).length;
  const anyStep = MODULES.some(m=>S.modules[m.id]?.steps && Object.keys(S.modules[m.id].steps).length>0);
  if(anyStep) grantTrophy('first_step');
  if(doneModules>=1) grantTrophy('first_module');
  if(doneModules>=3) grantTrophy('three_modules');
  if(doneModules>=Math.ceil(MODULES.length/2)) grantTrophy('half_way');
  if(doneModules>=MODULES.length) grantTrophy('all_modules');
  if(S.level>=5) grantTrophy('level5');
  if(MODULES.some(m=>S.modules[m.id]?.quiz?.score===S.modules[m.id]?.quiz?.total && S.modules[m.id]?.quiz?.total>0)) grantTrophy('quiz_perfect');
  if(Object.keys(S.surveys).length>0) grantTrophy('survey_done');
  if(Object.keys(S.surveys).length>=SURVEYS.length) grantTrophy('all_surveys');
  if(Object.keys(S.tools).length>0) grantTrophy('tool_used');
  if(Object.keys(S.tools).length>=TOOLS.length) grantTrophy('all_tools');
  if(MODULES.some(m=>S.modules[m.id]?.challengeDone)) grantTrophy('challenger');
  if(S.diary.length>0) grantTrophy('reflective');
  if(S.plan.length>0) grantTrophy('planner');
  if(S.diagnostic) grantTrophy('diagnosed');
  if(S.streak>=3) grantTrophy('streak3');
  if(S.streak>=7) grantTrophy('streak7');
}

/* ---------- streak (ofensiva de dias) ---------- */
function dayKey(t){ const d=new Date(t); return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate(); }
function touchStreak(){
  const today=dayKey(Date.now());
  if(S.lastActive===today) return; // já contou hoje
  const yest=dayKey(Date.now()-86400000);
  if(S.lastActive===yest){ S.streak=(S.streak||0)+1; }
  else if(S.lastActive){ // quebrou
    if(S.streak>=1){ pushNotif('🌅','Que bom te ver de volta','Sua jornada continua de onde parou.'); grantTrophy('comeback'); }
    S.streak=1;
  } else { S.streak=1; }
  S.lastActive=today;
  checkTrophies(); save();
}

/* unlock: módulo i exige módulo i-1 completo (primeiro sempre livre) */
function isUnlocked(idx){
  const m=MODULES[idx];
  const earlier=MODULES.filter((x,i)=>i<idx && x.group===m.group);
  if(earlier.length===0) return true;            // 1ª trilha do módulo: sempre liberada
  const prev=earlier[earlier.length-1];           // trilha anterior DENTRO do mesmo módulo
  return !!S.modules[prev.id]?.completed;
}

/* ---------- toasts ---------- */
function toast(em, title, sub){
  const z=$('#toastZone');
  const t=el('div','toast',`<span class="em">${em}</span><div><b>${title}</b>${sub?`<small>${sub}</small>`:''}</div>`);
  z.appendChild(t);
  setTimeout(()=>{ t.style.transition='.4s'; t.style.opacity='0'; t.style.transform='translateY(10px)'; setTimeout(()=>t.remove(),400); }, 3200);
}

function go(view){
  if(view!=='lesson') current=view;
  $$('.view').forEach(v=>v.classList.remove('active'));
  $('#view-'+view).classList.add('active');
  $$('.tab').forEach(t=>t.classList.toggle('active', t.dataset.v===current));
  window.scrollTo({top:0,behavior:'smooth'});
  S.visited[view]=true; touchStreak(); save();
  if(view==='home') renderHome();
  if(view==='trilhas') renderTrilhas();
  if(view==='ferramentas') renderFerramentas();
  if(view==='gestao') renderGestao();
  if(view==='pesquisas') renderPesquisas();
  if(view==='diario') renderDiario();
  if(view==='plano') renderPlano();
  if(view==='conquistas') renderConquistas();
  if(view==='mentora') renderMentora();
}

function renderTabs(){
  const t=$('#tabs'); t.innerHTML='';
  NAV.forEach(n=>{
    const b=el('button','tab',`<span class="ic">${n.ic}</span>${n.label}`);
    b.dataset.v=n.id; b.onclick=()=>go(n.id);
    t.appendChild(b);
  });
}

function renderTop(){
  const z=$('#topStats');
  if(!S.name){ z.innerHTML=''; return; }
  const lp=xpInLevel(S.xp);
  const unread=(S.notifs||[]).filter(n=>!n.read).length;
  const streakChip = S.streak>=2 ? `<div class="chip streak" title="${S.streak} dias seguidos"><span class="ic">🔥</span><span>${S.streak}</span></div>` : '';
  z.innerHTML=`
    ${streakChip}
    <div class="chip lvl"><span class="ic">⭐</span><span class="lbl">Nv ${S.level} · ${LEVEL_NAMES[S.level-1]}</span></div>
    <div class="chip xp"><span class="ic">✨</span><span>${S.xp} XP</span></div>
    <button class="bell" onclick="openNotifs()" title="Notificações">🔔${unread?`<span class="dot-badge">${unread}</span>`:''}</button>
    <div class="avatar" title="${S.name}" onclick="go('mentora')">${(S.name[0]||'?').toUpperCase()}</div>`;
}

function openNotifs(){
  (S.notifs||[]).forEach(n=>n.read=true); save(); renderTop();
  const list = (S.notifs||[]).length
    ? S.notifs.map(n=>`<div style="display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line-soft)">
        <span style="font-size:20px">${n.em}</span>
        <div style="flex:1"><b style="font-size:14px">${n.title}</b>${n.sub?`<div class="muted tiny" style="margin-top:2px">${n.sub}</div>`:''}</div>
        <span class="tiny muted">${timeAgo(n.t)}</span></div>`).join('')
    : '<p class="muted tiny" style="margin:0">Nenhuma novidade ainda. Conforme você avança, seus marcos aparecem aqui.</p>';
  modal(`<p class="eyebrow">Notificações</p><h3>🔔 Seus marcos</h3><div class="mt16">${list}</div>
    <div class="divider"></div><button class="btn ghost" onclick="closeModal()">Fechar</button>`);
}

function startJourney(){
  const n=$('#onbName').value.trim();
  if(!n){ $('#onbName').focus(); $('#onbName').style.borderColor='var(--coral)'; return; }
  S.name=n; S.role=$('#onbRole').value.trim()||null; S.company=$('#onbCompany').value.trim()||null;

function greeting(){ const h=new Date().getHours(); return h<12?'Bom dia':h<18?'Boa tarde':'Boa noite'; }
function mantraOfDay(){ const d=new Date(); const seed=d.getFullYear()*1000+ (d.getMonth()*31+d.getDate()); return MANTRAS[seed % MANTRAS.length]; }
function nextActionCard(){
  const done=MODULES.filter(m=>S.modules[m.id]?.completed).length;
  const total=MODULES.length;
  // prioridade de sugestão inteligente
  let icon,title,desc,btn,act;
  if(!S.diagnostic){ icon='🧭'; title='Faça seu autodiagnóstico'; desc='Descubra seus pontos fortes e onde crescer. Vira seu "antes" para medir evolução.'; btn='Começar diagnóstico'; act="openDiagnostic(false)"; }
  else if(done<total){ let ni=MODULES.findIndex((m,i)=>isUnlocked(i)&&!S.modules[m.id]?.completed); if(ni<0)ni=0; const m=MODULES[ni];
    icon=m.icon; title='Sua próxima trilha: '+m.title; desc=m.short; btn='Continuar trilha'; act="openLesson('"+m.id+"')"; }
  else if(!S.retake){ icon='📈'; title='Meça sua evolução'; desc='Você concluiu todas as trilhas! Refaça o diagnóstico e veja o quanto avançou desde o início.'; btn='Ver minha evolução'; act="finishJourney()"; }
  else if((S.plan||[]).filter(p=>!p.done).length>0){ icon='🎯'; title='Avance seu Plano de 30 dias'; desc='Você tem ações pendentes. Conhecimento vira resultado quando ganha prazo.'; btn='Abrir meu plano'; act="go('plano')"; }
  else { icon='🛠️'; title='Aprofunde com as ferramentas'; desc='Releia uma trilha ou use as ferramentas práticas com situações novas do seu dia a dia.'; btn='Ver ferramentas'; act="go('ferramentas')"; }
  return `<div class="card pad-lg" style="display:flex;gap:18px;align-items:center;flex-wrap:wrap;border-color:rgba(245,181,61,.3);background:linear-gradient(135deg,rgba(245,181,61,.06),var(--ink-2))">
    <div style="width:54px;height:54px;border-radius:14px;flex:none;display:grid;place-items:center;font-size:26px;background:rgba(245,181,61,.12);border:1px solid rgba(245,181,61,.3)">${icon}</div>

    <button class="btn primary" onclick="${act}">${btn} →</button>
  </div>`;
}
function homeMentorTip(done,total){
  if(done===0) return 'Não tente decorar tudo. Comece pela primeira trilha, aplique uma coisa no seu dia, e volte. Conhecimento que não vira prática evapora.';
  if(done===total) return 'Você percorreu a constelação inteira. Agora o verdadeiro trabalho: liderar pessoas com isso. Volte às ferramentas sempre que precisar de um norte.';
  if(done>=total/2) return 'Você já passou da metade. Repare como os temas conversam: clima revela cultura, conflito pede negociação, motivação sustenta liderança. Tudo é um sistema.';
  return 'Belo começo. Use as ferramentas práticas enquanto aprende — é nelas que a teoria vira competência de verdade.';
}
function renderLog(){
  if(!S.log.length) return '<p class="muted tiny" style="margin:0">Suas conquistas e avanços aparecerão aqui conforme você avança.</p>';
  return '<div style="display:flex;flex-direction:column;gap:2px">'+S.log.slice(0,8).map(e=>{
    const ic = e.type==='trophy'?'🏆':e.type==='xp'?'✨':e.type==='start'?'🚀':e.type==='module'?'✅':e.type==='survey'?'📊':e.type==='tool'?'🛠️':e.type==='diary'?'📔':'•';
    return `<div style="display:flex;gap:11px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-soft)">
      <span style="font-size:16px">${ic}</span>
      <span style="flex:1;font-size:13.5px">${e.label}</span>
      <span class="tiny muted">${timeAgo(e.t)}</span></div>`;
  }).join('')+'</div>';
}
function timeAgo(t){ const s=Math.floor((Date.now()-t)/1000); if(s<60)return 'agora'; const m=Math.floor(s/60); if(m<60)return m+'min'; const h=Math.floor(m/60); if(h<24)return h+'h'; return Math.floor(h/24)+'d'; }

   =================================================================== */
function moduleStatus(m,idx){
  if(!isUnlocked(idx)) return 'lock';
  if(S.modules[m.id]?.completed) return 'done';
  if(S.modules[m.id]?.steps && Object.keys(S.modules[m.id].steps).length>0) return 'prog';
  return 'open';
}
function moduleProgress(m){
  const st=S.modules[m.id]; if(!st) return 0;
  const totalSteps=m.steps.length+1; // +quiz
  let done=st.steps?Object.keys(st.steps).length:0;
  if(st.quiz?.done) done++;
  return Math.round((done/totalSteps)*100);
}

function trilhaCard(m,idx){
  const st=moduleStatus(m,idx);
  const prog=moduleProgress(m);
  const badge = st==='done'?'<span class="badge-status st-done">Concluída</span>'
    : st==='prog'?'<span class="badge-status st-prog">Em andamento</span>'
    : st==='lock'?'<span class="badge-status st-lock">Bloqueada</span>'
    : '<span class="badge-status st-prog" style="opacity:.7">Disponível</span>';
  const key=(m.title+' '+m.short+' '+(m.tags||[]).join(' ')).toLowerCase();
  return `<div class="module" data-key="${escAttr(key)}">
      ${st==='done'?'<div class="ribbon">FEITA</div>':''}
      <div class="top">
        <div class="num">TRILHA ${String(idx+1).padStart(2,'0')}</div>
        <h3>${m.icon} ${m.title}</h3>
        <div class="desc">${m.short}</div>
        <div class="pill-row" style="margin-top:12px">${(m.tags||[]).map(t=>`<span class="pill">${t}</span>`).join('')}</div>
      </div>
      <div class="meta">
        <span>📖 ${m.steps.length} aulas</span>
        <span>🧠 ${m.quiz.length} quiz</span>
        <span class="pill amber" style="margin-left:auto">+${m.xpReward} XP</span>
      </div>
      <div class="barwrap"><div class="bar"><i style="width:${prog}%"></i></div></div>
      <div class="foot">${badge}
        <button class="btn ${st==='done'?'ghost':'primary'} sm" ${st==='lock'?'disabled':''} onclick="openLesson('${m.id}')">${st==='done'?'Revisar':st==='prog'?'Continuar':'Abrir'}</button>
      </div>
      ${st!=='lock' && DEEP_TESTS[m.id]?`<button class="btn ghost sm" style="width:100%;justify-content:center;margin-top:10px" onclick="openDeepTest('${m.id}')">🧠 Teste Profundo${S.deepTests?.[m.id]?.at?' · feito ✓':''}</button>`:''}
      ${st!=='lock'?`<button class="btn sage sm" style="width:100%;justify-content:center;margin-top:8px" onclick="applyTrilha('${m.id}')">🎯 Aplicar na prática${S.modules[m.id]?.challengeDone?' ✓':''}</button>`:''}
      ${st==='lock'?`<div class="lockwrap"><div class="lk"><div class="ic">🔒</div><small>Conclua a trilha anterior para desbloquear.</small></div></div>`:''}
    </div>`;
}
function escAttr(s){ return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }
function filterTrilhas(q){
  trilhaQuery=q||'';
  const s=(q||'').trim().toLowerCase();
  document.querySelectorAll('#view-trilhas .module[data-key]').forEach(c=>{
    c.style.display = (!s || c.dataset.key.includes(s)) ? '' : 'none';
  });
}

let lessonStep=0; // 0..steps.length-1 = aulas; steps.length = quiz
function openLesson(id){
  lessonModuleId=id; lessonStep=0;
  if(!S.modules[id]) S.modules[id]={steps:{},quiz:null,completed:false};
  go('lesson');
  renderLesson();
}
function renderLesson(){
  const m=MODULES.find(x=>x.id===lessonModuleId);
  const idx=MODULES.findIndex(x=>x.id===lessonModuleId);
  const st=S.modules[m.id];
  const v=$('#view-lesson');
  v.innerHTML=`
  <button class="btn ghost sm" onclick="go('trilhas')">← Todas as trilhas</button>
  <div class="lesson-head" style="margin-top:18px">
    <div class="glyph">${m.glyph}</div>
    <div style="flex:1;min-width:240px">
      <div class="num" style="font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--mute-2)">TRILHA ${String(idx+1).padStart(2,'0')} · +${m.xpReward} XP</div>
      <h1 class="page" style="font-size:30px;margin:6px 0 6px">${m.title}</h1>
      <p class="muted" style="margin:0">${m.short}</p>
    </div>
  </div>

  <div class="mentor-note">
    <div class="ava">CC</div>
    <div class="mn-body"><b>${MENTOR_NAME} orienta</b><p>"${m.mentor}"</p></div>
  </div>

  <div class="grid" style="grid-template-columns:300px 1fr;gap:22px;align-items:start" id="lessonGrid">
    <div class="card" style="position:sticky;top:120px">
      <div class="steps" id="stepsList"></div>
    </div>
    <div id="stepContent"></div>
  </div>
  ${signature()}`;
  // responsive: stack on small
  if(window.innerWidth<820){ $('#lessonGrid').style.gridTemplateColumns='1fr'; $('#stepsList').parentElement.style.position='static'; }
  renderStepsList();
  renderStepContent();
}
function renderStepsList(){
  const m=MODULES.find(x=>x.id===lessonModuleId);
  const st=S.modules[m.id];
  const list=$('#stepsList'); list.innerHTML='';
  m.steps.forEach((s,i)=>{
    const done=!!st.steps[s.id];
    const e=el('div','step'+(i===lessonStep?' active':'')+(done?' done':''));
    e.innerHTML=`<div class="dot">${done?'✓':i+1}</div>
      <div class="stepbody"><div class="kind">${s.kind}</div><b>${s.title}</b></div>
      <span class="arrow">→</span>`;
    e.onclick=()=>{ lessonStep=i; renderStepsList(); renderStepContent(); window.scrollTo({top:300,behavior:'smooth'}); };
    list.appendChild(e);
  });
  // quiz step
  const qi=m.steps.length;
  const qdone=st.quiz?.done;
  const e=el('div','step'+(lessonStep===qi?' active':'')+(qdone?' done':''));
  e.innerHTML=`<div class="dot">${qdone?'✓':'🧠'}</div>
    <div class="stepbody"><div class="kind">quiz</div><b>Quiz da trilha</b></div><span class="arrow">→</span>`;
  e.onclick=()=>{ lessonStep=qi; renderStepsList(); renderStepContent(); window.scrollTo({top:300,behavior:'smooth'}); };
  list.appendChild(e);
}
function renderStepContent(){
  const m=MODULES.find(x=>x.id===lessonModuleId);
  const st=S.modules[m.id];
  const c=$('#stepContent');
  if(lessonStep<m.steps.length){
    const s=m.steps[lessonStep];
    const done=!!st.steps[s.id];
    c.innerHTML=`<div class="card pad-lg">
      <p class="eyebrow">${s.kind} · aula ${lessonStep+1} de ${m.steps.length}</p>
      <h2 class="sec" style="margin:0 0 14px">${s.title}</h2>
      <div class="content-block">${s.body}</div>
      <div class="divider"></div>
      <div class="btn-row">
        ${lessonStep>0?`<button class="btn ghost sm" onclick="prevStep()">← Anterior</button>`:''}
        <button class="btn ${done?'ghost':'sage'} sm" onclick="completeStep('${s.id}')">${done?'✓ Concluída':'Marcar como lida (+'+stepXp(m)+' XP)'}</button>
        <button class="btn primary sm" onclick="nextStep()" style="margin-left:auto">Próxima →</button>
      </div>
    </div>`;
  } else {
    renderQuiz();
  }
}
function stepXp(m){ return Math.round(m.xpReward*0.18); }
function prevStep(){ if(lessonStep>0){lessonStep--; renderStepsList(); renderStepContent(); window.scrollTo({top:300,behavior:'smooth'});} }
function nextStep(){ const m=MODULES.find(x=>x.id===lessonModuleId); if(lessonStep<m.steps.length){lessonStep++; renderStepsList(); renderStepContent(); window.scrollTo({top:300,behavior:'smooth'});} }
function completeStep(sid){
  const m=MODULES.find(x=>x.id===lessonModuleId);
  const st=S.modules[m.id];
  if(!st.steps[sid]){ st.steps[sid]=true; addXp(stepXp(m), `Aula concluída — ${m.title}`); }
  renderStepsList(); renderStepContent();
}

/* ---------- quiz ---------- */
let quizAnswers={};
function renderQuiz(){
  const m=MODULES.find(x=>x.id===lessonModuleId);
  const st=S.modules[m.id];
  quizAnswers={};
  const allStepsDone=m.steps.every(s=>st.steps[s.id]);
  const c=$('#stepContent');
  c.innerHTML=`<div class="card pad-lg">
    <p class="eyebrow">Quiz · fixação</p>
    <h2 class="sec" style="margin:0 0 6px">Quiz da trilha ${m.title}</h2>
    <p class="muted tiny" style="margin:0 0 20px">Responda para fixar. ${!allStepsDone?'<b style="color:var(--amber)">Dica: leia as aulas antes para garantir o gabarito.</b>':'Você já leu todas as aulas — mostre o que aprendeu.'}</p>
    <div id="quizForm"></div>
    <div class="divider"></div>
    <button class="btn primary" id="quizSubmit" onclick="submitQuiz()">Conferir respostas</button>
    <div id="quizResult"></div>
  </div>`;
  const qf=$('#quizForm');
  m.quiz.forEach((q,qi)=>{
    const block=el('div','quiz-q');
    block.innerHTML=`<div class="qnum">PERGUNTA ${qi+1} / ${m.quiz.length}</div><h4>${q.q}</h4>`;
    q.a.forEach((opt,oi)=>{
      const o=el('div','opt');
      o.innerHTML=`<div class="box"></div><div class="txt">${opt}</div>`;
      o.onclick=()=>{ if(st.quiz?.done) return; quizAnswers[qi]=oi; [...qf.querySelectorAll(`[data-q="${qi}"]`)].forEach(x=>x.classList.remove('sel')); o.classList.add('sel'); };
      o.dataset.q=qi; o.dataset.o=oi;
      block.appendChild(o);
    });
    const fb=el('div','feedback'); fb.dataset.fb=qi; block.appendChild(fb);
    qf.appendChild(block);
  });
  if(st.quiz?.done){ // already done — show result
    showQuizReview(m,st);
  }
}
function submitQuiz(){
  const m=MODULES.find(x=>x.id===lessonModuleId);
  const st=S.modules[m.id];
  if(Object.keys(quizAnswers).length<m.quiz.length){ toast('⚠️','Responda todas','Faltam perguntas para conferir.'); return; }
  let score=0;
  m.quiz.forEach((q,qi)=>{
    const chosen=quizAnswers[qi];
    const opts=$$(`#quizForm .opt[data-q="${qi}"]`);
    opts.forEach(o=>{ o.style.pointerEvents='none'; const oi=+o.dataset.o;
      if(oi===q.correct) o.classList.add('correct');
      if(oi===chosen && oi!==q.correct) o.classList.add('wrong');
    });
    const fb=$(`#quizForm .feedback[data-fb="${qi}"]`);
    const ok=chosen===q.correct; if(ok)score++;
    fb.className='feedback show '+(ok?'ok':'no');
    fb.innerHTML=(ok?'✓ Correto. ':'✗ ')+q.why;
  });
  st.quiz={score,total:m.quiz.length,done:true};
  const bonus = Math.round(m.xpReward*0.4*(score/m.quiz.length))+10;
  addXp(bonus, `Quiz ${m.title} — ${score}/${m.quiz.length}`);
  $('#quizSubmit').style.display='none';
  const r=$('#quizResult');
  r.innerHTML=`<div class="card" style="margin-top:20px;text-align:center;border-color:rgba(245,181,61,.4)">
    <div style="font-size:40px">${score===m.quiz.length?'🎯':score>=m.quiz.length/2?'👏':'📚'}</div>
    <h3 style="font-family:var(--serif);margin:6px 0">${score}/${m.quiz.length} acertos</h3>
    <p class="muted tiny">${score===m.quiz.length?'Gabaritou! Tiro certeiro.':score>=m.quiz.length/2?'Bom trabalho. Revise os que errou.':'Vale revisar as aulas e tentar fixar melhor.'}</p>
  </div>`;
  maybeCompleteModule(m);
  renderStepsList();
}
function showQuizReview(m,st){
  m.quiz.forEach((q,qi)=>{
    const opts=$$(`#quizForm .opt[data-q="${qi}"]`);
    opts.forEach(o=>{ o.style.pointerEvents='none'; const oi=+o.dataset.o; if(oi===q.correct) o.classList.add('correct'); });
    const fb=$(`#quizForm .feedback[data-fb="${qi}"]`); fb.className='feedback show ok'; fb.innerHTML='✓ '+q.why;
  });
  $('#quizSubmit').style.display='none';
  $('#quizResult').innerHTML=`<div class="card" style="margin-top:20px;text-align:center"><p class="muted" style="margin:0">Você já completou este quiz (${st.quiz.score}/${st.quiz.total}). Gabarito revelado acima.</p></div>`;
}
function maybeCompleteModule(m){
  const st=S.modules[m.id];
  const allSteps=m.steps.every(s=>st.steps[s.id]);
  if(allSteps && st.quiz?.done && !st.completed){
    st.completed=true;
    S.log.unshift({t:Date.now(),type:'module',label:`Trilha concluída: ${m.title}`});
    addXp(m.xpReward, `Trilha completa — ${m.title}`);
    setTimeout(()=>moduleCompleteModal(m),600);
    save();
  } else if(!allSteps){
    setTimeout(()=>toast('📖','Quase lá','Leia e marque todas as aulas para concluir a trilha.'),300);
  }
}

function applyCommit(modId){
  const m=MODULES.find(x=>x.id===modId); if(!m) return;
  const opts=[m.challenge, ...(APPLY_ACTIONS[m.group]||[])].filter(Boolean);
  openComposer({
    eyebrow:'Da teoria à prática', title:'🎯 Seu compromisso',
    intro:'Marque o que você vai aplicar desta trilha. Vira ação no seu Plano de 30 dias, com prazo — sem digitar.',
    confirmLabel:'Comprometer no Plano',
    steps:[
      {k:'acoes',type:'multi',q:'O que você vai fazer na prática? (marque)',more:true,opts:opts.map(v=>({v,label:v}))},
      {k:'prazo',type:'pick',q:'Até quando?',opts:[{v:'7',label:'7 dias'},{v:'14',label:'14 dias'},{v:'30',label:'30 dias'}]}
    ],
    onConfirm:(d)=>{
      const picks=(d.acoes||[]); if(!picks.length){ toast('⚠️','Escolha ao menos uma','Marque o que vai aplicar.'); return; }
      const days=+(d.prazo||'30');
      picks.forEach((t,k)=>S.plan.push({id:'p'+Date.now()+k, text:t, due:Date.now()+days*86400000, done:false, from:modId, src:m.title}));
      if(S.modules[modId] && !S.modules[modId].challengeDone){ S.modules[modId].challengeDone=true; }
      addXp(30,'Compromisso de aplicação definido'); grantTrophy('planner'); grantTrophy('challenger'); save(); closeModal();
      planTab='acoes'; go('plano'); toast('🎯','Compromisso firmado',picks.length+' ação(ões) no seu Plano de 30 dias.');
    }
  });
}

function tgEsc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function tgList(arr){return (arr&&arr.length)?'<ul>'+arr.map(x=>`<li>${tgEsc(x)}</li>`).join('')+'</ul>':'<p class="tg-hint">—</p>';}
function tgMoney(n){return 'R$ '+Math.round(n||0).toLocaleString('pt-BR');}
function tgStepHtml(s,v){
  const wrap=(inner)=>`<div class="tg-step"><div class="tg-q">${tgEsc(s.q)}</div>${s.hint?`<div class="tg-hint">${tgEsc(s.hint)}</div>`:''}${inner}</div>`;
  if(s.type==='pick'){
    const opts=s.opts.map(o=>`<button type="button" class="tg-opt${v[s.k]===o.v?' on':''}" data-v="${tgEsc(o.v)}" onclick="tgPick(this)">${tgEsc(o.label)}${o.sub?`<small>${tgEsc(o.sub)}</small>`:''}</button>`).join('');
    return wrap(`<div class="tg-opts" data-pick="${s.k}">${opts}</div>`);
  }
  if(s.type==='multi'){
    const arr=v[s.k]||[];
    const opts=s.opts.map(o=>`<button type="button" class="tg-opt multi${arr.includes(o.v)?' on':''}" data-v="${tgEsc(o.v)}" onclick="tgToggle(this)">${tgEsc(o.label)}</button>`).join('');
    const custom=arr.filter(x=>!s.opts.some(o=>o.v===x));
    const more=s.more?`<input class="in" style="margin-top:8px" data-more="${s.k}" placeholder="Outro… (opcional, separe por vírgula)" value="${tgEsc(custom.join(', '))}">`:'';
    return wrap(`<div class="tg-opts" data-multi="${s.k}">${opts}</div>${more}`);
  }
  if(s.type==='scale'){
    const cur=+v[s.k]||0;
    const btns=[1,2,3,4,5].map(n=>`<button type="button" class="${cur===n?'on':''}" data-n="${n}" onclick="tgScale(this)"><span class="n">${n}</span></button>`).join('');
    return wrap(`<div class="likert" data-scale="${s.k}">${btns}</div>`);
  }
  if(s.type==='number') return wrap(`<input class="in" type="number" inputmode="decimal" data-in="${s.k}" placeholder="${tgEsc(s.ph||'0')}" value="${tgEsc(v[s.k]||'')}">`);
  if(s.type==='long') return wrap(`<textarea class="in" data-in="${s.k}" placeholder="${tgEsc(s.ph||'')}">${tgEsc(v[s.k]||'')}</textarea>`);
  return wrap(`<input class="in" data-in="${s.k}" placeholder="${tgEsc(s.ph||'')}" value="${tgEsc(v[s.k]||'')}">`);
}
function tgPick(b){const c=b.parentElement;[...c.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');}
function tgToggle(b){b.classList.toggle('on');}
function tgScale(b){const c=b.parentElement;[...c.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');}
function tgCollect(t){
  const d={};
  t.steps.forEach(s=>{
    if(s.type==='pick'){const on=document.querySelector(`[data-pick="${s.k}"] .tg-opt.on`);d[s.k]=on?on.dataset.v:'';}
    else if(s.type==='multi'){const ons=[...document.querySelectorAll(`[data-multi="${s.k}"] .tg-opt.on`)].map(o=>o.dataset.v);const more=document.querySelector(`[data-more="${s.k}"]`);if(more&&more.value.trim())more.value.split(',').map(x=>x.trim()).filter(Boolean).forEach(x=>ons.push(x));d[s.k]=ons;}
    else if(s.type==='scale'){const on=document.querySelector(`[data-scale="${s.k}"] button.on`);d[s.k]=on?+on.dataset.n:0;}
    else {const inp=document.querySelector(`[data-in="${s.k}"]`);d[s.k]=inp?inp.value.trim():'';}
  });
  return d;
}
function openTool(id){

function tgGenerate(id,silent){

function tgSave(id){
  const t=TOOLS.find(x=>x.id===id);

  const fresh=!S.tools[id];

function tgCopy(){
  const r=$('#tgResult'); if(!r) return; const txt=r.innerText;
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(()=>toast('📋','Copiado','Cole onde quiser.')).catch(()=>toast('📋','Selecione e copie','Toque e segure no texto do resultado.')); }

function fillSurveyCards(g,list){

    else if(done){ status=`<div class="bar" style="margin:0 0 8px"><i style="width:${avgPct(done)}%"></i></div><p class="tiny" style="margin:0 0 14px">Média geral <b style="color:var(--amber)">${avgScore(done).toFixed(1)}/5</b></p>`; }
    else status='<p class="muted tiny" style="margin:0 0 14px">Ainda não respondida.</p>';
    card.innerHTML=`<div style="font-size:34px">${s.icon}</div>

function avgScore(rec){ const v=Object.values(rec.answers); return v.length? v.reduce((a,b)=>a+(+b),0)/v.length : 0; }
function avgPct(rec){ return Math.round(avgScore(rec)/5*100); }

function likertSurvey(i,kind){

function profileScores(s,rec){
  const sums={},cnts={};
  Object.keys(s.dims).forEach(k=>{sums[k]=0;cnts[k]=0;});
  s.items.forEach((it,i)=>{ const v=+rec.answers[i]||0; const val=it.reverse?(6-v):v; if(sums[it.dim]!==undefined){sums[it.dim]+=val;cnts[it.dim]++;} });
  return Object.keys(s.dims).map(k=>({k,label:s.dims[k],pct:cnts[k]?Math.round(sums[k]/(cnts[k]*5)*100):0})).sort((a,b)=>b.pct-a.pct);
}
const FIELD_ORDER=['lema','forte','sombra','trabalho','valoriza','contexto','risco','lidar','usar','desenvolver','dica'];
const FIELD_LABELS={lema:'Essência',forte:'Forças',sombra:'Ponto de atenção',trabalho:'No trabalho',valoriza:'O que valoriza',contexto:'Contexto ideal',risco:'O que frustra',lidar:'Como se relacionar e liderar',usar:'Como aproveitar no time',desenvolver:'Como desenvolver',dica:'Dica prática'};
function descBlock(d){

    const v=d[f];

    const body=Array.isArray(v)?('<ul>'+v.map(x=>`<li>${tgEsc(x)}</li>`).join('')+'</ul>'):`<p>${tgEsc(v)}</p>`;
    return `<h5>${FIELD_LABELS[f]}</h5>${body}`;
  }).join('');
}
function showProfileResult(s,rec){

function showSurveyResult(id){

  modal(withResultActions({eyebrow:'Relatório · '+s.icon, title:s.title, icon:s.icon, bodyHtml:body,

    extra:`<div class="btn-row" style="margin-top:12px"><button class="btn ghost" onclick="closeModal()">Fechar relatório</button></div>`}));
}

function planDueLabel(i){
  if(!i.due) return '';

}
function addPlan(){
  const text=$('#planText').value.trim();

  S.plan.push({id:'p'+Date.now(), text, due:Date.now()+days*86400000, done:false});
  addXp(15,'Ação adicionada ao plano');

}
function addPlanFrom(modId){

function togglePlan(id){
  const it=S.plan.find(p=>p.id===id); if(!it) return;

  else save();

function delPlan(id){ S.plan=S.plan.filter(p=>p.id!==id); save(); renderPlano(); }
function exportPlanICS(){
  const items=(S.plan||[]).filter(p=>p.due);
  if(!items.length){ toast('📅','Nada para exportar','Adicione ações com prazo primeiro.'); return; }
  const pad=n=>String(n).padStart(2,'0');
  const fmt=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());
  const now=new Date();
  const dtstamp=now.getUTCFullYear()+pad(now.getUTCMonth()+1)+pad(now.getUTCDate())+'T'+pad(now.getUTCHours())+pad(now.getUTCMinutes())+pad(now.getUTCSeconds())+'Z';
  const esc=s=>(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
  let ics='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Operacao Blindada//Plano 30d//PT-BR\r\nCALSCALE:GREGORIAN\r\n';
  items.forEach(p=>{
    const start=new Date(p.due); const end=new Date(p.due+86400000);
    ics+='BEGIN:VEVENT\r\n';
    ics+='UID:'+p.id+'@operacao-blindada\r\n';
    ics+='DTSTAMP:'+dtstamp+'\r\n';
    ics+='DTSTART;VALUE=DATE:'+fmt(start)+'\r\n';
    ics+='DTEND;VALUE=DATE:'+fmt(end)+'\r\n';
    ics+='SUMMARY:'+esc('🛡 '+p.text)+'\r\n';
    ics+='DESCRIPTION:'+esc('Ação do seu Plano de 30 dias — Operação Blindada.'+(p.done?' (concluída)':''))+'\r\n';
    ics+='BEGIN:VALARM\r\nTRIGGER:-PT9H\r\nACTION:DISPLAY\r\nDESCRIPTION:'+esc(p.text)+'\r\nEND:VALARM\r\n';
    ics+='END:VEVENT\r\n';
  });
  ics+='END:VCALENDAR\r\n';
  const blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download='operacao-blindada-plano.ics'; a.click(); URL.revokeObjectURL(url);
  toast('📅','Plano exportado','Abra o arquivo .ics para importar no seu Google Agenda.');
}

    <div class="btn-row"><button class="btn sage" onclick="savePdca('${id}')">Salvar ciclo</button>

      <button class="btn ghost" onclick="delPdca('${id}')">Excluir</button></div>`);
}
function savePdca(id,analyze){
  const c=(S.pdca||[]).find(x=>x.id===id); if(!c) return;
  c.title=$('#pdT').value.trim()||'Ciclo'; c.plan=$('#pdP').value.trim(); c.do=$('#pdD').value.trim();
  c.check=$('#pdC').value.trim(); c.act=$('#pdA').value.trim(); c.stage=$('#pdStage').value; c.updatedAt=Date.now();
  save();
  if(analyze){ showPdcaAnalysis(id); return; }
  closeModal(); toast('🔁','Ciclo salvo',''); planTab='pdca'; renderPlano();
}
function delPdca(id){ S.pdca=(S.pdca||[]).filter(x=>x.id!==id); save(); closeModal(); planTab='pdca'; renderPlano(); }
function showPdcaAnalysis(id){
  const c=(S.pdca||[]).find(x=>x.id===id); if(!c) return;
  const keys=[['plan','📝 Planejar'],['do','⚙️ Executar'],['check','🔍 Checar'],['act','🚀 Agir']];
  const filled=keys.filter(([k])=>c[k]&&c[k].trim());
  const pct=Math.round(filled.length/4*100);
  let diag, next;
  if(filled.length===0){ diag='Ciclo ainda em branco. Comece pelo <b>Planejar</b>: o quê, por quê e até quando.'; next='Definir o plano em uma frase clara.'; }
  else if(!(c.do&&c.do.trim())){ diag='Você <b>planejou mas ainda não executou</b>. O maior risco do PDCA é morrer no papel — tire o plano da gaveta esta semana.'; next='Executar o primeiro passo do plano nos próximos 7 dias.'; }
  else if(!(c.check&&c.check.trim())){ diag='Você executou, mas <b>ainda não checou</b>. Sem medir, você não sabe se funcionou — compare o que aconteceu com o que esperava.'; next='Medir o resultado e comparar com a meta.'; }
  else if(!(c.act&&c.act.trim())){ diag='Você já checou os resultados. Falta o passo que gera melhoria de verdade: <b>o que manter, mudar ou padronizar?</b>'; next='Decidir o que padronizar e abrir o próximo ciclo.'; }
  else { diag='<b>Ciclo completo!</b> Você rodou as quatro fases. Agora padronize o que funcionou e abra o próximo ciclo com o aprendizado.'; next=c.act; }
  const recap=keys.map(([k,l])=>`<div class="metric"><b>${l}</b><span>${c[k]&&c[k].trim()?'✅':'—'}</span></div>${c[k]&&c[k].trim()?`<p style="margin:2px 0 10px;font-size:13px;color:var(--steel)">${escapeHtml(c[k])}</p>`:''}`).join('');
  const col=pct<50?'var(--coral)':pct<100?'var(--amber)':'var(--sage)';
  const body=`<div class="card" style="text-align:center;margin:0 0 14px;border-color:${col}">
      <div class="stat-num" style="color:${col}">${pct}%</div><div class="stat-lbl">do ciclo preenchido · fase atual: ${(PDCA_STAGES[c.stage]||PDCA_STAGES.P).n}</div></div>
    <div class="bar" style="margin:0 0 16px"><i style="width:${pct}%;background:${col}"></i></div>
    <h4>Onde o ciclo está</h4>${recap}
    <div class="callout mt16"><span class="ic">🧭</span><div>${diag}</div></div>`;
  modal(withResultActions({eyebrow:'Análise do ciclo', title:c.title, icon:'🔁', bodyHtml:body,
    actions:[next].filter(Boolean), pdcaTitle:'Próximo ciclo: '+c.title,
    diaryText:`No ciclo PDCA "${c.title}" cheguei a ${pct}%. Próximo passo: `,
    extra:`<div class="btn-row" style="margin-top:12px"><button class="btn ghost sm" onclick="openPdca('${id}')">✏️ Editar ciclo</button></div>`}));
}

/* ---------- Agenda ---------- */
function gcalUrl(title,dateTs,details){
  const pad=n=>String(n).padStart(2,'0');
  const d=new Date(dateTs); const s=d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());
  const e=new Date(dateTs+86400000); const en=e.getFullYear()+pad(e.getMonth()+1)+pad(e.getDate());
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent('🛡 '+title)+'&dates='+s+'/'+en+'&details='+encodeURIComponent(details||'Ação agendada na Operação Blindada.');
}
function delAgenda(id){ S.agenda=(S.agenda||[]).filter(x=>x.id!==id); save(); renderPlano(); }
function exportAgendaICS(){
  const items=(S.agenda||[]);
  if(!items.length){ toast('📅','Nada para exportar','Agende uma ação primeiro.'); return; }
  const pad=n=>String(n).padStart(2,'0');
  const fmt=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());
  const now=new Date();
  const dtstamp=now.getUTCFullYear()+pad(now.getUTCMonth()+1)+pad(now.getUTCDate())+'T'+pad(now.getUTCHours())+pad(now.getUTCMinutes())+pad(now.getUTCSeconds())+'Z';
  const esc=s=>(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
  let ics='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Operacao Blindada//Agenda//PT-BR\r\nCALSCALE:GREGORIAN\r\n';
  items.forEach(p=>{
    const start=new Date(p.date); const end=new Date(p.date+86400000);
    ics+='BEGIN:VEVENT\r\nUID:'+p.id+'@operacao-blindada\r\nDTSTAMP:'+dtstamp+'\r\nDTSTART;VALUE=DATE:'+fmt(start)+'\r\nDTEND;VALUE=DATE:'+fmt(end)+'\r\nSUMMARY:'+esc('🛡 '+p.title)+'\r\nDESCRIPTION:'+esc('Ação agendada na Operação Blindada.'+(p.src?' Origem: '+p.src:''))+'\r\nBEGIN:VALARM\r\nTRIGGER:-PT9H\r\nACTION:DISPLAY\r\nDESCRIPTION:'+esc(p.title)+'\r\nEND:VALARM\r\nEND:VEVENT\r\n';
  });
  ics+='END:VCALENDAR\r\n';
  const blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download='operacao-blindada-agenda.ics'; a.click(); URL.revokeObjectURL(url);
  toast('📅','Agenda exportada','Abra o .ics no Google ou Apple Agenda.');
}

const TEST_GATES={ disc:1, clima:2, cultura:3, ie:4, ancoras:5, carater:6, 'lideranca-estilo':7 };

function refCount(){ return (S.referrals||[]).length; }
function testLock(s){
  if(S.unlocks&&S.unlocks[s.id]) return {locked:false};
  const need=TEST_GATES[s.id]||0;
  const have=refCount();
  if(have>=need) return {locked:false};
  return {locked:true, need, falta:need-have};
}

    <div class="mt16" id="diagForm"></div>
    <div class="divider"></div>
    <button class="btn primary" onclick="submitDiagnostic(${!!isRetake})">${isRetake?'Ver minha evolução':'Salvar diagnóstico (+50 XP)'}</button>`);
  const f=$('#diagForm');
  DIAGNOSTIC.forEach((d,i)=>{

    item.innerHTML=`<div class="dim">${d.dim}</div><div class="q">${d.q}</div>${likertDiag(i)}`;

function likertDiag(i){
  return `<div class="likert" data-d="${i}">`+[1,2,3,4,5].map(n=>`<button onclick="pickDiag(this,${i},${n})"><span class="n">${n}</span></button>`).join('')+`</div>`;
}
function pickDiag(btn,i,n){ const g=btn.closest('.likert'); [...g.children].forEach(b=>b.classList.remove('on')); btn.classList.add('on'); diagTmp[i]=n; }
function submitDiagnostic(isRetake){
  if(Object.keys(diagTmp).length<DIAGNOSTIC.length){ toast('⚠️','Responda tudo','Faltam itens para concluir.'); return; }
  const answers={}; DIAGNOSTIC.forEach((d,i)=>answers[d.dim]=diagTmp[i]);
  if(isRetake){ S.retake={answers, at:Date.now()}; addXp(60,'Rediagnóstico concluído'); save(); closeModal(); showEvolution(); }
  else { S.diagnostic={answers, at:Date.now()}; addXp(50,'Autodiagnóstico inicial'); checkTrophies(); save(); closeModal(); showDiagnosticResult(); }
}
function dimAvg(ans){ const v=Object.values(ans); return v.reduce((a,b)=>a+(+b),0)/v.length; }
function showDiagnosticResult(){
  const ans=S.diagnostic.answers;
  const rows=Object.entries(ans).sort((a,b)=>a[1]-b[1]);
  const low=rows[0], high=rows[rows.length-1];
  modal(`<p class="eyebrow">Seu ponto de partida</p><h3>🧭 Mapa de maturidade</h3>
    ${radarSVG(ans)}
    <div class="callout mt16"><span class="ic">🌱</span><div>Onde você se vê mais forte: <b>${high[0]}</b>. Onde há mais espaço para crescer: <b>${low[0]}</b>. Sugiro começar dando atenção especial à trilha de ${low[0]} — e, ao fim da jornada, refazer este diagnóstico para ver o quanto avançou.</div></div>
    <button class="btn primary" onclick="closeModal();go('trilhas')">Começar pelas trilhas →</button>`);
}
function showEvolution(){
  const before=S.diagnostic.answers, after=S.retake.answers;
  const dims=Object.keys(before);
  const avgB=dimAvg(before), avgA=dimAvg(after);
  const delta=(avgA-avgB);
  modal(`<p class="eyebrow">Antes e depois</p><h3>📈 Sua evolução</h3>
    <div class="card" style="text-align:center;margin:14px 0;border-color:rgba(95,208,166,.4)">
      <div style="display:flex;justify-content:center;gap:30px;align-items:center">
        <div><div class="stat-num" style="color:var(--violet)">${avgB.toFixed(1)}</div><div class="stat-lbl">Início</div></div>
        <div style="font-size:24px;color:var(--sage)">→</div>
        <div><div class="stat-num" style="color:var(--sage)">${avgA.toFixed(1)}</div><div class="stat-lbl">Agora</div></div>
        <div style="border-left:1px solid var(--line-soft);padding-left:24px"><div class="stat-num" style="color:${delta>=0?'var(--sage)':'var(--coral)'}">${delta>=0?'+':''}${delta.toFixed(1)}</div><div class="stat-lbl">Evolução</div></div>
      </div>
    </div>
    <div style="margin:10px 0">${dims.map(d=>{
      const b=before[d], a=after[d];
      return `<div class="cmp-bar"><span class="lb">${d}</span>
        <div class="cmp-track"><div class="before" style="width:${b/5*100}%"></div><div class="after" style="width:${a/5*100}%"></div></div>
        <span class="tiny" style="color:${a>=b?'var(--sage)':'var(--coral)'};text-align:right">${a>b?'+':''}${a-b}</span></div>`;
    }).join('')}</div>
    <p class="tiny muted" style="margin:4px 0 14px"><span style="color:var(--violet)">▬</span> antes &nbsp; <span style="color:var(--sage)">▬</span> agora</p>
    <div class="callout"><span class="ic">🎓</span><div><b>${delta>0?'Você evoluiu de forma mensurável.':'Você manteve sua base.'}</b> Esse é o tipo de prova que transforma percepção em resultado. Guarde este antes e depois — ele conta a sua história de desenvolvimento.</div></div>
    <button class="btn primary" onclick="closeModal()">Fechar</button>`);
}
function radarSVG(ans){
  const dims=Object.keys(ans), N=dims.length, cx=150, cy=150, R=110;
  const pt=(i,r)=>{ const a=(Math.PI*2*i/N)-Math.PI/2; return [cx+Math.cos(a)*r, cy+Math.sin(a)*r]; };
  let grid='';
  [0.25,0.5,0.75,1].forEach(f=>{ const pts=dims.map((_,i)=>pt(i,R*f).join(',')).join(' '); grid+=`<polygon points="${pts}" fill="none" stroke="rgba(120,130,170,.18)" stroke-width="1"/>`; });
  let axes='', labels='';
  dims.forEach((d,i)=>{ const [x,y]=pt(i,R); axes+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(120,130,170,.18)"/>`;
    const [lx,ly]=pt(i,R+22); labels+=`<text x="${lx}" y="${ly}" font-size="9" fill="#9aa6cf" text-anchor="middle" dominant-baseline="middle" font-family="monospace">${d}</text>`; });
  const dataPts=dims.map((d,i)=>pt(i,R*(ans[d]/5)).join(',')).join(' ');
  return `<div class="center"><svg viewBox="0 0 300 320" style="max-width:340px;width:100%">
    ${grid}${axes}
    <polygon points="${dataPts}" fill="rgba(245,181,61,.25)" stroke="var(--amber)" stroke-width="2"/>
    ${dims.map((d,i)=>{const [x,y]=pt(i,R*(ans[d]/5));return `<circle cx="${x}" cy="${y}" r="3.5" fill="var(--amber)"/>`;}).join('')}
    ${labels}
  </svg></div>`;
}

let deepTmp={}, deepCurrentId=null;
function openDeepTest(id){
  const t=DEEP_TESTS[id]; if(!t) return;
  deepCurrentId=id; deepTmp={};
  const m=MODULES.find(x=>x.id===id);
  const doneBefore=!!S.deepTests?.[id]?.at;
  modal(`<p class="eyebrow">Teste Profundo${m?' · '+m.title:''}</p>
    <h3>🧠 ${t.title}</h3>
    <p class="muted tiny" style="margin:6px 0 0">${t.intro}</p>
    <p class="muted tiny" style="margin:8px 0 0">Escala: <b>1 = discordo totalmente</b> · <b>5 = concordo totalmente</b>.</p>
    <div class="mt16" id="deepForm"></div>
    <div class="divider"></div>
    <button class="btn primary" onclick="submitDeepTest()">Ver meu resultado${doneBefore?'':' (+40 XP)'}</button>`);
  const f=$('#deepForm');
  t.items.forEach((it,i)=>{
    const item=el('div','diag-q');
    item.innerHTML=`<div class="dim">${t.dims[it.dim]}</div><div class="q">${it.q}</div>${likertDeep(i)}`;
    f.appendChild(item);
  });
}
function likertDeep(i){ return `<div class="likert" data-d="${i}">`+[1,2,3,4,5].map(n=>`<button onclick="pickDeep(this,${i},${n})"><span class="n">${n}</span></button>`).join('')+`</div>`; }
function pickDeep(btn,i,n){ const g=btn.closest('.likert'); [...g.children].forEach(b=>b.classList.remove('on')); btn.classList.add('on'); deepTmp[i]=n; }
function deepCompute(t,ans){
  const sums={},counts={}; Object.keys(t.dims).forEach(k=>{sums[k]=0;counts[k]=0;});
  t.items.forEach((it,i)=>{ const v=+ans[i]||0; sums[it.dim]+=v; counts[it.dim]++; });
  const raw={},pct={}; Object.keys(t.dims).forEach(k=>{ const avg=counts[k]?sums[k]/counts[k]:0; raw[k]=avg; pct[k]=Math.round((avg-1)/4*100); });
  return {raw,pct};
}
function submitDeepTest(){
  const id=deepCurrentId, t=DEEP_TESTS[id];
  if(Object.keys(deepTmp).length<t.items.length){ toast('⚠️','Responda tudo','Faltam afirmações para concluir o teste.'); return; }
  const {raw,pct}=deepCompute(t,deepTmp);
  const first=!S.deepTests[id]?.at;
  S.deepTests[id]={answers:{...deepTmp}, raw, pct, at:Date.now()};
  if(first) addXp(40, `Teste Profundo — ${t.title}`);
  save(); closeModal(); showDeepTestResult(id);
}
function deepBar(label,p,color){ return `<div class="cmp-bar"><span class="lb">${label}</span><div class="cmp-track"><div class="after" style="width:${Math.max(p,2)}%;background:${color||'var(--amber)'}"></div></div><span class="tiny" style="text-align:right">${p}%</span></div>`; }
function showDeepTestResult(id){
  const t=DEEP_TESTS[id], r=S.deepTests[id], m=MODULES.find(x=>x.id===id);
  const dims=Object.keys(t.dims);
  let body=''; let resActs=[]; let diaryText='';
  if(t.mode==='maturity'){
    const overall=Math.round(dims.reduce((a,k)=>a+r.pct[k],0)/dims.length);
    const band=MAT_BANDS.find(b=>overall<b.max)||MAT_BANDS[MAT_BANDS.length-1];
    const cap=t.theme.charAt(0).toUpperCase()+t.theme.slice(1);
    const note = overall<40
      ? `Há uma base, mas ${t.theme} ainda depende mais de intuição que de método — o maior ganho agora é estruturar o processo.`
      : overall<75
      ? `Você já tem método em ${t.theme}. O salto vem de tornar isso consistente e fechar os pontos mais fracos abaixo.`
      : `${cap} está num bom nível. Mantenha o padrão e use isso para puxar o resto da operação.`;
    const sorted=dims.slice().sort((a,b)=>r.pct[a]-r.pct[b]);
    const low=sorted[0], high=sorted[sorted.length-1];
    const tip=t.dimTips&&t.dimTips[low]?` Para evoluir, ${t.dimTips[low]}`:'';
    resActs=[t.dimTips&&t.dimTips[low]?`Evoluir ${t.dims[low]}: ${t.dimTips[low]}`:`Fortalecer ${t.dims[low]}`];
    diaryText=`No teste ${t.title} tirei ${overall}%. Meu ponto mais fraco é ${t.dims[low]}. O que vou fazer: `;
    body=`<div class="card" style="text-align:center;margin:0 0 14px;border-color:${band.color}">
        <div class="stat-num" style="color:${band.color}">${overall}%</div>
        <div class="stat-lbl">${band.label}</div></div>
      <div style="margin:10px 0">${dims.map(k=>deepBar(t.dims[k], r.pct[k], r.pct[k]<40?'var(--coral)':r.pct[k]<75?'var(--amber)':'var(--sage)')).join('')}</div>
      <div class="callout"><span class="ic">🧭</span><div>${note}<br><br>Mais forte: <b>${t.dims[high]}</b>. Onde focar agora: <b>${t.dims[low]}</b>.${tip}</div></div>`;
  } else {
    const sorted=dims.slice().sort((a,b)=>r.pct[b]-r.pct[a]);
    const dom=sorted[0];
    resActs=[`Aplicar meu perfil ${t.dims[dom]} no dia a dia`];
    diaryText=`No teste ${t.title} meu perfil dominante foi ${t.dims[dom]}. O que isso me mostra: `;
    body=`<div style="margin:0 0 14px">${sorted.map((k,i)=>deepBar(t.dims[k], r.pct[k], i===0?'var(--amber)':'var(--violet)')).join('')}</div>
      <div class="card" style="border-color:rgba(245,181,61,.4)"><p class="eyebrow">Seu perfil dominante</p>
        <h3 style="font-family:var(--serif);margin:4px 0 8px">${t.dims[dom]}</h3>
        <p class="muted" style="margin:0;line-height:1.6">${t.profileNotes[dom]}</p></div>
      ${t.closing?`<div class="callout mt16"><span class="ic">💡</span><div>${t.closing}</div></div>`:''}`;
  }
  modal(withResultActions({eyebrow:'Resultado'+(m?' · '+m.title:''), title:t.title, icon:'🧠', bodyHtml:body,
    actions:resActs, pdcaTitle:t.title, diaryText,
    extra:`<div class="btn-row" style="margin-top:14px">
      <button class="btn ghost sm" onclick="closeModal();openDeepTest('${id}')" style="flex:1;justify-content:center">Refazer</button>
      <button class="btn primary sm" onclick="closeModal()" style="flex:1;justify-content:center">Fechar</button>
    </div>`}));
}

/* ---------- farol ---------- */
function gFarol(k){
  const r=parseFloat(k.real), m=parseFloat(k.meta);
  if(isNaN(r)||isNaN(m)) return {pct:null, cls:'', em:'⚪', lbl:'defina meta e realizado'};
  let pct;
  if(k.inv){ // menor é melhor (inadimplência, atraso, reclamações…)
    if(r<=0) pct=120; else if(m<=0) pct=0; else pct=(m/r)*100;
  } else {
    pct = m<=0 ? 0 : (r/m)*100;
  }
  if(pct>=100) return {pct, cls:'verde',    em:'🟢', lbl:'verde — registre a causa e replique'};
  if(pct>=90)  return {pct, cls:'amarelo',  em:'🟡', lbl:'amarelo — explicação no PTM (bloco 4) + ação no bloco 7'};
  return        {pct, cls:'vermelho', em:'🔴', lbl:'vermelho — causa raiz, ação com data e presença na reunião'};
}
function gFarolChip(f){
  const cor = f.cls==='verde' ? 'var(--sage)' : f.cls==='amarelo' ? 'var(--amber)' : f.cls==='vermelho' ? 'var(--coral)' : 'var(--mute-2)';
  const txt = f.pct==null ? '—' : Math.round(f.pct)+'%';
  return `<span title="${escAttr(f.lbl)}" style="display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;color:${cor};white-space:nowrap">${f.em} ${txt}</span>`;
}

          <th style="padding:6px 8px">Indicador</th><th>Frequência</th><th>Meta</th><th>Realizado</th><th>Anterior</th><th title="Menor é melhor">↓ melhor</th><th>Farol</th><th></th></tr>
        ${rows || `<tr><td colspan="8" style="padding:22px;text-align:center;color:var(--mute-2)">Nenhum indicador ainda. Adicione um pacote acima para começar.</td></tr>`}
      </table>
    </div>

      <button class="btn sage sm" onclick="gKpiAdd()">＋ Indicador em branco</button>
      <button class="btn ghost sm" onclick="gPainelPrint()">🖨️ Imprimir painel A4</button>
    </div>
    <p class="tiny muted mt8">Semanal entra no RSG. Mensal só no PTM. Sem meta, o farol fica apagado — e sem cobrança.</p>
  </div>`;
}
function gKpiAdd(){ G().kpis.push({nome:'',fonte:'',freq:'semanal',inv:false,meta:'',real:'',ant:''}); save(); renderGestao(); }
function gKpiDel(i){ G().kpis.splice(i,1); save(); renderGestao(); }
function gKpiSet(i,f,val){ const k=G().kpis[i]; if(!k) return; k[f]=val; save();
  if(f==='meta'||f==='real'||f==='inv'){ renderGestao(); }
  const g=G(); if(g.kpis.some(x=>x.meta!==''&&x.real!=='')){ gXpOnce('painel_first',40,'Painel de Indicadores ativo'); grantTrophy('gestao_farol'); }
}
function gAddPack(id){
  const p=G_KPI_PACKS.find(x=>x.id===id); if(!p) return;
  p.kpis.forEach(k=>G().kpis.push({nome:k.nome,fonte:k.fonte,freq:k.freq,inv:k.inv,meta:'',real:'',ant:''}));
  save(); renderGestao();
  toast(p.em,'Pacote adicionado',p.nome+' — agora defina as metas com quem executa.');
}
function gPainelPrint(){
  const g=G();
  const rows=g.kpis.map(k=>{const f=gFarol(k);return [escapeHtml(k.nome||'—'),escapeHtml(k.freq||''),escapeHtml(String(k.meta||'—')),escapeHtml(String(k.real||'—')),escapeHtml(String(k.ant||'—')),gFarolPrint(f)];});
  gPrint('🚦','Painel de Indicadores — '+(g.periodo||'período atual'),
    `<h5>Escala: VERDE ≥100% · AMARELO 90–99,9% · VERMELHO &lt;90% — indicadores “menor é melhor” invertem sozinhos</h5>`+
    gPrintTable(['Indicador','Freq.','Meta','Realizado','Anterior','Farol'],rows)+

}

/* ===================================================================
   ABA 3 — RSG (REPORT SEMANAL DE GESTÃO)
   =================================================================== */
function gRsgHtml(){

    ? `<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px;min-width:520px">
        <tr style="color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.08em;text-align:left"><th style="padding:5px 8px">Indicador</th><th>Realizado</th><th>Meta</th><th>Farol</th></tr>
        ${sem.map(k=>{const f=gFarol(k);return `<tr><td style="padding:7px 8px;border-top:1px solid var(--line-soft)">${escapeHtml(k.nome)}</td><td>${escapeHtml(String(k.real||'—'))}</td><td>${escapeHtml(String(k.meta||'—'))}</td><td>${gFarolChip(f)}</td></tr>`;}).join('')}

  <div class="grid g-2" style="grid-template-columns:1.4fr 1fr;align-items:start">
    <div class="card pad-lg">
      <p class="eyebrow">1 página · toda segunda até 12h</p>
      <h2 class="sec" style="margin:6px 0 10px">📄 RSG — Report Semanal de Gestão</h2>
      <div class="grid g-2">
        <label class="fld"><span>Semana de referência</span><input class="in" id="rsgSemana" value="${escAttr(d.semana||'')}" placeholder="Ex.: 14 a 20/07" onchange="gRsgDraft()"></label>
        <label class="fld"><span>Área / unidade · gestor</span><input class="in" id="rsgArea" value="${escAttr(d.area||'')}" placeholder="Ex.: Comercial · Ana" onchange="gRsgDraft()"></label>
      </div>

      <label class="fld mt16"><span>Bloco 2 · Destaque positivo — um fato, com o número que comprova</span><textarea class="in" id="rsgDestaque" rows="2" placeholder='Ex.: "Conversão subiu de 21% para 26% após o rodízio de atendimento."' onchange="gRsgDraft()">${escapeHtml(d.destaque||'')}</textarea></label>
      <label class="fld"><span>Bloco 3 · Alerta — o que saiu do esperado, número e causa provável (ou “nenhum”)</span><textarea class="in" id="rsgAlerta" rows="2" onchange="gRsgDraft()">${escapeHtml(d.alerta||'')}</textarea></label>
      <label class="fld"><span>Bloco 4 · Bloqueios — o que está travado e QUEM destrava (ou “nenhum”)</span><textarea class="in" id="rsgBloqueios" rows="2" onchange="gRsgDraft()">${escapeHtml(d.bloqueios||'')}</textarea></label>
      <label class="fld"><span>Bloco 5 · Foco da próxima semana — até 3 prioridades (onde vai sua atenção, não lista de tarefas)</span><textarea class="in" id="rsgFoco" rows="2" onchange="gRsgDraft()">${escapeHtml(d.foco||'')}</textarea></label>
      <div class="btn-row mt16">

    </div>
    <div>
      <div class="card pad-lg">
        <p class="eyebrow">Histórico</p>
        ${g.rsg.length? g.rsg.map((r,i)=>`
          <div style="display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-soft)">
            <div><b style="font-size:14px">Semana ${escapeHtml(r.semana||'?')}</b><div class="tiny muted">${escapeHtml(r.area||'')} · ${new Date(r.ts).toLocaleDateString('pt-BR')}</div></div>
            <div class="btn-row"><button class="btn ghost sm" onclick="gRsgPrint(${i})">🖨️</button><button class="btn ghost sm" onclick="gRsgDel(${i})">✕</button></div>
          </div>`).join('') : '<p class="muted tiny">Nenhum report fechado ainda. O primeiro vale <b>+80 XP</b>.</p>'}
      </div>
      <div class="card mt16">
        <p class="tiny" style="color:var(--steel);line-height:1.7;margin:0">📌 <b>Regra da casa:</b> quem anota o número na hora leva 15 minutos para montar o report. Quem deixa para depois leva duas horas — e erra. Silêncio da direção depois do envio significa “segue em frente”.</p>
      </div>

}
function gRsgDraft(){
  const g=G();
  g.drafts.rsg={semana:gVal('rsgSemana'),area:gVal('rsgArea'),destaque:gVal('rsgDestaque'),alerta:gVal('rsgAlerta'),bloqueios:gVal('rsgBloqueios'),foco:gVal('rsgFoco')};
  save();
}
function gRsgSalvar(){
  gRsgDraft(); const g=G(); const d=g.drafts.rsg;
  if(!d.semana){ toast('⚠️','Falta a semana','Preencha a semana de referência.'); return; }
  const snap=g.kpis.filter(k=>k.freq==='semanal').map(k=>({nome:k.nome,real:k.real,meta:k.meta,inv:k.inv,f:gFarol(k)}));
  g.rsg.unshift({...d, kpis:snap, ts:Date.now()});
  if(g.rsg.length>60) g.rsg.length=60;
  g.drafts.rsg={};
  save(); grantTrophy('gestao_pulso');
  if(!g.xpFlags.rsg_first){ g.xpFlags.rsg_first=1; addXp(80,'Primeiro RSG fechado'); } else addXp(25,'RSG da semana fechado');
  renderGestao();
}
function gRsgDel(i){ G().rsg.splice(i,1); save(); renderGestao(); }
function gRsgPrint(i){
  const g=G();
  let r;
  if(i==null){ gRsgDraft(); const d=g.drafts.rsg; r={...d,kpis:g.kpis.filter(k=>k.freq==='semanal').map(k=>({nome:k.nome,real:k.real,meta:k.meta,inv:k.inv,f:gFarol(k)}))}; }
  else r=g.rsg[i];
  if(!r) return;
  const tb=r.kpis&&r.kpis.length? gPrintTable(['Indicador','Realizado','Meta','Farol'], r.kpis.map(k=>[escapeHtml(k.nome||''),escapeHtml(String(k.real||'—')),escapeHtml(String(k.meta||'—')),gFarolPrint(k.f||gFarol(k))])) : '<p>—</p>';
  const blk=(t,c)=>`<h5>${t}</h5><p>${escapeHtml(c||'nenhum')}</p>`;
  gPrint('📄','RSG — Report Semanal de Gestão',
    `<p style="font-size:11px;color:#8a8a8e">Semana de <b>${escapeHtml(r.semana||'—')}</b> · ${escapeHtml(r.area||'')}</p>
     <h5>Bloco 1 · Números da semana</h5>${tb}
     ${blk('Bloco 2 · Destaque positivo',r.destaque)}
     ${blk('Bloco 3 · Alerta',r.alerta)}
     ${blk('Bloco 4 · Bloqueios',r.bloqueios)}
     ${blk('Bloco 5 · Foco da próxima semana',r.foco)}`);
}

/* ===================================================================
   ABA 4 — PTM (PARECER TÉCNICO MENSAL)
   =================================================================== */
function gPtmRows(d,key,n,cols){
  const arr=(d[key]||[]);
  let h='';
  for(let i=0;i<n;i++){
    const row=arr[i]||{};
    h+=`<div class="grid" style="grid-template-columns:${cols.map(c=>c.w).join(' ')};gap:8px;margin-bottom:8px">`+
      cols.map(c=>`<input class="in" style="margin:0" id="ptm_${key}_${i}_${c.k}" value="${escAttr(row[c.k]||'')}" placeholder="${escAttr(c.p)}" onchange="gPtmDraft()">`).join('')+`</div>`;
  }
  return h;
}
function gPtmHtml(){
  const g=G(); const d=g.drafts.ptm||{};
  const painel = g.kpis.length
    ? `<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px;min-width:560px">
        <tr style="color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.08em;text-align:left"><th style="padding:5px 8px">Indicador</th><th>Realizado</th><th>Meta</th><th>Anterior</th><th>Var.</th><th>Farol</th></tr>
        ${g.kpis.map(k=>{const f=gFarol(k);const vr=gVarPct(k);return `<tr><td style="padding:7px 8px;border-top:1px solid var(--line-soft)">${escapeHtml(k.nome)}</td><td>${escapeHtml(String(k.real||'—'))}</td><td>${escapeHtml(String(k.meta||'—'))}</td><td>${escapeHtml(String(k.ant||'—'))}</td><td>${vr}</td><td>${gFarolChip(f)}</td></tr>`;}).join('')}
      </table></div><p class="tiny muted mt8">Bloco 2 é o painel — sem comentário. A análise vem nos blocos 3 e 4.</p>`
    : `<p class="muted tiny">Monte o Painel (aba 🚦) — o PTM injeta todos os indicadores automaticamente.</p>`;
  return `
  <div class="card pad-lg">
    <p class="eyebrow">2 páginas + painel · até o 5º dia útil</p>
    <h2 class="sec" style="margin:6px 0 10px">📈 PTM — Parecer Técnico Mensal</h2>
    <div class="grid g-2">
      <label class="fld"><span>Mês de referência</span><input class="in" id="ptmMes" value="${escAttr(d.mes||'')}" placeholder="Ex.: Julho 2026" onchange="gPtmDraft()"></label>
      <label class="fld"><span>Área / unidade · gestor</span><input class="in" id="ptmArea" value="${escAttr(d.area||'')}" placeholder="Ex.: Financeiro · Você" onchange="gPtmDraft()"></label>
    </div>
    <label class="fld"><span>Bloco 1 · Resumo executivo — até 10 linhas: o mês foi bom ou ruim, por quê, e a ÚNICA coisa que precisa ser decidida. Escreva por último.</span><textarea class="in" id="ptmResumo" rows="4" onchange="gPtmDraft()">${escapeHtml(d.resumo||'')}</textarea></label>
    <h5 style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin:14px 0 8px">Bloco 2 · Painel de indicadores (do seu Painel 🚦)</h5>
    ${painel}
    <h5 style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin:18px 0 8px">Bloco 3 · O que funcionou — máx. 3, cada um com o número que comprova</h5>
    ${gPtmRows(d,'funcionou',3,[{k:'oque',p:'O que foi feito',w:'2fr'},{k:'num',p:'Número que comprova',w:'1.4fr'},{k:'rep',p:'Repetível? Onde?',w:'1fr'}])}
    <h5 style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin:18px 0 8px">Bloco 4 · O que NÃO funcionou — máx. 3, com causa raiz (sintoma não vale)</h5>
    ${gPtmRows(d,'nao',3,[{k:'oque',p:'O que aconteceu',w:'2fr'},{k:'num',p:'Número que piorou',w:'1.2fr'},{k:'causa',p:'Causa raiz',w:'1.4fr'}])}
    <h5 style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin:18px 0 8px">Bloco 5 · Dificuldades e bloqueios — de quem é e qual o impacto</h5>
    ${gPtmRows(d,'bloq',3,[{k:'desc',p:'Dificuldade / bloqueio',w:'2fr'},{k:'dono',p:'Dono do bloqueio',w:'1fr'},{k:'imp',p:'Impacto (nº ou prazo)',w:'1fr'}])}
    <h5 style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin:18px 0 8px">Bloco 6 · Dúvidas e decisões — pergunta SEM recomendação é devolvida</h5>
    ${gPtmRows(d,'duv',3,[{k:'perg',p:'Pergunta / decisão necessária',w:'1.6fr'},{k:'opc',p:'Opções que enxergo',w:'1.2fr'},{k:'rec',p:'Minha recomendação',w:'1.2fr'},{k:'prazo',p:'Responder até',w:'.7fr'}])}
    <h5 style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin:18px 0 8px">Bloco 7 · Plano de ação — máx. 5; ação sem dono e data é inválida</h5>
    ${gPtmRows(d,'plano',5,[{k:'oque',p:'O que será feito',w:'1.8fr'},{k:'quem',p:'Responsável',w:'.9fr'},{k:'prazo',p:'Até quando',w:'.7fr'},{k:'ind',p:'Indicador que deve mover',w:'1.2fr'},{k:'depara',p:'De → Para',w:'.8fr'}])}
    <div class="btn-row mt16">
      <button class="btn primary" onclick="gPtmSalvar()">💾 Emitir parecer do mês</button>
      <button class="btn ghost" onclick="gPtmPrint(null)">🖨️ Imprimir A4</button>
    </div>
    ${g.ptm.length?`<div class="divider"></div><p class="eyebrow">Pareceres emitidos</p>${g.ptm.map((p,i)=>`
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-soft)">
        <div><b style="font-size:14px">${escapeHtml(p.mes||'?')}</b><div class="tiny muted">${escapeHtml(p.area||'')} · emitido em ${new Date(p.ts).toLocaleDateString('pt-BR')}</div></div>
        <div class="btn-row"><button class="btn ghost sm" onclick="gPtmPrint(${i})">🖨️</button><button class="btn ghost sm" onclick="gPtmDel(${i})">✕</button></div>
      </div>`).join('')}`:''}
  </div>`;
}
function gVarPct(k){
  const r=parseFloat(k.real), a=parseFloat(k.ant);
  if(isNaN(r)||isNaN(a)||a===0) return '<span class="muted">—</span>';
  const v=((r-a)/Math.abs(a))*100;
  const good = k.inv ? v<0 : v>0;
  return `<span style="color:${good?'var(--sage)':'var(--coral)'};font-family:var(--mono);font-size:12px">${v>0?'+':''}${v.toFixed(1)}%</span>`;
}
function gPtmCollectRows(key,n,fields){
  const out=[];
  for(let i=0;i<n;i++){
    const row={}; let filled=false;
    fields.forEach(f=>{ const val=gVal(`ptm_${key}_${i}_${f}`); row[f]=val; if(val) filled=true; });
    if(filled) out.push(row);
  }
  return out;
}
function gPtmDraft(){
  const g=G();
  g.drafts.ptm={
    mes:gVal('ptmMes'), area:gVal('ptmArea'), resumo:gVal('ptmResumo'),
    funcionou:gPtmCollectRows('funcionou',3,['oque','num','rep']),
    nao:gPtmCollectRows('nao',3,['oque','num','causa']),
    bloq:gPtmCollectRows('bloq',3,['desc','dono','imp']),
    duv:gPtmCollectRows('duv',3,['perg','opc','rec','prazo']),
    plano:gPtmCollectRows('plano',5,['oque','quem','prazo','ind','depara']),
  };
  save();
}
function gPtmSalvar(){
  gPtmDraft(); const g=G(); const d=g.drafts.ptm;
  const err=[];
  if(!d.mes) err.push('mês de referência');
  d.nao.forEach((r,i)=>{ if(r.oque&&!r.causa) err.push(`causa raiz no bloco 4 (item ${i+1})`); });
  d.duv.forEach((r,i)=>{ if(r.perg&&!r.rec) err.push(`recomendação no bloco 6 (item ${i+1}) — pergunta sem recomendação é devolvida`); });
  d.plano.forEach((r,i)=>{ if(r.oque&&(!r.quem||!r.prazo)) err.push(`dono e data no bloco 7 (ação ${i+1}) — sem os dois é intenção`); });
  if(err.length){ toast('↩️','Parecer devolvido','Falta: '+err[0]); return; }
  const snap=g.kpis.map(k=>({nome:k.nome,real:k.real,meta:k.meta,ant:k.ant,inv:k.inv,f:gFarol(k)}));
  g.ptm.unshift({...d, kpis:snap, ts:Date.now()});
  if(g.ptm.length>36) g.ptm.length=36;
  g.drafts.ptm={};
  save(); grantTrophy('gestao_parecer');
  if(!g.xpFlags.ptm_first){ g.xpFlags.ptm_first=1; addXp(120,'Primeiro PTM emitido'); } else addXp(40,'PTM do mês emitido');
  renderGestao();
}
function gPtmDel(i){ G().ptm.splice(i,1); save(); renderGestao(); }
function gPtmPrint(i){
  const g=G();
  let p;
  if(i==null){ gPtmDraft(); p={...g.drafts.ptm, kpis:g.kpis.map(k=>({nome:k.nome,real:k.real,meta:k.meta,ant:k.ant,inv:k.inv,f:gFarol(k)}))}; }
  else p=g.ptm[i];
  if(!p) return;
  const tb=p.kpis&&p.kpis.length? gPrintTable(['Indicador','Realizado','Meta','Anterior','Farol'], p.kpis.map(k=>[escapeHtml(k.nome||''),escapeHtml(String(k.real||'—')),escapeHtml(String(k.meta||'—')),escapeHtml(String(k.ant||'—')),gFarolPrint(k.f||gFarol(k))])) : '<p>—</p>';
  const lista=(t,rows,cols)=>`<h5>${t}</h5>`+(rows&&rows.length? gPrintTable(cols.map(c=>c[0]), rows.map(r=>cols.map(c=>escapeHtml(r[c[1]]||'—')))) : '<p>nenhum</p>');
  gPrint('📈','PTM — Parecer Técnico Mensal · '+(p.mes||''),
    `<p style="font-size:11px;color:#8a8a8e">${escapeHtml(p.area||'')} · Mês de referência: <b>${escapeHtml(p.mes||'—')}</b></p>
     <h5>Bloco 1 · Resumo executivo</h5><p>${escapeHtml(p.resumo||'—').replace(/\n/g,'<br>')}</p>
     <h5>Bloco 2 · Painel de indicadores</h5>${tb}
     ${lista('Bloco 3 · O que funcionou',p.funcionou,[['O que foi feito','oque'],['Número que comprova','num'],['Repetível? Onde?','rep']])}
     ${lista('Bloco 4 · O que não funcionou',p.nao,[['O que aconteceu','oque'],['Número que piorou','num'],['Causa raiz','causa']])}
     ${lista('Bloco 5 · Dificuldades e bloqueios',p.bloq,[['Bloqueio','desc'],['Dono','dono'],['Impacto','imp']])}
     ${lista('Bloco 6 · Dúvidas e decisões',p.duv,[['Pergunta','perg'],['Opções','opc'],['Recomendação','rec'],['Responder até','prazo']])}
     ${lista('Bloco 7 · Plano de ação',p.plano,[['O que será feito','oque'],['Responsável','quem'],['Prazo','prazo'],['Indicador','ind'],['De → Para','depara']])}
     <p style="margin-top:22px;font-size:11px;color:#8a8a8e">Assinatura do gestor: ______________________________ &nbsp;&nbsp; Data: ____/____/______</p>`);
}
