      <div class="grid g-2 mt8">
        <label class="fld"><span>Área</span><input class="in" id="caArea" value="${escAttr(d.area||'')}" placeholder="Ex.: Comercial, Financeiro, Loja…" onchange="gCartaoDraft()"></label>
        <label class="fld"><span>Responsável</span><input class="in" id="caPessoa" value="${escAttr(d.pessoa||'')}" placeholder="Nome de quem opera a área" onchange="gCartaoDraft()"></label>
      </div>
      <label class="fld"><span>O que NÃO muda na rotina (tranquilize: nada sai da lista de trabalho)</span><textarea class="in" id="caRotina" rows="2" placeholder="A rotina da pessoa, do jeito que já é hoje…" onchange="gCartaoDraft()">${escapeHtml(d.rotina||'')}</textarea></label>
      <label class="fld"><span>Números da semana — 3 ou 4, um por linha, no formato “indicador — onde tira”</span><textarea class="in" id="caNumeros" rows="3" placeholder="Faturamento vs. meta — ERP&#10;Taxa de conversão — planilha de orçamentos" onchange="gCartaoDraft()">${escapeHtml(d.numeros||'')}</textarea></label>
      <div class="grid g-3 mt8" style="gap:10px">
        <label class="fld"><span>🟢 DECIDE SOZINHO (níveis 1–2) — um por linha</span><textarea class="in" id="caDecide" rows="5" placeholder="Escala e folga da equipe&#10;Desconto até o limite combinado" onchange="gCartaoDraft()">${escapeHtml(d.decide||'')}</textarea></label>
        <label class="fld"><span>🟡 LEVA COM RECOMENDAÇÃO (nível 3)</span><textarea class="in" id="caRecomenda" rows="5" placeholder="Desconto acima da alçada&#10;Exceção de pagamento" onchange="gCartaoDraft()">${escapeHtml(d.recomenda||'')}</textarea></label>
        <label class="fld"><span>🔴 É DA DIREÇÃO (nível 4)</span><textarea class="in" id="caDirecao" rows="5" placeholder="Contratação e desligamento&#10;Investimento estrutural" onchange="gCartaoDraft()">${escapeHtml(d.direcao||'')}</textarea></label>
      </div>
      <label class="fld"><span>“Comece assim” — a primeira frase da apresentação (se começa com número, vira análise; se começa com desabafo, vira socorro)</span><textarea class="in" id="caFrase" rows="2" placeholder='“A área fechou a semana em ___% da meta. O que puxou foi ___. Já fiz ___ e recomendo ___.”' onchange="gCartaoDraft()">${escapeHtml(d.frase||'')}</textarea></label>
      <div class="btn-row mt16">
        <button class="btn primary" onclick="gCartaoSalvar()">💾 Salvar cartão</button>
        <button class="btn ghost" onclick="G().drafts.cartao=null;save();renderGestao()">Cancelar</button>
      </div>
    </div>` : '';
  return `
  <div class="card pad-lg">
    <p class="eyebrow">Autonomia com critério</p>
    <h2 class="sec" style="margin:6px 0 10px">🃏 Cartões de Alçada — um por área</h2>
    <p class="muted" style="font-size:14.5px">O cartão diz o que cada pessoa <b>decide sozinha</b>, o que <b>leva com recomendação</b> e o que <b>é da direção</b>. Usar a alçada não é atrevimento — é o combinado. Quem opera 6 meses sem incidente tem a faixa ampliada.</p>
    <div class="btn-row mt16"><button class="btn sage" onclick="gCartaoNew()">＋ Novo cartão de área</button></div>
  </div>
  <div class="grid g-2 mt16">${lista}</div>
  ${editor}`;
}
function gCartaoNew(){ G().drafts.cartao={_idx:null}; save(); renderGestao(); setTimeout(()=>$('#caArea')?.focus(),80); }
function gCartaoEdit(i){ const c=G().cartoes[i]; G().drafts.cartao={...c,_idx:i}; save(); renderGestao(); setTimeout(()=>$('#gCartaoEditor')?.scrollIntoView({behavior:'smooth'}),80); }
function gCartaoDraft(){
  const g=G(); const prev=g.drafts.cartao||{};
  g.drafts.cartao={_idx:prev._idx, area:gVal('caArea'), pessoa:gVal('caPessoa'), rotina:gVal('caRotina'), numeros:gVal('caNumeros'), decide:gVal('caDecide'), recomenda:gVal('caRecomenda'), direcao:gVal('caDirecao'), frase:gVal('caFrase')};
  save();
}
function gCartaoSalvar(){
  gCartaoDraft(); const g=G(); const d=g.drafts.cartao;
  if(!d.area){ toast('⚠️','Falta a área','Todo cartão pertence a uma área.'); return; }
  const c={area:d.area,pessoa:d.pessoa,rotina:d.rotina,numeros:d.numeros,decide:d.decide,recomenda:d.recomenda,direcao:d.direcao,frase:d.frase,ts:Date.now()};
  if(d._idx!=null) g.cartoes[d._idx]=c; else g.cartoes.push(c);
  g.drafts.cartao=null;
  save(); grantTrophy('gestao_alcada');
  if(!g.xpFlags.cartao_first){ g.xpFlags.cartao_first=1; addXp(60,'Primeiro Cartão de Alçada criado'); } else addXp(20,'Cartão de Alçada salvo');
  renderGestao();
}
function gCartaoDel(i){ G().cartoes.splice(i,1); save(); renderGestao(); }
function gLinhas(txt){ return (txt||'').split('\n').map(s=>s.trim()).filter(Boolean); }
function gCartaoPrint(i){
  const c=G().cartoes[i]; if(!c) return;
  const col=(t,itens)=>`<div style="flex:1;min-width:0"><h5 style="margin-top:0">${t}</h5><ul style="margin:0;padding-left:16px">${itens.length?itens.map(x=>`<li>${escapeHtml(x)}</li>`).join(''):'<li>—</li>'}</ul></div>`;
  gPrint('🃏','O Seu Cartão — '+(c.area||'Área'),
    `<p style="font-size:11px;color:#8a8a8e">${escapeHtml(c.pessoa||'')} · Imprima e deixe à vista. Nada sai da sua lista — muda o que você leva para a mesa da direção.</p>
     <h5>O que não muda na sua rotina</h5><p>${escapeHtml(c.rotina||'—')}</p>
     <h5>Os seus números da semana — vão no report toda segunda, até as 12h</h5>
     <ul style="margin:0 0 10px;padding-left:16px">${gLinhas(c.numeros).map(x=>`<li>${escapeHtml(x)}</li>`).join('')||'<li>—</li>'}</ul>
     <h5>A sua alçada</h5>
     <div style="display:flex;gap:14px">${col('EU DECIDO SOZINHO · níveis 1–2',gLinhas(c.decide))}${col('LEVO COM RECOMENDAÇÃO · nível 3',gLinhas(c.recomenda))}${col('É DA DIREÇÃO · nível 4',gLinhas(c.direcao))}</div>
     <div class="callout" style="margin-top:16px"><span class="ic">💬</span><div><b>Comece assim:</b> ${escapeHtml(c.frase||'“A área fechou a semana em ___% da meta. O que puxou foi ___. Já fiz ___ e recomendo ___.”')}</div></div>
     <p style="font-size:10px;color:#8a8a8e;margin-top:14px">Decisão registrada que deu errado custa menos que decisão que ficou esperando resposta. Autonomia se ganha mostrando critério.</p>`);
}

/* ===================================================================
   ABA 6 — MÉTODO DOS 5 DEDOS
   =================================================================== */
const G_DEDOS=[
  {k:'situacao', em:'👍', t:'1 · Polegar — Situação', p:'O que aconteceu, em UMA frase. Sem rodeio.', ex:'Perdi conversão em pedidos grandes.'},
  {k:'numero',   em:'☝️', t:'2 · Indicador — Número', p:'O dado que prova. “Caiu” não é número; 21% é número.', ex:'A conversão nessa faixa caiu de 24% para 13%.'},
  {k:'jafiz',    em:'🖕', t:'3 · Médio — O que eu já fiz', p:'A providência que você já tomou. Muda a conversa inteira.', ex:'Já mudei a ordem de atendimento para priorizar esses casos.'},
  {k:'recomendo',em:'💍', t:'4 · Anelar — O que eu recomendo', p:'O dedo mais importante. Sem ele, você pede que pensem por você.', ex:'Recomendo alçada de 8% de desconto com relatório semanal.'},
  {k:'preciso',  em:'🤙', t:'5 · Mindinho — O que eu preciso de você', p:'O pedido exato: aval, decisão, recurso — ou só ciência.', ex:'Preciso do seu aval até sexta.'},
];
function gDedosHtml(){
  const g=G(); const d=g.drafts.dedos||{};
  return `
  <div class="grid g-2" style="grid-template-columns:1.3fr 1fr;align-items:start">
    <div class="card pad-lg">
      <p class="eyebrow">Como levar qualquer assunto — sempre na mesma ordem</p>
      <h2 class="sec" style="margin:6px 0 10px">🖐️ Método dos 5 Dedos</h2>
      <p class="muted tiny">Serve para o relatório, a reunião e a conversa de corredor. Faltou um dedo, a conversa ainda não está pronta. Preencha e veja sua fala montada ao vivo.</p>
      ${G_DEDOS.map(f=>`<label class="fld"><span>${f.em} ${f.t} — <i style="color:var(--mute-2)">${f.p}</i></span><textarea class="in gd-in" id="gd_${f.k}" rows="2" placeholder="Ex.: ${escAttr(f.ex)}" oninput="gDedosPreview()" onchange="gDedosDraft()">${escapeHtml(d[f.k]||'')}</textarea></label>`).join('')}
      <div class="btn-row mt16">
        <button class="btn primary" onclick="gDedosSalvar()">💾 Salvar roteiro</button>
        <button class="btn ghost" onclick="gDedosCopy()">📋 Copiar fala</button>
        <button class="btn ghost" onclick="gDedosPrintDraft()">🖨️ Imprimir A4</button>
      </div>
    </div>
    <div>
      <div class="card pad-lg" style="border-color:rgba(245,181,61,.35)">
        <p class="eyebrow">Sua fala, pronta</p>
        <p id="gdPreview" style="font-size:15px;line-height:1.8;color:var(--star);font-style:italic;margin:10px 0 0">${escapeHtml(gDedosFala(d)||'Preencha os 5 dedos ao lado e sua fala aparece aqui, no tom certo.')}</p>
      </div>
      <div class="card mt16">
        <p class="eyebrow">O mesmo assunto, das duas formas</p>
        <p class="tiny mt8" style="color:var(--coral);line-height:1.6"><b>COMO ERA:</b> “Estamos perdendo venda grande porque a aprovação de desconto demora. Precisamos resolver isso.”</p>
        <p class="tiny mt8" style="color:var(--sage);line-height:1.6"><b>COMO FICA:</b> “Perdi 11 pontos de conversão em pedidos acima de 15 mil (1). A conversão caiu de 24% para 13% (2). Já mudei a ordem de atendimento (3). Recomendo alçada de 8% com relatório semanal (4). Preciso do seu aval até sexta (5).”</p>
        <p class="tiny muted mt8">Nas duas falas o problema é o mesmo. Na segunda, quem fala já resolveu — e só pede confirmação.</p>
      </div>
      ${g.dedos.length?`<div class="card mt16"><p class="eyebrow">Roteiros salvos</p>${g.dedos.map((r,i)=>`
        <div style="display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-soft)">
          <div class="tiny" style="color:var(--steel);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml((r.situacao||'').slice(0,60)||'Roteiro')}</div>
          <div class="btn-row"><button class="btn ghost sm" onclick="gDedosLoad(${i})">↩︎</button><button class="btn ghost sm" onclick="gDedosDel(${i})">✕</button></div>
        </div>`).join('')}</div>`:''}
    </div>
  </div>`;
}
function gDedosFala(d){
  if(!d) return '';
  const parts=[d.situacao,d.numero,d.jafiz,d.recomendo,d.preciso].map(s=>(s||'').trim()).filter(Boolean);
  if(!parts.length) return '';
  return '“'+parts.join(' ')+'”';
}
function gDedosCollect(){ const o={}; G_DEDOS.forEach(f=>o[f.k]=gVal('gd_'+f.k)); return o; }
function gDedosDraft(){ G().drafts.dedos=gDedosCollect(); save(); }
function gDedosPreview(){ const p=$('#gdPreview'); if(p) p.textContent=gDedosFala(gDedosCollect())||'Preencha os 5 dedos ao lado e sua fala aparece aqui, no tom certo.'; }
function gDedosSalvar(){
  gDedosDraft(); const g=G(); const d=g.drafts.dedos;
  if(!d.situacao||!d.recomendo){ toast('⚠️','Faltou dedo','No mínimo: a situação (1) e a sua recomendação (4).'); return; }
  g.dedos.unshift({...d, ts:Date.now()});
  if(g.dedos.length>40) g.dedos.length=40;
  g.drafts.dedos={};
  save();
  if(!g.xpFlags.dedos_first){ g.xpFlags.dedos_first=1; addXp(30,'Primeiro roteiro 5 Dedos'); } else addXp(10,'Roteiro 5 Dedos salvo');
  renderGestao();
}
function gDedosLoad(i){ const g=G(); g.drafts.dedos={...g.dedos[i]}; save(); renderGestao(); }
function gDedosDel(i){ G().dedos.splice(i,1); save(); renderGestao(); }
function gDedosCopy(){
  const fala=gDedosFala(gDedosCollect());
  if(!fala){ toast('⚠️','Nada para copiar','Preencha os dedos primeiro.'); return; }
  navigator.clipboard?.writeText(fala.replace(/[“”]/g,''));
  toast('📋','Fala copiada','Cole no WhatsApp, no e-mail ou leve para a reunião.');
}
function gDedosPrintDraft(){
  const d=gDedosCollect();
  gPrint('🖐️','Roteiro dos 5 Dedos',
    G_DEDOS.map(f=>`<h5>${f.t}</h5><p>${escapeHtml(d[f.k]||'—')}</p>`).join('')+
    `<div class="callout"><span class="ic">💬</span><div><b>Fala completa:</b> ${escapeHtml(gDedosFala(d)||'—')}</div></div>
     <p style="font-size:10px;color:#8a8a8e;margin-top:12px">Antes de falar, confira a mão. Faltou um dedo, a conversa ainda não está pronta.</p>`);
}

/* ===================================================================
   ABA 7 — POSSO DECIDIR SOZINHO? (fluxo de decisão + registro)
   =================================================================== */
function gFluxoHtml(){
  const g=G();
  const q=[
    {t:'Está na lista do cartão de alçada de quem vai decidir?', s:'Cada área tem por escrito o que decide sozinha (aba 🃏). Se está lá, é dela.', sim:'Próxima pergunta →', nao:'nivel3'},
    {t:'É a situação normal do dia a dia — ou uma exceção que a política já prevê?', s:'Rotina prevista decide e registra. Exceção prevista decide e avisa.', sim:'Próxima pergunta →', nao:'nivel2'},
    {t:'Se der errado, dá para voltar atrás?', s:'Contrato assinado, dinheiro alto, jurídico e dívida não dão.', sim:'nivel1', nao:'nivel4'},
  ];
  const NIVEIS={
    nivel1:{em:'🟢',t:'Nível 1 — Decida e registre',d:'Não precisa avisar ninguém. Aparece só como número no report da semana. Decisão registrada que deu errado custa menos que decisão parada esperando resposta.'},
    nivel2:{em:'🟢',t:'Nível 2 — Decida e avise no mesmo dia',d:'Decide primeiro, comunica depois — com a razão da escolha. Não é pedir permissão.'},
    nivel3:{em:'🟡',t:'Nível 3 — Leve com a sua recomendação',d:'Use os 5 Dedos (aba 🖐️). A direção aprova, ajusta ou recusa — mas em cima do que você já pensou.'},
    nivel4:{em:'🔴',t:'Nível 4 — A direção decide',d:'Leve os dados e o contexto. Este bloco não se delega — e isso não é falta de confiança: é o tipo de decisão que não tem volta.'},
  };
  let wizard='';
  const st=gFlow.step;
  if(typeof st==='string'){
    const n=NIVEIS[st];
    wizard=`<div class="center" style="padding:14px 0">
      <div style="font-size:44px">${n.em}</div>
      <h3 style="font-family:var(--serif);margin:10px 0 8px">${n.t}</h3>
      <p class="muted" style="max-width:480px;margin:0 auto">${n.d}</p>
      <div class="btn-row mt24" style="justify-content:center">
        ${st==='nivel3'?`<button class="btn primary" onclick="gGo('dedos')">🖐️ Montar os 5 Dedos</button>`:''}
        <button class="btn ghost" onclick="gFlow={step:0,answers:{}};renderGestao()">↺ Nova decisão</button>
      </div></div>`;
  } else {
    const qq=q[st];
    wizard=`<div class="center" style="padding:14px 0">
      <p class="eyebrow" style="justify-content:center">Pergunta ${st+1} de 3</p>
      <h3 style="font-family:var(--serif);margin:12px 0 8px;max-width:520px;margin-left:auto;margin-right:auto">${qq.t}</h3>
      <p class="muted tiny" style="max-width:440px;margin:0 auto">${qq.s}</p>
      <div class="btn-row mt24" style="justify-content:center">
        <button class="btn sage" onclick="gFlowAns(true)">Sim</button>
        <button class="btn ghost" onclick="gFlowAns(false)">Não</button>
      </div></div>`;
  }
  return `
  <div class="grid g-2" style="align-items:start">
    <div class="card pad-lg">
      <p class="eyebrow">Antes de mandar mensagem para a direção</p>
      <h2 class="sec" style="margin:6px 0 4px">🧩 Posso decidir isso sozinho?</h2>
      <p class="muted tiny">Três perguntas resolvem quase tudo. Na dúvida entre dois caminhos, escolha o de cima — e registre.</p>
      <div class="divider"></div>
      ${wizard}
    </div>
    <div class="card pad-lg">
      <p class="eyebrow">Diário de decisões — o ciclo de aprendizado</p>
      <p class="muted tiny mt8">Toda decisão registrada vira patrimônio da empresa. O conhecimento para de ir embora com as pessoas.</p>
      <label class="fld mt16"><span>O que foi decidido</span><input class="in" id="gdcOque" placeholder="Ex.: Troquei o fornecedor da embalagem"></label>
      <div class="grid g-2">
        <label class="fld"><span>Nível</span><select class="in" id="gdcNivel"><option>Nível 1 — decidi e registrei</option><option>Nível 2 — decidi e avisei</option><option>Nível 3 — levei com recomendação</option><option>Nível 4 — direção decidiu</option></select></label>
        <label class="fld"><span>Resultado até agora</span><select class="in" id="gdcRes"><option>Em andamento</option><option>Deu certo</option><option>Deu errado — e registrei o porquê</option></select></label>
      </div>
      <label class="fld"><span>Por que decidi assim (o critério)</span><textarea class="in" id="gdcPorque" rows="2" placeholder="O número, a regra do cartão ou o contexto que sustentou a decisão"></textarea></label>
      <button class="btn primary" onclick="gDecisaoAdd()">＋ Registrar decisão</button>
      ${g.decisoes.length?`<div class="divider"></div>${g.decisoes.slice(0,8).map((dc,i)=>`
        <div style="padding:9px 0;border-bottom:1px solid var(--line-soft)">
          <div style="display:flex;justify-content:space-between;gap:10px"><b class="tiny" style="color:var(--star)">${escapeHtml(dc.oque)}</b>
          <button class="btn ghost sm" onclick="gDecisaoDel(${i})">✕</button></div>
          <div class="tiny muted">${escapeHtml(dc.nivel)} · ${escapeHtml(dc.res)} · ${new Date(dc.ts).toLocaleDateString('pt-BR')}</div>
          ${dc.porque?`<div class="tiny" style="color:var(--steel);margin-top:3px">${escapeHtml(dc.porque)}</div>`:''}
        </div>`).join('')}`:''}
    </div>
  </div>`;
}
function gFlowAns(sim){
  const st=gFlow.step;
  if(st===0){ gFlow.step = sim ? 1 : 'nivel3'; }
  else if(st===1){ gFlow.step = sim ? 2 : 'nivel2'; }
  else if(st===2){ gFlow.step = sim ? 'nivel1' : 'nivel4'; }
  renderGestao();
}
function gDecisaoAdd(){
  const oque=gVal('gdcOque'); if(!oque){ toast('⚠️','Falta a decisão','Diga o que foi decidido.'); return; }
  const g=G();
  g.decisoes.unshift({oque, nivel:gVal('gdcNivel'), res:gVal('gdcRes'), porque:gVal('gdcPorque'), ts:Date.now()});
  if(g.decisoes.length>80) g.decisoes.length=80;
  save(); addXp(15,'Decisão registrada'); renderGestao();
}
function gDecisaoDel(i){ G().decisoes.splice(i,1); save(); renderGestao(); }

/* ---------- importar backup (contrapartida do exportData) ---------- */
function importData(file){
  const rd=new FileReader();
  rd.onload=async e=>{
    try{
      const obj=JSON.parse(e.target.result);
      if(!obj || typeof obj!=='object' || !('xp' in obj)) throw new Error('formato');
      S={...defaultState(),...obj};
      await Store.set(KEY, JSON.stringify(S));
      toast('📥','Progresso importado','Bem-vindo(a) de volta.');
      renderTop(); go('home');
    }catch(err){ toast('⚠️','Arquivo inválido','Selecione um backup exportado pela própria plataforma.'); }
  };
  rd.readAsText(file);
}

/* ---------- signature footer ---------- */
function signature(){
  return `<div class="sig">
    <div class="nm">Carla Caroline</div>
    <div class="rl">Mentora Comportamental · Estrategista de Negócios</div>
    <div class="ln">Operação Blindada — plataforma de mentoria de estratégia e negócios · transformar conhecimento em decisão e resultado.</div>
  </div>`;
}

/* ===================================================================
   BOOT
   =================================================================== */
async function boot(){
  const raw=await Store.get(KEY);
  if(raw){ try{ S=JSON.parse(raw); }catch(e){ S=defaultState(); } }
  else S=defaultState();
  // migrate missing keys
  S={...defaultState(),...S};
  S.modules=S.modules||{}; S.trophies=S.trophies||{}; S.surveys=S.surveys||{}; S.tools=S.tools||{}; S.log=S.log||[]; S.visited=S.visited||{};
  S.diary=S.diary||[]; S.plan=S.plan||[]; S.notifs=S.notifs||[]; S.notes=S.notes||{}; S.deepTests=S.deepTests||{};
  S.pdca=S.pdca||[]; S.agenda=S.agenda||[]; S.suggestions=S.suggestions||[]; S.referrals=S.referrals||[]; S.unlocks=S.unlocks||{}; S.results=S.results||[];
  S.gestao=S.gestao||null; // inicializado sob demanda por G()
  S.streak=S.streak||0;
  S.level=levelForXp(S.xp);

  renderTabs();
  if(!S.name){
    $('#tabs').style.display='none';
    renderOnboard();
    $('#view-onboard').classList.add('active');
  } else {
    $('#tabs').style.display='';
    touchStreak();
    renderTop();
    go('home');
  }
}
window.addEventListener('resize', ()=>{ if(current==='lesson') renderLesson(); });
OB.start().then(boot).then(function(){ if(window.obCheckUpdates) obCheckUpdates(); });
</script>
