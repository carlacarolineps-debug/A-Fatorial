<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Operação Blindada — Mentoria de Estratégia e Negócios</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap');
/* ============================================================
   OPERAÇÃO BLINDADA — Design tokens
   Direção: "Cofre e Estrategista". A mentoria como blindagem do
   negócio. Fundo carbono profundo (quase preto, levemente metálico),
   ouro = a conquista / a blindagem que se acende. Aço = estrutura.
   Estrutura que protege. Estratégia que escala.
   ============================================================ */
:root{
  --ink:#0a0c12;          /* carbono base, quase preto */
  --ink-2:#10131c;        /* painel */
  --ink-3:#181c28;        /* card */
  --line:#2c3344;         /* aço — linhas/divisores */
  --line-soft:#1f2533;
  --star:#f4f6fb;         /* texto claro */
  --mute:#9aa3bb;         /* texto secundário */
  --mute-2:#69728c;       /* texto terciário */
  --amber:#f5b53d;        /* OURO — acento principal, conquista/luz */
  --amber-deep:#c98a1e;
  --steel:#b9c2d6;        /* aço metálico — estrutura */
  --sage:#5fd0a6;         /* progresso vivo / sucesso */
  --sage-deep:#2fa07a;
  --coral:#ff7a6b;        /* alerta/atenção */
  --violet:#9b8cff;       /* destaque secundário / info */
  --glow: 0 0 0 1px rgba(245,181,61,.40), 0 8px 30px -8px rgba(245,181,61,.50);
  --radius:18px;
  --radius-sm:12px;
  --maxw:1120px;
  --shadow: 0 24px 60px -28px rgba(0,0,0,.78);
  --serif:"Fraunces", Georgia, "Times New Roman", serif;
  --sans:"Outfit", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:"Space Mono", ui-monospace, "Cascadia Mono", monospace;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);
  background:
    radial-gradient(1200px 700px at 85% -10%, rgba(245,181,61,.10), transparent 60%),
    radial-gradient(900px 600px at -5% 110%, rgba(185,194,214,.07), transparent 55%),
    var(--ink);
  color:var(--star);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
/* subtle star field */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:
    radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,.45), transparent),
    radial-gradient(1px 1px at 60% 70%, rgba(255,255,255,.30), transparent),
    radial-gradient(1px 1px at 80% 20%, rgba(255,255,255,.25), transparent),
    radial-gradient(1.5px 1.5px at 35% 80%, rgba(245,181,61,.30), transparent),
    radial-gradient(1px 1px at 90% 60%, rgba(255,255,255,.25), transparent);
  background-size:cover;
}
a{color:inherit}
button{font-family:inherit}
::selection{background:rgba(245,181,61,.3)}

.wrap{position:relative;z-index:1;max-width:var(--maxw);margin:0 auto;padding:0 20px}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(to bottom, rgba(12,18,36,.96), rgba(12,18,36,.75) 70%, transparent);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line-soft);
}
.topbar-inner{display:flex;align-items:center;gap:18px;padding:12px 20px;max-width:var(--maxw);margin:0 auto}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer;user-select:none}
.brand .mark{
  width:34px;height:34px;border-radius:10px;flex:none;
  background:conic-gradient(from 220deg, var(--amber), var(--steel) 45%, var(--amber-deep) 78%, var(--amber));
  display:grid;place-items:center;color:#0c1224;font-weight:700;font-family:var(--serif);
  box-shadow:0 6px 18px -6px rgba(245,181,61,.6);
}
.brand .mark span{font-size:18px;line-height:1;transform:translateY(.5px)}
.brand b{font-family:var(--serif);font-weight:600;font-size:17px;letter-spacing:.2px}
.brand small{display:block;color:var(--mute);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-top:1px}

.top-stats{margin-left:auto;display:flex;align-items:center;gap:10px}
.chip{
  display:inline-flex;align-items:center;gap:7px;
  background:var(--ink-3);border:1px solid var(--line);
  padding:6px 11px;border-radius:999px;font-size:13px;color:var(--star);font-weight:500;
}
.chip .ic{font-size:14px}
.chip.lvl{border-color:rgba(245,181,61,.4);background:rgba(245,181,61,.08)}
.chip.xp{border-color:rgba(95,208,166,.35);background:rgba(95,208,166,.07)}
.avatar{
  width:34px;height:34px;border-radius:50%;flex:none;cursor:pointer;
  background:radial-gradient(circle at 30% 30%, var(--violet), var(--ink-3));
  border:1px solid var(--line);display:grid;place-items:center;font-weight:600;font-size:13px;color:var(--star)
}

/* ---------- nav tabs ---------- */
.tabs{display:flex;gap:4px;overflow-x:auto;padding:10px 20px 0;max-width:var(--maxw);margin:0 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:none;border:none;background:transparent;color:var(--mute);
  padding:9px 15px;border-radius:11px 11px 0 0;font-size:14px;font-weight:500;cursor:pointer;
  border-bottom:2px solid transparent;transition:.16s;white-space:nowrap;display:flex;align-items:center;gap:7px
}
.tab:hover{color:var(--star)}
.tab.active{color:var(--star);border-bottom-color:var(--amber);background:linear-gradient(to bottom, rgba(245,181,61,.08), transparent)}
.tab .ic{font-size:15px;opacity:.85}

/* ---------- views ---------- */
.view{display:none;padding:30px 0 90px;animation:fade .4s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--amber);margin:0 0 8px}
h1.page{font-family:var(--serif);font-weight:600;font-size:clamp(28px,4.4vw,42px);line-height:1.05;margin:0 0 8px;letter-spacing:-.01em}
.lead{color:var(--mute);font-size:16px;max-width:680px;margin:0 0 28px}
h2.sec{font-family:var(--serif);font-weight:600;font-size:23px;margin:34px 0 14px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
h2.sec .ic{font-size:20px}

/* ---------- cards / grids ---------- */
.grid{display:grid;gap:16px}
.g-2{grid-template-columns:repeat(2,1fr)}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-4{grid-template-columns:repeat(4,1fr)}
.card{
  background:linear-gradient(180deg, var(--ink-3), var(--ink-2));
  border:1px solid var(--line-soft);border-radius:var(--radius);padding:20px;position:relative;overflow:hidden;
}
.card.pad-lg{padding:26px}

/* ---------- hero (home) ---------- */
.hero{
  background:
    radial-gradient(700px 300px at 110% -40%, rgba(245,181,61,.16), transparent 60%),
    linear-gradient(180deg, var(--ink-3), var(--ink-2));
  border:1px solid var(--line);border-radius:24px;padding:34px;position:relative;overflow:hidden
}
.hero .constellation{position:absolute;right:-20px;top:-20px;width:340px;height:340px;opacity:.5;pointer-events:none}
.hero h1{font-family:var(--serif);font-weight:600;font-size:clamp(26px,4vw,38px);margin:0 0 10px;max-width:640px;line-height:1.08;letter-spacing:-.01em}
.hero p{color:var(--mute);max-width:560px;font-size:16px;margin:0 0 22px}
.hero .greet{font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--sage);margin:0 0 14px}

.btn{
  display:inline-flex;align-items:center;gap:9px;border:none;cursor:pointer;
  padding:12px 20px;border-radius:12px;font-size:15px;font-weight:600;transition:.16s;text-decoration:none
}
.btn.primary{background:linear-gradient(135deg,var(--amber),var(--amber-deep));color:#231603;box-shadow:0 10px 24px -10px rgba(245,181,61,.7)}
.btn.primary:hover{transform:translateY(-2px);box-shadow:0 16px 30px -10px rgba(245,181,61,.8)}
.btn.ghost{background:var(--ink-3);color:var(--star);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--amber);color:var(--amber)}
.btn.sage{background:linear-gradient(135deg,var(--sage),var(--sage-deep));color:#04231a;box-shadow:0 10px 24px -12px rgba(95,208,166,.6)}
.btn.sage:hover{transform:translateY(-2px)}
.btn.sm{padding:8px 14px;font-size:13.5px;border-radius:10px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important;box-shadow:none}
.btn-row{display:flex;gap:12px;flex-wrap:wrap}

/* progress ring + bars */
.ring{--p:0;--sz:120px;width:var(--sz);height:var(--sz);border-radius:50%;display:grid;place-items:center;flex:none;
  background:conic-gradient(var(--amber) calc(var(--p)*1%), var(--line-soft) 0)}
.ring::before{content:"";position:absolute;width:calc(var(--sz) - 18px);height:calc(var(--sz) - 18px);border-radius:50%;background:var(--ink-2)}
.ring b{position:relative;font-family:var(--serif);font-size:26px;font-weight:600}
.ring small{position:relative;display:block;text-align:center;color:var(--mute);font-size:11px;letter-spacing:.08em}
.bar{height:9px;border-radius:99px;background:var(--line-soft);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--sage),var(--amber));width:0;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar.amber>i{background:linear-gradient(90deg,var(--amber-deep),var(--amber))}

.stat-num{font-family:var(--serif);font-size:32px;font-weight:600;line-height:1}
.stat-lbl{color:var(--mute);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;margin-top:6px}

/* ---------- trilhas (módulos) ---------- */
.module{
  background:linear-gradient(180deg, var(--ink-3), var(--ink-2));
  border:1px solid var(--line-soft);border-radius:var(--radius);overflow:hidden;
  display:flex;flex-direction:column;transition:.18s;position:relative
}
.module:hover{transform:translateY(-3px);border-color:var(--line)}
.module .top{padding:20px 20px 14px;position:relative}
.module .num{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--mute-2)}
.module h3{font-family:var(--serif);font-weight:600;font-size:19px;margin:6px 0 8px;line-height:1.15}
.module .desc{color:var(--mute);font-size:13.5px;min-height:38px}
.module .meta{display:flex;align-items:center;gap:14px;padding:0 20px 14px;color:var(--mute-2);font-size:12px}
.module .meta span{display:inline-flex;align-items:center;gap:5px}
.module .foot{margin-top:auto;padding:14px 20px;border-top:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;gap:10px}
.module .barwrap{padding:0 20px 14px}
.lockwrap{position:absolute;inset:0;background:rgba(10,15,30,.72);backdrop-filter:blur(2px);display:grid;place-items:center;z-index:3;border-radius:var(--radius)}
.lockwrap .lk{text-align:center;padding:20px}
.lockwrap .lk .ic{font-size:26px}
.lockwrap .lk small{display:block;color:var(--mute);margin-top:6px;font-size:12.5px;max-width:180px}
.badge-status{font-size:11px;font-weight:600;padding:4px 10px;border-radius:99px;letter-spacing:.04em}
.st-done{background:rgba(95,208,166,.15);color:var(--sage);border:1px solid rgba(95,208,166,.3)}
.st-prog{background:rgba(245,181,61,.13);color:var(--amber);border:1px solid rgba(245,181,61,.3)}
.st-lock{background:rgba(120,130,170,.12);color:var(--mute-2);border:1px solid var(--line-soft)}
.module .ribbon{position:absolute;top:14px;right:-32px;transform:rotate(45deg);background:var(--sage);color:#04231a;font-size:10px;font-weight:700;letter-spacing:.1em;padding:3px 38px}

.pill-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.pill{font-size:11.5px;color:var(--mute);background:var(--ink);border:1px solid var(--line-soft);padding:4px 10px;border-radius:99px}
.pill.amber{color:var(--amber);border-color:rgba(245,181,61,.3)}

/* ---------- lesson / módulo aberto ---------- */
.lesson-head{display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap;margin-bottom:8px}
.lesson-head .glyph{width:64px;height:64px;border-radius:16px;flex:none;display:grid;place-items:center;font-size:30px;
  background:linear-gradient(135deg, rgba(245,181,61,.18), rgba(155,140,255,.16));border:1px solid var(--line)}
.steps{display:flex;flex-direction:column;gap:10px;margin:18px 0}
.step{
  display:flex;gap:14px;align-items:flex-start;background:var(--ink-2);border:1px solid var(--line-soft);
  border-radius:14px;padding:14px 16px;cursor:pointer;transition:.15s
}
.step:hover{border-color:var(--line)}
.step.active{border-color:var(--amber);box-shadow:0 0 0 1px rgba(245,181,61,.25)}
.step.done{opacity:.85}
.step .dot{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;font-weight:700;
  background:var(--ink-3);border:1px solid var(--line);color:var(--mute)}
.step.done .dot{background:var(--sage);border-color:var(--sage);color:#04231a}
.step .stepbody{flex:1;min-width:0}
.step .stepbody b{font-size:14.5px;font-weight:600;display:block}
.step .stepbody .kind{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute-2);margin-bottom:3px}
.step .arrow{color:var(--mute-2);align-self:center}

.content-block{line-height:1.7;color:#cfd6f0;font-size:15.3px}
.content-block h4{font-family:var(--serif);color:var(--star);font-size:18px;margin:22px 0 8px;font-weight:600}
.content-block p{margin:0 0 14px}
.content-block ul{margin:0 0 14px;padding-left:0;list-style:none}
.content-block ul li{position:relative;padding-left:24px;margin-bottom:9px}
.content-block ul li::before{content:"";position:absolute;left:4px;top:9px;width:7px;height:7px;border-radius:50%;
  background:var(--amber);box-shadow:0 0 8px rgba(245,181,61,.7)}
.content-block .quote{border-left:3px solid var(--violet);background:rgba(155,140,255,.06);padding:14px 18px;border-radius:0 12px 12px 0;color:#dfe3f7;font-style:italic;margin:0 0 16px}
.content-block .quote cite{display:block;font-style:normal;color:var(--mute);font-size:12.5px;margin-top:8px;font-family:var(--mono)}
.callout{display:flex;gap:13px;background:rgba(245,181,61,.07);border:1px solid rgba(245,181,61,.25);border-radius:14px;padding:15px 17px;margin:0 0 16px}
.callout .ic{font-size:20px;flex:none}
.callout b{color:var(--amber)}

/* ---------- quiz ---------- */
.quiz-q{margin-bottom:22px}
.quiz-q .qnum{font-family:var(--mono);font-size:11px;color:var(--amber);letter-spacing:.14em}
.quiz-q h4{font-family:var(--sans);font-weight:600;font-size:16.5px;margin:5px 0 14px;line-height:1.35}
.opt{display:flex;gap:12px;align-items:flex-start;background:var(--ink-2);border:1px solid var(--line-soft);border-radius:12px;
  padding:13px 15px;margin-bottom:9px;cursor:pointer;transition:.14s}
.opt:hover{border-color:var(--line)}
.opt .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:13px;transition:.14s;margin-top:1px}
.opt.sel{border-color:var(--amber);background:rgba(245,181,61,.06)}
.opt.sel .box{background:var(--amber);border-color:var(--amber);color:#231603}
.opt.correct{border-color:var(--sage);background:rgba(95,208,166,.08)}
.opt.correct .box{background:var(--sage);border-color:var(--sage);color:#04231a}
.opt.wrong{border-color:var(--coral);background:rgba(255,122,107,.08)}
.opt.wrong .box{background:var(--coral);border-color:var(--coral);color:#2a0a06}
.opt .txt{font-size:14.5px;flex:1}
.feedback{font-size:13.5px;padding:11px 14px;border-radius:10px;margin-top:6px;display:none}
.feedback.show{display:block}
.feedback.ok{background:rgba(95,208,166,.1);color:var(--sage);border:1px solid rgba(95,208,166,.3)}
.feedback.no{background:rgba(255,122,107,.1);color:#ffb3a8;border:1px solid rgba(255,122,107,.3)}

/* ---------- ferramentas / práticas ---------- */
.tool-card{background:linear-gradient(180deg, var(--ink-3), var(--ink-2));border:1px solid var(--line-soft);border-radius:var(--radius);padding:22px;display:flex;flex-direction:column;transition:.16s}
.tool-card:hover{transform:translateY(-3px);border-color:var(--line)}
.tool-card .ic-lg{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;font-size:24px;margin-bottom:14px;
  background:linear-gradient(135deg,rgba(95,208,166,.16),rgba(245,181,61,.12));border:1px solid var(--line)}
.tool-card h3{font-family:var(--serif);font-size:18px;font-weight:600;margin:0 0 7px}
.tool-card p{color:var(--mute);font-size:13.5px;flex:1;margin:0 0 16px}

/* form fields */
label.fld{display:block;margin-bottom:14px}
label.fld span{display:block;font-size:13px;color:var(--mute);margin-bottom:6px;font-weight:500}
input.in,textarea.in,select.in{width:100%;background:var(--ink);border:1px solid var(--line);color:var(--star);
  border-radius:11px;padding:11px 13px;font-family:inherit;font-size:14.5px;transition:.14s}
input.in:focus,textarea.in:focus,select.in:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px rgba(245,181,61,.12)}
textarea.in{resize:vertical;min-height:84px;line-height:1.5}

/* likert scale (pesquisa clima/cultura) */
.likert{display:flex;gap:6px;flex-wrap:wrap}
.likert button{flex:1;min-width:52px;background:var(--ink);border:1px solid var(--line-soft);color:var(--mute);
  border-radius:10px;padding:10px 6px;cursor:pointer;font-size:12px;font-weight:600;transition:.14s;text-align:center}
.likert button .n{display:block;font-family:var(--serif);font-size:18px;color:var(--star);margin-bottom:2px}
.likert button:hover{border-color:var(--line)}
.likert button.on{border-color:var(--amber);background:rgba(245,181,61,.1);color:var(--amber)}
.likert button.on .n{color:var(--amber)}
.survey-item{padding:16px 0;border-bottom:1px solid var(--line-soft)}
.survey-item:last-child{border-bottom:none}
.survey-item .q{font-size:15px;margin-bottom:11px;font-weight:500}
.survey-item .cat{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--violet);margin-bottom:5px}

/* trophy / conquistas */
.trophy{background:linear-gradient(180deg,var(--ink-3),var(--ink-2));border:1px solid var(--line-soft);border-radius:16px;
  padding:18px;text-align:center;transition:.16s;position:relative;overflow:hidden}
.trophy.locked{opacity:.5;filter:grayscale(.6)}
.trophy.unlocked{border-color:rgba(245,181,61,.4)}
.trophy.unlocked::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,rgba(245,181,61,.14),transparent 60%);pointer-events:none}
.trophy .em{font-size:38px;display:block;margin-bottom:10px}
.trophy b{font-size:14px;display:block;font-weight:600}
.trophy small{color:var(--mute);font-size:11.5px;display:block;margin-top:4px;line-height:1.4}
.trophy .got{margin-top:9px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--sage)}

/* toast / level up */
.toast-zone{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:10px;align-items:center;width:calc(100% - 40px);max-width:420px}
.toast{background:linear-gradient(135deg,var(--ink-3),var(--ink-2));border:1px solid var(--amber);border-radius:14px;
  padding:13px 18px;display:flex;align-items:center;gap:13px;box-shadow:var(--shadow);animation:pop .4s cubic-bezier(.2,1.2,.3,1);width:100%}
.toast .em{font-size:24px;flex:none}
.toast b{display:block;font-size:14.5px}
.toast small{color:var(--mute);font-size:12.5px}
@keyframes pop{from{transform:translateY(20px) scale(.9);opacity:0}to{transform:none;opacity:1}}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(6,10,22,.78);backdrop-filter:blur(6px);z-index:150;display:none;place-items:center;padding:20px}
.modal-bg.show{display:grid;animation:fade .25s}
.modal{background:linear-gradient(180deg,var(--ink-3),var(--ink-2));border:1px solid var(--line);border-radius:20px;
  max-width:560px;width:100%;max-height:88vh;overflow:auto;box-shadow:var(--shadow);padding:28px;position:relative}
.modal .x{position:absolute;top:16px;right:16px;background:var(--ink);border:1px solid var(--line);color:var(--mute);
  width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:18px}
.modal .x:hover{color:var(--star);border-color:var(--amber)}
.modal h3{font-family:var(--serif);font-size:23px;font-weight:600;margin:0 0 6px}
.modal .levelup-em{font-size:54px;text-align:center;margin:6px 0 12px}

/* mentor note */
.mentor-note{display:flex;gap:14px;background:linear-gradient(135deg,rgba(155,140,255,.1),rgba(245,181,61,.06));
  border:1px solid rgba(155,140,255,.3);border-radius:16px;padding:18px 20px;margin:6px 0 20px}
.mentor-note .ava{width:46px;height:46px;border-radius:50%;flex:none;background:radial-gradient(circle at 30% 30%,var(--amber),var(--violet));
  display:grid;place-items:center;font-family:var(--serif);font-weight:600;color:#231603;font-size:18px}
.mentor-note .mn-body b{font-size:13px;color:var(--amber)}
.mentor-note .mn-body p{margin:4px 0 0;font-size:14px;color:#dfe3f7;font-style:italic;line-height:1.55}

/* desafio cards */
.challenge{display:flex;gap:14px;align-items:flex-start;background:var(--ink-2);border:1px solid var(--line-soft);
  border-radius:14px;padding:16px;margin-bottom:12px}
.challenge .cnum{font-family:var(--serif);font-size:22px;color:var(--amber);flex:none;width:34px;text-align:center}
.challenge .cbody{flex:1}
.challenge .cbody b{display:block;font-size:15px;margin-bottom:4px}
.challenge .cbody p{margin:0;color:var(--mute);font-size:13.5px}
.challenge .reward{font-family:var(--mono);font-size:11px;color:var(--sage);white-space:nowrap;flex:none}

/* empty / onboarding */
.center-stage{min-height:70vh;display:grid;place-items:center;text-align:center}
.onb{max-width:520px}
.onb .bigmark{width:84px;height:84px;border-radius:24px;margin:0 auto 22px;
  background:conic-gradient(from 200deg,var(--amber),var(--sage) 50%,var(--violet) 85%,var(--amber));
  display:grid;place-items:center;font-family:var(--serif);font-size:40px;color:#0c1224;font-weight:700;box-shadow:0 16px 40px -14px rgba(245,181,61,.6)}

.kicker-row{display:flex;gap:18px;flex-wrap:wrap;margin:24px 0}
.kicker{flex:1;min-width:130px}
.kicker .stat-num{font-size:26px}

.divider{height:1px;background:var(--line-soft);margin:28px 0}
.muted{color:var(--mute)}
.tiny{font-size:12.5px}
.center{text-align:center}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.hidden{display:none!important}

/* signature footer */
.sig{margin-top:60px;padding:28px 0 40px;border-top:1px solid var(--line-soft);text-align:center}
.sig .nm{font-family:var(--serif);font-size:20px;font-weight:600}
.sig .rl{color:var(--amber);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;font-family:var(--mono);margin-top:4px}
.sig .ln{color:var(--mute-2);font-size:12px;margin-top:10px}

.chip.streak{border-color:rgba(255,122,107,.4);background:rgba(255,122,107,.08);color:#ffb3a8;font-weight:700}
.bell{position:relative;background:var(--ink-3);border:1px solid var(--line);width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:16px;color:var(--star);transition:.14s}
.bell:hover{border-color:var(--amber)}
.dot-badge{position:absolute;top:-5px;right:-5px;background:var(--coral);color:#fff;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:99px;display:grid;place-items:center;padding:0 4px;border:2px solid var(--ink)}

/* diário timeline */
.diary-entry{display:flex;gap:16px;position:relative;padding-bottom:8px}
.diary-entry .tl{display:flex;flex-direction:column;align-items:center;flex:none}
.diary-entry .tl .dot{width:14px;height:14px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 4px rgba(245,181,61,.15);margin-top:6px}
.diary-entry .tl .line{flex:1;width:2px;background:var(--line-soft);margin-top:4px}
.diary-entry:last-child .tl .line{display:none}
.diary-entry .body{flex:1;background:var(--ink-2);border:1px solid var(--line-soft);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.diary-entry .body .meta{display:flex;gap:8px;align-items:center;margin-bottom:7px;flex-wrap:wrap}
.diary-entry .body .meta .tag{font-size:11px;color:var(--amber);background:rgba(245,181,61,.1);border:1px solid rgba(245,181,61,.25);padding:2px 9px;border-radius:99px}
.diary-entry .body p{margin:0;font-size:14.5px;line-height:1.6;color:#dfe3f7;white-space:pre-wrap}

/* plano de ação */
.plan-item{display:flex;gap:13px;align-items:flex-start;background:var(--ink-2);border:1px solid var(--line-soft);border-radius:14px;padding:14px 16px;margin-bottom:11px;transition:.14s}
.plan-item.done{opacity:.6}
.plan-item.done .ptext{text-decoration:line-through;color:var(--mute)}
.plan-check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex:none;cursor:pointer;display:grid;place-items:center;font-size:14px;transition:.14s;margin-top:1px}
.plan-check.on{background:var(--sage);border-color:var(--sage);color:#04231a}
.plan-item .ptext{flex:1;font-size:14.5px}
.plan-item .pdue{font-size:11.5px;color:var(--mute-2);font-family:var(--mono);white-space:nowrap}
.plan-item .pdel{background:none;border:none;color:var(--mute-2);cursor:pointer;font-size:16px;flex:none}
.plan-item .pdel:hover{color:var(--coral)}

/* radar/diagnóstico */
.radar-wrap{display:flex;gap:24px;align-items:center;flex-wrap:wrap;justify-content:center}
.diag-q{padding:15px 0;border-bottom:1px solid var(--line-soft)}
.diag-q:last-child{border-bottom:none}
.diag-q .dim{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--violet);margin-bottom:5px}
.diag-q .q{font-size:14.5px;margin-bottom:10px}
.cmp-bar{display:grid;grid-template-columns:120px 1fr 44px;gap:10px;align-items:center;margin-bottom:9px}
.cmp-bar .lb{font-size:12.5px;color:var(--mute)}
.cmp-track{height:20px;border-radius:6px;background:var(--line-soft);position:relative;overflow:hidden}
.cmp-track .before{position:absolute;left:0;top:0;height:100%;background:rgba(155,140,255,.4);border-radius:6px}
.cmp-track .after{position:absolute;left:0;top:0;height:100%;background:linear-gradient(90deg,var(--sage),var(--amber));border-radius:6px;opacity:.9}

/* certificate */
.cert{background:linear-gradient(160deg,#fbf6ea,#f4ead3);color:#3a2f1a;border-radius:18px;padding:38px;text-align:center;border:2px solid var(--amber);position:relative;overflow:hidden}
.cert::before{content:"";position:absolute;inset:10px;border:1px solid rgba(180,140,60,.35);border-radius:12px;pointer-events:none}
.cert .seal{font-size:46px}
.cert h2{font-family:var(--serif);font-size:28px;color:#2a2110;margin:6px 0}
.cert .nm{font-family:var(--serif);font-size:34px;font-weight:600;color:#7a5418;margin:14px 0 4px;border-bottom:2px solid rgba(122,84,24,.3);display:inline-block;padding:0 20px 8px}
.cert .body{font-size:14px;color:#5a4a2e;max-width:440px;margin:14px auto;line-height:1.6}
.cert .ftr{display:flex;justify-content:space-between;margin-top:24px;font-size:12px;color:#6a5733}
.cert .ftr b{font-family:var(--serif)}

@media(max-width:860px){
  .g-4{grid-template-columns:repeat(2,1fr)}
  .g-3{grid-template-columns:repeat(2,1fr)}
}

  var sb = null, user = null, readyResolve = null, started = false, pushTimer = null, isMentorFlag = false;

  function shieldSvg(px) {
    var h = Math.round(px * 72 / 64);
    return '<svg viewBox="0 0 64 72" width="' + px + '" height="' + h + '" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'
      + '<defs><linearGradient id="obShieldG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7cd6b"/><stop offset=".5" stop-color="#e0a92f"/><stop offset="1" stop-color="#b9831c"/></linearGradient></defs>'
      + '<path d="M32 2 L60 12 V34 C60 52 47 64 32 70 C17 64 4 52 4 34 V12 Z" fill="#14161f" stroke="url(#obShieldG)" stroke-width="2.6"/>'
      + '<path d="M32 8 L54 16 V34 C54 48 44 58 32 63 C20 58 10 48 10 34 V16 Z" fill="none" stroke="rgba(245,181,61,.25)" stroke-width="1"/>'
      + '<path d="M24 33 V26.5 a8 8 0 0 1 16 0 V33" fill="none" stroke="url(#obShieldG)" stroke-width="3.2" stroke-linecap="round"/>'
      + '<rect x="20" y="32" width="24" height="20" rx="4.5" fill="url(#obShieldG)"/>'
      + '<circle cx="32" cy="40" r="3" fill="#14161f"/>'
      + '<rect x="30.6" y="40" width="2.8" height="7.5" rx="1.3" fill="#14161f"/>'
      + '</svg>';
  }

  function overlay(html) {
    var el = document.getElementById("ob-gate");
    if (!el) {
      el = document.createElement("div");
      el.id = "ob-gate";
      el.style.cssText = "position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#0c0d0f;color:#e8e6e1;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:24px";
      document.body.appendChild(el);
    }
    el.innerHTML = '<div style="max-width:380px;width:100%;text-align:center">'
      + '<div style="display:flex;justify-content:center;margin-bottom:14px">' + shieldSvg(54) + '</div>'
      + '<div style="line-height:1;margin-bottom:7px;font-family:Georgia,serif">'
        + '<div style="color:#f5b53d;font-size:12px;font-weight:700;letter-spacing:.34em;margin-bottom:3px">OPERA&Ccedil;&Atilde;O</div>'
        + '<div style="color:#d7deec;font-size:27px;font-weight:800;letter-spacing:.14em">BLINDADA</div>'
      + '</div>'
      + '<div style="color:#c8a24a;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:24px">Estrutura que protege &middot; Estrat&eacute;gia que escala</div>'
      + html + "</div>";
    el.style.display = "flex";
    return el;
  }
  function closeOverlay() { var el = document.getElementById("ob-gate"); if (el) el.style.display = "none"; }
  var btnCss = "width:100%;padding:13px;border:0;border-radius:10px;cursor:pointer;background:linear-gradient(180deg,#f5b53d,#d99a25);color:#1a1505;font-weight:700;font-size:14px";
  var inpCss = "width:100%;padding:13px;border:1px solid #2a2c30;border-radius:10px;background:#141518;color:#e8e6e1;font-size:14px;margin-bottom:12px;box-sizing:border-box";
  var linkCss = "background:none;border:0;color:#8a8780;font-size:12px;cursor:pointer;margin-top:18px;text-decoration:underline";

  function showLogin() {
    overlay('<div style="color:#b9b6ad;font-size:13.5px;margin-bottom:18px">Entre com o <b>mesmo e-mail</b> que voce usou na compra.</div>'
      + '<input id="ob-email" type="email" placeholder="seu@email.com" style="' + inpCss + '"/>'
      + '<button id="ob-send" style="' + btnCss + '">Receber link de acesso</button>');
    var send = document.getElementById("ob-send"), inp = document.getElementById("ob-email");
    inp.addEventListener("keydown", function (e) { if (e.key === "Enter") send.click(); });
    send.addEventListener("click", function () {
      var email = (inp.value || "").trim().toLowerCase();
      if (!email || email.indexOf("@") < 0) { inp.focus(); return; }
      send.textContent = "Enviando..."; send.disabled = true;
      sb.auth.signInWithOtp({ email: email, options: { emailRedirectTo: location.href.split("#")[0] } })
        .then(function (r) {
          if (r.error) { send.textContent = "Tentar de novo"; send.disabled = false; return; }
          overlay('<div style="font-size:34px;margin-bottom:8px">&#128233;</div><div style="font-size:15px;margin-bottom:8px"><b>Link enviado!</b></div><div style="color:#b9b6ad;font-size:13px">Abra seu e-mail e toque no link para entrar. Pode fechar esta aba.</div>');
        });
    });
  }

  function showPending(email) {
    overlay('<div style="font-size:34px;margin-bottom:8px">&#9203;</div><div style="font-size:15px;margin-bottom:8px"><b>Acesso ainda nao liberado</b></div>'
      + '<div style="color:#b9b6ad;font-size:13px;line-height:1.5">Nao encontramos uma compra ativa para <b>' + email + '</b>.<br><br>Se voce acabou de comprar, aguarde 1-2 minutos e recarregue. Se usou outro e-mail na compra, entre com aquele e-mail.</div>'
      + '<button id="ob-reload" style="' + btnCss + ';margin-top:18px">Ja comprei - recarregar</button>'
      + '<button id="ob-logout" style="' + linkCss + '">Entrar com outro e-mail</button>');
    document.getElementById("ob-reload").addEventListener("click", function () { location.reload(); });
    document.getElementById("ob-logout").addEventListener("click", signOut);
  }

  function ensureClient() {
    if (sb) return sb;
    if (!window.supabase || !window.supabase.createClient) throw new Error("supabase-js nao carregou - confira sua conexao.");
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, detectSessionInUrl: true, autoRefreshToken: true } });
    return sb;
  }
  function ensureProfile() {
    var name = (user.user_metadata && user.user_metadata.full_name) || "";
    var display = name ? name.split(" ")[0] : (user.email || "").split("@")[0];
    return sb.from("profiles").upsert({ user_id: user.id, email: user.email, display_name: display, full_name: name }, { onConflict: "user_id", ignoreDuplicates: true });
  }
  function checkAccess() {
    return sb.from("access").select("status,expires_at").eq("email", (user.email || "").toLowerCase()).maybeSingle()
      .then(function (r) {
        if (r.error || !r.data) return false;
        if (r.data.status === "active") return true;
        if (r.data.status === "grace" && r.data.expires_at && new Date(r.data.expires_at) > new Date()) return true;
        return false;
      });
  }
  function pullState() {
    return sb.from("progress").select("state").eq("user_id", user.id).maybeSingle()
      .then(function (r) {
        if (r.error) return;
        if (r.data && r.data.state && Object.keys(r.data.state).length) {
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(r.data.state)); } catch (e) {}
        } else {
          var local = null; try { local = localStorage.getItem(STORAGE_KEY); } catch (e) {}
          var parsed = {}; try { parsed = local ? JSON.parse(local) : {}; } catch (e) { parsed = {}; }
          return sb.from("progress").upsert({ user_id: user.id, state: parsed, xp: parsed.xp || 0, level: parsed.level || 1 }, { onConflict: "user_id" });
        }
      });
  }
  function continueAuthed() {
    return ensureProfile().then(function () {
      return sb.from("profiles").select("is_mentor").eq("user_id", user.id).maybeSingle()
        .then(function (r) { isMentorFlag = !!(r && r.data && r.data.is_mentor); });
    }).then(checkAccess).then(function (ok) {
      if (!ok) { showPending(user.email); return; }
      return pullState().then(function () { closeOverlay(); if (readyResolve) { readyResolve(); readyResolve = null; } });
    });
  }
  function signOut() { if (!sb) { location.reload(); return; } sb.auth.signOut().then(function () { location.reload(); }); }

  return {
    start: function () {
      return new Promise(function (resolve) {
        if (PREVIEW) { resolve(); return; }              // local = abre direto, sem trava
        readyResolve = resolve;
        try { ensureClient(); } catch (e) { overlay('<div style="color:#d98a8a;font-size:13px">' + e.message + "</div>"); return; }
        sb.auth.onAuthStateChange(function (_evt, session) {
          if (session && session.user && !started) { started = true; user = session.user; continueAuthed(); }
        });
        sb.auth.getSession().then(function (r) {
          if (r.data && r.data.session) { started = true; user = r.data.session.user; continueAuthed(); }
          else { showLogin(); }
        });
      });
    },
    push: function (S) {
      if (PREVIEW || !sb || !user) return;
      clearTimeout(pushTimer);
      pushTimer = setTimeout(function () {
        sb.from("progress").upsert({ user_id: user.id, state: S, xp: S.xp || 0, level: S.level || 1 }, { onConflict: "user_id" }).then(function () {});
      }, 1200);
    },
    getRanking: function (limit) {
      if (PREVIEW || !sb) return Promise.resolve([]);
      return sb.rpc("get_ranking", { p_limit: limit || 50 }).then(function (r) { return r.error ? [] : (r.data || []); });
    },
    isPreview: function () { return PREVIEW; },
    shield: shieldSvg,
    audioList: function (limit) {
      if (PREVIEW || !sb) return Promise.resolve([]);
      return sb.from("audios").select("id,data,titulo,url,transcricao,created_at")
        .order("data", { ascending: false }).order("created_at", { ascending: false }).limit(limit || 14)
        .then(function (r) { return r.error ? [] : (r.data || []); });
    },
    audioPublish: function (o) {
      if (PREVIEW || !sb || !isMentorFlag) return Promise.resolve({ error: true });
      return sb.from("audios").insert({ titulo: o.titulo || null, url: o.url, transcricao: o.transcricao || null });
    },
    audioUpload: function (file) {
      if (PREVIEW || !sb || !isMentorFlag) return Promise.resolve({ error: true });
      var path = Date.now() + "_" + String(file.name || "audio").replace(/[^a-zA-Z0-9._-]/g, "_");
      return sb.storage.from("audios").upload(path, file, { upsert: false }).then(function (r) {
        if (r.error) return { error: r.error };
        var pub = sb.storage.from("audios").getPublicUrl(path);
        return { url: (pub && pub.data && pub.data.publicUrl) || "" };
      });
    },
    isMentor: function () { return !PREVIEW && isMentorFlag; },
    email: function () { return user ? user.email : null; },
    caixinhaAsk: function (text) {
      if (PREVIEW || !sb || !user) return Promise.resolve({ error: true });
      return sb.from("caixinha").insert({ user_id: user.id, pergunta: text, asker_email: user.email })
        .then(function (r) {
          if (r.error) return sb.from("caixinha").insert({ user_id: user.id, pergunta: text }); // fallback pre-migracao
          return r;
        });
    },
    caixinhaList: function () {
      if (PREVIEW || !sb || !user) return Promise.resolve([]);
      var q = sb.from("caixinha").select("id,pergunta,resposta,respondida,asker_email,created_at,answered_at");
      if (!isMentorFlag) q = q.eq("user_id", user.id);
      return q.order("respondida", { ascending: true }).order("created_at", { ascending: false })
        .then(function (r) { return r.error ? [] : (r.data || []); });
    },
    caixinhaAnswer: function (id, text) {
      if (PREVIEW || !sb || !isMentorFlag) return Promise.resolve({ error: true });
      return sb.from("caixinha").update({ resposta: text, respondida: true, answered_at: new Date().toISOString() }).eq("id", id);
    },
    signOut: signOut
  };
})();

window.loadObRanking = function () {
  var box = document.getElementById("ob-ranking");
  if (!box) return;
  OB.getRanking(50).then(function (rows) {
    if (!rows || !rows.length) {
      box.innerHTML = '<p class="muted tiny" style="margin:0">O ranking aparece quando o app estiver publicado e houver membros ativos pontuando. (Em pre-visualizacao local ele fica vazio.)</p>';
      return;
    }
    var medal = function (p) { return p === 1 ? "&#129351;" : p === 2 ? "&#129352;" : p === 3 ? "&#129353;" : ('<span style="opacity:.6">' + p + "&ordm;</span>"); };
    var meXp = (window.S && S.xp) || 0;
    var html = '<div style="display:grid;gap:6px">';
    rows.forEach(function (r) {
      var mine = (r.xp === meXp && meXp > 0);
      html += '<div style="display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;'
        + (mine ? "background:rgba(245,181,61,.10);border:1px solid rgba(245,181,61,.35)" : "background:var(--ink-2);border:1px solid var(--line-soft)") + '">'
        + '<div style="width:30px;text-align:center;font-weight:700">' + medal(r.posicao) + "</div>"
        + '<div style="flex:1;font-weight:' + (mine ? "700" : "500") + '">' + (r.display_name || "Membro") + (mine ? ' <span style="color:var(--amber);font-size:11px">(voce)</span>' : "") + "</div>"
        + '<div style="font-family:var(--mono);color:var(--amber);font-size:13px">' + r.xp + " XP</div></div>";
    });
    html += "</div>";
    box.innerHTML = html;
  });
};

window.obEsc = function (s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); };

window.loadObCaixinha = function () {
  var box = document.getElementById("ob-caixinha-list");
  var ask = document.getElementById("ob-caixinha-ask");
  if (!box) return;
  if (window.OB && OB.isPreview()) {
    if (ask) ask.style.display = "none";
    box.innerHTML = '<p class="muted tiny" style="margin:0">A caixinha funciona quando o app está publicado e com login. (Pré-visualização local não envia perguntas.)</p>';
    return;
  }
  var mentor = !!(window.OB && OB.isMentor());
  if (ask) ask.style.display = mentor ? "none" : "";
  OB.caixinhaList().then(function (rows) {
    if (mentor) {
      var hdr = '<p class="muted tiny" style="margin:0 0 10px">Modo mentora — responda às perguntas dos membros aqui.</p>';
      if (!rows.length) { box.innerHTML = hdr + '<p class="muted tiny" style="margin:0">Nenhuma pergunta ainda.</p>'; return; }
      box.innerHTML = hdr + rows.map(function (r) {
        var who = obEsc(r.asker_email || "Membro");
        if (r.respondida) {
          return '<div style="padding:11px 13px;border-radius:10px;background:var(--ink-2);border:1px solid var(--line-soft);margin-bottom:8px">'
            + '<div style="font-size:13.5px;margin-bottom:4px"><b>' + who + ':</b> ' + obEsc(r.pergunta) + "</div>"
            + '<div style="font-size:13px;color:var(--sage)">&#8627; ' + obEsc(r.resposta) + "</div></div>";
        }
        return '<div style="padding:11px 13px;border-radius:10px;background:rgba(245,181,61,.07);border:1px solid rgba(245,181,61,.30);margin-bottom:8px">'
          + '<div style="font-size:13.5px;margin-bottom:8px"><b>' + who + ':</b> ' + obEsc(r.pergunta) + "</div>"
          + '<textarea class="in" id="ob-ans-' + r.id + '" placeholder="Sua resposta…" style="min-height:60px"></textarea>'
          + '<div class="btn-row" style="margin-top:8px"><button class="btn sage sm" onclick="obAnswerQuestion(\'' + r.id + '\')">Responder</button></div></div>';
      }).join("");
      return;
    }
    if (!rows.length) { box.innerHTML = '<p class="muted tiny" style="margin:0">Você ainda não enviou perguntas. Mande a primeira acima.</p>'; return; }
    box.innerHTML = rows.map(function (r) {
      var ans = r.respondida
        ? '<div style="font-size:13px;color:var(--sage);margin-top:5px">&#8627; ' + obEsc(r.resposta) + "</div>"
        : '<div class="muted tiny" style="margin-top:5px">Aguardando resposta da mentora…</div>';
      return '<div style="padding:11px 13px;border-radius:10px;background:var(--ink-2);border:1px solid var(--line-soft);margin-bottom:8px">'
        + '<div style="font-size:13.5px">' + obEsc(r.pergunta) + "</div>" + ans + "</div>";
    }).join("");
  });
};

window.obAskQuestion = function () {
  var ta = document.getElementById("ob-cx-text");
  if (!ta) return;
  var text = (ta.value || "").trim();
  if (!text) { ta.focus(); return; }
  if (window.OB && OB.isPreview()) { if (window.toast) toast("🔒", "Disponível quando publicado"); return; }
  OB.caixinhaAsk(text).then(function (r) {
    if (r && r.error) { if (window.toast) toast("⚠️", "Não consegui enviar agora"); return; }
    ta.value = ""; if (window.toast) toast("✓", "Pergunta enviada"); loadObCaixinha();
  });
};

window.obAnswerQuestion = function (id) {
  var ta = document.getElementById("ob-ans-" + id);
  if (!ta) return;
  var text = (ta.value || "").trim();
  if (!text) { ta.focus(); return; }
  OB.caixinhaAnswer(id, text).then(function (r) {
    if (r && r.error) { if (window.toast) toast("⚠️", "Não consegui salvar"); return; }
    if (window.toast) toast("✓", "Resposta enviada"); loadObCaixinha();
  });
};

window.obFmtDate = function (d) { try { var p = String(d).split("-"); return p[2] + "/" + p[1]; } catch (e) { return d; } };

window.loadObAudioHome = function () {
  var box = document.getElementById("ob-audio-home");
  if (!box) return;
  if (window.OB && OB.isPreview()) { box.innerHTML = ""; return; }
  OB.audioList(14).then(function (rows) {
    if (!rows || !rows.length) { box.innerHTML = ""; return; }
    var today = rows[0];
    var todayStr = new Date().toISOString().slice(0, 10);
    var isToday = (today.data === todayStr);
    var isNew = ((window.S && S.audioSeen) || "") !== today.id;
    var hist = rows.slice(1, 6);
    var html = '<div class="card" style="border-color:rgba(245,181,61,.35);background:linear-gradient(135deg,rgba(245,181,61,.07),var(--ink-2))">'
      + '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">'
      + '<span style="font-size:22px">🎙️</span>'
      + '<div style="flex:1"><b style="font-family:var(--serif)">' + (isToday ? "Áudio de hoje" : "Último áudio da mentora") + "</b>"
      + (isNew ? ' <span id="ob-audio-new" style="background:var(--amber);color:#1a1505;font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;vertical-align:middle">NOVO</span>' : "")
      + '<div class="muted tiny">' + (today.titulo ? obEsc(today.titulo) + " · " : "") + obFmtDate(today.data) + "</div></div></div>"
      + '<audio controls preload="none" style="width:100%" src="' + today.url + '" onplay="obAudioHeard(\'' + today.id + '\')"></audio>'
      + (today.transcricao ? '<details style="margin-top:8px"><summary class="muted tiny" style="cursor:pointer">Ver transcrição / notas</summary><div class="muted tiny" style="margin-top:6px;white-space:pre-wrap">' + obEsc(today.transcricao) + "</div></details>" : "")
      + (hist.length ? '<div class="divider"></div><div class="muted tiny" style="margin-bottom:8px">Anteriores</div>' + hist.map(function (h) {
          return '<div style="margin-bottom:8px"><div class="tiny" style="margin-bottom:3px">' + (h.titulo ? obEsc(h.titulo) + " · " : "") + obFmtDate(h.data) + '</div><audio controls preload="none" style="width:100%;height:34px" src="' + h.url + '"></audio></div>';
        }).join("") : "")
      + "</div>";
    box.innerHTML = html;
  });
};

window.obAudioHeard = function (id) {
  if (!window.S || S.audioSeen === id) return;
  S.audioSeen = id;
  if (typeof save === "function") save();
  var nb = document.getElementById("ob-audio-new"); if (nb) nb.remove();
  if (typeof addXp === "function") addXp(5, "Ouviu o áudio da mentora");
};

window.loadObAudioMentor = function () {

  if (!box) return;
  if (!(window.OB && OB.isMentor())) { box.innerHTML = ""; return; }
  box.innerHTML = '<h2 class="sec"><span class="ic">🎙️</span> Áudio diário · publicar</h2>'

    + "</div>";

window.obPublishAudio = function () {
  var st = document.getElementById("ob-au-status");
  var btn = document.getElementById("ob-au-pub");
  var title = (document.getElementById("ob-au-title").value || "").trim();
  var url = (document.getElementById("ob-au-url").value || "").trim();
  var tx = (document.getElementById("ob-au-tx").value || "").trim();
  var fileInput = document.getElementById("ob-au-file");
  var file = fileInput && fileInput.files && fileInput.files[0];
  if (!file && !url) { st.textContent = "Escolha um arquivo ou cole um link."; return; }
  btn.disabled = true; st.textContent = "Enviando…";
  var step = file ? OB.audioUpload(file).then(function (r) { if (r.error) throw new Error("Falha no upload"); return r.url; }) : Promise.resolve(url);
  step.then(function (finalUrl) { return OB.audioPublish({ titulo: title, url: finalUrl, transcricao: tx }); })
    .then(function (r) {
      if (r && r.error) throw new Error("Falha ao publicar");
      btn.disabled = false; st.textContent = "✓ Áudio publicado!";
      document.getElementById("ob-au-title").value = ""; document.getElementById("ob-au-url").value = ""; document.getElementById("ob-au-tx").value = "";
      if (fileInput) fileInput.value = "";
      if (window.toast) toast("🎙️", "Áudio publicado", "Os membros já veem no Início");
    })
    .catch(function (e) { btn.disabled = false; st.textContent = "Não consegui publicar agora. Tente de novo."; });
};

// Loop de notificações: roda após o boot. Avisa no sininho sobre áudio novo
// e respostas da caixinha (e, para a mentora, perguntas na fila).
window.obCheckUpdates = function () {
  if (!window.OB || OB.isPreview() || !window.S || !S.name) return;
  if (typeof pushNotif !== "function") return;

  OB.audioList(1).then(function (rows) {
    if (!rows || !rows.length) return;
    var a = rows[0];
    if ((S.audioNotified || "") !== a.id && (S.audioSeen || "") !== a.id) {
      S.audioNotified = a.id; if (typeof save === "function") save();
      pushNotif("🎙️", "Novo áudio da mentora", a.titulo || "Disponível no Início");
    }
  });

  if (OB.isMentor()) {
    OB.caixinhaList().then(function (rows) {
      var pend = (rows || []).filter(function (r) { return !r.respondida; }).length;
      if (pend > 0 && (S.mentorPendNotified || 0) !== pend) {
        S.mentorPendNotified = pend; if (typeof save === "function") save();
        pushNotif("📨", pend === 1 ? "1 pergunta na fila" : pend + " perguntas na fila", "Responda em A Mentora");
      }
    });
  } else {
    OB.caixinhaList().then(function (rows) {
      var lastSeen = S.lastCaixinhaSeen || 0;
      var newest = 0, answered = 0, maxAny = 0;
      (rows || []).forEach(function (r) {
        if (r.answered_at) {
          var t = new Date(r.answered_at).getTime();
          if (t > maxAny) maxAny = t;
          if (r.respondida && t > lastSeen) { answered++; if (t > newest) newest = t; }
        }
      });
      if (lastSeen === 0) { // 1ª verificação: marca o ponto de partida sem barulho
        if (maxAny > 0) { S.lastCaixinhaSeen = maxAny; if (typeof save === "function") save(); }
        return;
      }
      if (answered > 0) {
        S.lastCaixinhaSeen = newest; if (typeof save === "function") save();
        pushNotif("✅", answered === 1 ? "A mentora respondeu sua pergunta" : "A mentora respondeu " + answered + " perguntas", "Veja em A Mentora");
      }
    });
  }
};

/* ---------- storage layer ----------
   Persistência REAL no dispositivo via localStorage (funciona quando o
   arquivo é hospedado em um link ou aberto no navegador do aluno).
   window.storage entra como reforço quando disponível; memória é o
   último fallback. Isso garante que o progresso não se perca ao fechar. */
const Store = (()=>{
  const mem = {};
  const hasWS = (typeof window!=='undefined' && window.storage && typeof window.storage.get==='function');
  const hasLS = (()=>{ try{ const k='__ob_probe__'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }catch(e){ return false; } })();
  return {
    async get(k){
      if(hasWS){ try{ const r=await window.storage.get(k); if(r!=null && r.value!=null) return r.value; }catch(e){} }
      if(hasLS){ try{ const v=localStorage.getItem(k); if(v!=null) return v; }catch(e){} }
      return mem[k]??null;
    },
    async set(k,v){
      let ok=false;
      if(hasLS){ try{ localStorage.setItem(k,v); ok=true; }catch(e){} }
      if(hasWS){ try{ await window.storage.set(k,v); ok=true; }catch(e){} }
      mem[k]=v; return ok;
    }
  };
})();

    steps:[
      {id:'cu1', kind:'conceito', title:'O que é cultura', body:`
        <p>Cultura organizacional (Schein) é o <b>conjunto de pressupostos fundamentais compartilhados</b> que um grupo desenvolveu para enfrentar a adaptação externa e a integração interna — e que se mostraram eficazes a ponto de serem transmitidos aos novos membros.</p>
        <p>Robbins a chama de <b>"sistema de significado compartilhado"</b> que distingue uma organização de outra. As 7 características essenciais (Chatman & Caldwell):</p>
        <ul>
          <li>Inovação e disposição para correr riscos</li>
          <li>Atenção aos detalhes</li>
          <li>Orientação para resultados, pessoas e trabalho em equipe</li>
          <li>Agressividade e estabilidade</li>
        </ul>

      {id:'cu2', kind:'conceito', title:'Os 3 níveis de Schein', body:`
        <p>Schein enxerga a cultura em três camadas de profundidade:</p>
        <ul>
          <li><b>Artefatos visíveis</b> — o observável: arquitetura, layout, vestimenta, comportamentos, documentos públicos.</li>

      {id:'cf1', kind:'conceito', title:'A natureza do conflito', body:`
        <p>Conflito é a contraposição de ideias, emoções ou interesses. Robbins: <i>processo que começa quando uma parte percebe que a outra afeta, ou pode afetar, negativamente algo que ela considera importante.</i></p>
        <p>Bastam duas pessoas para haver conflito — e a chance cresce com o número de gente, a pressão por resultados e a competição. Mas, bem gerenciado, o conflito vira <b>oportunidade de crescimento, reestruturação, energia e criatividade</b>.</p>

      {id:'cf2', kind:'conceito', title:'As fases e os escopos', body:`
        <p>O conflito evolui por fases:</p>
        <ul>

          <li><b>Percebido</b> — as partes reconhecem o problema, mas ainda sem ação.</li>
          <li><b>Sentido</b> — surgem emoções: ansiedade, frustração, hostilidade.</li>
          <li><b>Manifesto</b> — vira comportamento observável: discussões, sabotagem, competição aberta.</li>
        </ul>

          <li><b>Conciliação</b> — negociação com ganhos e perdas dos dois lados.</li>

  {
    id:'estrategia-empresarial', icon:'♟️', glyph:'♟️', group:'estrategia',
    title:'Estratégia Empresarial',
    short:'O que é estratégia, de onde ela veio e por que ela separa quem escala de quem só sobrevive.',
    tags:['Estratégia','Vantagem competitiva','Posicionamento'],

    mentor:"Estratégia não é o plano bonito na gaveta — é a decisão de PARA ONDE a empresa vai e, principalmente, o que ela escolhe NÃO fazer. Quem não decide isso, deixa o mercado decidir no lugar. Direção primeiro, tática depois.",
    steps:[
      {id:'e1', kind:'conceito', title:'O que é estratégia (e de onde veio)', body:`
        <p>A palavra <b>estratégia</b> nasce do grego <i>stratos</i> (exército) + <i>agein</i> (dirigir). A origem é militar: a arte de coordenar todas as forças para conduzir uma guerra, gerenciar uma crise ou preservar a paz. O marco dos estudos é <i>A Arte da Guerra</i>, de Sun Tzu (~500 a.C.) — usado até hoje por líderes políticos e empresariais.</p>
        <h4>Do campo de batalha para a empresa</h4>
        <p>No mundo dos negócios, <b>estratégia corporativa</b> é a orientação das atividades da organização no <b>longo prazo</b>: como ela direciona esforços para conseguir resultados no futuro e, assim, sustentar-se.</p>
        <p>Chandler resume bem: estratégia é a <i>determinação das metas e objetivos básicos de longo prazo</i>, mais a <i>adoção de cursos de ação</i> e a <i>alocação dos recursos</i> necessários para alcançá-los.</p>
        <div class="callout"><span class="ic">🎯</span><div>O objetivo central da estratégia é a <b>vantagem competitiva</b>: reconfigurar continuamente recursos e habilidades para responder a um ambiente em constante mudança e atender às expectativas dos <i>stakeholders</i> — sócios, equipe, financiadores, clientes.</div></div>
        <div class="callout"><span class="ic">🧭</span><div>Estratégia define as <b>diretrizes do lugar para onde você quer ir</b> — não necessariamente o passo a passo de como chegar. O "como" é tática; o "para onde e por quê" é estratégia.</div></div>
      `},
      {id:'e2', kind:'conceito', title:'Como o pensamento estratégico evoluiu', body:`
        <p>Conhecer a evolução ajuda a entender as ferramentas que usamos hoje:</p>
        <ul>
          <li><b>Anos 1960</b> — a estratégia entra no <b>planejamento corporativo</b>.</li>
          <li><b>Anos 1970</b> — foco em <b>diversificação e portfólio</b>.</li>
          <li><b>Anos 1980–90</b> — ênfase em <b>competências básicas</b> e abordagens mais orientadas a pessoas e gestão.</li>
        </ul>
        <h4>As ideias que ainda usamos</h4>
        <ul>
          <li><b>Curva de experiência</b> (Bruce Henderson / BCG): quanto mais a empresa produz e acumula experiência, <b>menor</b> o custo. Virou base para pensar preço, volume, custo e vantagem.</li>
          <li><b>Matriz BCG</b> (crescimento × participação): os famosos quadrantes — <i>vacas leiteiras, cães, estrelas e pontos de interrogação</i> — para gerir um portfólio de produtos.</li>
          <li><b>Michael Porter</b> (1985): as <b>cinco forças</b>, a <b>cadeia de valor</b> e três caminhos — <i>liderança de custo</i>, <i>diferenciação</i> ou <i>foco</i> em um segmento.</li>
          <li><b>Competência essencial</b> (Prahalad & Hamel, 1990): vantagem não vem só de olhar o mercado e os concorrentes, mas de olhar para <b>dentro</b> da própria empresa.</li>
          <li><b>Nova economia / internet</b> (final dos anos 1990): a internet muda tudo e provoca a <b>desintermediação</b> — cai a necessidade de atravessadores.</li>
        </ul>
        <div class="callout"><span class="ic">🔁</span><div>O fio condutor: a estratégia sempre se reinventa diante de <b>mudanças radicais no ambiente competitivo</b>. Por isso ela nunca é "pronta" — é prática contínua.</div></div>
      `},
      {id:'e3', kind:'pratica', title:'Por que isso decide o seu resultado', body:`
        <p>Estratégia parece abstrata até você olhar os números. Um estudo da consultoria <b>McKinsey (2017)</b> comparou empresas com e sem diretriz estratégica de longo prazo. As com estratégia tiveram, em média, cerca de <b>47% mais crescimento de receita</b> e <b>81% mais lucro</b> — além de gerarem mais empregos.</p>
        <p>Estratégia <b>não é</b> o planejamento de negócios clássico. Ela envolve <b>visão, missão e pensamento fora da caixa</b> — a direção, não só a planilha.</p>
        <h4>Ferramenta: seu posicionamento em 3 perguntas</h4>
        <p>Responda com sinceridade — é o esqueleto da sua estratégia:</p>
        <ul>
          <li><b>Onde competimos?</b> Qual mercado, segmento e cliente são realmente os seus.</li>
          <li><b>Como vencemos?</b> Sua vantagem é <i>custo</i>, <i>diferenciação</i> ou <i>foco</i>? (Não dá pra ser as três.)</li>
          <li><b>O que vamos deixar de fazer?</b> Estratégia é tanto sobre o "sim" quanto sobre os "nãos" que protegem seu foco.</li>
        </ul>
        <div class="callout"><span class="ic">📅</span><div>Leve essas 3 respostas para o seu <b>Plano 30d / Planner</b> e transforme cada uma em uma ação concreta da semana. Estratégia sem execução é só intenção.</div></div>
      `}

      {q:'A "curva de experiência" (Henderson/BCG) afirma que:', a:['Quanto mais a empresa produz e acumula experiência, menor o custo','Experiência não influencia custo','Empresas novas sempre têm custo menor','Quanto maior o preço, maior a qualidade'], correct:0, why:'Há relação direta entre experiência acumulada e custo: mais experiência produzindo → custo menor.'},
      {q:'Segundo o estudo McKinsey (2017), empresas com estratégia de longo prazo tiveram, em média:', a:['Resultados iguais às demais','Cerca de 47% mais crescimento de receita e 81% mais lucro','Menos lucro, porém mais estabilidade','Apenas vantagem de imagem, sem efeito financeiro'], correct:1, why:'O estudo apontou ~47% mais crescimento de receita e ~81% mais lucro frente às empresas sem estratégia.'}

    steps:[
      {id:'d1', kind:'conceito', title:'Sua vantagem começa nos recursos', body:`
        <p>A <b>Teoria Baseada em Recursos</b> (<i>Resource-based Theory</i>) diz que parte da sua vantagem competitiva está <b>dentro</b> da empresa — nos recursos que você tem. Mas nem todo recurso gera vantagem. Wright, Kroll e Parnell apontam quatro qualidades:</p>
        <ul>
          <li><b>Valioso</b> — contribui de fato para a eficiência e a eficácia do negócio.</li>
          <li><b>Raro</b> — poucos concorrentes possuem.</li>
          <li><b>Imperfeitamente imitável</b> — difícil de copiar por completo.</li>
          <li><b>Sem substituto estratégico</b> — não há um equivalente fácil que faça o mesmo papel.</li>
        </ul>
        <div class="callout"><span class="ic">💎</span><div>Quanto mais um recurso seu reúne essas quatro qualidades, mais difícil fica te atacar. Pergunte sempre: o que no meu negócio é <b>valioso, raro e difícil de imitar</b>?</div></div>
      `},
      {id:'d2', kind:'conceito', title:'Decisão é processo, não lampejo', body:`
        <p>Decidir é tomar posição sobre um assunto com base em <b>insumos</b>: informação, conhecimento, alternativas, impactos, avaliações e escolhas — e em muitas <b>outras decisões</b> tomadas por outras pessoas. Por isso, uma <b>decisão final é, na verdade, um conjunto de decisões parciais</b> vindas de vários níveis da empresa.</p>
        <p>Quando uma decisão passa a pesar nos <b>rumos</b> do negócio, ela vira <b>estratégica</b>: olha para o médio/longo prazo, exige muitos subsídios, pode levar meses e carrega <b>alto grau de risco</b> — ainda mais em ambientes voláteis como o nosso.</p>
        <h4>As 7 etapas do processo decisório (Chiavenato)</h4>
        <ol>
          <li><b>Percepção</b> — notar a situação ou o problema.</li>
          <li><b>Análise</b> — avaliar o grau de importância estratégica.</li>
          <li><b>Definição</b> — definir os objetivos a alcançar.</li>
          <li><b>Alternativas</b> — buscar soluções possíveis.</li>
          <li><b>Comparação</b> — pesar vantagens, desvantagens e impactos.</li>
          <li><b>Escolha</b> — optar pela alternativa mais adequada.</li>
          <li><b>Implementação</b> — executar e acompanhar com feedback permanente.</li>

      {id:'d3', kind:'pratica', title:'Estratégia é estado permanente (fuja da gaveta)', body:`
        <p>Planejar é só metade. A outra é a <b>gestão estratégica</b>: aplicar e executar. E como o ambiente muda o tempo todo, raramente o plano sai exatamente como o previsto — pode ser realizado na forma original, modificado, ou substituído por um caminho totalmente diferente. O essencial é ter <b>flexibilidade</b> para adaptar e ainda assim buscar o resultado.</p>
        <div class="callout"><span class="ic">🗄️</span><div><b>O inimigo nº 1 do plano é a gaveta.</b> Plano que vira documento arquivado nunca mais é consultado. Gestão estratégica é consulta, aplicação, análise, modificação e avaliação <b>contínuas</b> — não um evento de início de ano.</div></div>
        <p>E a premissa da gestão estratégica é <b>criar riqueza de forma permanente</b> — não só para os donos, mas satisfazendo as necessidades de <b>todos os stakeholders</b> (equipe, fornecedores, clientes). Espremer um deles para maximizar o outro derruba a eficiência no longo prazo.</p>

      {q:'Qual é a última etapa do processo decisório estratégico de Chiavenato?', a:['Percepção','Comparação','Implementação com acompanhamento e feedback','Definição dos objetivos'], correct:2, why:'A sequência termina na implementação da alternativa escolhida, com acompanhamento e feedback permanente.'},

  {
    id:'estrategia-ambientes', icon:'🔭', glyph:'🔭', group:'estrategia',

    steps:[
      {id:'a1', kind:'conceito', title:'Ambiente externo: 3 níveis e as forças que te afetam', body:`
        <p>Para ler o ambiente externo com olhar estratégico, há <b>três níveis</b>, do mais amplo ao mais próximo: o <b>macroambiente</b> → o <b>ambiente setorial</b> → a <b>organização</b>.</p>
        <h4>Macroambiente — 4 forças (Wright, Kroll e Parnell)</h4>
        <ul>
          <li><b>Político-legais</b> — eleições, leis, regulação/desregulação de setores (ex.: a redução do IPI no setor automotivo).</li>
          <li><b>Econômicas</b> — PIB, inflação, juros, câmbio; mexem em preços, crédito e poder de compra.</li>
          <li><b>Tecnológicas</b> — inovações que aceleram um setor (eletrônicos) ou que dizimam outro; ritmo varia muito por área.</li>
          <li><b>Sociais</b> — tradições e datas (Natal, Dia das Mães…), tendências (vida saudável, fitness) e demografia (envelhecimento da população).</li>
        </ul>
        <h4>Ambiente setorial — as forças competitivas</h4>
        <p>Dentro do seu setor pesam: a <b>ameaça de novos entrantes</b>, a <b>pressão de produtos substitutos</b>, o <b>poder de barganha dos fornecedores</b>, o <b>poder de barganha dos compradores</b> e a <b>rivalidade entre os concorrentes</b>.</p>
        <div class="callout"><span class="ic">🔭</span><div>Fazer essa leitura de forma deliberada tem nome: <i>environmental scanning</i> (mapeamento ambiental). É varrer o ambiente em busca das <b>ameaças</b> a evitar e das <b>oportunidades</b> a aproveitar.</div></div>
      `},
      {id:'a2', kind:'conceito', title:'Ambiente interno: forças, fraquezas e a vantagem que dura', body:`
        <p>Olhando para dentro: <b>forças</b> são os pontos em que você se destaca dos concorrentes (uma técnica, matéria-prima, processo, conceito, inovação, o valor das pessoas); <b>fraquezas</b> são os pontos a melhorar, que podem prejudicar o negócio.</p>
        <p>Esses pontos fortes e fracos estão nos seus <b>recursos</b>, de três tipos: <b>humanos</b>, <b>organizacionais</b> e <b>físicos</b>. Usá-los de forma inteligente e planejada cria <b>vantagem competitiva</b>.</p>
        <div class="callout"><span class="ic">💪</span><div>Recursos <b>físicos</b> (equipamentos, layout) e <b>organizacionais</b> (estrutura, processos) podem ser <b>copiados</b> com esforço. O que é quase impossível de imitar são as <b>pessoas</b> — ideias, criatividade, compromisso. Por isso a vantagem que <b>dura</b> nasce dos recursos humanos.</div></div>
        <p>E atenção: para um diferencial ser vantagem de verdade, ele precisa de <b>duas</b> coisas — ser <b>real</b> frente aos concorrentes <i>e</i> ser <b>percebido</b> claramente pelo mercado. Diferencial que ninguém nota não vende.</p>
      `},
      {id:'a3', kind:'pratica', title:'Análise SWOT (FOFA): juntando dentro e fora', body:`
        <p>A <b>Análise SWOT</b> nasceu em Stanford, nos anos 1960, e é a ferramenta de diagnóstico mais usada para análise de ambiente e construção de cenários. O nome vem de <i>Strengths</i> (forças), <i>Weaknesses</i> (fraquezas), <i>Opportunities</i> (oportunidades) e <i>Threats</i> (ameaças) — em português, <b>FOFA</b>.</p>
        <div class="callout"><span class="ic">🧭</span><div><b>Forças e fraquezas</b> são do <b>ambiente interno</b> (você controla). <b>Oportunidades e ameaças</b> são do <b>ambiente externo</b> (você não controla, mas precisa ler).</div></div>
        <h4>Ferramenta: monte sua matriz e cruze</h4>
        <p>Liste 2 itens em cada quadrante e depois cruze para gerar ação:</p>
        <ul>
          <li><b>Força × Oportunidade</b> — como usar o que você tem de melhor para aproveitar o que o mercado abriu?</li>
          <li><b>Fraqueza × Ameaça</b> — o que corrigir agora para não ser pego de surpresa?</li>
        </ul>
        <div class="callout"><span class="ic">📅</span><div>Transforme um desses cruzamentos em uma ação concreta no seu <b>Plano 30d</b>. SWOT que não vira ação é só uma tabela bonita.</div></div>
      `}
    ],
    quiz:[

  {

    steps:[
      {id:'ec1', kind:'conceito', title:'Estratégia e o triângulo que a sustenta', body:`
        <p>Na origem, <b>estratégia</b> era a "arte dos generais": organizar os meios para atingir um objetivo. No negócio, é o que a organização decide fazer para que o cliente prefira o seu produto ou serviço — o <b>posicionamento</b> que te diferencia dos concorrentes.</p>
        <h4>O triângulo estratégico (Costa)</h4>
        <p>Toda boa estratégia equilibra três perguntas. Quando uma delas é ignorada, a estratégia desanda:</p>
        <ul>
          <li><b>Propósito</b> — "O que queremos ser?" (missão, visão e valores).</li>
          <li><b>Ambiente externo</b> — "O que nos é permitido ser?" (o mercado e suas forças).</li>
          <li><b>Capacitação</b> — "O que sabemos fazer?" (suas competências reais).</li>
        </ul>
        <div class="callout"><span class="ic">⚠️</span><div>Uma estratégia que entra em conflito com o <b>propósito</b> da empresa tem enorme dificuldade de dar certo. Direção primeiro, tática depois.</div></div>
        <p>E lembre: estratégia não é receita pronta para copiar. É processo contínuo de invenção, teste e ajuste — e deve ser <b>simples, clara e objetiva</b>.</p>
      `},
      {id:'ec2', kind:'conceito', title:'Os três caminhos para vencer (Porter)', body:`
        <p>Porter mostrou que existem basicamente <b>três estratégias genéricas</b> para conquistar vantagem competitiva:</p>
        <ul>
          <li><b>Liderança em custo total</b> — ter o menor custo do setor, o que protege a empresa na guerra de preços e contra as demais forças. Atenção: costuma haver <b>apenas um</b> líder de custo por setor; disputar esse posto sem ser o nº 1 vira guerra de preços destrutiva.</li>
          <li><b>Diferenciação</b> — oferecer algo percebido como <b>único</b> pelo cliente (imagem, tecnologia, qualidade, atendimento). O cliente paga mais e fideliza. Várias empresas podem se diferenciar ao mesmo tempo, cada uma em atributos distintos.</li>
          <li><b>Enfoque (foco / nicho)</b> — escolher um <b>alvo restrito</b> (um segmento, um nicho, uma região) e atendê-lo melhor que todos, por custo baixo ou por diferenciação naquele recorte.</li>
        </ul>
        <h4>As cinco forças que definem a concorrência</h4>
        <p>O grau de concorrência de um setor depende de cinco forças (Porter): <b>entrantes potenciais</b>, <b>produtos substitutos</b>, <b>poder dos fornecedores</b>, <b>poder dos compradores</b> e a <b>rivalidade</b> entre os concorrentes atuais. É a soma delas que determina o potencial de lucro do setor.</p>
      `},
      {id:'ec3', kind:'pratica', title:'Escolha seu caminho (sem ficar no meio)', body:`
        <p>O erro mais comum é tentar ser <b>barato e diferenciado ao mesmo tempo</b>: a empresa fica "presa no meio", sem o menor preço nem o maior valor — e o cliente perde o motivo claro para escolhê-la.</p>
        <h4>Ferramenta: defina e defenda</h4>
        <ul>
          <li><b>Qual é o seu caminho?</b> Custo, diferenciação ou foco — escolha um.</li>
          <li><b>Por que o cliente te escolhe?</b> Enuncie o diferencial e garanta que o mercado o <b>percebe</b>.</li>
          <li><b>Quais forças te pressionam?</b> Mapeie as cinco forças do seu setor e onde você está mais exposto.</li>
        </ul>
        <div class="callout"><span class="ic">📅</span><div>Leve a sua escolha e o mapa das cinco forças para o <b>Plano 30d</b>. Uma estratégia escolhida e defendida vale mais que três tentadas pela metade.</div></div>
      `}
    ],
    quiz:[

  /* === MÓDULO 01 (Raio-X) — Crescimento, Fusões & Alianças === */
  {

      {id:'cr1', kind:'conceito', title:'Crescimento interno: crescer por dentro', body:`

          <li><b>Novos produtos em mercados existentes</b> — produtos similares que ampliam a oferta (ex.: quem vende chocolate passa a vender milk-shake).</li>
          <li><b>Produto atual em novos mercados</b> — o "desenvolvimento de mercado" (ex.: celulares mais acessíveis para novas regiões).</li>

        <div class="callout"><span class="ic">🧭</span><div>É eficiente porque depende do seu posicionamento, mas é <b>vulnerável</b>: um movimento do concorrente ou uma mudança de demanda pode travar o crescimento. Por isso, vale ter mais de um vetor no radar.</div></div>
      `},
      {id:'cr2', kind:'conceito', title:'Fusões, aquisições e alianças', body:`
        <p>Quando crescer por dentro não basta, entram os movimentos com outras empresas:</p>
        <h4>Fusões e aquisições (M&A)</h4>
        <ul>
          <li><b>Fusão</b> — duas empresas, em geral de porte parecido, unem forças e formam um novo negócio ("fusão de iguais").</li>
          <li><b>Aquisição</b> — uma empresa compra outra, normalmente menor, que pode ser absorvida ou virar subsidiária.</li>
          <li>A lógica é a <b>sinergia</b>: juntas valem mais do que separadas (1 + 1 maior que 2). Podem ser <b>horizontais</b> (mesma atividade) ou <b>verticais</b> (níveis diferentes da cadeia). A <b>gestão da mudança</b> é o que decide o sucesso.</li>

          <li><b>Econômicas</b> — reduzir custos e riscos, ganhar escala.</li>
          <li><b>Estratégicas</b> — cooperar com rivais, integrar a cadeia, acelerar P&D.</li>

      {id:'cr3', kind:'pratica', title:'Qual é o seu vetor agora?', body:`

          <li><b>Aliança</b> — quando alguém te complementa e cooperar é mais rápido (e barato) que fazer sozinho.</li>

  /* === MÓDULO 04 (Engenharia de Processos) — Governança Corporativa === */
  {
    id:'governanca', icon:'🏛️', glyph:'⚖️', group:'engenharia',
    title:'Governança Corporativa',
    short:'O sistema que dirige, monitora e dá transparência ao negócio — a estrutura que protege sócios, time e clientes.',
    tags:['Governança','Transparência','Conselho & Controle'],
    xpReward:160,
    mentor:"Governança não é luxo de grande empresa. É ter regras claras de como o negócio é dirigido, controlado e como se presta contas — para ele não depender de você no escuro. Estrutura que protege começa aqui.",
    steps:[
      {id:'gv1', kind:'conceito', title:'O que é governança corporativa', body:`
        <p>Segundo o <b>IBGC</b>, governança corporativa é o <b>sistema pelo qual as empresas são dirigidas, monitoradas e incentivadas</b>, envolvendo a relação entre sócios, conselho de administração, diretoria, órgãos de fiscalização e demais partes interessadas.</p>
        <p>Ela nasceu para resolver o chamado <b>"conflito de agência"</b>: quando o sócio (dono) delega ao administrador a decisão sobre a empresa, é preciso um sistema que alinhe os interesses dos dois e dê confiança a quem está de fora.</p>
        <div class="callout"><span class="ic">🛡</span><div>Boa governança gera um <b>ambiente de confiança</b> — interno (sócios, equipe) e externo (clientes, financiadores). É o que permite a empresa crescer sem depender do improviso de uma só pessoa.</div></div>
      `},
      {id:'gv2', kind:'conceito', title:'Quatro princípios e as ferramentas de controle', body:`
        <p>O Código do IBGC se apoia em <b>quatro princípios básicos</b>:</p>
        <ul>
          <li><b>Transparência</b> — disponibilizar às partes interessadas as informações de seu interesse, não só as obrigatórias por lei.</li>
          <li><b>Equidade</b> — tratamento justo e igualitário entre sócios e demais partes interessadas.</li>
          <li><b>Prestação de contas (accountability)</b> — prestar contas com clareza e <b>assumir as consequências</b> de atos e omissões.</li>
          <li><b>Responsabilidade corporativa</b> — zelar pela viabilidade econômica do negócio, ampliando o impacto positivo e reduzindo o negativo.</li>
        </ul>
        <h4>As ferramentas que dão controle</h4>
        <ul>
          <li><b>Conselho de administração</b> — órgão de decisão estratégica; faz o elo entre sócios e diretoria e monitora a gestão.</li>
          <li><b>Auditoria independente</b> — assegura a confiabilidade das informações.</li>
          <li><b>Conselho fiscal</b> — fiscalização independente dos administradores, em nome dos sócios.</li>
        </ul>
      `},
      {id:'gv3', kind:'pratica', title:'Governança mínima para o seu negócio', body:`
        <p>Você não precisa de um conselho formal para começar a ter governança. Precisa de <b>regras claras e prestação de contas</b>. Mesmo numa empresa enxuta:</p>
        <ul>
          <li><b>Separe</b> o caixa do sócio do caixa da empresa e registre as decisões importantes.</li>
          <li><b>Prestação de contas</b> — um ritual simples (mensal) de números e decisões, transparente para os sócios.</li>
          <li><b>Transparência</b> — informações claras para quem precisa, antes que alguém precise pedir.</li>
          <li><b>Responsabilidade</b> — decisões pensando na saúde do negócio no longo prazo, não só no mês.</li>
        </ul>
        <div class="callout"><span class="ic">📅</span><div>Escolha <b>um</b> dos quatro princípios para fortalecer neste mês e defina o primeiro passo concreto. Salve no <b>Plano 30d</b>.</div></div>
      `}
    ],
    quiz:[
      {q:'Governança corporativa, segundo o IBGC, é o sistema pelo qual as empresas são:', a:['Compradas e vendidas','Dirigidas, monitoradas e incentivadas, envolvendo sócios, conselho, diretoria e partes interessadas','Apenas fiscalizadas pelo governo','Divididas entre os funcionários'], correct:1, why:'É o sistema pelo qual as empresas são dirigidas, monitoradas e incentivadas, envolvendo as relações entre as partes.'},
      {q:'Quais são os quatro princípios básicos de governança do IBGC?', a:['Lucro, crescimento, marketing e vendas','Transparência, equidade, prestação de contas (accountability) e responsabilidade corporativa','Missão, visão, valores e metas','Custo, preço, praça e promoção'], correct:1, why:'Os quatro princípios são transparência, equidade, prestação de contas (accountability) e responsabilidade corporativa.'},
      {q:'O "conflito de agência" que a governança busca resolver acontece quando:', a:['Dois sócios discutem o nome da empresa','O sócio delega ao administrador a decisão sobre a empresa, e é preciso alinhar interesses e dar confiança','A empresa contrata uma agência de publicidade','Os clientes reclamam do produto'], correct:1, why:'O conflito de agência surge na delegação do sócio ao administrador; a governança alinha interesses e gera confiança.'},
      {q:'A função do conselho fiscal é:', a:['Cuidar do marketing','Exercer a fiscalização independente dos administradores, em nome dos sócios','Contratar funcionários','Definir o preço dos produtos'], correct:1, why:'O conselho fiscal é um mecanismo de fiscalização independente dos administradores, reportando aos sócios.'}
    ],
    challenge:'Escolha um dos quatro princípios de governança (transparência, equidade, prestação de contas ou responsabilidade) para fortalecer no seu negócio neste mês e descreva o primeiro passo concreto. Salve no Plano 30d.'
