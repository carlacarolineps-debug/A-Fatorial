    <div style="margin:16px 0;padding:20px;border:1.5px dashed var(--line);border-radius:12px;text-align:center">
      <input type="file" id="fileInput" accept=".csv,text/csv" style="display:none" onchange="if(this.files[0])handleImport(this.files[0])">
      <button class="btn red" onclick="document.getElementById('fileInput').click()">${svg(IC.merge,15)} Escolher arquivo CSV</button>
      <p style="font-size:11.5px;color:var(--ink-4);margin:12px 0 0">No Excel: Arquivo → Salvar como → CSV (separado por ponto e vírgula). O sistema lê acentuação e valores em R$ automaticamente.</p>
    </div>`, null);
  document.querySelector('#modalBox .modal-f').style.display='none';
}

/* ---------- LOGIN ---------- */
function showLogin(){
  document.getElementById('loginScrim').classList.add('on');
  setTimeout(()=>{const el=document.getElementById('li_u');if(el)el.focus();},50);
}
function tryLogin(){
  const u=val('li_u'),s=val('li_s');
  if(doLogin(u,s)){document.getElementById('loginScrim').classList.remove('on');bootUI();}
  else{const e=document.getElementById('loginErr');e.style.display='block';}
}
function fillLogin(u,s){const a=document.getElementById('li_u'),b=document.getElementById('li_s');a.value=u;b.value=s;tryLogin();}

/* ---------- NAV (com permissões) ---------- */
const NAVDEF=[
  ['Operação',[['painel','Painel de comando',IC.grid],['alertas','Alertas inteligentes',IC.warn,'c-alertas','alert'],['separacao','Fila de separação',IC.box,'c-sep'],['rotas','Roteirização',IC.route,'c-rotas'],['retiradas','Retiradas / balcão',IC.store,'c-ret'],['carga','Planejador de carga',IC.truck,'c-carga']]],
  ['Cadastros',[['frota','Frota',IC.truck],['motoristas','Motoristas',IC.users],['acessos','Acessos & perfis',IC.lock]]],
  ['Análise & sistema',[['pedidos','Todos os pedidos',IC.list,'c-ped'],['gestao','Gestão & risco',IC.chart],['rastreio','Rastreabilidade',IC.clock],['regras','Regras',IC.zap]]],
];
function buildNav(){
  let h='';
  NAVDEF.forEach(([grp,items])=>{
    const vis=items.filter(it=>can(it[0]));if(!vis.length)return;
    h+=`<div class="lbl">${grp}</div>`;
    vis.forEach(it=>{const[v,label,ic,cnt,cls]=it;
      h+=`<a data-v="${v}" class="${v===CUR?'on':''} ${cls||''}" title="${label}">${svg(ic,18).replace('width="18" height="18"','class="ic"')}<span class="ntxt">${label}</span>${cnt?`<span class="cnt" id="${cnt}">0</span>`:''}</a>`;
    });
  });
  document.getElementById('nav').innerHTML=h;
  refreshCounts();
}
function toggleSide(){const collapsed=document.body.classList.toggle('side-collapsed');localStorage.setItem('horus_side',collapsed?'1':'0');}

/* ---------- WIRE ---------- */
function wire(){}
document.getElementById('nav').addEventListener('click',e=>{const a=e.target.closest('a');if(a){go(a.dataset.v);}});
document.getElementById('scrim').addEventListener('click',closeDrawer);
document.getElementById('modalScrim').addEventListener('click',e=>{if(e.target.id==='modalScrim')closeModal();});
document.getElementById('printBtn').addEventListener('click',()=>{if(CUR!=='rotas')go('rotas');setTimeout(()=>window.print(),120);});
document.getElementById('globalSearch').addEventListener('input',e=>{FILTER.q=e.target.value;const target=CUR==='rastreio'?'rastreio':'pedidos';if(e.target.value&&CUR!=='pedidos'&&CUR!=='rastreio'){CUR=can('pedidos')?'pedidos':CUR;render();document.getElementById('globalSearch').focus();}else render();});
document.getElementById('themeBtn').addEventListener('click',()=>{
  const cur=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',cur);localStorage.setItem('horus_theme',cur);
  document.getElementById('themeIcon').innerHTML=cur==='dark'?'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>':'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();closeModal();}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo();}if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();document.getElementById('globalSearch').focus();}});
window.addEventListener('resize',()=>{document.getElementById('menuBtn').style.display=window.innerWidth<820?'grid':'none';});

/* ---------- BOOT ---------- */
function bootUI(){
  document.getElementById('appShell').style.display='flex';
  document.getElementById('userChip').innerHTML=`<div class="uc-av">${initials(currentUser())}</div><div class="uc-t"><b>${currentUser()}</b><span>${ROLES[SESSION.role].nome}</span></div><button class="btn ic sm" title="Sair" onclick="doLogout()">${svg('<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',15)}</button>`;
  if(!can(CUR))CUR=ROLES[SESSION.role].views[0];
  buildNav();render();updateUndoBtn();
}
(function(){
  const t=localStorage.getItem('horus_theme');if(t){document.documentElement.setAttribute('data-theme',t);if(t==='light')document.getElementById('themeIcon').innerHTML='<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';}
  if(localStorage.getItem('horus_side')==='1')document.body.classList.add('side-collapsed');
  document.getElementById('foot-date').textContent=new Date().toLocaleDateString('pt-BR');
  document.getElementById('menuBtn').style.display=window.innerWidth<820?'grid':'none';
  if(SESSION&&USERS.find(x=>x.u===SESSION.u&&x.ativo))bootUI();
  else{SESSION=null;showLogin();}
})();
</script>
</body>
</html>
