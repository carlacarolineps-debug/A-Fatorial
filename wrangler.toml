# Cloudflare Pages: o site e as duas rotas sobem juntos, num projeto só.
#
# public/     é o que vira o site
# functions/  vira /typeform e /leads no mesmo domínio, sem configurar rota

name = "ideia-que-vende"
compatibility_date = "2026-08-01"
pages_build_output_dir = "public"

# O banco já existe e as tabelas já foram criadas.
[[d1_databases]]
binding = "DB"
database_name = "ideia-que-vende"
database_id = "9e6ad2f3-7bf5-42dc-acdf-20282227edff"

# O segredo do webhook NÃO vai aqui: este arquivo é versionado no git.
# Defina no painel do Pages, em Settings > Variables and Secrets, como
# secret, com o nome TYPEFORM_WEBHOOK_SECRET.
#
# TEAM_DOMAIN é o subdomínio do Zero Trust (ex.: grupoa.cloudflareaccess.com).
# Sem segredo, pode ficar aqui.
[vars]
TEAM_DOMAIN = ""
