# Um Worker só serve o site inteiro e as rotas de dados.
#
# public/  vira o site (landing em /, sistema em /sistema/)
# src/     vira /leads, /eu, /api/* , /robots.txt e /sitemap.xml
#
# Não existe passo de build: o site é HTML pronto. O deploy só sobe os
# arquivos e o script.

# O nome tem que ser igual ao do Worker no painel. Quando um Worker e
# ligado a um repositorio, nome diferente aqui faz o build falhar - ou,
# pior, um "wrangler deploy" cria um SEGUNDO Worker sem o dominio.
# Renomeado de "a-fatorial" para "ideia-que-vende" em 26/08: o nome
# anterior era o de outro negocio, e este projeto e do Ideia Que Vende.
name = "ideia-que-vende"
main = "src/index.js"
compatibility_date = "2026-08-01"

# URL de versao (<versao>-ideia-que-vende.workers.dev) fica desligada: ela
# serviria /sistema/ para qualquer um que adivinhasse o endereco, e o
# Access so protege o dominio de verdade.
preview_urls = false

[assets]
directory = "public"
binding = "ASSETS"

# O Worker só é chamado nestes caminhos. Todo o resto (a landing, o
# sistema, a imagem de compartilhamento) sai direto do cache da borda,
# sem executar código e sem contar requisição de Worker.
run_worker_first = ["/leads", "/eu", "/entrar", "/sair", "/primeiro-acesso",
                    "/minha-senha", "/pessoas", "/api/*",
                    "/robots.txt", "/sitemap.xml"]

# O banco já existe e as tabelas já foram criadas.
[[d1_databases]]
binding = "DB"
database_name = "ideia-que-vende"
database_id = "9e6ad2f3-7bf5-42dc-acdf-20282227edff"

[observability]
enabled = true

# O Typeform saiu em 31/08: as aplicacoes chegam pelo formulario da propria
# casa, em /aplicar. Com ele saiu o segredo do webhook, que era o unico
# secret deste Worker. Se um dia o TYPEFORM_WEBHOOK_SECRET ainda estiver
# no painel, em Settings > Variables and Secrets, pode apagar.
#
# Nao existe mais variavel de login aqui. Ate 01/09 o Cloudflare Access
# trancava o endereco, e este arquivo guardava o time e a etiqueta dele.
# Agora quem confere quem entra e o src/porta.js, com e-mail e senha no
# banco D1, e nao ha nada para configurar fora do repositorio.
#
# ATENCAO AO PLANO DO WORKER. O calculo da senha usa 210 mil voltas de
# PBKDF2, que gastam mais que os 10 ms de processador do plano gratis.
# Isso pede o plano de 5 dolares. Se um dia precisar voltar para o gratis,
# o numero de voltas esta em src/porta.js, numa constante so.
