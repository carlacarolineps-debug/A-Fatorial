# Publica o app como site, para a Carla abrir no celular.
#
# ATENÇÃO, e isto custou duas publicações vermelhas: o `enablement: true`
# do configure-pages NÃO liga o Pages sozinho num repositório onde ele
# nunca existiu. O GITHUB_TOKEN tem permissão para publicar, não para
# CRIAR o site, e o erro que sai é
#   Create Pages site failed. Error: Resource not accessible by integration
# Criar o site é uma vez só, e é a dona da conta que faz, em
# Settings > Pages > Source > GitHub Actions. Depois disso este arquivo
# publica sozinho a cada mudança em docs/, e o enablement vira um passo
# que não faz nada.
#
# O que vai para o ar é a pasta docs/, que o build do app atualiza junto
# com o .html. Endereço final:
#   https://carlacarolineps-debug.github.io/A-Fatorial/
name: Publicar o app

on:
  push:
    branches:
      - claude/strategy-cards-mentoring-vygy1x
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# uma publicação de cada vez, e a mais nova ganha
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Ligar o Pages (na primeira vez ele se liga sozinho)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empacotar a pasta docs
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
