<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuLar — Rede de Adoção e Gestão Animal</title>
<meta name="description" content="Plataforma de adoção responsável e gestão para ONGs e protetores de animais. Vitrine com compatibilidade, calendário de vacinas, lares temporários, doações por Pix e gestão completa.">
<meta name="theme-color" content="#E9762B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%BE%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ======================= LOGIN ======================= -->
<div id="login"></div>

<!-- ======================= APLICAÇÃO ======================= -->
<div id="app">

  <aside class="side">
    <div class="side-top">
      <div class="logo">🐾</div>
      <div><b>AuLar</b><small>adoção e gestão</small></div>
    </div>
    <nav class="side-nav" id="side-nav"></nav>
    <div class="side-pe">
      <button class="nav-i" onclick="trocarPapel()">
        <span class="ic">🔄</span><span>Trocar de perfil</span>
      </button>
    </div>
  </aside>

  <main class="main">
    <div id="faixa" style="display:none"></div>

    <header class="topo">
      <button class="icobtn" id="menu-btn" onclick="alternarMenu()" aria-label="Menu">☰</button>
      <div>
        <h1 id="tela-titulo">AuLar</h1>
        <div class="sub" id="tela-sub"></div>
      </div>
      <div class="dir">
        <button class="icobtn" id="btn-tema" onclick="alternarTema()" title="Tema claro/escuro">🌙</button>
        <button class="icobtn" onclick="abrirNotificacoes()" title="Notificações">🔔
          <span class="ponto" id="ponto-notif" style="display:none"></span>
        </button>
        <div class="eu" onclick="trocarPapel()" title="Trocar de perfil">
          <div id="topo-eu"></div>
          <div class="av" id="topo-av"></div>
        </div>
      </div>
    </header>

    <div class="rolagem">
      <div id="telas"></div>
    </div>
  </main>

</div>

<div class="cortina" id="cortina"></div>
<div id="toasts"></div>

<script src="js/00-core.js"></script>
<script src="js/01-seed.js"></script>
<script src="js/02-vacinas.js"></script>
<script src="js/03-match.js"></script>
<script src="js/04-billing.js"></script>
<script src="js/05-publico.js"></script>
<script src="js/06-gestao.js"></script>
<script src="js/07-plataforma.js"></script>
<script src="js/08-app.js"></script>
</body>
</html>
