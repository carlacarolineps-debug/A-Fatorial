<!-- =====================================================================
     Minha semana.

     A marcacao aqui e so a moldura: a frase de abertura, o lugar do
     seletor de pessoa, o lugar do recado e o corpo. Nenhum numero mora
     nesta marcacao de proposito. Numero escrito no HTML envelhece calado,

     saber o que mudou desde sexta.
     ===================================================================== -->
<section class="tela" id="tela-semana">

  <div class="abertura">
    <span class="selo" id="semana-periodo">Sua semana</span>
    <h2 style="margin-top:14px" id="semana-frase">O que vence, o que atrasou e quem está esperando.</h2>
    <!-- A providência da manchete. Quando a manchete é o fato, esta linha
         é o que fazer com ele. -->
    <p id="semana-linha"></p>
  </div>

  <div id="semana-quem-caixa"></div>
  <div id="semana-recado"></div>
  <div id="semana-corpo"></div>

</section>
