<!-- =====================================================================
     O formulario

     A decima tela, e a segunda que fala com o servidor. As perguntas da
     aplicacao nao podem morar no navegador de quem edita: quem abre a
     pagina publica precisa ver as mesmas perguntas que a mesa acabou de
     escrever, e duas pessoas da equipe precisam enxergar o mesmo
     rascunho em vez de se sobrescreverem em silencio.

     Dai os mesmos quatro estados de rede de "Ideias que chegaram", com
     texto proprio: buscando, sem servidor, login vencido e login
     protegido ainda nao ligado.

     A marcacao aqui e so a moldura. O corpo e reescrito a cada desenho,
     porque a tela troca de assunto entre as duas visoes e porque uma
     pergunta apagada nao pode deixar sobra na tela.

     A tela guarda tres pedacos separados de proposito: quem digita o
     texto de uma pergunta nao pode perder o cursor porque a contagem la
     em cima mudou. Os numeros, a frase de abertura e os avisos se
     redesenham sozinhos; a lista de perguntas so quando alguma coisa
     mudou de lugar.
     ===================================================================== -->
<section class="tela" id="tela-formulario">

  <div class="abertura">
    <h2 id="form-frase">Buscando o formulário no <b>servidor</b>.</h2>
    <p id="form-obs">Ele mora no servidor, e não neste navegador: a mesa inteira precisa ver o mesmo formulário.</p>
  </div>

  <div id="form-abas" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px"></div>

  <!-- Na visao das perguntas sao os quatro numeros do formulario. Na visao
       de como esta indo e a tira do periodo. -->
  <div class="numeros" id="form-numeros" hidden></div>

  <div id="form-avisos"></div>

  <div id="form-corpo"></div>

</section>
