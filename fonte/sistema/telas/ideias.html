<!-- =====================================================================
     Ideias que chegaram

     A unica tela do sistema que fala com o servidor. Todo o resto vive em
     localStorage, por navegador. As aplicacoes nao podem viver assim: elas
     chegam do Typeform, caem no D1 e voltam pela rota /leads, atras do
     porta. Se morassem no navegador, cada pessoa da mesa veria
     uma fila diferente da fila de quem esta sentado ao lado.

     Dai os quatro estados que nenhuma outra tela tem, e que estao escritos
     por extenso no arquivo ao lado: carregando, sem servidor, login
     vencido e Worker sem configuracao.
     ===================================================================== -->
<section class="tela" id="tela-ideias">

  <div class="abertura">
    <h2 id="ideias-frase">Buscando as aplicações no <b>servidor</b>.</h2>
    <p id="ideias-frase-obs"></p>
  </div>

  <!-- Os numeros olham a lista inteira, e nao o filtro que a pessoa esta
       usando agora: eles sao o retrato da mesa. -->
  <div class="numeros" id="ideias-numeros" hidden></div>

  <div id="ideias-aviso"></div>

  <div class="cartao">
    <div class="cartao-t">
      <span>Quem contou a ideia</span>
      <span id="ideias-estado"></span>
      <!-- O selo do ao vivo diz de quando e a lista, e se atualiza sozinho:
           e ele que substituiu o carimbo escrito uma vez e esquecido. -->
      <span class="ao-vivo" data-ao-vivo hidden style="margin-left:auto"></span>
      <button class="bt bt-linha bt-sm" id="ideias-bt-baixar" onclick="ideiasBaixar()" hidden>Baixar em planilha</button>
      <button class="bt bt-linha bt-sm" id="ideias-bt-buscar" onclick="ideiasCarregar()">Buscar de novo</button>
    </div>

    <div id="ideias-ferramentas" hidden style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px">
      <input class="campo campo-sm" id="ideias-busca" style="flex:1 1 240px;width:auto"
             placeholder="Procurar por nome, contato ou pelo que a pessoa escreveu"
             oninput="ideiasBuscar(this.value)">
      <select class="campo campo-sm" id="ideias-filtro" style="flex:0 1 250px;width:auto"
              onchange="ideiasFiltrar(this.value)"></select>
    </div>

    <div class="rolo-h">
      <table class="lista">
        <thead>
          <tr>
            <th>Espera</th>
            <th>Quem contou</th>
            <th>Contato</th>
            <th>Nível clicado</th>
            <th>Origem</th>
            <th>Andamento</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="ideias-corpo"></tbody>
      </table>
    </div>
  </div>

</section>
