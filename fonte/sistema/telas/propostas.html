<!-- =====================================================================
     Propostas.

     No pacote de origem esta tela era uma pagina solta em
     public/sistema/propostas/index.html, "protegida pelo Cloudflare
     Access por estar sob /sistema/". O Access saiu em 02/09: /sistema/ e
     arquivo estatico e nao passa pelo Worker, entao uma pagina solta ali
     seria PUBLICA, com o formulario de criar proposta a vista de qualquer
     um. Aqui ela e a decima primeira tela do sistema, atras da porta.
     ===================================================================== -->
<section class="tela" id="tela-propostas">

  <!-- O formulario nasce fechado.

       Aberto, ele punha mil e duzentos pixels de campos antes da lista das
       propostas ja enviadas, e a lista e o que se olha todo dia: quem
       abriu, quem assinou, quem esta parada. Criar proposta acontece
       algumas vezes por semana. Quem chega pelo botao "Gerar proposta" da
       mesa encontra a dobra ja aberta, porque ai criar E o motivo da
       visita: quem cuida disso e o propAberta do desenho. -->
  <details class="dobra" id="propDobraNova" style="margin-bottom:var(--e4)">
    <summary><b>Criar uma proposta nova</b></summary>
    <div class="dobra-corpo">
      <div id="propNova"></div>
      <div id="propErro"></div>
      <div id="propFeito"></div>
    </div>
  </details>

  <div class="secao">
    <div class="secao-t">
      <h3>Propostas enviadas</h3>
      <span class="conta-t" id="propConta"></span>
      <button class="bt bt-linha bt-sm" onclick="propCarregar()">Buscar de novo</button>
    </div>
    <div id="propAviso"></div>
    <div class="rolo-h">
      <table class="lista">
        <thead><tr>
          <th>Código</th><th>Cliente</th><th>Situação</th><th>Plano aceito</th><th></th>
        </tr></thead>
        <tbody id="propLista"></tbody>
      </table>
    </div>
  </div>

  <div class="secao">
    <div class="secao-t"><h3>Dados do contrato</h3></div>
    <p class="dica" style="margin:-8px 0 16px">
      Entram no contrato de toda proposta, e ficam guardados neste navegador
      depois da primeira vez. O WhatsApp é para onde o cliente manda a
      confirmação depois de assinar.
    </p>
    <div id="propContratada"></div>
  </div>

</section>
