<!-- =====================================================================
     A porta. E-mail e senha, conferidos no servidor. O que aparece nesta
     caixa muda conforme o servidor responde: criar o primeiro acesso,
     entrar, ou escolher a senha propria na primeira entrada. Por isso o
     miolo e so um buraco vazio aqui, pintado pelo 90-fim.js.
     ===================================================================== -->
<div class="porta" id="porta">
  <div class="grao"></div>
  <!-- A lombada da porta: a marca fica de um lado, no preto da casa, e o
       que se preenche fica do outro, no papel. Junto, o formulario ficava
       com o nome da empresa em branco sobre bege. -->
  <div class="porta-capa">
    <!-- O logotipo por extenso, e nao o simbolo mais o nome escrito com a
         fonte da casa: aquilo era uma imitacao do logotipo. O desenho de
         verdade tem o triangulo dentro do A, as duas cores e os dois fios
         em volta do QUE. O build embute o arquivo em base64 no lugar do
         __LOGO_H__, entao a pagina continua nao pedindo nada a ninguem. -->
    <div class="porta-marca">
      <span class="marca-h" role="img" aria-label="Ideia Que Vende"></span>
    </div>
    <p class="porta-frase">Sua experiência<br>já vale muito.<br><span>Falta virar produto.</span></p>
    <div class="pe">O sistema de dentro da casa</div>
  </div>

  <div class="porta-caixa" id="porta-caixa">
    <div class="porta-feixe" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <h1 id="porta-titulo">Entrando no <b>sistema</b></h1>
    <p id="porta-texto">Conferindo o seu acesso.</p>
    <div id="porta-corpo"></div>
  </div>
</div>

<!-- =====================================================================
     A moldura. O cliente entra sem barra lateral: ele tem uma tela so, e
     um menu de um item so e um menu que nao serve para nada.
     ===================================================================== -->
<div class="app" id="app" hidden>
  <aside class="lateral" id="lateral">
    <div class="lateral-marca">
      <span class="marca-h" role="img" aria-label="Ideia Que Vende"></span>
    </div>
    <nav class="menu" id="menu"></nav>

    <!-- Quem esta dentro fica no pe da lombada, e nao no cabeco: no cabeco
         disputava espaco com o titulo da tela a cada linha que crescia. -->
    <div class="lateral-pe">
      <span class="iniciais" id="quem-iniciais" aria-hidden="true"></span>
      <div style="min-width:0">
        <b id="quem-nome"></b>
        <span class="eti eti-neutra" id="quem-papel"></span>
      </div>
      <button class="sair" onclick="sair()" title="Sair" aria-label="Sair">
        <svg class="ic" aria-hidden="true"><use href="#i-arrow"/></svg>
      </button>
    </div>
  </aside>

  <div>
    <header class="topo">
      <button class="bt bt-linha bt-sm so-celular" id="bt-menu" onclick="alternarMenu()">Menu</button>
      <h1 id="topo-titulo"></h1>
      <div class="sub" id="topo-sub"></div>
      <div class="agora" id="topo-agora"></div>
    </header>

    <main class="rolo">
