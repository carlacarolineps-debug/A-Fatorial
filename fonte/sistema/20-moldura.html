<!-- =====================================================================
     A porta. Quem identifica a pessoa e o Cloudflare Access, pelo e-mail
     que ele carimba no pedido e que a rota /eu devolve. Enquanto o Access
     nao estiver ligado, esta tela diz isso por escrito em vez de fingir
     um login que nao protege nada.
     ===================================================================== -->
<div class="porta" id="porta">
  <div class="porta-caixa">
    <div class="porta-marca">
      <svg aria-hidden="true"><use href="#marca"/></svg>
      <b>Ideia Que Vende</b>
    </div>
    <h1 id="porta-titulo">Entrando no <b>sistema</b></h1>
    <p id="porta-texto">Conferindo o seu acesso.</p>
    <div id="porta-corpo"></div>
  </div>
</div>

<!-- =====================================================================
     A moldura. O cliente entra sem barra lateral: ele tem uma tela so, e
     um menu de um item so e um menu que nao serve para nada.
     ===================================================================== -->
<div class="app" id="app" hidden>
  <aside class="lateral" id="lateral">
    <div class="lateral-marca">
      <svg aria-hidden="true"><use href="#marca"/></svg>
      <div>
        <b>Ideia Que Vende</b>
        <span>Transformamos experiência em produto</span>
      </div>
    </div>
    <nav class="menu" id="menu"></nav>
  </aside>

  <div>
    <header class="topo">
      <button class="bt bt-linha bt-sm so-celular" id="bt-menu" onclick="alternarMenu()">Menu</button>
      <div>
        <h1 id="topo-titulo"></h1>
        <div class="sub" id="topo-sub"></div>
      </div>
      <div class="quem">
        <b id="quem-nome"></b>
        <span id="quem-papel"></span>
      </div>
      <button class="bt bt-linha bt-sm" onclick="sair()">Sair</button>
    </header>

    <main class="rolo">
