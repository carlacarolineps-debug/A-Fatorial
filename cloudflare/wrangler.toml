name = "ideia-que-vende"
main = "src/index.js"
compatibility_date = "2026-08-01"

# O banco ja existe e as tabelas ja foram criadas. Nao precisa rodar
# "wrangler d1 create" nem o schema.sql de novo.
[[d1_databases]]
binding = "DB"
database_name = "ideia-que-vende"
database_id = "9e6ad2f3-7bf5-42dc-acdf-20282227edff"

# O segredo do webhook NAO vai neste arquivo: ele e versionado no git.
# Defina por comando, que guarda cifrado na Cloudflare:
#   npx wrangler secret put TYPEFORM_WEBHOOK_SECRET
#
# TEAM_DOMAIN e o seu subdominio do Zero Trust (ex.: grupoa.cloudflareaccess.com),
# usado para conferir quem entrou pelo Access. Sem segredo, pode ficar aqui.
[vars]
TEAM_DOMAIN = ""
