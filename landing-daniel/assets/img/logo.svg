<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 128" role="img" aria-label="EEEEEEEITA Protagonista">
  <title>EEEEEEEITA Protagonista</title>
  <!--
    ATENCAO: este e um placeholder fiel da marca (cerebro colorido + wordmark).
    Substitua este arquivo pelo SVG ou PNG oficial fornecido pelo Daniel,
    mantendo o mesmo nome (logo.svg) para nao precisar editar o HTML.
  -->

  <!-- Cerebro: aglomerado de blobs coloridos (paleta da marca) -->
  <g>
    <circle cx="44"  cy="46" r="24" fill="#E11D74"/>
    <circle cx="74"  cy="40" r="20" fill="#8B3FB0"/>
    <circle cx="30"  cy="70" r="21" fill="#6D2A8C"/>
    <circle cx="60"  cy="66" r="24" fill="#B4318F"/>
    <circle cx="88"  cy="62" r="18" fill="#EF7B21"/>
    <circle cx="50"  cy="90" r="17" fill="#F4C020"/>
    <circle cx="80"  cy="90" r="15" fill="#159C97"/>
    <!-- brilho sutil para dar volume, sem exagero -->
    <circle cx="52"  cy="40" r="7"  fill="#ffffff" opacity="0.18"/>
    <circle cx="66"  cy="60" r="6"  fill="#ffffff" opacity="0.14"/>
  </g>

  <!-- Wordmark: fontes web-safe para renderizar em qualquer contexto -->
  <text x="126" y="66" font-family="'Arial Black', 'Arial', sans-serif" font-weight="900"
        font-style="italic" font-size="42" letter-spacing="-1.5" fill="#3A1748">EEEEEEEITA</text>
  <text x="129" y="93" font-family="'Arial', sans-serif" font-weight="700"
        font-size="15" letter-spacing="8.5" fill="#6D2A8C">PROTAGONISTA</text>
</svg>
