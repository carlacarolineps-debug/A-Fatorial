window.obPublishAudio = function () {
  var st = document.getElementById("ob-au-status");
  var btn = document.getElementById("ob-au-pub");
  var title = (document.getElementById("ob-au-title").value || "").trim();
  var url = (document.getElementById("ob-au-url").value || "").trim();
  var tx = (document.getElementById("ob-au-tx").value || "").trim();
  var fileInput = document.getElementById("ob-au-file");
  var file = fileInput && fileInput.files && fileInput.files[0];
  if (!file && !url) { st.textContent = "Escolha um arquivo ou cole um link."; return; }
  btn.disabled = true; st.textContent = "Enviando…";
  var step = file ? OB.audioUpload(file).then(function (r) { if (r.error) throw new Error("Falha no upload"); return r.url; }) : Promise.resolve(url);
  step.then(function (finalUrl) { return OB.audioPublish({ titulo: title, url: finalUrl, transcricao: tx }); })
    .then(function (r) {
      if (r && r.error) throw new Error("Falha ao publicar");
      btn.disabled = false; st.textContent = "✓ Áudio publicado!";
      document.getElementById("ob-au-title").value = ""; document.getElementById("ob-au-url").value = ""; document.getElementById("ob-au-tx").value = "";
      if (fileInput) fileInput.value = "";
      if (window.toast) toast("", "Áudio publicado", "Os membros já veem no Início");
    })
    .catch(function (e) { btn.disabled = false; st.textContent = "Não consegui publicar agora. Tente de novo."; });
};

// Loop de notificações: roda após o boot. Avisa no sininho sobre áudio novo
// e respostas da caixinha (e, para a mentora, perguntas na fila).
window.obCheckUpdates = function () {
  if (!window.OB || OB.isPreview() || !window.S || !S.name) return;
  if (typeof pushNotif !== "function") return;

  OB.audioList(1).then(function (rows) {
    if (!rows || !rows.length) return;
    var a = rows[0];
    if ((S.audioNotified || "") !== a.id && (S.audioSeen || "") !== a.id) {
      S.audioNotified = a.id; if (typeof save === "function") save();
      pushNotif("", "Novo áudio da mentora", a.titulo || "Disponível no Início");
    }
  });

  if (OB.isMentor()) {
    OB.caixinhaList().then(function (rows) {
      var pend = (rows || []).filter(function (r) { return !r.respondida; }).length;
      if (pend > 0 && (S.mentorPendNotified || 0) !== pend) {
        S.mentorPendNotified = pend; if (typeof save === "function") save();
        pushNotif("", pend === 1 ? "1 pergunta na fila" : pend + " perguntas na fila", "Responda em A Mentora");
      }
    });
  } else {
    OB.caixinhaList().then(function (rows) {
      var lastSeen = S.lastCaixinhaSeen || 0;
      var newest = 0, answered = 0, maxAny = 0;
      (rows || []).forEach(function (r) {
        if (r.answered_at) {
          var t = new Date(r.answered_at).getTime();
          if (t > maxAny) maxAny = t;
          if (r.respondida && t > lastSeen) { answered++; if (t > newest) newest = t; }
        }
      });
      if (lastSeen === 0) { // 1ª verificação: marca o ponto de partida sem barulho
        if (maxAny > 0) { S.lastCaixinhaSeen = maxAny; if (typeof save === "function") save(); }
        return;
      }
      if (answered > 0) {
        S.lastCaixinhaSeen = newest; if (typeof save === "function") save();
        pushNotif("", answered === 1 ? "A mentora respondeu sua pergunta" : "A mentora respondeu " + answered + " perguntas", "Veja em A Mentora");
      }
    });
  }
};
</script>

<script>
/* ===================================================================
   JORNADA CC — Motor do produto
   Persistência via window.storage (Claude artifacts). Fallback memória.
   =================================================================== */

/* ---------- storage layer ----------
   Persistência REAL no dispositivo via localStorage (funciona quando o
   arquivo é hospedado em um link ou aberto no navegador do aluno).
   window.storage entra como reforço quando disponível; memória é o
   último fallback. Isso garante que o progresso não se perca ao fechar. */
const Store = (()=>{
  const mem = {};
  const hasWS = (typeof window!=='undefined' && window.storage && typeof window.storage.get==='function');
  const hasLS = (()=>{ try{ const k='__ob_probe__'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }catch(e){ return false; } })();
  return {
    async get(k){
      if(hasWS){ try{ const r=await window.storage.get(k); if(r!=null && r.value!=null) return r.value; }catch(e){} }
      if(hasLS){ try{ const v=localStorage.getItem(k); if(v!=null) return v; }catch(e){} }
      return mem[k]??null;
    },
    async set(k,v){
      let ok=false;
      if(hasLS){ try{ localStorage.setItem(k,v); ok=true; }catch(e){} }
      if(hasWS){ try{ await window.storage.set(k,v); ok=true; }catch(e){} }
      mem[k]=v; return ok;
    }
  };
})();

      {id:'cf1', kind:'conceito', title:'A natureza do conflito', body:`
        <p>Conflito é a contraposição de ideias, emoções ou interesses. Robbins: <i>processo que começa quando uma parte percebe que a outra afeta, ou pode afetar, negativamente algo que ela considera importante.</i></p>
        <p>Bastam duas pessoas para haver conflito — e a chance cresce com o número de gente, a pressão por resultados e a competição. Mas, bem gerenciado, o conflito vira <b>oportunidade de crescimento, reestruturação, energia e criatividade</b>.</p>

          <li><b>Sentido</b> — surgem emoções: ansiedade, frustração, hostilidade.</li>

  /* === 10 · MÓDULO 02 — ESTRATÉGIA === */
  {
    id:'estrategia-empresarial', icon:'♟️', glyph:'♟️', group:'estrategia',
    title:'Estratégia Empresarial',
    short:'O que é estratégia, de onde ela veio e por que ela separa quem escala de quem só sobrevive.',
    tags:['Estratégia','Vantagem competitiva','Posicionamento'],
    xpReward:160,
    mentor:"Estratégia não é o plano bonito na gaveta — é a decisão de PARA ONDE a empresa vai e, principalmente, o que ela escolhe NÃO fazer. Quem não decide isso, deixa o mercado decidir no lugar. Direção primeiro, tática depois.",
    steps:[
      {id:'e1', kind:'conceito', title:'O que é estratégia (e de onde veio)', body:`
        <p>A palavra <b>estratégia</b> nasce do grego <i>stratos</i> (exército) + <i>agein</i> (dirigir). A origem é militar: a arte de coordenar todas as forças para conduzir uma guerra, gerenciar uma crise ou preservar a paz. O marco dos estudos é <i>A Arte da Guerra</i>, de Sun Tzu (~500 a.C.) — usado até hoje por líderes políticos e empresariais.</p>
        <h4>Do campo de batalha para a empresa</h4>
        <p>No mundo dos negócios, <b>estratégia corporativa</b> é a orientação das atividades da organização no <b>longo prazo</b>: como ela direciona esforços para conseguir resultados no futuro e, assim, sustentar-se.</p>
        <p>Chandler resume bem: estratégia é a <i>determinação das metas e objetivos básicos de longo prazo</i>, mais a <i>adoção de cursos de ação</i> e a <i>alocação dos recursos</i> necessários para alcançá-los.</p>
        <div class="callout"><span class="ic">🎯</span><div>O objetivo central da estratégia é a <b>vantagem competitiva</b>: reconfigurar continuamente recursos e habilidades para responder a um ambiente em constante mudança e atender às expectativas dos <i>stakeholders</i> — sócios, equipe, financiadores, clientes.</div></div>
        <div class="callout"><span class="ic">🧭</span><div>Estratégia define as <b>diretrizes do lugar para onde você quer ir</b> — não necessariamente o passo a passo de como chegar. O "como" é tática; o "para onde e por quê" é estratégia.</div></div>
      `},
      {id:'e2', kind:'conceito', title:'Como o pensamento estratégico evoluiu', body:`
        <p>Conhecer a evolução ajuda a entender as ferramentas que usamos hoje:</p>
        <ul>
          <li><b>Anos 1960</b> — a estratégia entra no <b>planejamento corporativo</b>.</li>
          <li><b>Anos 1970</b> — foco em <b>diversificação e portfólio</b>.</li>
          <li><b>Anos 1980–90</b> — ênfase em <b>competências básicas</b> e abordagens mais orientadas a pessoas e gestão.</li>
        </ul>
        <h4>As ideias que ainda usamos</h4>
        <ul>
          <li><b>Curva de experiência</b> (Bruce Henderson / BCG): quanto mais a empresa produz e acumula experiência, <b>menor</b> o custo. Virou base para pensar preço, volume, custo e vantagem.</li>
          <li><b>Matriz BCG</b> (crescimento × participação): os famosos quadrantes — <i>vacas leiteiras, cães, estrelas e pontos de interrogação</i> — para gerir um portfólio de produtos.</li>
          <li><b>Michael Porter</b> (1985): as <b>cinco forças</b>, a <b>cadeia de valor</b> e três caminhos — <i>liderança de custo</i>, <i>diferenciação</i> ou <i>foco</i> em um segmento.</li>
          <li><b>Competência essencial</b> (Prahalad & Hamel, 1990): vantagem não vem só de olhar o mercado e os concorrentes, mas de olhar para <b>dentro</b> da própria empresa.</li>
          <li><b>Nova economia / internet</b> (final dos anos 1990): a internet muda tudo e provoca a <b>desintermediação</b> — cai a necessidade de atravessadores.</li>
        </ul>
        <div class="callout"><span class="ic">🔁</span><div>O fio condutor: a estratégia sempre se reinventa diante de <b>mudanças radicais no ambiente competitivo</b>. Por isso ela nunca é "pronta" — é prática contínua.</div></div>
      `},
      {id:'e3', kind:'pratica', title:'Por que isso decide o seu resultado', body:`
        <p>Estratégia parece abstrata até você olhar os números. Um estudo da consultoria <b>McKinsey (2017)</b> comparou empresas com e sem diretriz estratégica de longo prazo. As com estratégia tiveram, em média, cerca de <b>47% mais crescimento de receita</b> e <b>81% mais lucro</b> — além de gerarem mais empregos.</p>
        <p>Estratégia <b>não é</b> o planejamento de negócios clássico. Ela envolve <b>visão, missão e pensamento fora da caixa</b> — a direção, não só a planilha.</p>
        <h4>Ferramenta: seu posicionamento em 3 perguntas</h4>
        <p>Responda com sinceridade — é o esqueleto da sua estratégia:</p>
        <ul>
          <li><b>Onde competimos?</b> Qual mercado, segmento e cliente são realmente os seus.</li>
          <li><b>Como vencemos?</b> Sua vantagem é <i>custo</i>, <i>diferenciação</i> ou <i>foco</i>? (Não dá pra ser as três.)</li>

      `}

  {

    short:'Como decidir sob risco e fazer a estratégia virar gestão do dia a dia — não uma pasta na gaveta.',

    xpReward:160,
    mentor:"Decisão estratégica não é palpite de um dia inspirado — é processo. E estratégia que fica na gaveta não muda nada. O que separa quem decide bem é método para escolher e disciplina para revisar.",
    steps:[
      {id:'d1', kind:'conceito', title:'Sua vantagem começa nos recursos', body:`
        <p>A <b>Teoria Baseada em Recursos</b> (<i>Resource-based Theory</i>) diz que parte da sua vantagem competitiva está <b>dentro</b> da empresa — nos recursos que você tem. Mas nem todo recurso gera vantagem. Wright, Kroll e Parnell apontam quatro qualidades:</p>
        <ul>
          <li><b>Valioso</b> — contribui de fato para a eficiência e a eficácia do negócio.</li>
          <li><b>Raro</b> — poucos concorrentes possuem.</li>
          <li><b>Imperfeitamente imitável</b> — difícil de copiar por completo.</li>
          <li><b>Sem substituto estratégico</b> — não há um equivalente fácil que faça o mesmo papel.</li>
        </ul>
        <div class="callout"><span class="ic">💎</span><div>Quanto mais um recurso seu reúne essas quatro qualidades, mais difícil fica te atacar. Pergunte sempre: o que no meu negócio é <b>valioso, raro e difícil de imitar</b>?</div></div>
      `},
      {id:'d2', kind:'conceito', title:'Decisão é processo, não lampejo', body:`
        <p>Decidir é tomar posição sobre um assunto com base em <b>insumos</b>: informação, conhecimento, alternativas, impactos, avaliações e escolhas — e em muitas <b>outras decisões</b> tomadas por outras pessoas. Por isso, uma <b>decisão final é, na verdade, um conjunto de decisões parciais</b> vindas de vários níveis da empresa.</p>
        <p>Quando uma decisão passa a pesar nos <b>rumos</b> do negócio, ela vira <b>estratégica</b>: olha para o médio/longo prazo, exige muitos subsídios, pode levar meses e carrega <b>alto grau de risco</b> — ainda mais em ambientes voláteis como o nosso.</p>
        <h4>As 7 etapas do processo decisório (Chiavenato)</h4>
        <ol>
          <li><b>Percepção</b> — notar a situação ou o problema.</li>
          <li><b>Análise</b> — avaliar o grau de importância estratégica.</li>
          <li><b>Definição</b> — definir os objetivos a alcançar.</li>
          <li><b>Alternativas</b> — buscar soluções possíveis.</li>
          <li><b>Comparação</b> — pesar vantagens, desvantagens e impactos.</li>
          <li><b>Escolha</b> — optar pela alternativa mais adequada.</li>
          <li><b>Implementação</b> — executar e acompanhar com feedback permanente.</li>
        </ol>
      `},
      {id:'d3', kind:'pratica', title:'Estratégia é estado permanente (fuja da gaveta)', body:`
        <p>Planejar é só metade. A outra é a <b>gestão estratégica</b>: aplicar e executar. E como o ambiente muda o tempo todo, raramente o plano sai exatamente como o previsto — pode ser realizado na forma original, modificado, ou substituído por um caminho totalmente diferente. O essencial é ter <b>flexibilidade</b> para adaptar e ainda assim buscar o resultado.</p>
        <div class="callout"><span class="ic">🗄️</span><div><b>O inimigo nº 1 do plano é a gaveta.</b> Plano que vira documento arquivado nunca mais é consultado. Gestão estratégica é consulta, aplicação, análise, modificação e avaliação <b>contínuas</b> — não um evento de início de ano.</div></div>
        <p>E a premissa da gestão estratégica é <b>criar riqueza de forma permanente</b> — não só para os donos, mas satisfazendo as necessidades de <b>todos os stakeholders</b> (equipe, fornecedores, clientes). Espremer um deles para maximizar o outro derruba a eficiência no longo prazo.</p>
        <div class="callout"><span class="ic">📅</span><div>Leve sua estratégia para o <b>Plano 30d / Planner</b> e marque uma data fixa para revisá-la. Estratégia revisada é estratégia viva.</div></div>
      `}
    ],
    quiz:[
      {q:'Pela Teoria Baseada em Recursos, um recurso gera mais vantagem quando é:', a:['Barato e fácil de comprar','Valioso, raro, difícil de imitar e sem substituto','Igual ao dos concorrentes','Apenas valioso, nada mais'], correct:1, why:'A vantagem cresce quando o recurso é valioso, raro, imperfeitamente imitável e sem substituto estratégico relevante.'},
      {q:'Segundo o material, uma decisão final é:', a:['Sempre fruto da intuição de uma só pessoa','Um conjunto de várias decisões parciais de diferentes níveis','Algo que não pode ser planejado','Uma decisão isolada do dia a dia'], correct:1, why:'A decisão final é a soma de decisões parciais tomadas por várias pessoas, em níveis hierárquicos diferentes.'},
      {q:'Qual é a última etapa do processo decisório estratégico de Chiavenato?', a:['Percepção','Comparação','Implementação com acompanhamento e feedback','Definição dos objetivos'], correct:2, why:'A sequência termina na implementação da alternativa escolhida, com acompanhamento e feedback permanente.'},
      {q:'A premissa da gestão estratégica é:', a:['Criar riqueza de forma permanente, satisfazendo todos os stakeholders','Maximizar o lucro dos donos a qualquer custo','Usar uma estratégia só por um curto período','Arquivar o plano e seguir a intuição'], correct:0, why:'A gestão estratégica cria riqueza de forma contínua, atendendo às necessidades de todos os stakeholders — não só dos acionistas.'}
    ],
    challenge:'Pegue uma decisão estratégica que você precisa tomar e rode as 7 etapas (percepção → análise → definição → alternativas → comparação → escolha → implementação). Anote no Plano 30d a data em que vai revisar a escolha.'

  /* === 12 · MÓDULO 02 — ESTRATÉGIA (3) === */
  {
    id:'estrategia-ambientes', icon:'🔭', glyph:'🔭', group:'estrategia',
    title:'Ambientes Externo e Interno · SWOT',
    short:'Ler o que vem de fora (ameaças e oportunidades) e o que você tem dentro (forças e fraquezas) — e cruzar tudo numa SWOT.',
    tags:['Ambiente','SWOT / FOFA','Vantagem competitiva'],
    xpReward:170,
    mentor:"Decisão boa começa com leitura boa: o que o mercado está te oferecendo e te ameaçando, e o que você tem de verdade para usar. Quem só olha pra dentro tropeça no ambiente; quem só olha pra fora esquece a própria força. A SWOT junta os dois.",
    steps:[
      {id:'a1', kind:'conceito', title:'Ambiente externo: 3 níveis e as forças que te afetam', body:`
        <p>Para ler o ambiente externo com olhar estratégico, há <b>três níveis</b>, do mais amplo ao mais próximo: o <b>macroambiente</b> → o <b>ambiente setorial</b> → a <b>organização</b>.</p>
        <h4>Macroambiente — 4 forças (Wright, Kroll e Parnell)</h4>
        <ul>
          <li><b>Político-legais</b> — eleições, leis, regulação/desregulação de setores (ex.: a redução do IPI no setor automotivo).</li>
          <li><b>Econômicas</b> — PIB, inflação, juros, câmbio; mexem em preços, crédito e poder de compra.</li>
          <li><b>Tecnológicas</b> — inovações que aceleram um setor (eletrônicos) ou que dizimam outro; ritmo varia muito por área.</li>
          <li><b>Sociais</b> — tradições e datas (Natal, Dia das Mães…), tendências (vida saudável, fitness) e demografia (envelhecimento da população).</li>
        </ul>
        <h4>Ambiente setorial — as forças competitivas</h4>
        <p>Dentro do seu setor pesam: a <b>ameaça de novos entrantes</b>, a <b>pressão de produtos substitutos</b>, o <b>poder de barganha dos fornecedores</b>, o <b>poder de barganha dos compradores</b> e a <b>rivalidade entre os concorrentes</b>.</p>
        <div class="callout"><span class="ic">🔭</span><div>Fazer essa leitura de forma deliberada tem nome: <i>environmental scanning</i> (mapeamento ambiental). É varrer o ambiente em busca das <b>ameaças</b> a evitar e das <b>oportunidades</b> a aproveitar.</div></div>
      `},
      {id:'a2', kind:'conceito', title:'Ambiente interno: forças, fraquezas e a vantagem que dura', body:`
        <p>Olhando para dentro: <b>forças</b> são os pontos em que você se destaca dos concorrentes (uma técnica, matéria-prima, processo, conceito, inovação, o valor das pessoas); <b>fraquezas</b> são os pontos a melhorar, que podem prejudicar o negócio.</p>
        <p>Esses pontos fortes e fracos estão nos seus <b>recursos</b>, de três tipos: <b>humanos</b>, <b>organizacionais</b> e <b>físicos</b>. Usá-los de forma inteligente e planejada cria <b>vantagem competitiva</b>.</p>
        <div class="callout"><span class="ic">💪</span><div>Recursos <b>físicos</b> (equipamentos, layout) e <b>organizacionais</b> (estrutura, processos) podem ser <b>copiados</b> com esforço. O que é quase impossível de imitar são as <b>pessoas</b> — ideias, criatividade, compromisso. Por isso a vantagem que <b>dura</b> nasce dos recursos humanos.</div></div>
        <p>E atenção: para um diferencial ser vantagem de verdade, ele precisa de <b>duas</b> coisas — ser <b>real</b> frente aos concorrentes <i>e</i> ser <b>percebido</b> claramente pelo mercado. Diferencial que ninguém nota não vende.</p>
      `},
      {id:'a3', kind:'pratica', title:'Análise SWOT (FOFA): juntando dentro e fora', body:`
        <p>A <b>Análise SWOT</b> nasceu em Stanford, nos anos 1960, e é a ferramenta de diagnóstico mais usada para análise de ambiente e construção de cenários. O nome vem de <i>Strengths</i> (forças), <i>Weaknesses</i> (fraquezas), <i>Opportunities</i> (oportunidades) e <i>Threats</i> (ameaças) — em português, <b>FOFA</b>.</p>
        <div class="callout"><span class="ic">🧭</span><div><b>Forças e fraquezas</b> são do <b>ambiente interno</b> (você controla). <b>Oportunidades e ameaças</b> são do <b>ambiente externo</b> (você não controla, mas precisa ler).</div></div>
        <h4>Ferramenta: monte sua matriz e cruze</h4>
        <p>Liste 2 itens em cada quadrante e depois cruze para gerar ação:</p>
        <ul>
          <li><b>Força × Oportunidade</b> — como usar o que você tem de melhor para aproveitar o que o mercado abriu?</li>
          <li><b>Fraqueza × Ameaça</b> — o que corrigir agora para não ser pego de surpresa?</li>
        </ul>
        <div class="callout"><span class="ic">📅</span><div>Transforme um desses cruzamentos em uma ação concreta no seu <b>Plano 30d</b>. SWOT que não vira ação é só uma tabela bonita.</div></div>
      `}
    ],
    quiz:[
      {q:'Quais são os três níveis de análise do ambiente externo?', a:['Passado, presente e futuro','Macroambiente, ambiente setorial e a organização','Político, econômico e social','Interno, médio e externo'], correct:1, why:'Do mais amplo ao mais próximo: macroambiente → ambiente setorial → organização.'},
      {q:'As quatro forças do macroambiente (Wright, Kroll e Parnell) são:', a:['Forças, fraquezas, oportunidades e ameaças','Político-legais, econômicas, tecnológicas e sociais','Compradores, fornecedores, entrantes e substitutos','Humanos, organizacionais, físicos e financeiros'], correct:1, why:'O macroambiente é formado pelas forças político-legais, econômicas, tecnológicas e sociais.'},
      {q:'Qual tipo de recurso tende a sustentar a vantagem competitiva por mais tempo?', a:['Recursos físicos (equipamentos, layout)','Recursos organizacionais (estrutura, processos)','Recursos humanos (pessoas, ideias, compromisso)','Todos são igualmente fáceis de copiar'], correct:2, why:'Físicos e organizacionais podem ser imitados; as pessoas e seus atributos são quase impossíveis de copiar — daí a vantagem mais duradoura.'},

  /* === MÓDULO 01 (Raio-X) — Estratégias Competitivas (Porter) === */
  {
    id:'estrategia-competitiva', icon:'⚔️', glyph:'⚔️', group:'raiox',
    title:'Estratégias Competitivas',
    short:'Os três caminhos para vencer — custo, diferenciação ou foco — e como escolher o seu sem ficar no meio-termo.',

    steps:[
      {id:'ec1', kind:'conceito', title:'Estratégia e o triângulo que a sustenta', body:`
        <p>Na origem, <b>estratégia</b> era a "arte dos generais": organizar os meios para atingir um objetivo. No negócio, é o que a organização decide fazer para que o cliente prefira o seu produto ou serviço — o <b>posicionamento</b> que te diferencia dos concorrentes.</p>
        <h4>O triângulo estratégico (Costa)</h4>
        <p>Toda boa estratégia equilibra três perguntas. Quando uma delas é ignorada, a estratégia desanda:</p>
        <ul>
          <li><b>Propósito</b> — "O que queremos ser?" (missão, visão e valores).</li>
          <li><b>Ambiente externo</b> — "O que nos é permitido ser?" (o mercado e suas forças).</li>
          <li><b>Capacitação</b> — "O que sabemos fazer?" (suas competências reais).</li>
        </ul>
        <div class="callout"><span class="ic">⚠️</span><div>Uma estratégia que entra em conflito com o <b>propósito</b> da empresa tem enorme dificuldade de dar certo. Direção primeiro, tática depois.</div></div>
        <p>E lembre: estratégia não é receita pronta para copiar. É processo contínuo de invenção, teste e ajuste — e deve ser <b>simples, clara e objetiva</b>.</p>
      `},
      {id:'ec2', kind:'conceito', title:'Os três caminhos para vencer (Porter)', body:`
        <p>Porter mostrou que existem basicamente <b>três estratégias genéricas</b> para conquistar vantagem competitiva:</p>
        <ul>
          <li><b>Liderança em custo total</b> — ter o menor custo do setor, o que protege a empresa na guerra de preços e contra as demais forças. Atenção: costuma haver <b>apenas um</b> líder de custo por setor; disputar esse posto sem ser o nº 1 vira guerra de preços destrutiva.</li>
          <li><b>Diferenciação</b> — oferecer algo percebido como <b>único</b> pelo cliente (imagem, tecnologia, qualidade, atendimento). O cliente paga mais e fideliza. Várias empresas podem se diferenciar ao mesmo tempo, cada uma em atributos distintos.</li>
          <li><b>Enfoque (foco / nicho)</b> — escolher um <b>alvo restrito</b> (um segmento, um nicho, uma região) e atendê-lo melhor que todos, por custo baixo ou por diferenciação naquele recorte.</li>
        </ul>
        <h4>As cinco forças que definem a concorrência</h4>
        <p>O grau de concorrência de um setor depende de cinco forças (Porter): <b>entrantes potenciais</b>, <b>produtos substitutos</b>, <b>poder dos fornecedores</b>, <b>poder dos compradores</b> e a <b>rivalidade</b> entre os concorrentes atuais. É a soma delas que determina o potencial de lucro do setor.</p>
      `},
      {id:'ec3', kind:'pratica', title:'Escolha seu caminho (sem ficar no meio)', body:`
        <p>O erro mais comum é tentar ser <b>barato e diferenciado ao mesmo tempo</b>: a empresa fica "presa no meio", sem o menor preço nem o maior valor — e o cliente perde o motivo claro para escolhê-la.</p>
        <h4>Ferramenta: defina e defenda</h4>
        <ul>
          <li><b>Qual é o seu caminho?</b> Custo, diferenciação ou foco — escolha um.</li>
          <li><b>Por que o cliente te escolhe?</b> Enuncie o diferencial e garanta que o mercado o <b>percebe</b>.</li>
          <li><b>Quais forças te pressionam?</b> Mapeie as cinco forças do seu setor e onde você está mais exposto.</li>
        </ul>
        <div class="callout"><span class="ic">📅</span><div>Leve a sua escolha e o mapa das cinco forças para o <b>Plano 30d</b>. Uma estratégia escolhida e defendida vale mais que três tentadas pela metade.</div></div>
      `}
    ],
    quiz:[
      {q:'O triângulo estratégico (Costa) equilibra quais três perguntas?', a:['Preço, praça e promoção','Propósito ("o que queremos ser?"), ambiente externo ("o que nos é permitido ser?") e capacitação ("o que sabemos fazer?")','Passado, presente e futuro','Vendas, marketing e finanças'], correct:1, why:'O triângulo cruza propósito, ambiente externo e capacitação — e a estratégia precisa equilibrar os três.'},
      {q:'Sobre a liderança em custo total, é correto afirmar que:', a:['Todo setor comporta vários líderes de custo','Costuma existir apenas um líder de custo por setor; disputar esse posto sem ser o nº 1 vira guerra de preços','Custo baixo não protege contra concorrentes','É a única estratégia possível'], correct:1, why:'Em geral há só um líder de custo por setor; brigar por isso sem ser o primeiro leva a uma guerra de preços destrutiva.'},
      {q:'A estratégia de enfoque (foco) consiste em:', a:['Atender todo o mercado com preço médio','Escolher um alvo restrito (nicho, segmento, região) e atendê-lo melhor que todos, por custo ou diferenciação','Copiar o líder do setor','Vender o máximo de produtos diferentes possível'], correct:1, why:'O enfoque concentra-se num alvo restrito, atendido com excelência via custo baixo ou diferenciação naquele recorte.'},
      {q:'Qual das opções NÃO é uma das cinco forças competitivas de Porter?', a:['Poder de barganha dos fornecedores','Ameaça de produtos substitutos','A taxa de inflação do país','Rivalidade entre os concorrentes atuais'], correct:2, why:'A inflação é uma força do macroambiente, não uma das cinco forças setoriais (entrantes, substitutos, fornecedores, compradores e rivalidade).'}

  /* === MÓDULO 01 (Raio-X) — Crescimento, Fusões & Alianças === */
  {
    id:'estrategia-crescimento', icon:'📈', glyph:'🌐', group:'raiox',
    title:'Crescimento, Fusões & Alianças',
    short:'Três vetores para crescer: por dentro, comprando ou se fundindo, ou aliando-se a quem te complementa.',

    steps:[
      {id:'cr1', kind:'conceito', title:'Crescimento interno: crescer por dentro', body:`
        <p>No <b>crescimento interno</b>, a empresa se desenvolve a partir dos próprios recursos, ampliando operações pela expansão do produto ou do mercado. Costuma vir de quatro movimentos:</p>
        <ul>
          <li><b>Mais vendas do produto atual no mesmo mercado</b> — via promoção ou novos usos (ex.: uma marca de café passa a vender o mesmo café gelado para crescer no verão).</li>
          <li><b>Novos produtos em mercados existentes</b> — produtos similares que ampliam a oferta (ex.: quem vende chocolate passa a vender milk-shake).</li>
          <li><b>Produto atual em novos mercados</b> — o "desenvolvimento de mercado" (ex.: celulares mais acessíveis para novas regiões).</li>
          <li><b>Novos serviços e variações</b> — mudanças de cor, tamanho, forma ou serviços agregados ao produto existente.</li>
        </ul>
        <div class="callout"><span class="ic">🧭</span><div>É eficiente porque depende do seu posicionamento, mas é <b>vulnerável</b>: um movimento do concorrente ou uma mudança de demanda pode travar o crescimento. Por isso, vale ter mais de um vetor no radar.</div></div>
      `},
      {id:'cr2', kind:'conceito', title:'Fusões, aquisições e alianças', body:`
        <p>Quando crescer por dentro não basta, entram os movimentos com outras empresas:</p>
        <h4>Fusões e aquisições (M&A)</h4>
        <ul>
          <li><b>Fusão</b> — duas empresas, em geral de porte parecido, unem forças e formam um novo negócio ("fusão de iguais").</li>
          <li><b>Aquisição</b> — uma empresa compra outra, normalmente menor, que pode ser absorvida ou virar subsidiária.</li>
          <li>A lógica é a <b>sinergia</b>: juntas valem mais do que separadas (1 + 1 maior que 2). Podem ser <b>horizontais</b> (mesma atividade) ou <b>verticais</b> (níveis diferentes da cadeia). A <b>gestão da mudança</b> é o que decide o sucesso.</li>
        </ul>
        <h4>Alianças e parcerias estratégicas</h4>
        <p>Aqui as empresas <b>cooperam sem criar uma nova entidade</b> (diferente de uma joint venture). A aliança costuma trazer quatro tipos de vantagem:</p>
        <ul>
          <li><b>Organizacionais</b> — aprender habilidades e ganhar capacidade do parceiro.</li>
          <li><b>Econômicas</b> — reduzir custos e riscos, ganhar escala.</li>
          <li><b>Estratégicas</b> — cooperar com rivais, integrar a cadeia, acelerar P&D.</li>
          <li><b>Políticas</b> — entrar em novos mercados e ganhar influência.</li>
        </ul>
      `},
      {id:'cr3', kind:'pratica', title:'Qual é o seu vetor agora?', body:`
        <p>Não existe vetor "melhor" — existe o certo para o seu <b>momento</b> e os seus <b>recursos</b>:</p>
        <ul>
          <li><b>Interno</b> — quando produto e mercado ainda têm espaço e você cresce com o que tem.</li>
          <li><b>Fusão/Aquisição</b> — quando comprar ou se unir acelera o que levaria anos para construir.</li>
          <li><b>Aliança</b> — quando alguém te complementa e cooperar é mais rápido (e barato) que fazer sozinho.</li>
        </ul>
        <div class="callout"><span class="ic">📅</span><div>Escolha o seu vetor principal para os próximos 12 meses e a primeira ação dele. Salve no <b>Plano 30d</b>.</div></div>
      `}
    ],
    quiz:[
      {q:'Qual a diferença essencial entre fusão e aquisição?', a:['São exatamente a mesma coisa','Na fusão, duas empresas se unem formando um novo negócio; na aquisição, uma empresa compra outra (geralmente menor)','Fusão é sempre entre concorrentes; aquisição, nunca','Aquisição cria uma nova empresa; fusão, não'], correct:1, why:'Fusão une duas empresas em um novo negócio; aquisição é a compra de uma empresa por outra.'},
      {q:'Um exemplo de crescimento INTERNO é:', a:['Comprar um concorrente','Fundir-se com outra empresa','Vender o mesmo produto de uma nova forma (ex.: café gelado no verão) para aumentar as vendas','Formar uma aliança com um fornecedor'], correct:2, why:'Crescimento interno usa os próprios recursos — como dar novos usos ao produto atual para vender mais.'},
      {q:'O que diferencia uma aliança estratégica de uma joint venture?', a:['A aliança cria uma nova empresa; a joint venture, não','Na aliança, as empresas cooperam sem formar uma nova entidade, permanecendo separadas','Aliança só existe entre concorrentes','Não há diferença'], correct:1, why:'Na aliança as empresas colaboram mas permanecem separadas e distintas; não criam uma nova entidade.'},
      {q:'A "sinergia" buscada em fusões e aquisições significa:', a:['Reduzir o número de clientes','Que as duas empresas juntas valem mais do que separadas','Vender uma das empresas rapidamente','Eliminar a concorrência por lei'], correct:1, why:'Sinergia é o princípio de que as empresas juntas geram mais valor do que separadas.'}

    steps:[
      {id:'gv1', kind:'conceito', title:'O que é governança corporativa', body:`
        <p>Segundo o <b>IBGC</b>, governança corporativa é o <b>sistema pelo qual as empresas são dirigidas, monitoradas e incentivadas</b>, envolvendo a relação entre sócios, conselho de administração, diretoria, órgãos de fiscalização e demais partes interessadas.</p>
        <p>Ela nasceu para resolver o chamado <b>"conflito de agência"</b>: quando o sócio (dono) delega ao administrador a decisão sobre a empresa, é preciso um sistema que alinhe os interesses dos dois e dê confiança a quem está de fora.</p>
        <div class="callout"><span class="ic">🛡</span><div>Boa governança gera um <b>ambiente de confiança</b> — interno (sócios, equipe) e externo (clientes, financiadores). É o que permite a empresa crescer sem depender do improviso de uma só pessoa.</div></div>
      `},
      {id:'gv2', kind:'conceito', title:'Quatro princípios e as ferramentas de controle', body:`
        <p>O Código do IBGC se apoia em <b>quatro princípios básicos</b>:</p>
        <ul>
          <li><b>Transparência</b> — disponibilizar às partes interessadas as informações de seu interesse, não só as obrigatórias por lei.</li>
          <li><b>Equidade</b> — tratamento justo e igualitário entre sócios e demais partes interessadas.</li>
          <li><b>Prestação de contas (accountability)</b> — prestar contas com clareza e <b>assumir as consequências</b> de atos e omissões.</li>
          <li><b>Responsabilidade corporativa</b> — zelar pela viabilidade econômica do negócio, ampliando o impacto positivo e reduzindo o negativo.</li>

        <h4>As ferramentas que dão controle</h4>
        <ul>
          <li><b>Conselho de administração</b> — órgão de decisão estratégica; faz o elo entre sócios e diretoria e monitora a gestão.</li>
          <li><b>Auditoria independente</b> — assegura a confiabilidade das informações.</li>
          <li><b>Conselho fiscal</b> — fiscalização independente dos administradores, em nome dos sócios.</li>
        </ul>
      `},
      {id:'gv3', kind:'pratica', title:'Governança mínima para o seu negócio', body:`

          <li><b>Separe</b> o caixa do sócio do caixa da empresa e registre as decisões importantes.</li>

          <li><b>Transparência</b> — informações claras para quem precisa, antes que alguém precise pedir.</li>
          <li><b>Responsabilidade</b> — decisões pensando na saúde do negócio no longo prazo, não só no mês.</li>
        </ul>
        <div class="callout"><span class="ic">📅</span><div>Escolha <b>um</b> dos quatro princípios para fortalecer neste mês e defina o primeiro passo concreto. Salve no <b>Plano 30d</b>.</div></div>
      `}

    quiz:[

      {q:'O "conflito de agência" que a governança busca resolver acontece quando:', a:['Dois sócios discutem o nome da empresa','O sócio delega ao administrador a decisão sobre a empresa, e é preciso alinhar interesses e dar confiança','A empresa contrata uma agência de publicidade','Os clientes reclamam do produto'], correct:1, why:'O conflito de agência surge na delegação do sócio ao administrador; a governança alinha interesses e gera confiança.'},
      {q:'A função do conselho fiscal é:', a:['Cuidar do marketing','Exercer a fiscalização independente dos administradores, em nome dos sócios','Contratar funcionários','Definir o preço dos produtos'], correct:1, why:'O conselho fiscal é um mecanismo de fiscalização independente dos administradores, reportando aos sócios.'}

  /* === MÓDULO 05 (Blindagem Financeira) — Administração Financeira & Mercado === */
  {
    id:'financas-admin', icon:'💵', glyph:'🏦', group:'financas',
    title:'Administração Financeira & Mercado',
    short:'O que é finanças, como o dinheiro circula no mercado e quem regula tudo isso — a base para decidir com o bolso.',
    tags:['Finanças','Mercado financeiro','Captação & Alocação'],
    xpReward:160,
    mentor:"Empresa não quebra por falta de vontade — quebra por falta de caixa. Entender finanças não é virar contador: é saber de onde o dinheiro vem, para onde vai e a que custo. Quem domina isso decide com clareza; quem não domina, decide no escuro.",
    steps:[
      {id:'fa1', kind:'conceito', title:'O que é finanças e administração financeira', body:`
        <p>Finanças, em poucas palavras, é a <b>arte e a ciência de gerir o dinheiro</b> (Gitman): os processos, instituições e instrumentos ligados à transferência de recursos entre pessoas, empresas e governo.</p>
        <p>A <b>administração financeira</b> tem uma função central: garantir o melhor processo de <b>captação</b> (financiamento — de onde vem o dinheiro) e de <b>alocação</b> (investimento — para onde ele vai) dos recursos de capital. O objetivo final é <b>criar valor</b> — e isso vale até para organizações sem fins lucrativos, que criam valor ao cumprir sua missão de forma sustentável.</p>
        <div class="callout"><span class="ic">🧭</span><div>A área de finanças se divide em três frentes: <b>mercado financeiro</b>, <b>finanças corporativas</b> (a empresa) e <b>finanças pessoais</b>. Aqui o foco é o dinheiro do seu negócio.</div></div>
      `},
      {id:'fa2', kind:'conceito', title:'O mercado financeiro e quem regula', body:`
        <p>O mercado financeiro é, de forma simples, o "lugar" onde a moeda é negociada. Ele se divide em quatro:</p>
        <ul>
          <li><b>Monetário</b> (open market) — operações de curtíssimo prazo (dias), como um depósito bancário.</li>
          <li><b>Crédito</b> — conecta quem precisa de recursos a quem tem (crédito para capital de giro, aquisição de bens, imobiliário).</li>
          <li><b>Capitais</b> — onde se negociam ações, debêntures e papéis; o investidor vira sócio e participa de lucros (ou prejuízos).</li>
          <li><b>Câmbio</b> — compra e venda de moeda estrangeira, regulado pelo Banco Central.</li>
        </ul>
        <h4>Instituição financeira e os órgãos reguladores</h4>
        <p>A instituição financeira é o <b>intermediário</b>: capta de quem tem dinheiro sobrando (agente superavitário) e empresta a quem precisa (agente deficitário). Para isso ser seguro, existem os reguladores: <b>CMN</b> (órgão superior, define a política da moeda e do crédito), <b>Bacen</b> (zela pela estabilidade da moeda e controla o crédito) e <b>CVM</b> (regula o mercado de capitais).</p>
      `},
      {id:'fa3', kind:'pratica', title:'Onde o seu negócio se posiciona', body:`
        <p>Traga para a sua realidade:</p>
        <ul>
          <li><b>Você é agente deficitário ou superavitário hoje?</b> Precisa captar recursos ou tem caixa para investir?</li>
          <li><b>Qual mercado/instrumento você usa?</b> Crédito para capital de giro? Aplicação no mercado monetário? Cada um tem custo e prazo diferentes.</li>
          <li><b>Você decide com base em número ou no "achismo"?</b> Saber de onde vem e para onde vai o dinheiro muda o jogo.</li>
        </ul>
        <div class="callout"><span class="ic">📅</span><div>Anote no <b>Plano 30d</b>: sua posição (capta ou investe), o instrumento que usa hoje e uma decisão financeira que estava no "achismo" e agora você vai basear em dados.</div></div>
      `}
    ],
    quiz:[
      {q:'A função central da administração financeira é:', a:['Apenas pagar contas em dia','Garantir o melhor processo de captação (financiamento) e alocação (investimento) de recursos, criando valor','Vender o máximo possível','Reduzir a equipe para cortar custos'], correct:1, why:'Administração financeira cuida da captação e da alocação de recursos com o objetivo de criar valor.'},
      {q:'O mercado financeiro se divide em quatro. Qual é o de curtíssimo prazo, também chamado de open market?', a:['Mercado de capitais','Mercado de câmbio','Mercado monetário','Mercado de crédito'], correct:2, why:'O mercado monetário (open market) concentra as operações de curtíssimo prazo, como um depósito bancário.'},
      {q:'Numa instituição financeira, o agente DEFICITÁRIO é aquele que:', a:['Tem dinheiro sobrando para investir','Precisa de recursos (toma emprestado)','Regula o sistema','Emite ações'], correct:1, why:'O agente deficitário precisa de recursos; o superavitário tem recursos sobrando. O banco intermedeia os dois.'},
      {q:'Qual órgão regula especificamente o mercado de capitais (ações, debêntures)?', a:['CMN','Bacen','CVM','Receita Federal'], correct:2, why:'A CVM (Comissão de Valores Mobiliários) regula e fiscaliza o mercado de capitais no Brasil.'}
    ],
    challenge:'Responda em 3 frases: hoje meu negócio é agente ___ (deficitário/superavitário); o instrumento financeiro que mais uso é ___; a decisão financeira que vou tirar do achismo é ___. Salve no Plano 30d.'
  },

  /* === MÓDULO 05 (Blindagem Financeira) — Demonstrações Financeiras === */
  {
    id:'financas-demonstracoes', icon:'📊', glyph:'📑', group:'financas',
    title:'Demonstrações Financeiras',
    short:'Ler o balanço, o resultado e o caixa do seu negócio — e projetar cenários antes de decidir.',
    tags:['Balanço','DRE','Fluxo de Caixa'],
    xpReward:170,
    mentor:"Os números não mentem — mas só falam com quem sabe ouvir. Balanço, DRE e fluxo de caixa contam três histórias diferentes do mesmo negócio. Quem lê as três decide com fato; quem não lê, decide com sorte.",
    steps:[
      {id:'fd1', kind:'conceito', title:'Informação que vira decisão', body:`
        <p>Gerir é decidir, e decidir exige <b>informação</b>. Para servir à decisão, a informação gerencial precisa de três qualidades: <b>confiabilidade</b> (refletir a realidade), <b>abrangência</b> (dar a visão completa) e <b>tempestividade</b> (chegar na hora certa).</p>
        <p>Entre todas as informações de um negócio, as <b>demonstrações financeiras</b> são as principais. Elas evidenciam como o lucro foi formado, onde a empresa investe e como ela se financia.</p>
        <div class="callout"><span class="ic">⚖️</span><div>Por lei (6.404/76, estendida pela 11.638/07), sociedades por ações e empresas de grande porte são obrigadas a publicar demonstrações. Mesmo sem ser obrigado, todo negócio deveria ter as suas — é assim que se enxerga a saúde real.</div></div>
      `},
      {id:'fd2', kind:'conceito', title:'As principais demonstrações', body:`
        <p>Cada demonstração conta uma parte da história:</p>
        <ul>
          <li><b>Balanço Patrimonial (BP)</b> — a "foto" do negócio numa data: o <b>ativo</b> (bens e direitos = onde o recurso está aplicado) e o <b>passivo</b> (obrigações = de onde o recurso veio), mais o patrimônio líquido.</li>
          <li><b>DRE (Resultado do Exercício)</b> — o "filme" do período: receitas menos custos e despesas, revelando o <b>lucro ou prejuízo</b>.</li>
          <li><b>DFC (Fluxo de Caixa)</b> — como o dinheiro de fato entrou e saiu (recebimentos e pagamentos). Lucro não é caixa: dá para ter lucro no papel e faltar dinheiro.</li>
          <li><b>DLPA</b> e <b>DVA</b> — variações do lucro acumulado e a riqueza gerada e distribuída pela empresa.</li>
        </ul>
      `},
      {id:'fd3', kind:'pratica', title:'Projetar antes de decidir', body:`
        <p>As <b>demonstrações projetadas</b> usam os mesmos procedimentos das reais — a diferença é que as reais olham o passado (o que ocorreu) e as projetadas olham o <b>futuro possível</b> (o que pode ocorrer se as metas forem cumpridas).</p>
        <p>Projetar uma DRE, por exemplo, mostra qual seria o lucro ao fim do ano se o plano der certo — e permite <b>comparar estratégias</b> antes de gastar o dinheiro de verdade.</p>
        <div class="callout"><span class="ic">📅</span><div>Escolha <b>uma</b> das três demonstrações (BP, DRE ou caixa) que hoje você não acompanha e comprometa-se a montar a sua neste mês. Salve no <b>Plano 30d</b>.</div></div>
      `}
    ],
    quiz:[
      {q:'O Balanço Patrimonial apresenta o ativo e o passivo. O ATIVO representa:', a:['As obrigações da empresa','Os bens e direitos (onde os recursos estão aplicados)','Apenas o lucro do período','As vendas do mês'], correct:1, why:'No balanço, o ativo reúne bens e direitos (aplicações de recursos); o passivo são as obrigações (origens dos recursos).'},
      {q:'Qual demonstração revela o lucro ou prejuízo do período, a partir de receitas, custos e despesas?', a:['Balanço Patrimonial','DRE (Demonstração do Resultado do Exercício)','DFC (Fluxo de Caixa)','DVA'], correct:1, why:'A DRE apura o lucro ou prejuízo do exercício com base em receitas, custos e despesas.'},
      {q:'Por que lucro não é a mesma coisa que caixa?', a:['Porque lucro é sempre maior que o caixa','Porque o fluxo de caixa mostra o dinheiro que de fato entrou e saiu; é possível ter lucro no papel e faltar dinheiro','Porque caixa só existe em grandes empresas','Não há diferença entre os dois'], correct:1, why:'A DRE registra o resultado pelo regime de competência; o caixa (DFC) mostra a movimentação real. Dá para ter lucro e faltar caixa.'},
      {q:'A diferença entre uma demonstração REAL e uma PROJETADA é que:', a:['A projetada é sempre mais precisa','A real se baseia em fatos passados; a projetada considera fatos futuros possíveis (se as metas forem cumpridas)','A real é opcional e a projetada é obrigatória','Não há diferença de método'], correct:1, why:'As reais retratam o que já ocorreu; as projetadas estimam o futuro possível com base em metas e cenários.'}
    ],
    challenge:'Escolha uma demonstração que você ainda não acompanha (Balanço, DRE ou Fluxo de Caixa) e monte uma versão simples do seu negócio neste mês. Anote o primeiro número que te surpreendeu. Salve no Plano 30d.'
  },

  /* === MÓDULO 05 (Blindagem Financeira) — Fontes de Financiamento === */
  {
    id:'financas-financiamento', icon:'💳', glyph:'🏦', group:'financas',
    title:'Fontes de Financiamento',
    short:'Quando, por que e como captar recursos — capital de giro, curto vs longo prazo e o equilíbrio entre risco e custo.',
    tags:['Capital de giro','Curto x Longo prazo','Risco x Custo'],
    xpReward:170,
    mentor:"Pegar dinheiro não é fraqueza — é ferramenta. O erro é pegar a fonte errada para a necessidade errada: financiar o dia a dia com dívida cara, ou travar caixa que precisava girar. Casar a fonte com a necessidade é o que protege a empresa.",
    steps:[
      {id:'ff1', kind:'conceito', title:'Que necessidade você está financiando?', body:`
        <p>Antes de captar, identifique a <b>necessidade</b>. Ela pode ser:</p>
        <ul>
          <li><b>De longo prazo / permanente</b> — financia os ativos permanentes (máquinas, sede) e a parcela fixa do giro.</li>
          <li><b>De curto prazo / sazonal</b> — cobre os ativos circulantes que oscilam no ano (estoques, contas a receber).</li>
        </ul>
        <p>Dois conceitos-chave do curto prazo: <b>Capital de Giro</b> (os recursos para a empresa funcionar no dia a dia — estoque, fornecedores, salários, impostos) e <b>Capital Circulante Líquido (CCL)</b> = ativos circulantes menos passivos circulantes. Quanto maior o CCL, menor o risco de não honrar obrigações; quanto menor, mais lucratividade — e mais risco.</p>
      `},
      {id:'ff2', kind:'conceito', title:'Curto x longo prazo, risco x custo', body:`
        <p>Há dois estilos de financiar o giro:</p>
        <ul>
          <li><b>Arrojado</b> — financia o giro com recursos de curto prazo. Costuma ser <b>mais barato</b> em juros, porém <b>mais arriscado</b> (e mais lucrativo).</li>
          <li><b>Conservador</b> — usa longo prazo até para cobrir o giro. <b>Mais seguro</b>, porém costuma sair <b>mais caro</b> em juros, porque o longo prazo embute mais risco para quem empresta.</li>
        </ul>
        <h4>No longo prazo, o credor pede garantias</h4>
        <p>Financiamentos longos (expansão, sede, equipamentos) envolvem valores altos e vêm com <b>cláusulas</b> (padronizadas e restritivas) e <b>garantias</b>: empréstimo garantido (o próprio bem como garantia), colateral, ou não garantido. Linhas de longo prazo para investimento costumam passar por instituições como o <b>BNDES</b>.</p>
      `},
      {id:'ff3', kind:'pratica', title:'Casar a fonte com a necessidade', body:`
        <p>A regra de ouro: <b>não financie necessidade de longo prazo com dívida de curto prazo</b> (e vice-versa, quando o custo não compensa). Antes de assinar:</p>

  {id:'equilibrio', icon:'🎯', mod:'financas', title:'Calculadora de Ponto de Equilíbrio',
   desc:'Informe faturamento e custos — a ferramenta diz quanto você precisa vender só para não ter prejuízo.',
   intro:'Em 3 números, descubra o seu ponto de equilíbrio: o faturamento mínimo para o negócio se pagar.',
   steps:[
     {k:'receita',type:'number',q:'Faturamento mensal médio (R$)',ph:'Ex.: 30000'},
     {k:'cvar',type:'number',q:'Custos variáveis mensais (R$)',ph:'Ex.: 12000',hint:'Matéria-prima, comissões, taxas de cartão — o que varia com as vendas.'},
     {k:'cfix',type:'number',q:'Custos fixos mensais (R$)',ph:'Ex.: 10000',hint:'Aluguel, salários, contas fixas.'}
   ],
   build:(d)=>{
     const rec=+d.receita||0,cv=+d.cvar||0,cf=+d.cfix||0;
     if(rec<=0||rec<=cv) return '<p>Informe um faturamento maior que os custos variáveis para calcular.</p>';
     const imc=(rec-cv)/rec; const pe=cf/imc; const folga=rec-pe;
     return `<h4>🎯 Ponto de equilíbrio</h4>
     <div class="metric"><b>Margem de contribuição</b><span>${(imc*100).toFixed(0)}%</span></div>
     <div class="metric"><b>Ponto de equilíbrio (mês)</b><span class="big" style="font-size:18px">${tgMoney(pe)}</span></div>
     <div class="metric"><span>Seu faturamento hoje</span><b>${tgMoney(rec)}</b></div>
     <div class="tg-flag ${folga>=0?'good':'warn'}">${folga>=0?`Você está ACIMA do equilíbrio — sobram ${tgMoney(folga)} depois de cobrir os custos. 👏`:`Você está ABAIXO do equilíbrio. Faltam ${tgMoney(-folga)} de faturamento por mês só para empatar. Foque em vender mais ou cortar custo fixo.`}</div>
     <p class="tg-hint">Margem = (faturamento − custos variáveis) ÷ faturamento. Ponto de equilíbrio = custo fixo ÷ margem.</p>`;
   }}

const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const el = (t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};

let saveTimer=null;
async function save(){ clearTimeout(saveTimer); saveTimer=setTimeout(async()=>{ await Store.set(KEY, JSON.stringify(S)); if(window.OB) OB.push(S); }, 250); }

function levelForXp(xp){ let lv=1; for(let i=0;i<LEVELS.length;i++){ if(xp>=LEVELS[i]) lv=i+1; } return Math.min(lv, LEVELS.length); }
function xpInLevel(xp){ const lv=levelForXp(xp); const lo=LEVELS[lv-1]??0; const hi=LEVELS[lv]??(lo+1000); return {lo,hi,pct: Math.min(100, Math.round(((xp-lo)/(hi-lo))*100))}; }

function addXp(amount, label){
  const before=S.level;
  S.xp+=amount;
  const lv=levelForXp(S.xp);
  S.log.unshift({t:Date.now(), type:'xp', label:`+${amount} XP — ${label}`});
  if(lv>before){ S.level=lv; setTimeout(()=>levelUpModal(lv), 400); }
  S.level=lv;
  toast('', `+${amount} XP`, label);
  checkTrophies();
  save(); renderTop();
}

function grantTrophy(id){
  if(S.trophies[id]) return false;
  S.trophies[id]=Date.now();
  const t=TROPHIES.find(x=>x.id===id);
  S.log.unshift({t:Date.now(), type:'trophy', label:`Conquista: ${t.title}`});
  pushNotif(t.em, 'Conquista desbloqueada', t.title);
  setTimeout(()=>toast(t.em, 'Conquista desbloqueada!', t.title), 700);
  save();
  return true;
}

function pushNotif(em,title,sub){
  S.notifs.unshift({t:Date.now(), em, title, sub, read:false});
  if(S.notifs.length>40) S.notifs.length=40;
  renderTop();
}

function checkTrophies(){
  const doneModules = MODULES.filter(m=>S.modules[m.id]?.completed).length;
  const anyStep = MODULES.some(m=>S.modules[m.id]?.steps && Object.keys(S.modules[m.id].steps).length>0);
  if(anyStep) grantTrophy('first_step');
  if(doneModules>=1) grantTrophy('first_module');
  if(doneModules>=3) grantTrophy('three_modules');
  if(doneModules>=Math.ceil(MODULES.length/2)) grantTrophy('half_way');
  if(doneModules>=MODULES.length) grantTrophy('all_modules');
  if(S.level>=5) grantTrophy('level5');
  if(MODULES.some(m=>S.modules[m.id]?.quiz?.score===S.modules[m.id]?.quiz?.total && S.modules[m.id]?.quiz?.total>0)) grantTrophy('quiz_perfect');
  if(Object.keys(S.surveys).length>0) grantTrophy('survey_done');
  if(Object.keys(S.surveys).length>=SURVEYS.length) grantTrophy('all_surveys');
  if(Object.keys(S.tools).length>0) grantTrophy('tool_used');
  if(Object.keys(S.tools).length>=TOOLS.length) grantTrophy('all_tools');
  if(MODULES.some(m=>S.modules[m.id]?.challengeDone)) grantTrophy('challenger');
  if(S.diary.length>0) grantTrophy('reflective');
  if(S.plan.length>0) grantTrophy('planner');
  if(S.diagnostic) grantTrophy('diagnosed');
  if(S.streak>=3) grantTrophy('streak3');
  if(S.streak>=7) grantTrophy('streak7');
}

/* ---------- streak (ofensiva de dias) ---------- */
function dayKey(t){ const d=new Date(t); return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate(); }
function touchStreak(){
  const today=dayKey(Date.now());
  if(S.lastActive===today) return; // já contou hoje
  const yest=dayKey(Date.now()-86400000);
  if(S.lastActive===yest){ S.streak=(S.streak||0)+1; }
  else if(S.lastActive){ // quebrou
    if(S.streak>=1){ pushNotif('','Que bom te ver de volta','Sua jornada continua de onde parou.'); grantTrophy('comeback'); }
    S.streak=1;
  } else { S.streak=1; }
  S.lastActive=today;
  checkTrophies(); save();
}

/* unlock: módulo i exige módulo i-1 completo (primeiro sempre livre) */
function isUnlocked(idx){
  const m=MODULES[idx];
  const earlier=MODULES.filter((x,i)=>i<idx && x.group===m.group);
  if(earlier.length===0) return true;            // 1ª trilha do módulo: sempre liberada
  const prev=earlier[earlier.length-1];           // trilha anterior DENTRO do mesmo módulo
  return !!S.modules[prev.id]?.completed;
}

/* ---------- toasts ---------- */
function toast(em, title, sub){
  const z=$('#toastZone');
  const t=el('div','toast',`<span class="em">${em}</span><div><b>${title}</b>${sub?`<small>${sub}</small>`:''}</div>`);
  z.appendChild(t);
  setTimeout(()=>{ t.style.transition='.4s'; t.style.opacity='0'; t.style.transform='translateY(10px)'; setTimeout(()=>t.remove(),400); }, 3200);
}

function go(view){
  if(view!=='lesson') current=view;
  if(PRIMARY.includes(view)) lastPrimary=view;
  $$('.view').forEach(v=>v.classList.remove('active'));
  const vEl=$('#view-'+view); vEl.classList.add('active');
  vEl.classList.remove('view-in'); void vEl.offsetWidth; vEl.classList.add('view-in');
  syncChrome(view);
  window.scrollTo({top:0,behavior:'smooth'});
  S.visited[view]=true; touchStreak(); save();
  if(typeof afGuiaUpdate==='function') afGuiaUpdate();
  if(view==='home'){ renderHome(); if(typeof bHomeHook==='function') bHomeHook(); }
  if(view==='bussola') renderBussola();
  if(view==='trilhas') renderTrilhas();
  if(view==='ferramentas') renderFerramentas();
  if(view==='gestao') renderGestao();
  if(view==='pesquisas') renderPesquisas();
  if(view==='diario') renderDiario();
  if(view==='plano') renderPlano();
  if(view==='conquistas') renderConquistas();
  if(view==='mentora') renderMentora();
  if(view==='menu') renderMenu();
}

// Barra inferior (tab bar nativa) + estado do topo contextual
function syncChrome(view){
  const activeTab = PRIMARY.includes(view) ? view
                  : (OVERFLOW.includes(view) ? 'menu' : lastPrimary);
  $$('#appnav .anav').forEach(t=>t.classList.toggle('active', t.dataset.v===activeTab));
  const back=$('#topBack'), brand=$('#brand'), title=$('#screenTitle');
  if(!back||!brand||!title) return;
  const isRoot = PRIMARY.includes(view);
  if(view==='home'){
    back.style.display='none'; brand.style.display=''; title.style.display='none';
  } else if(isRoot){
    back.style.display='none'; brand.style.display='none';
    title.style.display=''; title.textContent=NAV_TITLE[view]||'';
  } else {
    back.style.display=''; brand.style.display='none';
    title.style.display=''; title.textContent=NAV_TITLE[view]||'';
  }
}

function greeting(){ const h=new Date().getHours(); return h<12?'Bom dia':h<18?'Boa tarde':'Boa noite'; }
function mantraOfDay(){ const d=new Date(); const seed=d.getFullYear()*1000+ (d.getMonth()*31+d.getDate()); return MANTRAS[seed % MANTRAS.length]; }
function nextActionCard(){

  else if(done<total){ let ni=MODULES.findIndex((m,i)=>isUnlocked(i)&&!S.modules[m.id]?.completed); if(ni<0)ni=0; const m=MODULES[ni];

  else if(!S.retake){ icon=''; title='Meça sua evolução'; desc='Você concluiu todas as trilhas! Refaça o diagnóstico e veja o quanto avançou desde o início.'; btn='Ver minha evolução'; act="finishJourney()"; }

function homeMentorTip(done,total){
  if(done===0) return 'Não tente decorar tudo. Comece pela primeira trilha, aplique uma coisa no seu dia, e volte. Conhecimento que não vira prática evapora.';
  if(done===total) return 'Você percorreu a constelação inteira. Agora o verdadeiro trabalho: liderar pessoas com isso. Volte às ferramentas sempre que precisar de um norte.';
  if(done>=total/2) return 'Você já passou da metade. Repare como os temas conversam: clima revela cultura, conflito pede negociação, motivação sustenta liderança. Tudo é um sistema.';
  return 'Belo começo. Use as ferramentas práticas enquanto aprende — é nelas que a teoria vira competência de verdade.';
}
function renderLog(){
  if(!S.log.length) return '<p class="muted tiny" style="margin:0">Suas conquistas e avanços aparecerão aqui conforme você avança.</p>';
  return '<div style="display:flex;flex-direction:column;gap:2px">'+S.log.slice(0,8).map(e=>{
    const ic = e.type==='trophy'?'':e.type==='xp'?'':e.type==='start'?'':e.type==='module'?'':e.type==='survey'?'':e.type==='tool'?'':e.type==='diary'?'':'•';
    return `<div style="display:flex;gap:11px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-soft)">
      <span style="font-size:16px">${ic}</span>
      <span style="flex:1;font-size:13.5px">${e.label}</span>
      <span class="tiny muted">${timeAgo(e.t)}</span></div>`;
  }).join('')+'</div>';
}
function timeAgo(t){ const s=Math.floor((Date.now()-t)/1000); if(s<60)return 'agora'; const m=Math.floor(s/60); if(m<60)return m+'min'; const h=Math.floor(m/60); if(h<24)return h+'h'; return Math.floor(h/24)+'d'; }

/* ===================================================================
   TRILHAS
   =================================================================== */
function moduleStatus(m,idx){
  if(!isUnlocked(idx)) return 'lock';
  if(S.modules[m.id]?.completed) return 'done';
  if(S.modules[m.id]?.steps && Object.keys(S.modules[m.id].steps).length>0) return 'prog';
  return 'open';
}
function moduleProgress(m){
  const st=S.modules[m.id]; if(!st) return 0;
  const totalSteps=m.steps.length+1; // +quiz
  let done=st.steps?Object.keys(st.steps).length:0;
  if(st.quiz?.done) done++;
  return Math.round((done/totalSteps)*100);
}
/* ---------- MÓDULOS: agrupamento alinhado à vitrine da Cakto ----------

/* Alinhamento dos módulos à vitrine da Cakto (Raio-X / Descompressão / Liderança) */
const MOD_MAP = {
  'estrategia-empresarial':'raiox', 'estrategia-decisorio':'raiox', 'estrategia-ambientes':'raiox',

MODULES.forEach(m=>{ m.group = MOD_MAP[m.id] || m.group || 'lideranca'; });
const GROUPS = [

  {id:'engenharia',    n:'04', icon:'⚙️', title:'Engenharia de Processos',   desc:'Organizar o funcionamento e o controle da empresa — governança e estrutura que rodam sem depender de você.', status:'open'},

let trilhaQuery='';
function renderTrilhas(){

    return `<div class="mod-band">

  <div class="search-wrap"><span class="ic"></span><input class="in search-in" id="trilhaSearch" placeholder="Buscar tema, trilha ou tag…" value="${escAttr(trilhaQuery)}" oninput="filterTrilhas(this.value)"></div>

  ${signature()}`;
  if(trilhaQuery) filterTrilhas(trilhaQuery);
}
function trilhaCard(m,idx){
  const st=moduleStatus(m,idx);
  const prog=moduleProgress(m);
  const badge = st==='done'?'<span class="badge-status st-done">Concluída</span>'
    : st==='prog'?'<span class="badge-status st-prog">Em andamento</span>'
    : st==='lock'?'<span class="badge-status st-lock">Bloqueada</span>'
    : '<span class="badge-status st-prog" style="opacity:.7">Disponível</span>';
  const key=(m.title+' '+m.short+' '+(m.tags||[]).join(' ')).toLowerCase();
  return `<div class="module" data-key="${escAttr(key)}">
      ${st==='done'?'<div class="ribbon">FEITA</div>':''}
      <div class="top">
        <div class="num">TRILHA ${String(idx+1).padStart(2,'0')}</div>
        <h3>${m.icon} ${m.title}</h3>
        <div class="desc">${m.short}</div>
        <div class="pill-row" style="margin-top:12px">${(m.tags||[]).map(t=>`<span class="pill">${t}</span>`).join('')}</div>
      </div>
      <div class="meta">
        <span>${m.steps.length} aulas</span>
        <span>${m.quiz.length} quiz</span>
        <span class="pill amber" style="margin-left:auto">+${m.xpReward} XP</span>
      </div>
      <div class="barwrap"><div class="bar"><i style="width:${prog}%"></i></div></div>
      <div class="foot">${badge}
        <button class="btn ${st==='done'?'ghost':'primary'} sm" ${st==='lock'?'disabled':''} onclick="openLesson('${m.id}')">${st==='done'?'Revisar':st==='prog'?'Continuar':'Abrir'}</button>
      </div>
      ${st!=='lock' && DEEP_TESTS[m.id]?`<button class="btn ghost sm" style="width:100%;justify-content:center;margin-top:10px" onclick="openDeepTest('${m.id}')">Teste Profundo${S.deepTests?.[m.id]?.at?' · feito ✓':''}</button>`:''}
      ${st!=='lock'?`<button class="btn sage sm" style="width:100%;justify-content:center;margin-top:8px" onclick="applyTrilha('${m.id}')">Aplicar na prática${S.modules[m.id]?.challengeDone?' ✓':''}</button>`:''}
      ${st==='lock'?`<div class="lockwrap"><div class="lk"><div class="ic"></div><small>Conclua a trilha anterior para desbloquear.</small></div></div>`:''}
    </div>`;
}
function escAttr(s){ return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }
function filterTrilhas(q){
  trilhaQuery=q||'';
  const s=(q||'').trim().toLowerCase();
  document.querySelectorAll('#view-trilhas .module[data-key]').forEach(c=>{
    c.style.display = (!s || c.dataset.key.includes(s)) ? '' : 'none';
  });
}

/* ===================================================================
   LESSON (trilha aberta)
   =================================================================== */
let lessonStep=0; // 0..steps.length-1 = aulas; steps.length = quiz
function openLesson(id){
  lessonModuleId=id; lessonStep=0;
  if(!S.modules[id]) S.modules[id]={steps:{},quiz:null,completed:false};
  go('lesson');
  renderLesson();
}
function renderLesson(){
  const m=MODULES.find(x=>x.id===lessonModuleId);
  const idx=MODULES.findIndex(x=>x.id===lessonModuleId);
  const st=S.modules[m.id];
  const v=$('#view-lesson');
  v.innerHTML=`
  <button class="btn ghost sm" onclick="go('trilhas')">← Todas as trilhas</button>
  <div class="lesson-head" style="margin-top:18px">
    <div class="glyph">${m.glyph}</div>
    <div style="flex:1;min-width:240px">
      <div class="num" style="font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--mute-2)">TRILHA ${String(idx+1).padStart(2,'0')} · +${m.xpReward} XP</div>
      <h1 class="page" style="font-size:30px;margin:6px 0 6px">${m.title}</h1>
      <p class="muted" style="margin:0">${m.short}</p>
    </div>
  </div>

  <div class="mentor-note">
    <div class="ava">CC</div>
    <div class="mn-body"><b>${MENTOR_NAME} orienta</b><p>"${m.mentor}"</p></div>
  </div>

  <div class="grid" style="grid-template-columns:300px 1fr;gap:22px;align-items:start" id="lessonGrid">
    <div class="card" style="position:sticky;top:120px">
      <div class="steps" id="stepsList"></div>
    </div>
    <div id="stepContent"></div>
  </div>
  ${signature()}`;
  // responsive: stack on small
  if(window.innerWidth<820){ $('#lessonGrid').style.gridTemplateColumns='1fr'; $('#stepsList').parentElement.style.position='static'; }
  renderStepsList();
  renderStepContent();
}
function renderStepsList(){
  const m=MODULES.find(x=>x.id===lessonModuleId);
  const st=S.modules[m.id];
  const list=$('#stepsList'); list.innerHTML='';
  m.steps.forEach((s,i)=>{
    const done=!!st.steps[s.id];
    const e=el('div','step'+(i===lessonStep?' active':'')+(done?' done':''));
    e.innerHTML=`<div class="dot">${done?'✓':i+1}</div>
      <div class="stepbody"><div class="kind">${s.kind}</div><b>${s.title}</b></div>
      <span class="arrow">→</span>`;
    e.onclick=()=>{ lessonStep=i; renderStepsList(); renderStepContent(); window.scrollTo({top:300,behavior:'smooth'}); };
    list.appendChild(e);
  });
  // quiz step
  const qi=m.steps.length;
  const qdone=st.quiz?.done;
  const e=el('div','step'+(lessonStep===qi?' active':'')+(qdone?' done':''));
  e.innerHTML=`<div class="dot">${qdone?'✓':''}</div>
    <div class="stepbody"><div class="kind">quiz</div><b>Quiz da trilha</b></div><span class="arrow">→</span>`;
  e.onclick=()=>{ lessonStep=qi; renderStepsList(); renderStepContent(); window.scrollTo({top:300,behavior:'smooth'}); };
  list.appendChild(e);
}
function renderStepContent(){
  const m=MODULES.find(x=>x.id===lessonModuleId);
  const st=S.modules[m.id];
  const c=$('#stepContent');
  if(lessonStep<m.steps.length){
    const s=m.steps[lessonStep];
    const done=!!st.steps[s.id];
    c.innerHTML=`<div class="card pad-lg">
      <p class="eyebrow">${s.kind} · aula ${lessonStep+1} de ${m.steps.length}</p>
      <h2 class="sec" style="margin:0 0 14px">${s.title}</h2>
      <div class="content-block">${s.body}</div>
      <div class="divider"></div>
      <div class="btn-row">
        ${lessonStep>0?`<button class="btn ghost sm" onclick="prevStep()">← Anterior</button>`:''}
        <button class="btn ${done?'ghost':'sage'} sm" onclick="completeStep('${s.id}')">${done?'✓ Concluída':'Marcar como lida (+'+stepXp(m)+' XP)'}</button>
        <button class="btn primary sm" onclick="nextStep()" style="margin-left:auto">Próxima →</button>
      </div>
    </div>`;
  } else {
    renderQuiz();
  }
}
function stepXp(m){ return Math.round(m.xpReward*0.18); }
function prevStep(){ if(lessonStep>0){lessonStep--; renderStepsList(); renderStepContent(); window.scrollTo({top:300,behavior:'smooth'});} }
function nextStep(){ const m=MODULES.find(x=>x.id===lessonModuleId); if(lessonStep<m.steps.length){lessonStep++; renderStepsList(); renderStepContent(); window.scrollTo({top:300,behavior:'smooth'});} }
function completeStep(sid){
  const m=MODULES.find(x=>x.id===lessonModuleId);
  const st=S.modules[m.id];
  if(!st.steps[sid]){ st.steps[sid]=true; addXp(stepXp(m), `Aula concluída — ${m.title}`); }
  renderStepsList(); renderStepContent();
}

/* ---------- quiz ---------- */
let quizAnswers={};
function renderQuiz(){
  const m=MODULES.find(x=>x.id===lessonModuleId);
  const st=S.modules[m.id];
  quizAnswers={};
  const allStepsDone=m.steps.every(s=>st.steps[s.id]);
  const c=$('#stepContent');
  c.innerHTML=`<div class="card pad-lg">
    <p class="eyebrow">Quiz · fixação</p>
    <h2 class="sec" style="margin:0 0 6px">Quiz da trilha ${m.title}</h2>
    <p class="muted tiny" style="margin:0 0 20px">Responda para fixar. ${!allStepsDone?'<b style="color:var(--amber)">Dica: leia as aulas antes para garantir o gabarito.</b>':'Você já leu todas as aulas — mostre o que aprendeu.'}</p>
    <div id="quizForm"></div>
    <div class="divider"></div>
    <button class="btn primary" id="quizSubmit" onclick="submitQuiz()">Conferir respostas</button>
    <div id="quizResult"></div>
  </div>`;
  const qf=$('#quizForm');
  m.quiz.forEach((q,qi)=>{
    const block=el('div','quiz-q');
    block.innerHTML=`<div class="qnum">PERGUNTA ${qi+1} / ${m.quiz.length}</div><h4>${q.q}</h4>`;
    q.a.forEach((opt,oi)=>{
      const o=el('div','opt');
      o.innerHTML=`<div class="box"></div><div class="txt">${opt}</div>`;
      o.onclick=()=>{ if(st.quiz?.done) return; quizAnswers[qi]=oi; [...qf.querySelectorAll(`[data-q="${qi}"]`)].forEach(x=>x.classList.remove('sel')); o.classList.add('sel'); };
      o.dataset.q=qi; o.dataset.o=oi;
      block.appendChild(o);
    });
    const fb=el('div','feedback'); fb.dataset.fb=qi; block.appendChild(fb);
    qf.appendChild(block);
  });
  if(st.quiz?.done){ // already done — show result
    showQuizReview(m,st);
  }
}
function submitQuiz(){
  const m=MODULES.find(x=>x.id===lessonModuleId);
  const st=S.modules[m.id];
  if(Object.keys(quizAnswers).length<m.quiz.length){ toast('⚠️','Responda todas','Faltam perguntas para conferir.'); return; }
  let score=0;
  m.quiz.forEach((q,qi)=>{
    const chosen=quizAnswers[qi];
    const opts=$$(`#quizForm .opt[data-q="${qi}"]`);
    opts.forEach(o=>{ o.style.pointerEvents='none'; const oi=+o.dataset.o;
      if(oi===q.correct) o.classList.add('correct');
      if(oi===chosen && oi!==q.correct) o.classList.add('wrong');
    });
    const fb=$(`#quizForm .feedback[data-fb="${qi}"]`);
    const ok=chosen===q.correct; if(ok)score++;
    fb.className='feedback show '+(ok?'ok':'no');
    fb.innerHTML=(ok?'✓ Correto. ':'✗ ')+q.why;
  });
  st.quiz={score,total:m.quiz.length,done:true};
  const bonus = Math.round(m.xpReward*0.4*(score/m.quiz.length))+10;
  addXp(bonus, `Quiz ${m.title} — ${score}/${m.quiz.length}`);
  $('#quizSubmit').style.display='none';
  const r=$('#quizResult');
  r.innerHTML=`<div class="card" style="margin-top:20px;text-align:center;border-color:rgba(245,181,61,.4)">
    <div style="font-size:40px">${score===m.quiz.length?'':score>=m.quiz.length/2?'':''}</div>
    <h3 style="font-family:var(--serif);margin:6px 0">${score}/${m.quiz.length} acertos</h3>
    <p class="muted tiny">${score===m.quiz.length?'Gabaritou! Tiro certeiro.':score>=m.quiz.length/2?'Bom trabalho. Revise os que errou.':'Vale revisar as aulas e tentar fixar melhor.'}</p>
  </div>`;
  maybeCompleteModule(m);
  renderStepsList();
}
function showQuizReview(m,st){
  m.quiz.forEach((q,qi)=>{
    const opts=$$(`#quizForm .opt[data-q="${qi}"]`);
    opts.forEach(o=>{ o.style.pointerEvents='none'; const oi=+o.dataset.o; if(oi===q.correct) o.classList.add('correct'); });
    const fb=$(`#quizForm .feedback[data-fb="${qi}"]`); fb.className='feedback show ok'; fb.innerHTML='✓ '+q.why;
  });
  $('#quizSubmit').style.display='none';
  $('#quizResult').innerHTML=`<div class="card" style="margin-top:20px;text-align:center"><p class="muted" style="margin:0">Você já completou este quiz (${st.quiz.score}/${st.quiz.total}). Gabarito revelado acima.</p></div>`;
}
function maybeCompleteModule(m){
  const st=S.modules[m.id];
  const allSteps=m.steps.every(s=>st.steps[s.id]);
  if(allSteps && st.quiz?.done && !st.completed){
    st.completed=true;
    S.log.unshift({t:Date.now(),type:'module',label:`Trilha concluída: ${m.title}`});
    addXp(m.xpReward, `Trilha completa — ${m.title}`);
    setTimeout(()=>moduleCompleteModal(m),600);
    save();
  } else if(!allSteps){
    setTimeout(()=>toast('','Quase lá','Leia e marque todas as aulas para concluir a trilha.'),300);
  }
}
const APPLY_ACTIONS={
  raiox:['Escrever meu posicionamento em uma frase','Listar o que vou deixar de fazer','Definir a decisão mais importante do mês','Mapear meus 3 maiores gargalos hoje'],
  descompressao:['Definir o perfil da próxima contratação','Mapear o que só eu faço hoje','Delegar 1 tarefa esta semana','Montar um plano de treinamento para 1 pessoa'],
  lideranca:['Marcar 1 conversa de feedback','Definir 1 acordo de convivência com o time','Resolver 1 conflito pendente','Reconhecer publicamente alguém esta semana'],
  engenharia:['Documentar 1 processo do dia a dia','Definir 1 indicador para acompanhar','Padronizar 1 decisão recorrente','Criar 1 rotina de prestação de contas'],
  financas:['Calcular meu ponto de equilíbrio','Levantar minha necessidade de capital de giro','Separar o caixa pessoal do da empresa','Revisar minha precificação']
};
function applyCommit(modId){
  const m=MODULES.find(x=>x.id===modId); if(!m) return;
  const opts=[m.challenge, ...(APPLY_ACTIONS[m.group]||[])].filter(Boolean);
  openComposer({
    eyebrow:'Da teoria à prática', title:'Seu compromisso',
    intro:'Marque o que você vai aplicar desta trilha. Vira ação no seu Plano de 30 dias, com prazo — sem digitar.',
    confirmLabel:'Comprometer no Plano',
    steps:[
      {k:'acoes',type:'multi',q:'O que você vai fazer na prática? (marque)',more:true,opts:opts.map(v=>({v,label:v}))},
      {k:'prazo',type:'pick',q:'Até quando?',opts:[{v:'7',label:'7 dias'},{v:'14',label:'14 dias'},{v:'30',label:'30 dias'}]}
    ],
    onConfirm:(d)=>{
      const picks=(d.acoes||[]); if(!picks.length){ toast('⚠️','Escolha ao menos uma','Marque o que vai aplicar.'); return; }
      const days=+(d.prazo||'30');
      picks.forEach((t,k)=>S.plan.push({id:'p'+Date.now()+k, text:t, due:Date.now()+days*86400000, done:false, from:modId, src:m.title}));
      if(S.modules[modId] && !S.modules[modId].challengeDone){ S.modules[modId].challengeDone=true; }
      addXp(30,'Compromisso de aplicação definido'); grantTrophy('planner'); grantTrophy('challenger'); save(); closeModal();
      planTab='acoes'; go('plano'); toast('','Compromisso firmado',picks.length+' ação(ões) no seu Plano de 30 dias.');
    }
  });
}

  </div>`);

function applyTrilha(modId){ applyPracticeModal(modId,{}); }
function moduleCompleteModal(m){ applyPracticeModal(m.id,{completed:true}); }

function tgEsc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function tgList(arr){return (arr&&arr.length)?'<ul>'+arr.map(x=>`<li>${tgEsc(x)}</li>`).join('')+'</ul>':'<p class="tg-hint">—</p>';}
function tgMoney(n){return 'R$ '+Math.round(n||0).toLocaleString('pt-BR');}
function tgStepHtml(s,v){
  const wrap=(inner)=>`<div class="tg-step"><div class="tg-q">${tgEsc(s.q)}</div>${s.hint?`<div class="tg-hint">${tgEsc(s.hint)}</div>`:''}${inner}</div>`;
  if(s.type==='pick'){
    const opts=s.opts.map(o=>`<button type="button" class="tg-opt${v[s.k]===o.v?' on':''}" data-v="${tgEsc(o.v)}" onclick="tgPick(this)">${tgEsc(o.label)}${o.sub?`<small>${tgEsc(o.sub)}</small>`:''}</button>`).join('');
    return wrap(`<div class="tg-opts" data-pick="${s.k}">${opts}</div>`);
  }
  if(s.type==='multi'){
    const arr=v[s.k]||[];
    const opts=s.opts.map(o=>`<button type="button" class="tg-opt multi${arr.includes(o.v)?' on':''}" data-v="${tgEsc(o.v)}" onclick="tgToggle(this)">${tgEsc(o.label)}</button>`).join('');
    const custom=arr.filter(x=>!s.opts.some(o=>o.v===x));
    const more=s.more?`<input class="in" style="margin-top:8px" data-more="${s.k}" placeholder="Outro… (opcional, separe por vírgula)" value="${tgEsc(custom.join(', '))}">`:'';
    return wrap(`<div class="tg-opts" data-multi="${s.k}">${opts}</div>${more}`);
  }
  if(s.type==='scale'){
    const cur=+v[s.k]||0;
    const btns=[1,2,3,4,5].map(n=>`<button type="button" class="${cur===n?'on':''}" data-n="${n}" onclick="tgScale(this)"><span class="n">${n}</span></button>`).join('');
    return wrap(`<div class="likert" data-scale="${s.k}">${btns}</div>`);
  }
  if(s.type==='number') return wrap(`<input class="in" type="number" inputmode="decimal" data-in="${s.k}" placeholder="${tgEsc(s.ph||'0')}" value="${tgEsc(v[s.k]||'')}">`);
  if(s.type==='long') return wrap(`<textarea class="in" data-in="${s.k}" placeholder="${tgEsc(s.ph||'')}">${tgEsc(v[s.k]||'')}</textarea>`);
  return wrap(`<input class="in" data-in="${s.k}" placeholder="${tgEsc(s.ph||'')}" value="${tgEsc(v[s.k]||'')}">`);
}
function tgPick(b){const c=b.parentElement;[...c.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');}
function tgToggle(b){b.classList.toggle('on');}
function tgScale(b){const c=b.parentElement;[...c.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');}
function tgCollect(t){
  const d={};
  t.steps.forEach(s=>{
    if(s.type==='pick'){const on=document.querySelector(`[data-pick="${s.k}"] .tg-opt.on`);d[s.k]=on?on.dataset.v:'';}
    else if(s.type==='multi'){const ons=[...document.querySelectorAll(`[data-multi="${s.k}"] .tg-opt.on`)].map(o=>o.dataset.v);const more=document.querySelector(`[data-more="${s.k}"]`);if(more&&more.value.trim())more.value.split(',').map(x=>x.trim()).filter(Boolean).forEach(x=>ons.push(x));d[s.k]=ons;}
    else if(s.type==='scale'){const on=document.querySelector(`[data-scale="${s.k}"] button.on`);d[s.k]=on?+on.dataset.n:0;}
    else {const inp=document.querySelector(`[data-in="${s.k}"]`);d[s.k]=inp?inp.value.trim():'';}
  });
  return d;
}
function openTool(id){
  const t=TOOLS.find(x=>x.id===id); const saved=S.tools[id]; const d=(saved&&saved.data)?saved.data:{};
  const gm=GROUPS.find(x=>x.id===t.mod);
  const form=t.steps.map(s=>tgStepHtml(s,d)).join('');
  modal(`<p class="eyebrow">Ferramenta${gm?' · '+gm.title:''}</p><h3>${t.icon} ${t.title}</h3>
    <p class="tg-intro">${tgEsc(t.intro||t.desc)}</p>
    <div id="tgForm">${form}</div>
    <div class="divider"></div>
    <div class="btn-row"><button class="btn primary" onclick="tgGenerate('${id}')">⚡ Gerar resultado</button>
    <button class="btn ghost" onclick="closeModal()">Fechar</button></div>
    <div id="tgResultWrap" class="mt16"></div>`);
  if(saved&&saved.data) tgGenerate(id,true);
}
function tgGenerate(id,silent){
  const t=TOOLS.find(x=>x.id===id); const d=tgCollect(t);
  let out; try{ out=t.build(d)||''; }catch(e){ out='<p>Preencha os campos para gerar o resultado.</p>'; }
  window._tgLast={id,d};
  _art={title:t.title, icon:t.icon, html:out, actions:[`Aplicar no negócio: ${t.title}`], pdcaTitle:t.title, diaryText:`Usei a ferramenta "${t.title}". O que vou fazer com o resultado: `};
  $('#tgResultWrap').innerHTML=`<div class="tg-result" id="tgResult">${out}</div>
    <div class="btn-row" style="margin-top:14px">
      <button class="btn sage" onclick="tgSave('${id}')">Salvar ferramenta</button>
      <button class="btn ghost" onclick="tgCopy()">Copiar</button>
    </div>
    <div class="res-actions">
      <button class="btn ghost xs" onclick="actPrint()">Imprimir A4</button>
      <button class="btn ghost xs" onclick="actToPlano()">Plano 30d</button>
      <button class="btn ghost xs" onclick="actToPdca()">PDCA</button>
      <button class="btn ghost xs" onclick="actToAgenda()">Agenda</button>
      <button class="btn ghost xs" onclick="actToDiario()">Diário</button>
    </div>`;
  if(!silent){ const w=$('#tgResultWrap'); if(w&&w.scrollIntoView) w.scrollIntoView({behavior:'smooth',block:'nearest'}); }
}
function tgSave(id){
  const t=TOOLS.find(x=>x.id===id);
  const d=(window._tgLast&&window._tgLast.id===id)?window._tgLast.d:tgCollect(t);
  const fresh=!S.tools[id];
  S.tools[id]={data:d,ts:Date.now()};
  if(fresh){ addXp(25,`Ferramenta salva — ${t.title}`); S.log.unshift({t:Date.now(),type:'tool',label:`Ferramenta salva: ${t.title}`}); }
  grantTrophy('tool_used');
  if(Object.keys(S.tools).length>=TOOLS.length) grantTrophy('all_tools');
  save(); toast('','Ferramenta salva',fresh?'+25 XP':'Atualizada.'); renderFerramentas();
}
function tgCopy(){
  const r=$('#tgResult'); if(!r) return; const txt=r.innerText;
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(()=>toast('','Copiado','Cole onde quiser.')).catch(()=>toast('','Selecione e copie','Toque e segure no texto do resultado.')); }
  else toast('','Selecione e copie','Toque e segure no texto do resultado.');
}
