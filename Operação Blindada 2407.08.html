<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Operação Blindada — Mentoria de Estratégia e Negócios</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap');
/* ============================================================
   OPERAÇÃO BLINDADA — Design tokens
   Direção: "Cofre e Estrategista". A mentoria como blindagem do
   negócio. Fundo carbono profundo (quase preto, levemente metálico),
   ouro = a conquista / a blindagem que se acende. Aço = estrutura.
   Estrutura que protege. Estratégia que escala.
   ============================================================ */
:root{
  /* Direção "Cofre Privado" — carbono quente, ouro-champanhe, pergaminho */
  --ink:#0a0806;          /* carbono quente, quase preto */
  --ink-2:#12100b;        /* painel */
  --ink-3:#1a1610;        /* card */
  --line:rgba(198,168,103,.20);   /* fio de ouro — linhas/divisores */
  --line-soft:rgba(236,227,210,.07);
  --star:#ece3d2;         /* pergaminho — texto claro */
  --mute:#a89f8a;         /* texto secundário (taupe quente) */
  --mute-2:#6f685a;       /* texto terciário */
  --amber:#c6a867;        /* OURO champanhe — acento único */
  --amber-deep:#8a7233;
  --amber-bright:#e9d4a0;
  --steel:#8a8f96;        /* aço frio — dado/estrutura */
  --sage:#63c49a;         /* sucesso (uso semântico, discreto) */
  --sage-deep:#2fa07a;
  --coral:#c06a5a;        /* alerta (uso semântico, discreto) */
  --violet:#9a8f78;       /* neutro quente (antes: destaque) */
  --glow: 0 0 0 1px rgba(198,168,103,.30), 0 10px 34px -12px rgba(198,168,103,.32);
  --radius:5px;
  --radius-sm:3px;
  --maxw:1120px;
  --shadow: 0 30px 80px -40px rgba(0,0,0,.85);
  --serif:"Fraunces", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans:"Outfit", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:"Space Mono", ui-monospace, "Cascadia Mono", monospace;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);
  background:
    radial-gradient(1200px 700px at 85% -10%, rgba(245,181,61,.10), transparent 60%),
    radial-gradient(900px 600px at -5% 110%, rgba(185,194,214,.07), transparent 55%),
    var(--ink);
  color:var(--star);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
/* subtle star field */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:
    radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,.45), transparent),
    radial-gradient(1px 1px at 60% 70%, rgba(255,255,255,.30), transparent),
    radial-gradient(1px 1px at 80% 20%, rgba(255,255,255,.25), transparent),
    radial-gradient(1.5px 1.5px at 35% 80%, rgba(245,181,61,.30), transparent),
    radial-gradient(1px 1px at 90% 60%, rgba(255,255,255,.25), transparent);
  background-size:cover;
}
a{color:inherit}
button{font-family:inherit}
::selection{background:rgba(245,181,61,.3)}

.wrap{position:relative;z-index:1;max-width:var(--maxw);margin:0 auto;padding:0 20px}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(to bottom, rgba(12,18,36,.96), rgba(12,18,36,.75) 70%, transparent);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line-soft);
}
.topbar-inner{display:flex;align-items:center;gap:18px;padding:12px 20px;max-width:var(--maxw);margin:0 auto}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer;user-select:none}
.brand .mark{
  width:34px;height:34px;border-radius:10px;flex:none;
  background:conic-gradient(from 220deg, var(--amber), var(--steel) 45%, var(--amber-deep) 78%, var(--amber));
  display:grid;place-items:center;color:#0c1224;font-weight:700;font-family:var(--serif);
  box-shadow:0 6px 18px -6px rgba(245,181,61,.6);
}
.brand .mark span{font-size:18px;line-height:1;transform:translateY(.5px)}
.brand b{font-family:var(--serif);font-weight:600;font-size:17px;letter-spacing:.2px}
.brand small{display:block;color:var(--mute);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-top:1px}

.top-stats{margin-left:auto;display:flex;align-items:center;gap:10px}
.chip{
  display:inline-flex;align-items:center;gap:7px;
  background:var(--ink-3);border:1px solid var(--line);
  padding:6px 11px;border-radius:999px;font-size:13px;color:var(--star);font-weight:500;
}
.chip .ic{font-size:14px}
.chip.lvl{border-color:rgba(245,181,61,.4);background:rgba(245,181,61,.08)}
.chip.xp{border-color:rgba(95,208,166,.35);background:rgba(95,208,166,.07)}
.avatar{
  width:34px;height:34px;border-radius:50%;flex:none;cursor:pointer;
  background:radial-gradient(circle at 30% 30%, var(--violet), var(--ink-3));
  border:1px solid var(--line);display:grid;place-items:center;font-weight:600;font-size:13px;color:var(--star)
}

/* ---------- nav tabs ---------- */
.tabs{display:flex;gap:4px;overflow-x:auto;padding:10px 20px 0;max-width:var(--maxw);margin:0 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:none;border:none;background:transparent;color:var(--mute);
  padding:9px 15px;border-radius:11px 11px 0 0;font-size:14px;font-weight:500;cursor:pointer;
  border-bottom:2px solid transparent;transition:.16s;white-space:nowrap;display:flex;align-items:center;gap:7px
}
.tab:hover{color:var(--star)}
.tab.active{color:var(--star);border-bottom-color:var(--amber);background:linear-gradient(to bottom, rgba(245,181,61,.08), transparent)}
.tab .ic{font-size:15px;opacity:.85}

/* ---------- views ---------- */
.view{display:none;padding:30px 0 90px;animation:fade .4s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--amber);margin:0 0 8px}
h1.page{font-family:var(--serif);font-weight:600;font-size:clamp(28px,4.4vw,42px);line-height:1.05;margin:0 0 8px;letter-spacing:-.01em}
.lead{color:var(--mute);font-size:16px;max-width:680px;margin:0 0 28px}
h2.sec{font-family:var(--serif);font-weight:600;font-size:23px;margin:34px 0 14px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
h2.sec .ic{font-size:20px}

/* ---------- cards / grids ---------- */
.grid{display:grid;gap:16px}
.g-2{grid-template-columns:repeat(2,1fr)}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-4{grid-template-columns:repeat(4,1fr)}
.card{
  background:linear-gradient(180deg, var(--ink-3), var(--ink-2));
  border:1px solid var(--line-soft);border-radius:var(--radius);padding:20px;position:relative;overflow:hidden;
}
.card.pad-lg{padding:26px}

/* ---------- hero (home) ---------- */
.hero{
  background:
    radial-gradient(700px 300px at 110% -40%, rgba(245,181,61,.16), transparent 60%),
    linear-gradient(180deg, var(--ink-3), var(--ink-2));
  border:1px solid var(--line);border-radius:24px;padding:34px;position:relative;overflow:hidden
}
.hero .constellation{position:absolute;right:-20px;top:-20px;width:340px;height:340px;opacity:.5;pointer-events:none}
.hero h1{font-family:var(--serif);font-weight:600;font-size:clamp(26px,4vw,38px);margin:0 0 10px;max-width:640px;line-height:1.08;letter-spacing:-.01em}
.hero p{color:var(--mute);max-width:560px;font-size:16px;margin:0 0 22px}
.hero .greet{font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--sage);margin:0 0 14px}

.btn{
  display:inline-flex;align-items:center;gap:9px;border:none;cursor:pointer;
  padding:12px 20px;border-radius:12px;font-size:15px;font-weight:600;transition:.16s;text-decoration:none
}
.btn.primary{background:linear-gradient(135deg,var(--amber),var(--amber-deep));color:#231603;box-shadow:0 10px 24px -10px rgba(245,181,61,.7)}
.btn.primary:hover{transform:translateY(-2px);box-shadow:0 16px 30px -10px rgba(245,181,61,.8)}
.btn.ghost{background:var(--ink-3);color:var(--star);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--amber);color:var(--amber)}
.btn.sage{background:linear-gradient(135deg,var(--sage),var(--sage-deep));color:#04231a;box-shadow:0 10px 24px -12px rgba(95,208,166,.6)}
.btn.sage:hover{transform:translateY(-2px)}
.btn.sm{padding:8px 14px;font-size:13.5px;border-radius:10px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important;box-shadow:none}
.btn-row{display:flex;gap:12px;flex-wrap:wrap}

/* progress ring + bars */
.ring{--p:0;--sz:120px;width:var(--sz);height:var(--sz);border-radius:50%;display:grid;place-items:center;flex:none;
  background:conic-gradient(var(--amber) calc(var(--p)*1%), var(--line-soft) 0)}
.ring::before{content:"";position:absolute;width:calc(var(--sz) - 18px);height:calc(var(--sz) - 18px);border-radius:50%;background:var(--ink-2)}
.ring b{position:relative;font-family:var(--serif);font-size:26px;font-weight:600}
.ring small{position:relative;display:block;text-align:center;color:var(--mute);font-size:11px;letter-spacing:.08em}
.bar{height:9px;border-radius:99px;background:var(--line-soft);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--sage),var(--amber));width:0;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar.amber>i{background:linear-gradient(90deg,var(--amber-deep),var(--amber))}

.stat-num{font-family:var(--serif);font-size:32px;font-weight:600;line-height:1}
.stat-lbl{color:var(--mute);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;margin-top:6px}

/* ---------- trilhas (módulos) ---------- */
.module{
  background:linear-gradient(180deg, var(--ink-3), var(--ink-2));
  border:1px solid var(--line-soft);border-radius:var(--radius);overflow:hidden;
  display:flex;flex-direction:column;transition:.18s;position:relative
}
.module:hover{transform:translateY(-3px);border-color:var(--line)}
.module .top{padding:20px 20px 14px;position:relative}
.module .num{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--mute-2)}
.module h3{font-family:var(--serif);font-weight:600;font-size:19px;margin:6px 0 8px;line-height:1.15}
.module .desc{color:var(--mute);font-size:13.5px;min-height:38px}
.module .meta{display:flex;align-items:center;gap:14px;padding:0 20px 14px;color:var(--mute-2);font-size:12px}
.module .meta span{display:inline-flex;align-items:center;gap:5px}
.module .foot{margin-top:auto;padding:14px 20px;border-top:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;gap:10px}
.module .barwrap{padding:0 20px 14px}
.lockwrap{position:absolute;inset:0;background:rgba(10,15,30,.72);backdrop-filter:blur(2px);display:grid;place-items:center;z-index:3;border-radius:var(--radius)}
.lockwrap .lk{text-align:center;padding:20px}
.lockwrap .lk .ic{font-size:26px}
.lockwrap .lk small{display:block;color:var(--mute);margin-top:6px;font-size:12.5px;max-width:180px}
.badge-status{font-size:11px;font-weight:600;padding:4px 10px;border-radius:99px;letter-spacing:.04em}
.st-done{background:rgba(95,208,166,.15);color:var(--sage);border:1px solid rgba(95,208,166,.3)}
.st-prog{background:rgba(245,181,61,.13);color:var(--amber);border:1px solid rgba(245,181,61,.3)}
.st-lock{background:rgba(120,130,170,.12);color:var(--mute-2);border:1px solid var(--line-soft)}
.module .ribbon{position:absolute;top:14px;right:-32px;transform:rotate(45deg);background:var(--sage);color:#04231a;font-size:10px;font-weight:700;letter-spacing:.1em;padding:3px 38px}

.pill-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.pill{font-size:11.5px;color:var(--mute);background:var(--ink);border:1px solid var(--line-soft);padding:4px 10px;border-radius:99px}
.pill.amber{color:var(--amber);border-color:rgba(245,181,61,.3)}

/* ---------- lesson / módulo aberto ---------- */
.lesson-head{display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap;margin-bottom:8px}
.lesson-head .glyph{width:64px;height:64px;border-radius:16px;flex:none;display:grid;place-items:center;font-size:30px;
  background:linear-gradient(135deg, rgba(245,181,61,.18), rgba(155,140,255,.16));border:1px solid var(--line)}
.steps{display:flex;flex-direction:column;gap:10px;margin:18px 0}
.step{
  display:flex;gap:14px;align-items:flex-start;background:var(--ink-2);border:1px solid var(--line-soft);
  border-radius:14px;padding:14px 16px;cursor:pointer;transition:.15s
}
.step:hover{border-color:var(--line)}
.step.active{border-color:var(--amber);box-shadow:0 0 0 1px rgba(245,181,61,.25)}
.step.done{opacity:.85}
.step .dot{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;font-weight:700;
  background:var(--ink-3);border:1px solid var(--line);color:var(--mute)}
.step.done .dot{background:var(--sage);border-color:var(--sage);color:#04231a}
.step .stepbody{flex:1;min-width:0}
.step .stepbody b{font-size:14.5px;font-weight:600;display:block}
.step .stepbody .kind{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute-2);margin-bottom:3px}
.step .arrow{color:var(--mute-2);align-self:center}

.content-block{line-height:1.7;color:#cfd6f0;font-size:15.3px}
.content-block h4{font-family:var(--serif);color:var(--star);font-size:18px;margin:22px 0 8px;font-weight:600}
.content-block p{margin:0 0 14px}
.content-block ul{margin:0 0 14px;padding-left:0;list-style:none}
.content-block ul li{position:relative;padding-left:24px;margin-bottom:9px}
.content-block ul li::before{content:"";position:absolute;left:4px;top:9px;width:7px;height:7px;border-radius:50%;
  background:var(--amber);box-shadow:0 0 8px rgba(245,181,61,.7)}
.content-block .quote{border-left:3px solid var(--violet);background:rgba(155,140,255,.06);padding:14px 18px;border-radius:0 12px 12px 0;color:#dfe3f7;font-style:italic;margin:0 0 16px}
.content-block .quote cite{display:block;font-style:normal;color:var(--mute);font-size:12.5px;margin-top:8px;font-family:var(--mono)}
.callout{display:flex;gap:13px;background:rgba(245,181,61,.07);border:1px solid rgba(245,181,61,.25);border-radius:14px;padding:15px 17px;margin:0 0 16px}
.callout .ic{font-size:20px;flex:none}
.callout b{color:var(--amber)}

/* ---------- quiz ---------- */
.quiz-q{margin-bottom:22px}
.quiz-q .qnum{font-family:var(--mono);font-size:11px;color:var(--amber);letter-spacing:.14em}
.quiz-q h4{font-family:var(--sans);font-weight:600;font-size:16.5px;margin:5px 0 14px;line-height:1.35}
.opt{display:flex;gap:12px;align-items:flex-start;background:var(--ink-2);border:1px solid var(--line-soft);border-radius:12px;
  padding:13px 15px;margin-bottom:9px;cursor:pointer;transition:.14s}
.opt:hover{border-color:var(--line)}
.opt .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:13px;transition:.14s;margin-top:1px}
.opt.sel{border-color:var(--amber);background:rgba(245,181,61,.06)}
.opt.sel .box{background:var(--amber);border-color:var(--amber);color:#231603}
.opt.correct{border-color:var(--sage);background:rgba(95,208,166,.08)}
.opt.correct .box{background:var(--sage);border-color:var(--sage);color:#04231a}
.opt.wrong{border-color:var(--coral);background:rgba(255,122,107,.08)}
.opt.wrong .box{background:var(--coral);border-color:var(--coral);color:#2a0a06}
.opt .txt{font-size:14.5px;flex:1}
.feedback{font-size:13.5px;padding:11px 14px;border-radius:10px;margin-top:6px;display:none}
.feedback.show{display:block}
.feedback.ok{background:rgba(95,208,166,.1);color:var(--sage);border:1px solid rgba(95,208,166,.3)}
.feedback.no{background:rgba(255,122,107,.1);color:#ffb3a8;border:1px solid rgba(255,122,107,.3)}

/* ---------- ferramentas / práticas ---------- */
.tool-card{background:linear-gradient(180deg, var(--ink-3), var(--ink-2));border:1px solid var(--line-soft);border-radius:var(--radius);padding:22px;display:flex;flex-direction:column;transition:.16s}
.tool-card:hover{transform:translateY(-3px);border-color:var(--line)}
.tool-card .ic-lg{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;font-size:24px;margin-bottom:14px;
  background:linear-gradient(135deg,rgba(95,208,166,.16),rgba(245,181,61,.12));border:1px solid var(--line)}
.tool-card h3{font-family:var(--serif);font-size:18px;font-weight:600;margin:0 0 7px}
.tool-card p{color:var(--mute);font-size:13.5px;flex:1;margin:0 0 16px}

/* form fields */
label.fld{display:block;margin-bottom:14px}
label.fld span{display:block;font-size:13px;color:var(--mute);margin-bottom:6px;font-weight:500}
input.in,textarea.in,select.in{width:100%;background:var(--ink);border:1px solid var(--line);color:var(--star);
  border-radius:11px;padding:11px 13px;font-family:inherit;font-size:14.5px;transition:.14s}
input.in:focus,textarea.in:focus,select.in:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px rgba(245,181,61,.12)}
textarea.in{resize:vertical;min-height:84px;line-height:1.5}

/* likert scale (pesquisa clima/cultura) */
.likert{display:flex;gap:6px;flex-wrap:wrap}
.likert button{flex:1;min-width:52px;background:var(--ink);border:1px solid var(--line-soft);color:var(--mute);
  border-radius:10px;padding:10px 6px;cursor:pointer;font-size:12px;font-weight:600;transition:.14s;text-align:center}
.likert button .n{display:block;font-family:var(--serif);font-size:18px;color:var(--star);margin-bottom:2px}
.likert button:hover{border-color:var(--line)}
.likert button.on{border-color:var(--amber);background:rgba(245,181,61,.1);color:var(--amber)}
.likert button.on .n{color:var(--amber)}
.survey-item{padding:16px 0;border-bottom:1px solid var(--line-soft)}
.survey-item:last-child{border-bottom:none}
.survey-item .q{font-size:15px;margin-bottom:11px;font-weight:500}
.survey-item .cat{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--violet);margin-bottom:5px}

/* trophy / conquistas */
.trophy{background:linear-gradient(180deg,var(--ink-3),var(--ink-2));border:1px solid var(--line-soft);border-radius:16px;
  padding:18px;text-align:center;transition:.16s;position:relative;overflow:hidden}
.trophy.locked{opacity:.5;filter:grayscale(.6)}
.trophy.unlocked{border-color:rgba(245,181,61,.4)}
.trophy.unlocked::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,rgba(245,181,61,.14),transparent 60%);pointer-events:none}
.trophy .em{font-size:38px;display:block;margin-bottom:10px}
.trophy b{font-size:14px;display:block;font-weight:600}
.trophy small{color:var(--mute);font-size:11.5px;display:block;margin-top:4px;line-height:1.4}
.trophy .got{margin-top:9px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--sage)}

/* toast / level up */
.toast-zone{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:10px;align-items:center;width:calc(100% - 40px);max-width:420px}
.toast{background:linear-gradient(135deg,var(--ink-3),var(--ink-2));border:1px solid var(--amber);border-radius:14px;
  padding:13px 18px;display:flex;align-items:center;gap:13px;box-shadow:var(--shadow);animation:pop .4s cubic-bezier(.2,1.2,.3,1);width:100%}
.toast .em{font-size:24px;flex:none}
.toast b{display:block;font-size:14.5px}
.toast small{color:var(--mute);font-size:12.5px}
@keyframes pop{from{transform:translateY(20px) scale(.9);opacity:0}to{transform:none;opacity:1}}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(6,10,22,.78);backdrop-filter:blur(6px);z-index:150;display:none;place-items:center;padding:20px}
.modal-bg.show{display:grid;animation:fade .25s}
.modal{background:linear-gradient(180deg,var(--ink-3),var(--ink-2));border:1px solid var(--line);border-radius:20px;
  max-width:560px;width:100%;max-height:88vh;overflow:auto;box-shadow:var(--shadow);padding:28px;position:relative}
.modal .x{position:absolute;top:16px;right:16px;background:var(--ink);border:1px solid var(--line);color:var(--mute);
  width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:18px}
.modal .x:hover{color:var(--star);border-color:var(--amber)}
.modal h3{font-family:var(--serif);font-size:23px;font-weight:600;margin:0 0 6px}
.modal .levelup-em{font-size:54px;text-align:center;margin:6px 0 12px}

/* mentor note */
.mentor-note{display:flex;gap:14px;background:linear-gradient(135deg,rgba(155,140,255,.1),rgba(245,181,61,.06));
  border:1px solid rgba(155,140,255,.3);border-radius:16px;padding:18px 20px;margin:6px 0 20px}
.mentor-note .ava{width:46px;height:46px;border-radius:50%;flex:none;background:radial-gradient(circle at 30% 30%,var(--amber),var(--violet));
  display:grid;place-items:center;font-family:var(--serif);font-weight:600;color:#231603;font-size:18px}
.mentor-note .mn-body b{font-size:13px;color:var(--amber)}
.mentor-note .mn-body p{margin:4px 0 0;font-size:14px;color:#dfe3f7;font-style:italic;line-height:1.55}

/* desafio cards */
.challenge{display:flex;gap:14px;align-items:flex-start;background:var(--ink-2);border:1px solid var(--line-soft);
  border-radius:14px;padding:16px;margin-bottom:12px}
.challenge .cnum{font-family:var(--serif);font-size:22px;color:var(--amber);flex:none;width:34px;text-align:center}
.challenge .cbody{flex:1}
.challenge .cbody b{display:block;font-size:15px;margin-bottom:4px}
.challenge .cbody p{margin:0;color:var(--mute);font-size:13.5px}
.challenge .reward{font-family:var(--mono);font-size:11px;color:var(--sage);white-space:nowrap;flex:none}

/* empty / onboarding */
.center-stage{min-height:70vh;display:grid;place-items:center;text-align:center}
.onb{max-width:520px}
.onb .bigmark{width:84px;height:84px;border-radius:24px;margin:0 auto 22px;
  background:conic-gradient(from 200deg,var(--amber),var(--sage) 50%,var(--violet) 85%,var(--amber));
  display:grid;place-items:center;font-family:var(--serif);font-size:40px;color:#0c1224;font-weight:700;box-shadow:0 16px 40px -14px rgba(245,181,61,.6)}

.kicker-row{display:flex;gap:18px;flex-wrap:wrap;margin:24px 0}
.kicker{flex:1;min-width:130px}
.kicker .stat-num{font-size:26px}

.divider{height:1px;background:var(--line-soft);margin:28px 0}
.muted{color:var(--mute)}
.tiny{font-size:12.5px}
.center{text-align:center}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.hidden{display:none!important}

/* signature footer */
.sig{margin-top:60px;padding:28px 0 40px;border-top:1px solid var(--line-soft);text-align:center}
.sig .nm{font-family:var(--serif);font-size:20px;font-weight:600}
.sig .rl{color:var(--amber);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;font-family:var(--mono);margin-top:4px}
.sig .ln{color:var(--mute-2);font-size:12px;margin-top:10px}

.chip.streak{border-color:rgba(255,122,107,.4);background:rgba(255,122,107,.08);color:#ffb3a8;font-weight:700}
.bell{position:relative;background:var(--ink-3);border:1px solid var(--line);width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:16px;color:var(--star);transition:.14s}
.bell:hover{border-color:var(--amber)}
.dot-badge{position:absolute;top:-5px;right:-5px;background:var(--coral);color:#fff;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:99px;display:grid;place-items:center;padding:0 4px;border:2px solid var(--ink)}

/* diário timeline */
.diary-entry{display:flex;gap:16px;position:relative;padding-bottom:8px}
.diary-entry .tl{display:flex;flex-direction:column;align-items:center;flex:none}
.diary-entry .tl .dot{width:14px;height:14px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 4px rgba(245,181,61,.15);margin-top:6px}
.diary-entry .tl .line{flex:1;width:2px;background:var(--line-soft);margin-top:4px}
.diary-entry:last-child .tl .line{display:none}
.diary-entry .body{flex:1;background:var(--ink-2);border:1px solid var(--line-soft);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.diary-entry .body .meta{display:flex;gap:8px;align-items:center;margin-bottom:7px;flex-wrap:wrap}
.diary-entry .body .meta .tag{font-size:11px;color:var(--amber);background:rgba(245,181,61,.1);border:1px solid rgba(245,181,61,.25);padding:2px 9px;border-radius:99px}
.diary-entry .body p{margin:0;font-size:14.5px;line-height:1.6;color:#dfe3f7;white-space:pre-wrap}

/* plano de ação */
.plan-item{display:flex;gap:13px;align-items:flex-start;background:var(--ink-2);border:1px solid var(--line-soft);border-radius:14px;padding:14px 16px;margin-bottom:11px;transition:.14s}
.plan-item.done{opacity:.6}
.plan-item.done .ptext{text-decoration:line-through;color:var(--mute)}
.plan-check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex:none;cursor:pointer;display:grid;place-items:center;font-size:14px;transition:.14s;margin-top:1px}
.plan-check.on{background:var(--sage);border-color:var(--sage);color:#04231a}
.plan-item .ptext{flex:1;font-size:14.5px}
.plan-item .pdue{font-size:11.5px;color:var(--mute-2);font-family:var(--mono);white-space:nowrap}
.plan-item .pdel{background:none;border:none;color:var(--mute-2);cursor:pointer;font-size:16px;flex:none}
.plan-item .pdel:hover{color:var(--coral)}

/* radar/diagnóstico */
.radar-wrap{display:flex;gap:24px;align-items:center;flex-wrap:wrap;justify-content:center}
.diag-q{padding:15px 0;border-bottom:1px solid var(--line-soft)}
.diag-q:last-child{border-bottom:none}
.diag-q .dim{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--violet);margin-bottom:5px}
.diag-q .q{font-size:14.5px;margin-bottom:10px}
.cmp-bar{display:grid;grid-template-columns:120px 1fr 44px;gap:10px;align-items:center;margin-bottom:9px}
.cmp-bar .lb{font-size:12.5px;color:var(--mute)}
.cmp-track{height:20px;border-radius:6px;background:var(--line-soft);position:relative;overflow:hidden}
.cmp-track .before{position:absolute;left:0;top:0;height:100%;background:rgba(155,140,255,.4);border-radius:6px}
.cmp-track .after{position:absolute;left:0;top:0;height:100%;background:linear-gradient(90deg,var(--sage),var(--amber));border-radius:6px;opacity:.9}

/* certificate */
.cert{background:linear-gradient(160deg,#fbf6ea,#f4ead3);color:#3a2f1a;border-radius:18px;padding:38px;text-align:center;border:2px solid var(--amber);position:relative;overflow:hidden}
.cert::before{content:"";position:absolute;inset:10px;border:1px solid rgba(180,140,60,.35);border-radius:12px;pointer-events:none}
.cert .seal{font-size:46px}
.cert h2{font-family:var(--serif);font-size:28px;color:#2a2110;margin:6px 0}
.cert .nm{font-family:var(--serif);font-size:34px;font-weight:600;color:#7a5418;margin:14px 0 4px;border-bottom:2px solid rgba(122,84,24,.3);display:inline-block;padding:0 20px 8px}
.cert .body{font-size:14px;color:#5a4a2e;max-width:440px;margin:14px auto;line-height:1.6}
.cert .ftr{display:flex;justify-content:space-between;margin-top:24px;font-size:12px;color:#6a5733}
.cert .ftr b{font-family:var(--serif)}

@media(max-width:860px){
  .g-4{grid-template-columns:repeat(2,1fr)}
  .g-3{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:620px){
  .g-2,.g-3,.g-4{grid-template-columns:1fr}
  .hero{padding:24px}
  .top-stats .chip span.lbl{display:none}
  h1.page{font-size:27px}
  .modal{padding:22px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---- módulos (grupos temáticos) e busca ---- */
.search-wrap{display:flex;align-items:center;gap:10px;background:var(--ink-3);border:1px solid var(--line);border-radius:999px;padding:10px 16px;margin:0 0 28px;max-width:520px}
.search-wrap .ic{opacity:.7}
.search-in{flex:1;background:transparent;border:none;outline:none;color:var(--star);font-family:inherit;font-size:14.5px}
.search-in::placeholder{color:var(--mute-2)}
.mod-band{margin:0 0 34px}
.mod-band-head{display:flex;align-items:center;gap:16px;margin:0 0 18px;padding:0 0 14px;border-bottom:1px solid var(--line-soft)}
.mod-n{font-family:var(--mono);font-size:13px;color:var(--amber);border:1px solid rgba(245,181,61,.40);border-radius:8px;padding:6px 9px;background:rgba(245,181,61,.07);flex:none}
.mod-title{font-family:var(--serif);font-size:21px;font-weight:600;margin:0}
.mod-desc{color:var(--mute);font-size:13.5px;margin:3px 0 0;max-width:60ch}
.mod-band.soon{opacity:.9}
.mod-band.soon .mod-band-head{border-bottom-style:dashed}
.soon-note{background:var(--ink-2);border:1px dashed var(--line);border-radius:var(--radius-sm);padding:16px 18px;color:var(--mute);font-size:13.5px}
/* ---- cartão de roteiro Fase 2 (versão conectada) ---- */
.roadmap{display:grid;gap:10px;margin-top:6px}
.roadmap .ri{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--ink-2);border:1px solid var(--line-soft);border-radius:var(--radius-sm)}
.roadmap .ri .em{font-size:19px;flex:none}
.roadmap .ri b{font-size:14px}
.roadmap .ri p{margin:2px 0 0;color:var(--mute);font-size:12.5px}
.roadmap .ri .tagx{margin-left:auto;flex:none;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--steel);border:1px solid var(--line);border-radius:6px;padding:3px 7px;text-transform:uppercase;align-self:center}
/* ---- ferramentas guiadas ---- */
.tg-badge{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--violet);border:1px solid var(--line);border-radius:20px;padding:3px 9px;margin:0 0 9px}
.tg-intro{color:var(--mute);font-size:13.5px;margin:2px 0 18px;line-height:1.55}
.tg-step{margin:0 0 18px}
.tg-q{font-size:14.5px;font-weight:600;color:var(--star);margin:0 0 4px}
.tg-hint{font-size:11.5px;color:var(--mute);margin:0 0 9px;line-height:1.45}
.tg-opts{display:flex;flex-wrap:wrap;gap:8px}
.tg-opt{flex:1 1 auto;min-width:130px;text-align:left;background:var(--ink);border:1px solid var(--line-soft);color:var(--steel);border-radius:11px;padding:11px 13px;font:inherit;font-size:13px;cursor:pointer;transition:.14s;line-height:1.35}
.tg-opt:hover{border-color:var(--line)}
.tg-opt small{display:block;color:var(--mute);font-size:11px;margin-top:3px}
.tg-opt.on{border-color:var(--amber);background:rgba(245,181,61,.10);color:var(--star)}
.tg-opt.multi.on{border-color:var(--sage);background:rgba(95,208,166,.10)}
.tg-result{background:linear-gradient(180deg,rgba(245,181,61,.06),rgba(245,181,61,.02));border:1px solid rgba(245,181,61,.32);border-radius:16px;padding:20px 22px;margin:4px 0 0}
.tg-result h4{font-family:var(--serif);font-size:17px;margin:0 0 10px;color:var(--amber)}
.tg-result h5{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--steel);margin:16px 0 6px;font-family:var(--mono)}
.tg-result p{font-size:14px;line-height:1.6;margin:0 0 9px;color:var(--star)}
.tg-result ul{margin:0 0 10px;padding-left:18px}
.tg-result li{font-size:13.5px;line-height:1.55;margin:0 0 5px;color:var(--star)}
.tg-result .big{font-family:var(--serif);color:var(--amber);font-weight:600}
.tg-result .metric{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:13.5px;color:var(--mute)}
.tg-result .metric:last-of-type{border-bottom:none}
.tg-result .metric b{color:var(--star)}
.tg-flag{font-size:13px;padding:11px 14px;border-radius:11px;margin:10px 0 4px;line-height:1.5}
.tg-flag.good{background:rgba(95,208,166,.09);border:1px solid rgba(95,208,166,.3);color:#bdf0db}
.tg-flag.warn{background:rgba(255,122,107,.09);border:1px solid rgba(255,122,107,.3);color:#ffc7bf}
/* ---- motor de execução: barra de ações, abas, banner ---- */
.res-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line-soft)}
.btn.xs{padding:7px 11px;font-size:12px;border-radius:9px}
.plan-tabs{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.ptab{background:var(--ink);border:1px solid var(--line-soft);color:var(--steel);border-radius:11px;padding:9px 14px;font:inherit;font-size:13px;cursor:pointer;transition:.14s;display:flex;align-items:center;gap:6px}
.ptab:hover{border-color:var(--line)}
.ptab.on{border-color:var(--amber);background:rgba(245,181,61,.10);color:var(--star)}
.ptab .pcount{background:var(--amber);color:#231603;border-radius:20px;font-size:10px;font-weight:700;padding:1px 7px;min-width:16px;text-align:center}
.ptab.on .pcount{background:var(--amber)}
.src-tag{display:inline-block;font-size:10px;color:var(--mute);font-family:var(--mono);margin-left:8px;opacity:.8}
.earn-banner{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;background:linear-gradient(110deg,rgba(245,181,61,.08),rgba(155,140,255,.06));border:1px solid rgba(245,181,61,.25);border-radius:16px;padding:16px 18px;margin:4px 0 18px}
.earn-banner .eb-x{display:flex;flex-direction:column;gap:3px;min-width:200px;flex:1}
.earn-banner .eb-x b{font-family:var(--serif);font-size:17px;color:var(--amber)}
.earn-banner .eb-x span{font-size:12px;color:var(--mute);line-height:1.45}
.earn-banner .eb-btns{display:flex;flex-wrap:wrap;gap:8px}
.locked-card{opacity:.92;border-color:var(--line-soft)!important}

/* ---- acabamento premium ---- */
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background:
    repeating-linear-gradient(45deg,rgba(255,255,255,.013) 0 1px,transparent 1px 5px),
    repeating-linear-gradient(-45deg,rgba(255,255,255,.013) 0 1px,transparent 1px 5px);}
.card{box-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 20px 50px -30px rgba(0,0,0,.85)}
.gtabs{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:24px;background:var(--ink-2)}
.gtab{flex:1;min-width:110px;padding:13px 10px;background:none;border:none;border-right:1px solid var(--line-soft);cursor:pointer;
  font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);transition:.18s;white-space:nowrap}
.gtab:last-child{border-right:none}
.gtab:hover{color:var(--star);background:rgba(255,255,255,.02)}
.gtab.on{background:linear-gradient(135deg,var(--amber),var(--amber-deep));color:#231603;font-weight:700}
.gdot{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:0;margin-right:2px}
.gdot.verde{background:var(--sage);box-shadow:0 0 8px rgba(95,208,166,.7)}
.gdot.amarelo{background:var(--amber);box-shadow:0 0 8px rgba(245,181,61,.7)}
.gdot.vermelho{background:var(--coral);box-shadow:0 0 8px rgba(255,122,107,.7)}
.gdot.off{background:var(--mute-2);box-shadow:none}

/* ==== BÚSSOLA CSS ==== */
/* ===== A BÚSSOLA — componentes (identidade Cofre e Estrategista) ===== */
.b-bar{height:6px;border-radius:100px;background:var(--line-soft);overflow:hidden}
.b-bar>i{display:block;height:100%;border-radius:100px;background:var(--amber)}
.b-deck{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:14px}
.bcard{background:linear-gradient(180deg,var(--ink-3),var(--ink-2));border:1px solid var(--line);border-top:2px solid var(--sc,var(--amber));border-radius:var(--radius-sm);padding:16px 14px;cursor:pointer;transition:transform .16s,border-color .16s,box-shadow .16s;position:relative;text-align:center}
.bcard:hover{transform:translateY(-3px);border-color:var(--sc,var(--amber));box-shadow:0 18px 44px -24px var(--sc,var(--amber))}
.bcard-top{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--sc,var(--amber));opacity:.85}
.bcard-glyph{font-size:30px;color:var(--sc,var(--amber));margin:6px 0 2px;line-height:1}
.bcard-naipe{font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--sc,var(--amber))}
.bcard h4{font-family:var(--serif);font-size:15px;margin:6px 0 8px;line-height:1.18}
.bcard-seed{margin-top:4px;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--amber);border:1px solid var(--amber);border-radius:100px;padding:2px 8px;display:inline-block}
.b-mini{display:flex;gap:4px;justify-content:center;margin-top:2px}
.b-mini span{display:flex;gap:2px}
.b-mini i{width:4px;height:4px;border-radius:50%;background:var(--line);display:block}
.b-mini i.on{background:var(--sc,var(--amber))}
.b-featured{background:radial-gradient(420px 200px at 50% -20%,color-mix(in srgb,var(--sc) 24%,transparent),transparent),linear-gradient(180deg,var(--ink-3),var(--ink-2));border:1px solid var(--sc,var(--amber));border-radius:var(--radius);padding:26px 22px;text-align:center;cursor:pointer;transition:transform .2s}
.b-featured:hover{transform:translateY(-3px)}
.b-fnum{font-family:var(--mono);color:var(--sc,var(--amber));font-size:11px;letter-spacing:1px}
.b-fglyph{font-size:52px;color:var(--sc,var(--amber));line-height:1;margin-top:8px}
.b-fnaipe{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--sc,var(--amber));margin-top:10px}
.b-featured h2{font-family:var(--serif);margin:8px 0 12px;font-size:26px}
.b-open{margin-top:14px;color:var(--amber);font-weight:600}
.b-infl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.b-infl>div{padding:10px 12px;border-radius:10px;font-size:12.5px;line-height:1.45}
.b-infl .pos{background:rgba(95,208,166,.1);border:1px solid rgba(95,208,166,.3)}
.b-infl .neg{background:rgba(255,122,107,.1);border:1px solid rgba(255,122,107,.3)}
.b-infl b{display:block;font-size:10px;letter-spacing:.5px;text-transform:uppercase;margin-bottom:3px}
.b-infl .pos b{color:var(--sage)}
.b-infl .neg b{color:var(--coral)}
.b-levels{display:flex;flex-direction:column;gap:6px;margin:14px 0}
.b-lvl{display:grid;grid-template-columns:96px 1fr 18px;align-items:center;gap:10px;font-size:11px}
.b-lvl>span{color:var(--mute);text-transform:uppercase;letter-spacing:.5px;font-size:10px}
.b-lvl b{text-align:right;font-family:var(--mono)}
.b-dim{margin-bottom:12px}
.b-dim .dh{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.b-dim .dh b{font-family:var(--serif);color:var(--star)}
.b-trilha{cursor:pointer;transition:transform .16s,border-color .16s;border-top:2px solid var(--sc,var(--amber))}
.b-trilha:hover{transform:translateY(-3px);border-color:var(--sc,var(--amber))}
.b-tico{font-size:26px;color:var(--sc,var(--amber));line-height:1}
.b-stepper{display:flex;flex-direction:column}
.b-step{display:grid;grid-template-columns:32px 1fr;gap:12px;padding-bottom:16px;position:relative}
.b-step .b-node{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--serif);color:var(--mute);background:var(--ink-2);z-index:1}
.b-step.done .b-node{background:var(--amber);color:var(--ink);border-color:transparent}
.b-step.cur .b-node{border-color:var(--amber);color:var(--amber);box-shadow:0 0 0 4px rgba(245,181,61,.16)}
.b-step.lock{opacity:.5}
.b-step:not(:last-child)::before{content:"";position:absolute;left:15px;top:30px;bottom:0;width:2px;background:var(--line)}
.b-report p{font-size:13.8px;line-height:1.62;color:var(--mute);margin:0 0 12px}
.b-report p b{color:var(--star)}
.b-rlead{font-family:var(--serif);font-size:18px;color:var(--star)!important;margin-bottom:10px!important}
.b-rquote{font-family:var(--serif);font-style:italic;color:var(--amber)!important;border-top:1px solid var(--line);padding-top:12px;margin-top:8px}
.b-ii{border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px 16px;margin:14px 0;background:rgba(245,181,61,.05)}
.b-iihead{font-size:13px;font-weight:600;color:var(--amber);margin-bottom:8px}
.b-pacto{border:1px solid rgba(245,181,61,.4);border-radius:var(--radius-sm);padding:16px 18px;margin-bottom:18px;background:radial-gradient(400px 140px at 100% -40%,rgba(245,181,61,.12),transparent 60%),linear-gradient(180deg,var(--ink-3),var(--ink-2))}
.b-pactohead{display:flex;align-items:center;font-weight:600;color:var(--star)}
.b-hoje-teaser{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-top:2px solid var(--sc,var(--amber));border-radius:var(--radius-sm);cursor:pointer;background:var(--ink-2);transition:transform .16s}
.b-hoje-teaser:hover{transform:translateY(-2px);border-color:var(--sc,var(--amber))}
.b-state{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;border:1px solid var(--line-soft);border-radius:var(--radius-sm);margin-bottom:12px;background:var(--ink-2)}
.b-energy{display:flex;gap:6px;margin-left:auto}
.b-energy button{background:none;border:1px solid var(--line);border-radius:9px;font-size:18px;width:36px;height:34px;cursor:pointer;transition:.15s;line-height:1}
.b-energy button:hover{border-color:var(--amber);transform:translateY(-2px);background:rgba(245,181,61,.08)}
.b-cofre{border:1px solid rgba(95,208,166,.35);border-radius:var(--radius-sm);padding:14px 16px;margin:14px 0;background:rgba(95,208,166,.05)}
.b-provalist{margin:8px 0 0;padding-left:18px}
.b-provalist li{font-size:12.5px;color:var(--star);margin-bottom:4px;line-height:1.4}

/* ==== PREMIUM (Cofre Privado) ==== */
/* =====================================================================
   PREMIUM — direção "Cofre Privado" · camada de refinamento (vence a cascata)
   Aplica-se a TODO o produto: base Operação Blindada + aba A Bússola.
   ===================================================================== */
body{letter-spacing:.004em}
::selection{background:rgba(198,168,103,.26);color:#fff}

/* rótulos e títulos editoriais */
.eyebrow,.kicker{letter-spacing:.24em !important;text-transform:uppercase;color:var(--mute-2) !important;font-weight:500;font-family:var(--sans)}
h1.page,h2.sec,.hero h1,.hero h2{font-family:var(--serif);font-weight:500;letter-spacing:-.01em}
.lead{color:var(--mute);font-family:var(--sans)}
.stat-num{font-family:var(--serif);font-weight:500}

/* topbar — mais sóbria */
.brand small{letter-spacing:.16em;text-transform:uppercase;color:var(--mute-2)}
.chip{border-radius:2px;border:1px solid var(--line);background:none;text-transform:uppercase;letter-spacing:.1em;font-size:10px;color:var(--mute)}
.chip .xp,.chip .lvl,.chip .streak{color:var(--amber-bright)}

/* NAV — abas editoriais, sem emoji */
.tab .ic{display:none !important}
.tabs{gap:0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{border-radius:0;background:none !important;border:0;border-bottom:2px solid transparent;
  padding:15px 17px;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute-2);font-weight:500;transition:color .2s,border-color .2s}
.tab:hover{color:var(--star)}
.tab.active{color:var(--amber-bright);border-bottom-color:var(--amber);background:none !important}

/* sub-abas (Gestão + Bússola) */
.gtabs{gap:0;border-bottom:1px solid var(--line);flex-wrap:wrap;margin-bottom:8px}
.gtab{border-radius:0;background:none;border:0;border-bottom:2px solid transparent;
  padding:13px 15px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute-2)}
.gtab.on{color:var(--amber-bright);border-bottom-color:var(--amber);background:none}

/* botões — versalete, cantos secos */
.btn{border-radius:2px;font-family:var(--sans);letter-spacing:.14em;text-transform:uppercase;font-size:11px;font-weight:500;border:1px solid transparent}
.btn.primary{background:linear-gradient(180deg,var(--amber-bright),var(--amber));color:#241b08;box-shadow:none}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:none;border-color:var(--line);color:var(--star)}
.btn.ghost:hover{border-color:var(--amber);color:var(--amber-bright)}
.btn.sage{background:none;border-color:var(--line);color:var(--amber-bright)}
.btn.sage:hover{border-color:var(--amber)}
.btn.sm{font-size:10px;padding:9px 15px}.btn.xs{font-size:9.5px;padding:7px 12px;letter-spacing:.12em}

/* cartões, painéis, callouts — fio de ouro */
.card,.tool-card,.diary-entry,.plan-item,.trophy{border-radius:var(--radius);border:1px solid var(--line)}
.card{background:linear-gradient(180deg,var(--ink-3),var(--ink-2))}
.callout{border-radius:var(--radius);border:1px solid var(--line);background:rgba(198,168,103,.05);padding:15px 18px}
.callout .ic{display:none}
.challenge,.mentor-note{border-radius:var(--radius)}

/* chips / pills / status */
.pill,.badge-status,.pill-row .pill{border-radius:2px;border:1px solid var(--line);text-transform:uppercase;letter-spacing:.1em;font-size:10px;background:none;color:var(--mute)}
.pill.amber{background:var(--amber);color:#241b08;border-color:transparent}

/* módulos / trilhas — glifo discreto (menos "app") */
.module{border-radius:var(--radius)}
.module .glyph,.lesson-head .glyph{opacity:.45;filter:grayscale(.4)}
.ring{filter:grayscale(.2)}

/* likert / campos */
.likert button{border-radius:2px}
.in,input.in,textarea.in,select.in{border-radius:3px;background:var(--ink-2);border:1px solid var(--line)}
.in:focus{border-color:var(--amber)}
label.fld>span{letter-spacing:.14em;text-transform:uppercase;font-size:10.5px;color:var(--mute-2)}

/* toasts — refinados, sem emoji saltitante */
.toast{border-radius:2px;border:1px solid var(--line);background:var(--ink-2)}
.toast .em{display:none}
.toast b{font-family:var(--serif);font-weight:500}

/* modais */
.modal{border-radius:var(--radius);border:1px solid var(--line)}
.modal h3,.card h3,.tg-result h3{font-family:var(--serif);font-weight:500}

/* barra de ações de resultado */
.res-actions{border-top:1px solid var(--line);gap:4px}

/* diagnóstico / radar */
.diag-q{border-bottom:1px solid var(--line-soft)}
.cmp-track{border-radius:2px}

/* ===== Bússola — reforço editorial (mono ouro) ===== */
.bcard{border-radius:var(--radius-sm);border-top-width:1px}
.bcard-glyph{filter:none}
.b-featured{border-radius:var(--radius)}
.b-ii,.b-cofre,.b-pacto,.b-state,.b-hoje-teaser{border-radius:var(--radius-sm)}
.b-rlead,.b-report .b-rlead{font-family:var(--serif)}
.b-mini i.on{background:var(--amber)}

/* =====================================================================
   VIVO (2407.04) — joia sobre carbono iluminado.
   Cor vibrante no conteúdo; chrome permanece ouro. Vence a cascata.
   ===================================================================== */
body{
  background:
    radial-gradient(1150px 660px at 86% -12%, rgba(233,184,76,.14), transparent 58%),
    radial-gradient(780px 540px at 3% 4%, rgba(166,107,232,.11), transparent 55%),
    radial-gradient(720px 520px at 98% 42%, rgba(78,143,230,.08), transparent 55%),
    radial-gradient(880px 600px at 50% 114%, rgba(47,184,137,.08), transparent 55%),
    var(--ink) !important;
}
/* Baralho — gemas retroiluminadas na cor do naipe */
.bcard{
  background:
    radial-gradient(150% 82% at 50% -20%, color-mix(in srgb, var(--sc,var(--amber)) 32%, transparent), transparent 62%),
    linear-gradient(180deg, var(--ink-3), var(--ink-2)) !important;
  border-top:2px solid var(--sc,var(--amber)) !important;
  box-shadow:0 12px 36px -22px color-mix(in srgb, var(--sc,var(--amber)) 65%, transparent);
}
.bcard:hover{ box-shadow:0 24px 54px -20px color-mix(in srgb, var(--sc,var(--amber)) 75%, transparent) !important; }
.bcard-glyph,.b-fglyph{ text-shadow:0 0 22px color-mix(in srgb, var(--sc,var(--amber)) 65%, transparent); }
.b-featured{ box-shadow:0 26px 74px -32px color-mix(in srgb, var(--sc,var(--amber)) 78%, transparent); }
.b-tico{ text-shadow:0 0 18px color-mix(in srgb, var(--sc,var(--amber)) 60%, transparent); }
.b-bar>i{ box-shadow:0 0 10px color-mix(in srgb, var(--sc,var(--amber)) 60%, transparent); }
.b-mini i.on{ box-shadow:0 0 5px color-mix(in srgb, var(--sc,var(--amber)) 75%, transparent); }
.b-trilha{ box-shadow:0 12px 36px -26px color-mix(in srgb, var(--sc,var(--amber)) 55%, transparent); }
.b-step.done .b-node,.b-step.cur .b-node{ box-shadow:0 0 0 4px color-mix(in srgb, var(--amber) 18%, transparent),0 0 16px -4px var(--amber); }
.b-dim .dh b{ color:var(--amber-bright); }
/* Botões e cartões — profundidade e brilho quente */
.btn.primary{ box-shadow:0 10px 28px -12px rgba(233,184,76,.55) !important; }
.btn.primary:hover{ box-shadow:0 14px 34px -12px rgba(233,184,76,.7) !important; }
.card{ box-shadow:0 26px 64px -42px rgba(0,0,0,.82), inset 0 1px 0 rgba(255,255,255,.035); }
.stat-num{ color:var(--amber-bright); }
.tab.active,.gtab.on{ text-shadow:0 0 14px rgba(233,184,76,.35); }
/* topo com leve calor */
.topbar,.top-bar{ box-shadow:0 1px 0 var(--line),0 20px 40px -40px rgba(233,184,76,.4); }

.b-mini i.on{ background:var(--sc,var(--amber)) !important; }

/* =====================================================================
   ORIENTAÇÃO GUIADA (2407.05)
   ===================================================================== */
#afBanner{background:linear-gradient(180deg,rgba(198,168,103,.16),rgba(198,168,103,.05));border-bottom:1px solid var(--line);position:relative;z-index:9}
.af-banner-in{display:flex;align-items:center;gap:16px;padding:12px 22px;flex-wrap:wrap}
.af-bstep{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber-bright);white-space:nowrap;font-weight:600}
.af-btxt{font-size:13.5px;color:var(--mute);flex:1;min-width:200px}
.af-btxt b{color:var(--star);font-family:var(--serif);font-weight:500}
.af-bx{background:none;border:0;color:var(--mute-2);font-size:18px;cursor:pointer;line-height:1;padding:2px 6px}
.af-bx:hover{color:var(--amber-bright)}
/* roteiro (jornada) na Home */
.af-jornada{margin-bottom:20px;border-color:var(--amber) !important;background:radial-gradient(700px 240px at 0% -30%,rgba(198,168,103,.10),transparent 60%),linear-gradient(180deg,var(--ink-3),var(--ink-2)) !important}
.af-jhead{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap}
.af-jprog{text-align:right;min-width:120px}
.af-jpct{font-family:var(--serif);font-size:30px;color:var(--amber-bright);line-height:1}
.af-jpct span{font-size:16px;color:var(--mute-2)}
.af-jbar{height:4px;border-radius:100px;background:var(--line);overflow:hidden;margin-top:8px}
.af-jbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),var(--amber-bright));box-shadow:0 0 10px rgba(233,184,76,.6)}
.af-steps{display:flex;flex-direction:column}
.af-step{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line-soft)}
.af-step:first-child{border-top:0}
.af-node{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--serif);font-size:14px;color:var(--mute-2);background:var(--ink-2)}
.af-step.done .af-node{background:linear-gradient(180deg,var(--amber-bright),var(--amber));color:#241b08;border-color:transparent}
.af-step.cur .af-node{border-color:var(--amber);color:var(--amber-bright);box-shadow:0 0 0 4px rgba(233,184,76,.14),0 0 16px -3px var(--amber)}
.af-step.cur{background:linear-gradient(90deg,rgba(198,168,103,.07),transparent 70%);margin:0 -14px;padding:14px;border-radius:var(--radius);border-top-color:transparent}
.af-step.done .af-stitle{color:var(--mute)}
.af-stitle{font-family:var(--serif);font-size:17px;color:var(--star)}
.af-step.done .af-stitle{text-decoration:none;color:var(--mute-2)}
.af-now{font-family:var(--sans);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber-bright);border:1px solid var(--amber);border-radius:100px;padding:2px 8px;margin-left:8px;vertical-align:middle}
.af-sdesc{font-size:12.5px;color:var(--mute-2);margin-top:2px}
.af-doneb{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--sage)}
/* modal do método (duas frentes) */
.af-two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
@media(max-width:560px){.af-two{grid-template-columns:1fr}.af-step{grid-template-columns:32px 1fr;gap:10px}.af-step>.btn,.af-step .af-doneb{grid-column:2}}
.af-half{border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px 16px;background:var(--ink-2)}
.af-hk{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin-bottom:6px;font-weight:600}
.af-half p{font-size:13px;color:var(--mute);line-height:1.5}
.af-jfoot{margin-top:16px;padding-top:12px;border-top:1px solid var(--line-soft);text-align:right}
.af-jfoot a{color:var(--mute-2);cursor:pointer;font-size:11.5px;letter-spacing:.04em;text-decoration:underline;text-underline-offset:2px}
.af-jfoot a:hover{color:var(--coral)}

/* =====================================================================
   APP SHELL — navegação nativa (bottom tab bar + topo contextual)
   Pensada para virar app (Play Store / App Store): alvos grandes,
   zona do polegar, safe-areas, transição de "entrar na tela".
   ===================================================================== */

/* aposenta a antiga barra de abas horizontal */
.tabs{display:none !important}

/* respiro para a barra inferior fixa não cobrir conteúdo */
main.wrap{padding-bottom:calc(78px + env(safe-area-inset-bottom,0px)) !important}
/* toasts acima da barra */
.toast-zone{bottom:calc(90px + env(safe-area-inset-bottom,0px)) !important}

/* ---- Topo contextual (voltar + título da tela) ---- */
.topbar-inner{gap:12px !important;padding:11px 18px !important}
.topback{
  -webkit-appearance:none;appearance:none;background:transparent;border:0;cursor:pointer;
  width:40px;height:40px;margin-left:-8px;border-radius:12px;
  display:grid;place-items:center;color:var(--star);flex:0 0 auto;
  transition:background .15s ease}
.topback:hover{background:rgba(198,168,103,.12)}
.topback:active{transform:scale(.94)}
.screentitle{
  font-family:var(--serif);font-weight:600;font-size:19px;letter-spacing:.2px;
  color:var(--star);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---- Bottom tab bar ---- */
.appnav{
  position:fixed;left:0;right:0;bottom:0;z-index:90;
  display:flex;align-items:stretch;
  padding:6px max(10px,calc((100% - 600px)/2)) calc(6px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg,color-mix(in srgb,var(--ink-2) 82%,transparent),var(--ink-2) 40%);
  -webkit-backdrop-filter:saturate(1.3) blur(14px);backdrop-filter:saturate(1.3) blur(14px);
  border-top:1px solid var(--line);
  box-shadow:0 -1px 0 rgba(255,255,255,.02), 0 -18px 40px -30px rgba(0,0,0,.9)}
.appnav::before{content:"";position:absolute;top:-1px;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(233,184,76,.5),transparent);opacity:.7}
.anav{
  -webkit-appearance:none;appearance:none;background:transparent;border:0;cursor:pointer;
  flex:1 1 0;min-width:0;min-height:52px;padding:6px 2px 4px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--mute-2);position:relative;transition:color .18s ease;
  -webkit-tap-highlight-color:transparent}
.anav-ic{width:26px;height:26px;display:grid;place-items:center;transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.anav-ic svg{width:24px;height:24px;display:block}
.anav-lb{font-family:var(--sans);font-size:10.5px;letter-spacing:.02em;line-height:1;font-weight:600}
.anav:hover{color:var(--star)}
.anav:active .anav-ic{transform:scale(.9)}
.anav.active{color:var(--amber-bright)}
.anav.active .anav-ic{transform:translateY(-1px)}
.anav.active .anav-ic svg{filter:drop-shadow(0 0 9px rgba(233,184,76,.5))}
.anav.active::after{content:"";position:absolute;top:0;width:26px;height:3px;border-radius:0 0 4px 4px;
  background:linear-gradient(90deg,var(--amber),var(--amber-bright));box-shadow:0 0 10px rgba(233,184,76,.7)}

/* ---- Transição "entrar na tela" (push) ---- */
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.view.view-in{animation:viewIn .3s cubic-bezier(.22,.61,.36,1)}
@media(prefers-reduced-motion:reduce){.view.view-in{animation:none}}

/* ---- Tela "Mais" (hub de seções) ---- */
.menu-wrap{max-width:640px;margin:0 auto;padding:28px 0 8px}
.menu-head{margin-bottom:18px}
.menu-list{display:flex;flex-direction:column;gap:10px}
.menu-row{
  -webkit-appearance:none;appearance:none;cursor:pointer;text-align:left;width:100%;
  display:grid;grid-template-columns:52px 1fr 22px;align-items:center;gap:14px;
  padding:15px 16px;border-radius:16px;
  border:1px solid var(--line);
  background:linear-gradient(180deg,var(--ink-3),var(--ink-2));
  transition:border-color .16s ease,transform .12s ease,box-shadow .16s ease;
  -webkit-tap-highlight-color:transparent}
.menu-row:hover{border-color:var(--amber);box-shadow:0 10px 30px -22px rgba(233,184,76,.8)}
.menu-row:active{transform:scale(.99)}
.menu-ic{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;
  color:var(--amber-bright);
  background:radial-gradient(120% 120% at 30% 20%,rgba(233,184,76,.16),rgba(233,184,76,.04));
  border:1px solid color-mix(in srgb,var(--amber) 40%,transparent)}
.menu-ic svg{width:24px;height:24px}
.menu-tx{min-width:0}
.menu-tx b{display:block;font-family:var(--serif);font-size:17px;color:var(--star);letter-spacing:.2px}
.menu-tx small{display:block;font-size:12.5px;color:var(--mute-2);line-height:1.4;margin-top:3px}
.menu-cv{color:var(--mute-2);display:grid;place-items:center}
.menu-cv svg{width:20px;height:20px}
.menu-foot{margin-top:26px;padding-top:18px;border-top:1px solid var(--line-soft);text-align:center}
.menu-reset{color:var(--mute-2);cursor:pointer;font-size:12.5px;letter-spacing:.03em;
  text-decoration:underline;text-underline-offset:3px}
.menu-reset:hover{color:var(--coral)}

/* topo mais enxuto no celular */
@media(max-width:560px){
  .brand small{display:none}
  .brand b{font-size:16px}
  .screentitle{font-size:18px}
  .menu-wrap{padding-top:20px}
  .menu-tx b{font-size:16px}
  /* o chip de nível fica sem rótulo no celular (pílula vazia) — oculta */
  .top-stats .chip.lvl{display:none}
}

/* =====================================================================
   CARTA ABERTA (2407.08) — a carta aberta parece uma carta de verdade.
   Mesma identidade do baralho (--sc = cor do naipe). Não altera .bcard.
   ===================================================================== */
.bo{--sc:var(--amber)}

/* ---- a FACE da carta ---- */
.bo-face{
  position:relative;overflow:hidden;text-align:center;
  border-radius:16px;padding:26px 22px 22px;margin:26px 0 18px;
  border:1px solid color-mix(in srgb,var(--sc) 42%,var(--line));
  background:
    radial-gradient(150% 88% at 50% -22%, color-mix(in srgb,var(--sc) 30%,transparent), transparent 62%),
    linear-gradient(180deg,var(--ink-3),var(--ink-2));
  box-shadow:0 26px 66px -34px color-mix(in srgb,var(--sc) 78%,transparent),
             inset 0 1px 0 rgba(255,255,255,.04)}
/* moldura dupla, como carta impressa */
.bo-face::before{
  content:"";position:absolute;inset:7px;border-radius:11px;pointer-events:none;
  border:1px solid color-mix(in srgb,var(--sc) 26%,transparent)}
/* índices nos cantos (naipe + número), como baralho */
.bo-corner{position:absolute;display:flex;flex-direction:column;align-items:center;gap:1px;
  font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--sc);opacity:.9;line-height:1;z-index:2}
.bo-corner i{font-style:normal;font-size:14px;text-shadow:0 0 12px color-mix(in srgb,var(--sc) 60%,transparent)}
.bo-corner.tl{top:15px;left:16px}
.bo-corner.br{bottom:15px;right:16px;transform:rotate(180deg)}
/* marca d'água do naipe */
.bo-wm{position:absolute;top:50%;left:50%;transform:translate(-50%,-52%);
  font-size:190px;line-height:1;color:var(--sc);opacity:.07;pointer-events:none;user-select:none}
.bo-naipe{position:relative;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--sc);margin:0 0 6px;font-weight:600}
.bo-title{position:relative;font-family:var(--serif);font-size:30px;line-height:1.1;
  margin:0;color:var(--star);font-weight:600;letter-spacing:.2px}
.bo-rule{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;margin:14px auto 12px;max-width:230px}
.bo-rule i{flex:1;height:1px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--sc) 60%,transparent))}
.bo-rule i:last-child{background:linear-gradient(90deg,color-mix(in srgb,var(--sc) 60%,transparent),transparent)}
.bo-rule span{color:var(--sc);font-size:13px;text-shadow:0 0 14px color-mix(in srgb,var(--sc) 65%,transparent)}
.bo-q{position:relative;font-family:var(--serif);font-style:italic;font-size:16px;
  color:var(--mute);margin:0 auto;max-width:34ch;line-height:1.45}
/* atributos da carta (Força/Potência/Efetividade/Facilidade) */
.bo-stats{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0 0}
.bo-stat{display:flex;flex-direction:column;align-items:center;gap:5px}
.bo-stat>span{font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute-2)}
.bo-pips{display:flex;gap:3px}
.bo-pips i{width:5px;height:5px;border-radius:50%;background:var(--line);display:block}
.bo-pips i.on{background:var(--sc);box-shadow:0 0 6px color-mix(in srgb,var(--sc) 80%,transparent)}
.bo-stat>b{font-family:var(--mono);font-size:11px;color:var(--sc)}
.bo-dim{position:relative;margin:14px 0 0;font-size:9.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--mute-2)}
.bo-flag{position:relative;display:inline-block;margin-top:11px;
  font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--sage);
  border:1px solid var(--sage);border-radius:100px;padding:3px 10px}

/* ---- o padrão em jogo (leitura comportamental) ---- */
.bo-pattern{border-left:2px solid var(--sc);border-radius:0 10px 10px 0;padding:12px 15px;margin:0 0 16px;
  background:linear-gradient(90deg,color-mix(in srgb,var(--sc) 12%,transparent),transparent 85%);
  font-family:var(--serif);font-size:15.5px;line-height:1.45;color:var(--star)}
.bo-pattern b{display:block;font-family:var(--sans);font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--sc);margin-bottom:4px;font-weight:600}

/* ---- painéis de conteúdo ---- */
.bo-panels{display:flex;flex-direction:column;gap:0;margin:0 0 14px}
.bo-panel{padding:13px 0;border-top:1px solid var(--line-soft)}
.bo-panel:first-child{border-top:0;padding-top:4px}
.bo-panel h4{margin:0 0 4px;font-family:var(--sans);font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--mute-2);font-weight:600}
.bo-panel p{margin:0;font-size:14px;line-height:1.6;color:var(--mute)}

/* ---- a ferramenta ---- */
.bo-tool{border:1px solid color-mix(in srgb,var(--sc) 40%,var(--line));border-radius:12px;
  padding:14px 16px;margin:14px 0;font-size:14.5px;line-height:1.55;color:var(--star);
  background:radial-gradient(120% 140% at 0% 0%,color-mix(in srgb,var(--sc) 12%,transparent),transparent 70%)}
.bo-tool b{display:block;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--sc);margin-bottom:5px;font-weight:600}

.bo-cta{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);text-align:center}
.bo-cta .btn{min-width:220px;justify-content:center}
.bo-sign{margin:16px 0 0;text-align:center;font-family:var(--serif);font-style:italic;
  font-size:12.5px;color:var(--mute-2)}

/* =====================================================================
   CONSTRUTOR DE PLANO — nada começa em branco
   ===================================================================== */
.bp-lead{font-size:14px;color:var(--mute);line-height:1.6;margin:6px 0 18px}
.bp-step{display:grid;grid-template-columns:34px 1fr;gap:14px;padding:16px 0;border-top:1px solid var(--line-soft)}
.bp-step:first-of-type{border-top:0}
.bp-num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--serif);font-size:14px;color:var(--sc);background:var(--ink-2);
  border:1.5px solid color-mix(in srgb,var(--sc) 55%,var(--line))}
.bp-q{display:block;font-family:var(--serif);font-size:17px;font-weight:600;color:var(--star);margin-bottom:10px;line-height:1.3}
.bp-q .tiny,.bp-q .muted{display:block;font-family:var(--sans);font-size:11.5px;font-weight:400;
  letter-spacing:.01em;color:var(--mute-2);margin-top:3px}
/* nível de partida */
.bp-lvls{display:flex;flex-direction:column;gap:8px}
.bp-lvl{-webkit-appearance:none;appearance:none;cursor:pointer;text-align:left;width:100%;
  padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--ink-2);
  transition:border-color .15s,background .15s}
.bp-lvl b{display:block;font-size:14px;color:var(--star);font-weight:600}
.bp-lvl small{display:block;font-size:12px;color:var(--mute-2);margin-top:2px;line-height:1.4}
.bp-lvl:hover{border-color:color-mix(in srgb,var(--sc) 60%,var(--line))}
.bp-lvl.on{border-color:var(--sc);background:color-mix(in srgb,var(--sc) 10%,var(--ink-2));
  box-shadow:0 0 0 3px color-mix(in srgb,var(--sc) 14%,transparent)}
.bp-lvl.on b{color:var(--sc)}
/* sugestões de ação */
.bp-sugs{display:flex;flex-direction:column;gap:7px;margin-bottom:10px}
.bp-sug{-webkit-appearance:none;appearance:none;cursor:pointer;text-align:left;width:100%;
  padding:10px 13px;border-radius:10px;border:1px dashed var(--line);background:transparent;
  font-size:13.5px;line-height:1.45;color:var(--mute);transition:all .15s}
.bp-sug:hover{border-color:var(--sc);color:var(--star)}
.bp-sug.on{border-style:solid;border-color:var(--sc);color:var(--star);
  background:color-mix(in srgb,var(--sc) 9%,transparent)}
.bp-act{font-size:14px !important;line-height:1.5;min-height:92px !important;resize:vertical}
/* gatilhos */
.bp-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.bp-chip{-webkit-appearance:none;appearance:none;cursor:pointer;font-size:12px;
  padding:6px 12px;border-radius:100px;border:1px solid var(--line);background:transparent;
  color:var(--mute-2);transition:all .15s}
.bp-chip:hover,.bp-chip.on{border-color:var(--sc);color:var(--sc)}
.bp-more{margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:12px 15px;background:var(--ink-2)}
.bp-more summary{cursor:pointer;font-size:13px;color:var(--star);font-weight:600}
.bp-more summary::marker{color:var(--sc)}

/* =====================================================================
   O PLANO PRONTO
   ===================================================================== */
.pl-head{display:flex;align-items:center;gap:13px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.pl-badge{width:46px;height:46px;flex:0 0 auto;border-radius:12px;display:grid;place-items:center;
  font-size:22px;color:var(--amber-bright);border:1px solid color-mix(in srgb,var(--amber) 45%,transparent);
  background:radial-gradient(120% 120% at 30% 20%,rgba(233,184,76,.18),rgba(233,184,76,.04))}
.pl-kicker{margin:0;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);font-weight:600}
.pl-title{margin:3px 0 0;font-family:var(--serif);font-size:21px;font-weight:600;color:var(--star)}
.pl-pattern{margin:14px 0;padding:11px 14px;border-left:2px solid var(--amber);border-radius:0 8px 8px 0;
  background:linear-gradient(90deg,rgba(198,168,103,.12),transparent 85%);font-size:13.5px;line-height:1.5;color:var(--mute)}
.pl-pattern b{color:var(--amber);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  display:block;margin-bottom:3px}
.pl-row{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:13.5px;color:var(--mute)}
.pl-row>span{flex:0 0 118px;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute-2);padding-top:3px;font-weight:600}
.pl-commit{margin:16px 0;padding:15px 17px;border:1.5px solid var(--amber);border-radius:12px;
  background:radial-gradient(120% 140% at 0% 0%,rgba(233,184,76,.14),transparent 70%)}
.pl-commit>span{display:block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--amber);margin-bottom:5px;font-weight:600}
.pl-commit>b{font-family:var(--serif);font-size:19px;line-height:1.35;color:var(--star);font-weight:600}
.pl-seq{margin:16px 0}
.pl-s{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-soft)}
.pl-s>i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;
  font-family:var(--serif);font-size:12.5px;color:#241b08;background:linear-gradient(180deg,var(--amber-bright),var(--amber))}
.pl-s b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);margin-bottom:3px}
.pl-s>div{font-size:13.5px;line-height:1.5;color:var(--mute)}
.pl-grid{display:flex;flex-direction:column;gap:9px;margin:16px 0}
.pl-box{border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13.5px;line-height:1.5;color:var(--mute)}
.pl-box>span{display:block;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px;font-weight:600}
.pl-box.ok{border-left:2px solid var(--sage)}.pl-box.ok>span{color:var(--sage)}
.pl-box.warn{border-left:2px solid var(--coral)}.pl-box.warn>span{color:var(--coral)}
.pl-box.gold{border-left:2px solid var(--amber)}.pl-box.gold>span{color:var(--amber)}
.pl-check{margin:16px 0}
.pl-check>span{display:block;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute-2);margin-bottom:7px;font-weight:600}
.pl-days{display:flex;gap:8px}
.pl-days i{width:34px;height:34px;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;
  font-style:normal;font-family:var(--mono);font-size:12px;color:var(--mute-2)}
.pl-sign{margin:18px 0 0;text-align:center;font-family:var(--serif);font-style:italic;font-size:12.5px;color:var(--mute-2)}

@media(max-width:560px){
  .bo-title{font-size:25px}
  .bo-wm{font-size:150px}
  .bo-face{padding:24px 16px 20px}
  .bo-stats{grid-template-columns:repeat(2,1fr);gap:12px}
  .bo-q{font-size:15px}
  .bp-step{grid-template-columns:28px 1fr;gap:10px}
  .pl-commit>b{font-size:17px}
  .pl-row{flex-direction:column;gap:3px}
  .pl-row>span{flex:none}
  .pl-days i{width:30px;height:30px}
}

  var inpCss = "width:100%;padding:13px;border:1px solid #2a2c30;border-radius:10px;background:#141518;color:#e8e6e1;font-size:14px;margin-bottom:12px;box-sizing:border-box";
  var linkCss = "background:none;border:0;color:#8a8780;font-size:12px;cursor:pointer;margin-top:18px;text-decoration:underline";

  function showLogin() {
    overlay('<div style="color:#b9b6ad;font-size:13.5px;margin-bottom:18px">Entre com o <b>mesmo e-mail</b> que voce usou na compra.</div>'
      + '<input id="ob-email" type="email" placeholder="seu@email.com" style="' + inpCss + '"/>'
      + '<button id="ob-send" style="' + btnCss + '">Receber link de acesso</button>');
    var send = document.getElementById("ob-send"), inp = document.getElementById("ob-email");
    inp.addEventListener("keydown", function (e) { if (e.key === "Enter") send.click(); });
    send.addEventListener("click", function () {
      var email = (inp.value || "").trim().toLowerCase();
      if (!email || email.indexOf("@") < 0) { inp.focus(); return; }
      send.textContent = "Enviando..."; send.disabled = true;
      sb.auth.signInWithOtp({ email: email, options: { emailRedirectTo: location.href.split("#")[0] } })
        .then(function (r) {
          if (r.error) { send.textContent = "Tentar de novo"; send.disabled = false; return; }
          overlay('<div style="font-size:34px;margin-bottom:8px">&#128233;</div><div style="font-size:15px;margin-bottom:8px"><b>Link enviado!</b></div><div style="color:#b9b6ad;font-size:13px">Abra seu e-mail e toque no link para entrar. Pode fechar esta aba.</div>');
        });
    });
  }

  function showPending(email) {
    overlay('<div style="font-size:34px;margin-bottom:8px">&#9203;</div><div style="font-size:15px;margin-bottom:8px"><b>Acesso ainda nao liberado</b></div>'
      + '<div style="color:#b9b6ad;font-size:13px;line-height:1.5">Nao encontramos uma compra ativa para <b>' + email + '</b>.<br><br>Se voce acabou de comprar, aguarde 1-2 minutos e recarregue. Se usou outro e-mail na compra, entre com aquele e-mail.</div>'
      + '<button id="ob-reload" style="' + btnCss + ';margin-top:18px">Ja comprei - recarregar</button>'
      + '<button id="ob-logout" style="' + linkCss + '">Entrar com outro e-mail</button>');
    document.getElementById("ob-reload").addEventListener("click", function () { location.reload(); });
    document.getElementById("ob-logout").addEventListener("click", signOut);
  }

  function ensureClient() {
    if (sb) return sb;
    if (!window.supabase || !window.supabase.createClient) throw new Error("supabase-js nao carregou - confira sua conexao.");
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, detectSessionInUrl: true, autoRefreshToken: true } });
    return sb;
  }
  function ensureProfile() {
    var name = (user.user_metadata && user.user_metadata.full_name) || "";
    var display = name ? name.split(" ")[0] : (user.email || "").split("@")[0];
    return sb.from("profiles").upsert({ user_id: user.id, email: user.email, display_name: display, full_name: name }, { onConflict: "user_id", ignoreDuplicates: true });
  }
  function checkAccess() {
    return sb.from("access").select("status,expires_at").eq("email", (user.email || "").toLowerCase()).maybeSingle()
      .then(function (r) {
        if (r.error || !r.data) return false;
        if (r.data.status === "active") return true;
        if (r.data.status === "grace" && r.data.expires_at && new Date(r.data.expires_at) > new Date()) return true;
        return false;
      });
  }
  function pullState() {
    return sb.from("progress").select("state").eq("user_id", user.id).maybeSingle()
      .then(function (r) {
        if (r.error) return;
        if (r.data && r.data.state && Object.keys(r.data.state).length) {
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(r.data.state)); } catch (e) {}
        } else {
          var local = null; try { local = localStorage.getItem(STORAGE_KEY); } catch (e) {}
          var parsed = {}; try { parsed = local ? JSON.parse(local) : {}; } catch (e) { parsed = {}; }
          return sb.from("progress").upsert({ user_id: user.id, state: parsed, xp: parsed.xp || 0, level: parsed.level || 1 }, { onConflict: "user_id" });
        }
      });
  }
  function continueAuthed() {
    return ensureProfile().then(function () {
      return sb.from("profiles").select("is_mentor").eq("user_id", user.id).maybeSingle()
        .then(function (r) { isMentorFlag = !!(r && r.data && r.data.is_mentor); });
    }).then(checkAccess).then(function (ok) {
      if (!ok) { showPending(user.email); return; }
      return pullState().then(function () { closeOverlay(); if (readyResolve) { readyResolve(); readyResolve = null; } });
    });
  }
  function signOut() { if (!sb) { location.reload(); return; } sb.auth.signOut().then(function () { location.reload(); }); }

  return {
    start: function () {
      return new Promise(function (resolve) {
        if (PREVIEW) { resolve(); return; }              // local = abre direto, sem trava
        readyResolve = resolve;
        try { ensureClient(); } catch (e) { overlay('<div style="color:#d98a8a;font-size:13px">' + e.message + "</div>"); return; }
        sb.auth.onAuthStateChange(function (_evt, session) {
          if (session && session.user && !started) { started = true; user = session.user; continueAuthed(); }
        });
        sb.auth.getSession().then(function (r) {
          if (r.data && r.data.session) { started = true; user = r.data.session.user; continueAuthed(); }
          else { showLogin(); }
        });
      });
    },
    push: function (S) {
      if (PREVIEW || !sb || !user) return;
      clearTimeout(pushTimer);
      pushTimer = setTimeout(function () {
        sb.from("progress").upsert({ user_id: user.id, state: S, xp: S.xp || 0, level: S.level || 1 }, { onConflict: "user_id" }).then(function () {});
      }, 1200);
    },
    getRanking: function (limit) {
      if (PREVIEW || !sb) return Promise.resolve([]);
      return sb.rpc("get_ranking", { p_limit: limit || 50 }).then(function (r) { return r.error ? [] : (r.data || []); });
    },
    isPreview: function () { return PREVIEW; },
    shield: shieldSvg,
    audioList: function (limit) {
      if (PREVIEW || !sb) return Promise.resolve([]);
      return sb.from("audios").select("id,data,titulo,url,transcricao,created_at")
        .order("data", { ascending: false }).order("created_at", { ascending: false }).limit(limit || 14)
        .then(function (r) { return r.error ? [] : (r.data || []); });
    },
    audioPublish: function (o) {
      if (PREVIEW || !sb || !isMentorFlag) return Promise.resolve({ error: true });
      return sb.from("audios").insert({ titulo: o.titulo || null, url: o.url, transcricao: o.transcricao || null });
    },
    audioUpload: function (file) {
      if (PREVIEW || !sb || !isMentorFlag) return Promise.resolve({ error: true });
      var path = Date.now() + "_" + String(file.name || "audio").replace(/[^a-zA-Z0-9._-]/g, "_");
      return sb.storage.from("audios").upload(path, file, { upsert: false }).then(function (r) {
        if (r.error) return { error: r.error };
        var pub = sb.storage.from("audios").getPublicUrl(path);
        return { url: (pub && pub.data && pub.data.publicUrl) || "" };
      });
    },
    isMentor: function () { return !PREVIEW && isMentorFlag; },
    email: function () { return user ? user.email : null; },
    caixinhaAsk: function (text) {
      if (PREVIEW || !sb || !user) return Promise.resolve({ error: true });
      return sb.from("caixinha").insert({ user_id: user.id, pergunta: text, asker_email: user.email })
        .then(function (r) {
          if (r.error) return sb.from("caixinha").insert({ user_id: user.id, pergunta: text }); // fallback pre-migracao
          return r;
        });
    },
    caixinhaList: function () {
      if (PREVIEW || !sb || !user) return Promise.resolve([]);
      var q = sb.from("caixinha").select("id,pergunta,resposta,respondida,asker_email,created_at,answered_at");
      if (!isMentorFlag) q = q.eq("user_id", user.id);
      return q.order("respondida", { ascending: true }).order("created_at", { ascending: false })
        .then(function (r) { return r.error ? [] : (r.data || []); });
    },
    caixinhaAnswer: function (id, text) {
      if (PREVIEW || !sb || !isMentorFlag) return Promise.resolve({ error: true });
      return sb.from("caixinha").update({ resposta: text, respondida: true, answered_at: new Date().toISOString() }).eq("id", id);
    },
    signOut: signOut
  };
})();

window.obEsc = function (s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); };

window.loadObCaixinha = function () {

      var hdr = '<p class="muted tiny" style="margin:0 0 10px">Modo mentora — responda às perguntas dos membros aqui.</p>';
      if (!rows.length) { box.innerHTML = hdr + '<p class="muted tiny" style="margin:0">Nenhuma pergunta ainda.</p>'; return; }

          + '<div class="btn-row" style="margin-top:8px"><button class="btn sage sm" onclick="obAnswerQuestion(\'' + r.id + '\')">Responder</button></div></div>';
      }).join("");

window.obFmtDate = function (d) { try { var p = String(d).split("-"); return p[2] + "/" + p[1]; } catch (e) { return d; } };

window.loadObAudioHome = function () {
