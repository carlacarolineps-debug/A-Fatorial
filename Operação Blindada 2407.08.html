    else status='<p class="muted tiny" style="margin:0 0 14px">Ainda não respondida.</p>';

function avgScore(rec){ const v=Object.values(rec.answers); return v.length? v.reduce((a,b)=>a+(+b),0)/v.length : 0; }
function avgPct(rec){ return Math.round(avgScore(rec)/5*100); }

let surveyTmp={};

  const s=SURVEYS.find(x=>x.id===id); surveyTmp={};

    <div class="divider"></div>

function likertSurvey(i,kind){
  const labels = kind==='profile' ? [['1','Nada a ver'],['2',''],['3','Às vezes'],['4',''],['5','Sou eu']] : [['1','Discordo'],['2',''],['3','Neutro'],['4',''],['5','Concordo']];
  return `<div class="likert" data-s="${i}">`+labels.map(([n,l])=>`<button onclick="pickSurvey(this,${i},${n})"><span class="n">${n}</span>${l||'·'}</button>`).join('')+`</div>`;
}
function pickSurvey(btn,i,n){ const g=btn.closest('.likert'); [...g.children].forEach(b=>b.classList.remove('on')); btn.classList.add('on'); surveyTmp[i]=n; }
function submitSurvey(id){
  const s=SURVEYS.find(x=>x.id===id);
  if(Object.keys(surveyTmp).length<s.items.length){ toast('⚠️','Responda tudo','Faltam itens para enviar.'); return; }
  const fresh=!S.surveys[id];
  S.surveys[id]={answers:{...surveyTmp}, submittedAt:Date.now()};
  if(fresh){ addXp(40,`${s.kind==='profile'?'Teste aplicado':'Pesquisa aplicada'} — ${s.title}`); S.log.unshift({t:Date.now(),type:'survey',label:`${s.kind==='profile'?'Teste respondido':'Pesquisa respondida'}: ${s.title}`}); }
  else { addXp(15,`Atualizado — ${s.title}`); }
  if(Object.keys(S.surveys).length>0) grantTrophy('survey_done');
  if(Object.keys(S.surveys).length>=SURVEYS.length) grantTrophy('all_surveys');
  save(); closeModal(); renderPesquisas();
  setTimeout(()=>showSurveyResult(id),200);
}
function profileScores(s,rec){
  const sums={},cnts={};
  Object.keys(s.dims).forEach(k=>{sums[k]=0;cnts[k]=0;});
  s.items.forEach((it,i)=>{ const v=+rec.answers[i]||0; const val=it.reverse?(6-v):v; if(sums[it.dim]!==undefined){sums[it.dim]+=val;cnts[it.dim]++;} });
  return Object.keys(s.dims).map(k=>({k,label:s.dims[k],pct:cnts[k]?Math.round(sums[k]/(cnts[k]*5)*100):0})).sort((a,b)=>b.pct-a.pct);
}
const FIELD_ORDER=['lema','forte','sombra','trabalho','valoriza','contexto','risco','lidar','usar','desenvolver','dica'];
const FIELD_LABELS={lema:'Essência',forte:'Forças',sombra:'Ponto de atenção',trabalho:'No trabalho',valoriza:'O que valoriza',contexto:'Contexto ideal',risco:'O que frustra',lidar:'Como se relacionar e liderar',usar:'Como aproveitar no time',desenvolver:'Como desenvolver',dica:'Dica prática'};
function descBlock(d){
  if(!d) return '';
  return FIELD_ORDER.filter(f=>d[f]!=null).map(f=>{
    const v=d[f];
    if(f==='lema') return `<p style="font-style:italic;color:var(--star)">${tgEsc(v)}</p>`;
    const body=Array.isArray(v)?('<ul>'+v.map(x=>`<li>${tgEsc(x)}</li>`).join('')+'</ul>'):`<p>${tgEsc(v)}</p>`;
    return `<h5>${FIELD_LABELS[f]}</h5>${body}`;
  }).join('');
}
function showProfileResult(s,rec){
  const ranks=profileScores(s,rec);
  const top=ranks[0], sec=ranks[1];
  const topN=s.reportTop||2;
  const bars=ranks.map(r=>{const col=r.pct>=66?'var(--sage)':r.pct>=40?'var(--amber)':'var(--steel)';return `<div><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px"><span>${tgEsc(r.label)}</span><b style="color:${col}">${r.pct}%</b></div><div class="bar"><i style="width:${r.pct}%;background:${col}"></i></div></div>`;}).join('');
  const cards=ranks.slice(0,topN).map((r,idx)=>`<div class="tg-result" style="margin-top:14px"><div class="tg-badge">${idx===0?'Perfil dominante':(topN>3?'Domínio':'Perfil secundário')}</div><h4>${tgEsc(r.label)} · ${r.pct}%</h4>${descBlock(s.desc[r.k])}</div>`).join('');
  const leitura = s.id==='disc' ? 'Aplique este teste com o time para montar a comunicação ideal com cada pessoa.'
    : s.id==='ancoras' ? 'Use a âncora dominante de cada pessoa para alocar e reter no lugar certo.'
    : s.id==='ie' ? 'Escolha o domínio mais baixo e treine só ele por 30 dias.'
    : 'Aplique com o time para conhecer cada pessoa de verdade.';
  const dd=s.desc[top.k]||{};
  const acts=[];
  if(dd.desenvolver) acts.push(typeof dd.desenvolver==='string'?dd.desenvolver:dd.desenvolver[0]);
  if(dd.dica) acts.push(dd.dica);
  if(dd.usar) acts.push(dd.usar);
  if(!acts.length) acts.push(`Trabalhar meu ponto de atenção em ${tgEsc(top.label)}`);
  const body=`${s.note?`<div class="callout" style="margin:0 0 14px"><span class="ic">ℹ️</span><div>${s.note}</div></div>`:''}
    <div class="card" style="text-align:center;margin:0 0 14px;border-color:rgba(245,181,61,.4)">
      <div class="stat-num" style="color:var(--amber);font-size:22px">${tgEsc(top.label)}</div>
      <div class="stat-lbl">Seu perfil dominante${sec?` · 2º: ${tgEsc(sec.label)}`:''}</div>
    </div>
    <h4 style="font-family:var(--serif);margin:10px 0 12px">Seu perfil completo</h4>
    <div style="display:flex;flex-direction:column;gap:11px">${bars}</div>
    ${cards}
    <div class="callout mt16"><span class="ic"></span><div><b>Leitura da mentora:</b> ninguém é um tipo puro — você é a combinação. Use suas <b>forças</b> de propósito e trabalhe <b>um</b> ponto de atenção por vez. ${leitura}</div></div>`;
  modal(withResultActions({eyebrow:'Laudo · '+s.icon, title:s.title, icon:s.icon, bodyHtml:body,
    actions:acts.slice(0,3), pdcaTitle:`Desenvolver: ${s.title}`,
    diaryText:`No teste ${s.title} meu perfil dominante foi ${top.label}. O que isso me mostra e o que vou desenvolver: `,
    extra:`<div class="btn-row" style="margin-top:12px"><button class="btn ghost" onclick="closeModal()">Fechar laudo</button></div>`}));
}
function showSurveyResult(id){
  const s=SURVEYS.find(x=>x.id===id);
  const rec=S.surveys[id]; if(!rec) return;
  if(s.kind==='profile') return showProfileResult(s,rec);
  const cats={};
  s.items.forEach((it,i)=>{ if(!cats[it.cat])cats[it.cat]=[]; cats[it.cat].push(+rec.answers[i]); });
  const rows=Object.entries(cats).map(([c,arr])=>{ const m=arr.reduce((a,b)=>a+b,0)/arr.length; return {c,m}; }).sort((a,b)=>a.m-b.m);
  const overall=avgScore(rec);
  const lowest=rows[0], highest=rows[rows.length-1];
  const body=`<div class="card" style="text-align:center;margin:0 0 14px;border-color:rgba(245,181,61,.4)">

function planDueLabel(i){
  if(!i.due) return '';
  const days=Math.ceil((i.due-Date.now())/86400000);
  if(i.done) return 'concluída';
  if(days<0) return 'atrasada';
  if(days===0) return 'hoje';
  return `${days}d`;
}
function addPlan(){
  const text=$('#planText').value.trim();
  if(!text){ $('#planText').focus(); $('#planText').style.borderColor='var(--coral)'; return; }
  const days=+$('#planDue').value;
  S.plan.push({id:'p'+Date.now(), text, due:Date.now()+days*86400000, done:false});
  addXp(15,'Ação adicionada ao plano');
  renderPlano();
}
function addPlanFrom(modId){
  const m=MODULES.find(x=>x.id===modId);
  S.plan.push({id:'p'+Date.now(), text:m.challenge, due:Date.now()+30*86400000, done:false, from:modId});
  addXp(15,'Ação adicionada ao plano'); renderPlano();
}
function togglePlan(id){
  const it=S.plan.find(p=>p.id===id); if(!it) return;
  it.done=!it.done;
  if(it.done){ addXp(20,'Ação concluída'); toast('','Ação concluída','Mais uma mudança real. Continue.'); }
  else save();
  renderPlano();
}
function delPlan(id){ S.plan=S.plan.filter(p=>p.id!==id); save(); renderPlano(); }
function exportPlanICS(){
  const items=(S.plan||[]).filter(p=>p.due);
  if(!items.length){ toast('','Nada para exportar','Adicione ações com prazo primeiro.'); return; }
  const pad=n=>String(n).padStart(2,'0');
  const fmt=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());
  const now=new Date();
  const dtstamp=now.getUTCFullYear()+pad(now.getUTCMonth()+1)+pad(now.getUTCDate())+'T'+pad(now.getUTCHours())+pad(now.getUTCMinutes())+pad(now.getUTCSeconds())+'Z';
  const esc=s=>(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
  let ics='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Operacao Blindada//Plano 30d//PT-BR\r\nCALSCALE:GREGORIAN\r\n';
  items.forEach(p=>{
    const start=new Date(p.due); const end=new Date(p.due+86400000);
    ics+='BEGIN:VEVENT\r\n';
    ics+='UID:'+p.id+'@operacao-blindada\r\n';
    ics+='DTSTAMP:'+dtstamp+'\r\n';
    ics+='DTSTART;VALUE=DATE:'+fmt(start)+'\r\n';
    ics+='DTEND;VALUE=DATE:'+fmt(end)+'\r\n';
    ics+='SUMMARY:'+esc(''+p.text)+'\r\n';
    ics+='DESCRIPTION:'+esc('Ação do seu Plano de 30 dias — Operação Blindada.'+(p.done?' (concluída)':''))+'\r\n';
    ics+='BEGIN:VALARM\r\nTRIGGER:-PT9H\r\nACTION:DISPLAY\r\nDESCRIPTION:'+esc(p.text)+'\r\nEND:VALARM\r\n';
    ics+='END:VEVENT\r\n';
  });
  ics+='END:VCALENDAR\r\n';
  const blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download='operacao-blindada-plano.ics'; a.click(); URL.revokeObjectURL(url);
  toast('','Plano exportado','Abra o arquivo .ics para importar no seu Google Agenda.');
}

function showPdcaAnalysis(id){
  const c=(S.pdca||[]).find(x=>x.id===id); if(!c) return;
  const keys=[['plan','Planejar'],['do','⚙️ Executar'],['check','Checar'],['act','Agir']];
  const filled=keys.filter(([k])=>c[k]&&c[k].trim());
  const pct=Math.round(filled.length/4*100);
  let diag, next;
  if(filled.length===0){ diag='Ciclo ainda em branco. Comece pelo <b>Planejar</b>: o quê, por quê e até quando.'; next='Definir o plano em uma frase clara.'; }
  else if(!(c.do&&c.do.trim())){ diag='Você <b>planejou mas ainda não executou</b>. O maior risco do PDCA é morrer no papel — tire o plano da gaveta esta semana.'; next='Executar o primeiro passo do plano nos próximos 7 dias.'; }
  else if(!(c.check&&c.check.trim())){ diag='Você executou, mas <b>ainda não checou</b>. Sem medir, você não sabe se funcionou — compare o que aconteceu com o que esperava.'; next='Medir o resultado e comparar com a meta.'; }
  else if(!(c.act&&c.act.trim())){ diag='Você já checou os resultados. Falta o passo que gera melhoria de verdade: <b>o que manter, mudar ou padronizar?</b>'; next='Decidir o que padronizar e abrir o próximo ciclo.'; }
  else { diag='<b>Ciclo completo!</b> Você rodou as quatro fases. Agora padronize o que funcionou e abra o próximo ciclo com o aprendizado.'; next=c.act; }
  const recap=keys.map(([k,l])=>`<div class="metric"><b>${l}</b><span>${c[k]&&c[k].trim()?'':'—'}</span></div>${c[k]&&c[k].trim()?`<p style="margin:2px 0 10px;font-size:13px;color:var(--steel)">${escapeHtml(c[k])}</p>`:''}`).join('');
  const col=pct<50?'var(--coral)':pct<100?'var(--amber)':'var(--sage)';
  const body=`<div class="card" style="text-align:center;margin:0 0 14px;border-color:${col}">
      <div class="stat-num" style="color:${col}">${pct}%</div><div class="stat-lbl">do ciclo preenchido · fase atual: ${(PDCA_STAGES[c.stage]||PDCA_STAGES.P).n}</div></div>
    <div class="bar" style="margin:0 0 16px"><i style="width:${pct}%;background:${col}"></i></div>
    <h4>Onde o ciclo está</h4>${recap}
    <div class="callout mt16"><span class="ic"></span><div>${diag}</div></div>`;
  modal(withResultActions({eyebrow:'Análise do ciclo', title:c.title, icon:'', bodyHtml:body,
    actions:[next].filter(Boolean), pdcaTitle:'Próximo ciclo: '+c.title,
    diaryText:`No ciclo PDCA "${c.title}" cheguei a ${pct}%. Próximo passo: `,
    extra:`<div class="btn-row" style="margin-top:12px"><button class="btn ghost sm" onclick="openPdca('${id}')">✏️ Editar ciclo</button></div>`}));
}

function gcalUrl(title,dateTs,details){
  const pad=n=>String(n).padStart(2,'0');
  const d=new Date(dateTs); const s=d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());
  const e=new Date(dateTs+86400000); const en=e.getFullYear()+pad(e.getMonth()+1)+pad(e.getDate());
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(''+title)+'&dates='+s+'/'+en+'&details='+encodeURIComponent(details||'Ação agendada na Operação Blindada.');
}
function delAgenda(id){ S.agenda=(S.agenda||[]).filter(x=>x.id!==id); save(); renderPlano(); }
function exportAgendaICS(){
  const items=(S.agenda||[]);
  if(!items.length){ toast('','Nada para exportar','Agende uma ação primeiro.'); return; }
  const pad=n=>String(n).padStart(2,'0');
  const fmt=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());
  const now=new Date();
  const dtstamp=now.getUTCFullYear()+pad(now.getUTCMonth()+1)+pad(now.getUTCDate())+'T'+pad(now.getUTCHours())+pad(now.getUTCMinutes())+pad(now.getUTCSeconds())+'Z';
  const esc=s=>(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
  let ics='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Operacao Blindada//Agenda//PT-BR\r\nCALSCALE:GREGORIAN\r\n';
  items.forEach(p=>{
    const start=new Date(p.date); const end=new Date(p.date+86400000);
    ics+='BEGIN:VEVENT\r\nUID:'+p.id+'@operacao-blindada\r\nDTSTAMP:'+dtstamp+'\r\nDTSTART;VALUE=DATE:'+fmt(start)+'\r\nDTEND;VALUE=DATE:'+fmt(end)+'\r\nSUMMARY:'+esc(''+p.title)+'\r\nDESCRIPTION:'+esc('Ação agendada na Operação Blindada.'+(p.src?' Origem: '+p.src:''))+'\r\nBEGIN:VALARM\r\nTRIGGER:-PT9H\r\nACTION:DISPLAY\r\nDESCRIPTION:'+esc(p.title)+'\r\nEND:VALARM\r\nEND:VEVENT\r\n';
  });
  ics+='END:VCALENDAR\r\n';
  const blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download='operacao-blindada-agenda.ics'; a.click(); URL.revokeObjectURL(url);
  toast('','Agenda exportada','Abra o .ics no Google ou Apple Agenda.');
}

let diagTmp={};
function openDiagnostic(isRetake){
  diagTmp={};
  const prev=isRetake?S.diagnostic:null;
  modal(`<p class="eyebrow">${isRetake?'Rediagnóstico':'Ponto de partida'}</p>
    <h3>${isRetake?'Como você está agora?':'Autodiagnóstico de maturidade'}</h3>

    <div class="mt16" id="diagForm"></div>
    <div class="divider"></div>
    <button class="btn primary" onclick="submitDiagnostic(${!!isRetake})">${isRetake?'Ver minha evolução':'Salvar diagnóstico (+50 XP)'}</button>`);
  const f=$('#diagForm');
  DIAGNOSTIC.forEach((d,i)=>{
    const item=el('div','diag-q');
    item.innerHTML=`<div class="dim">${d.dim}</div><div class="q">${d.q}</div>${likertDiag(i)}`;

function likertDiag(i){
  return `<div class="likert" data-d="${i}">`+[1,2,3,4,5].map(n=>`<button onclick="pickDiag(this,${i},${n})"><span class="n">${n}</span></button>`).join('')+`</div>`;
}
function pickDiag(btn,i,n){ const g=btn.closest('.likert'); [...g.children].forEach(b=>b.classList.remove('on')); btn.classList.add('on'); diagTmp[i]=n; }
function submitDiagnostic(isRetake){
  if(Object.keys(diagTmp).length<DIAGNOSTIC.length){ toast('⚠️','Responda tudo','Faltam itens para concluir.'); return; }
  const answers={}; DIAGNOSTIC.forEach((d,i)=>answers[d.dim]=diagTmp[i]);
  if(isRetake){ S.retake={answers, at:Date.now()}; addXp(60,'Rediagnóstico concluído'); save(); closeModal(); showEvolution(); }
  else { S.diagnostic={answers, at:Date.now()}; addXp(50,'Autodiagnóstico inicial'); checkTrophies(); save(); closeModal(); showDiagnosticResult(); }
}
function dimAvg(ans){ const v=Object.values(ans); return v.reduce((a,b)=>a+(+b),0)/v.length; }
function showDiagnosticResult(){
  const ans=S.diagnostic.answers;
  const rows=Object.entries(ans).sort((a,b)=>a[1]-b[1]);
  const low=rows[0], high=rows[rows.length-1];
  modal(`<p class="eyebrow">Seu ponto de partida</p><h3>Mapa de maturidade</h3>
    ${radarSVG(ans)}
    <div class="callout mt16"><span class="ic"></span><div>Onde você se vê mais forte: <b>${high[0]}</b>. Onde há mais espaço para crescer: <b>${low[0]}</b>. Sugiro começar dando atenção especial à trilha de ${low[0]} — e, ao fim da jornada, refazer este diagnóstico para ver o quanto avançou.</div></div>
    <button class="btn primary" onclick="closeModal();go('trilhas')">Começar pelas trilhas →</button>`);
}
function showEvolution(){
  const before=S.diagnostic.answers, after=S.retake.answers;
  const dims=Object.keys(before);
  const avgB=dimAvg(before), avgA=dimAvg(after);
  const delta=(avgA-avgB);
  modal(`<p class="eyebrow">Antes e depois</p><h3>Sua evolução</h3>
    <div class="card" style="text-align:center;margin:14px 0;border-color:rgba(95,208,166,.4)">
      <div style="display:flex;justify-content:center;gap:30px;align-items:center">
        <div><div class="stat-num" style="color:var(--violet)">${avgB.toFixed(1)}</div><div class="stat-lbl">Início</div></div>
        <div style="font-size:24px;color:var(--sage)">→</div>
        <div><div class="stat-num" style="color:var(--sage)">${avgA.toFixed(1)}</div><div class="stat-lbl">Agora</div></div>
        <div style="border-left:1px solid var(--line-soft);padding-left:24px"><div class="stat-num" style="color:${delta>=0?'var(--sage)':'var(--coral)'}">${delta>=0?'+':''}${delta.toFixed(1)}</div><div class="stat-lbl">Evolução</div></div>
      </div>
    </div>
    <div style="margin:10px 0">${dims.map(d=>{
      const b=before[d], a=after[d];
      return `<div class="cmp-bar"><span class="lb">${d}</span>
        <div class="cmp-track"><div class="before" style="width:${b/5*100}%"></div><div class="after" style="width:${a/5*100}%"></div></div>
        <span class="tiny" style="color:${a>=b?'var(--sage)':'var(--coral)'};text-align:right">${a>b?'+':''}${a-b}</span></div>`;
    }).join('')}</div>
    <p class="tiny muted" style="margin:4px 0 14px"><span style="color:var(--violet)">▬</span> antes &nbsp; <span style="color:var(--sage)">▬</span> agora</p>
    <div class="callout"><span class="ic"></span><div><b>${delta>0?'Você evoluiu de forma mensurável.':'Você manteve sua base.'}</b> Esse é o tipo de prova que transforma percepção em resultado. Guarde este antes e depois — ele conta a sua história de desenvolvimento.</div></div>
    <button class="btn primary" onclick="closeModal()">Fechar</button>`);
}
function radarSVG(ans){
  const dims=Object.keys(ans), N=dims.length, cx=150, cy=150, R=110;
  const pt=(i,r)=>{ const a=(Math.PI*2*i/N)-Math.PI/2; return [cx+Math.cos(a)*r, cy+Math.sin(a)*r]; };
  let grid='';
  [0.25,0.5,0.75,1].forEach(f=>{ const pts=dims.map((_,i)=>pt(i,R*f).join(',')).join(' '); grid+=`<polygon points="${pts}" fill="none" stroke="rgba(120,130,170,.18)" stroke-width="1"/>`; });
  let axes='', labels='';
  dims.forEach((d,i)=>{ const [x,y]=pt(i,R); axes+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(120,130,170,.18)"/>`;
    const [lx,ly]=pt(i,R+22); labels+=`<text x="${lx}" y="${ly}" font-size="9" fill="#9aa6cf" text-anchor="middle" dominant-baseline="middle" font-family="monospace">${d}</text>`; });
  const dataPts=dims.map((d,i)=>pt(i,R*(ans[d]/5)).join(',')).join(' ');
  return `<div class="center"><svg viewBox="0 0 300 320" style="max-width:340px;width:100%">
    <defs>
      <radialGradient id="radFill" cx="50%" cy="42%" r="60%">
        <stop offset="0%" stop-color="rgba(233,212,160,.42)"/>
        <stop offset="60%" stop-color="rgba(198,168,103,.22)"/>
        <stop offset="100%" stop-color="rgba(198,168,103,.06)"/>
      </radialGradient>
      <filter id="radGlow" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    ${grid}${axes}
    <polygon points="${dataPts}" fill="url(#radFill)" stroke="var(--amber-bright,#e9d4a0)" stroke-width="2" filter="url(#radGlow)"/>
    ${dims.map((d,i)=>{const [x,y]=pt(i,R*(ans[d]/5));return `<circle cx="${x}" cy="${y}" r="3.6" fill="var(--amber-bright,#e9d4a0)" filter="url(#radGlow)"/>`;}).join('')}
    ${labels}
  </svg></div>`;
}

let deepTmp={}, deepCurrentId=null;
function openDeepTest(id){
  const t=DEEP_TESTS[id]; if(!t) return;
  deepCurrentId=id; deepTmp={};
  const m=MODULES.find(x=>x.id===id);
  const doneBefore=!!S.deepTests?.[id]?.at;
  modal(`<p class="eyebrow">Teste Profundo${m?' · '+m.title:''}</p>
    <h3>${t.title}</h3>
    <p class="muted tiny" style="margin:6px 0 0">${t.intro}</p>
    <p class="muted tiny" style="margin:8px 0 0">Escala: <b>1 = discordo totalmente</b> · <b>5 = concordo totalmente</b>.</p>
    <div class="mt16" id="deepForm"></div>
    <div class="divider"></div>
    <button class="btn primary" onclick="submitDeepTest()">Ver meu resultado${doneBefore?'':' (+40 XP)'}</button>`);
  const f=$('#deepForm');
  t.items.forEach((it,i)=>{
    const item=el('div','diag-q');
    item.innerHTML=`<div class="dim">${t.dims[it.dim]}</div><div class="q">${it.q}</div>${likertDeep(i)}`;
    f.appendChild(item);
  });
}
function likertDeep(i){ return `<div class="likert" data-d="${i}">`+[1,2,3,4,5].map(n=>`<button onclick="pickDeep(this,${i},${n})"><span class="n">${n}</span></button>`).join('')+`</div>`; }
function pickDeep(btn,i,n){ const g=btn.closest('.likert'); [...g.children].forEach(b=>b.classList.remove('on')); btn.classList.add('on'); deepTmp[i]=n; }
function deepCompute(t,ans){
  const sums={},counts={}; Object.keys(t.dims).forEach(k=>{sums[k]=0;counts[k]=0;});
  t.items.forEach((it,i)=>{ const v=+ans[i]||0; sums[it.dim]+=v; counts[it.dim]++; });
  const raw={},pct={}; Object.keys(t.dims).forEach(k=>{ const avg=counts[k]?sums[k]/counts[k]:0; raw[k]=avg; pct[k]=Math.round((avg-1)/4*100); });
  return {raw,pct};
}
function submitDeepTest(){
  const id=deepCurrentId, t=DEEP_TESTS[id];
  if(Object.keys(deepTmp).length<t.items.length){ toast('⚠️','Responda tudo','Faltam afirmações para concluir o teste.'); return; }
  const {raw,pct}=deepCompute(t,deepTmp);
  const first=!S.deepTests[id]?.at;
  S.deepTests[id]={answers:{...deepTmp}, raw, pct, at:Date.now()};
  if(first) addXp(40, `Teste Profundo — ${t.title}`);
  save(); closeModal(); showDeepTestResult(id);
}
function deepBar(label,p,color){ return `<div class="cmp-bar"><span class="lb">${label}</span><div class="cmp-track"><div class="after" style="width:${Math.max(p,2)}%;background:${color||'var(--amber)'}"></div></div><span class="tiny" style="text-align:right">${p}%</span></div>`; }
function showDeepTestResult(id){
  const t=DEEP_TESTS[id], r=S.deepTests[id], m=MODULES.find(x=>x.id===id);
  const dims=Object.keys(t.dims);
  let body=''; let resActs=[]; let diaryText='';
  if(t.mode==='maturity'){
    const overall=Math.round(dims.reduce((a,k)=>a+r.pct[k],0)/dims.length);
    const band=MAT_BANDS.find(b=>overall<b.max)||MAT_BANDS[MAT_BANDS.length-1];
    const cap=t.theme.charAt(0).toUpperCase()+t.theme.slice(1);
    const note = overall<40
      ? `Há uma base, mas ${t.theme} ainda depende mais de intuição que de método — o maior ganho agora é estruturar o processo.`
      : overall<75
      ? `Você já tem método em ${t.theme}. O salto vem de tornar isso consistente e fechar os pontos mais fracos abaixo.`
      : `${cap} está num bom nível. Mantenha o padrão e use isso para puxar o resto da operação.`;
    const sorted=dims.slice().sort((a,b)=>r.pct[a]-r.pct[b]);
    const low=sorted[0], high=sorted[sorted.length-1];
    const tip=t.dimTips&&t.dimTips[low]?` Para evoluir, ${t.dimTips[low]}`:'';
    resActs=[t.dimTips&&t.dimTips[low]?`Evoluir ${t.dims[low]}: ${t.dimTips[low]}`:`Fortalecer ${t.dims[low]}`];
    diaryText=`No teste ${t.title} tirei ${overall}%. Meu ponto mais fraco é ${t.dims[low]}. O que vou fazer: `;
    body=`<div class="card" style="text-align:center;margin:0 0 14px;border-color:${band.color}">
        <div class="stat-num" style="color:${band.color}">${overall}%</div>
        <div class="stat-lbl">${band.label}</div></div>
      <div style="margin:10px 0">${dims.map(k=>deepBar(t.dims[k], r.pct[k], r.pct[k]<40?'var(--coral)':r.pct[k]<75?'var(--amber)':'var(--sage)')).join('')}</div>
      <div class="callout"><span class="ic"></span><div>${note}<br><br>Mais forte: <b>${t.dims[high]}</b>. Onde focar agora: <b>${t.dims[low]}</b>.${tip}</div></div>`;
  } else {
    const sorted=dims.slice().sort((a,b)=>r.pct[b]-r.pct[a]);
    const dom=sorted[0];
    resActs=[`Aplicar meu perfil ${t.dims[dom]} no dia a dia`];
    diaryText=`No teste ${t.title} meu perfil dominante foi ${t.dims[dom]}. O que isso me mostra: `;
    body=`<div style="margin:0 0 14px">${sorted.map((k,i)=>deepBar(t.dims[k], r.pct[k], i===0?'var(--amber)':'var(--violet)')).join('')}</div>
      <div class="card" style="border-color:rgba(245,181,61,.4)"><p class="eyebrow">Seu perfil dominante</p>
        <h3 style="font-family:var(--serif);margin:4px 0 8px">${t.dims[dom]}</h3>
        <p class="muted" style="margin:0;line-height:1.6">${t.profileNotes[dom]}</p></div>
      ${t.closing?`<div class="callout mt16"><span class="ic"></span><div>${t.closing}</div></div>`:''}`;
  }
  modal(withResultActions({eyebrow:'Resultado'+(m?' · '+m.title:''), title:t.title, icon:'', bodyHtml:body,
    actions:resActs, pdcaTitle:t.title, diaryText,
    extra:`<div class="btn-row" style="margin-top:14px">
      <button class="btn ghost sm" onclick="closeModal();openDeepTest('${id}')" style="flex:1;justify-content:center">Refazer</button>
      <button class="btn primary sm" onclick="closeModal()" style="flex:1;justify-content:center">Fechar</button>
    </div>`}));
}

/* ---------- farol ---------- */
function gFarol(k){
  const r=parseFloat(k.real), m=parseFloat(k.meta);
  if(isNaN(r)||isNaN(m)) return {pct:null, cls:'', em:'<i class="gdot off"></i>', lbl:'defina meta e realizado'};
  let pct;
  if(k.inv){ // menor é melhor (inadimplência, atraso, reclamações…)
    if(r<=0) pct=120; else if(m<=0) pct=0; else pct=(m/r)*100;
  } else {
    pct = m<=0 ? 0 : (r/m)*100;
  }
  if(pct>=100) return {pct, cls:'verde',    em:'<i class="gdot verde"></i>', lbl:'verde — registre a causa e replique'};
  if(pct>=90)  return {pct, cls:'amarelo',  em:'<i class="gdot amarelo"></i>', lbl:'amarelo — explicação no PTM (bloco 4) + ação no bloco 7'};
  return        {pct, cls:'vermelho', em:'<i class="gdot vermelho"></i>', lbl:'vermelho — causa raiz, ação com data e presença na reunião'};
}
function gFarolChip(f){
  const cor = f.cls==='verde' ? 'var(--sage)' : f.cls==='amarelo' ? 'var(--amber)' : f.cls==='vermelho' ? 'var(--coral)' : 'var(--mute-2)';
  const txt = f.pct==null ? '—' : Math.round(f.pct)+'%';
  return `<span title="${escAttr(f.lbl)}" style="display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;color:${cor};white-space:nowrap">${f.em} ${txt}</span>`;
}

    <div class="grid g-2 mt16">
      ${G_IMPL.map((f,fi)=>`
        <div class="card">
          <b style="font-size:14.5px;color:var(--amber)">${escapeHtml(f.t)}</b>
          <div class="mt8" style="display:flex;flex-direction:column;gap:8px">
            ${f.itens.map((it,ii)=>{
              const k=fi+'-'+ii, on=!!G().imp[k];
              return `<label style="display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:13.5px;color:${on?'var(--mute-2)':'var(--steel)'}">
                <input type="checkbox" ${on?'checked':''} onchange="gImpToggle('${k}')" style="margin-top:3px;accent-color:var(--amber)">
                <span style="${on?'text-decoration:line-through':''}">${escapeHtml(it)}</span></label>`;
            }).join('')}
          </div>
        </div>`).join('')}
    </div>
    <p class="tiny muted mt16">Não ligue os faróis no primeiro ciclo: se o mês 1 já vier com cobrança de meta, o gestor gasta energia defendendo número em vez de aprender o formato.</p>
  </div>`;
}
function gImpToggle(k){ const g=G(); g.imp[k]=!g.imp[k]; save(); renderGestao(); gXpOnce('imp_first',20,'Implantação do Padrão iniciada'); }

/* ===================================================================
   ABA 2 — PAINEL DE INDICADORES COM FAROL
   =================================================================== */
function gPainelHtml(){
  const g=G();
  const packs=`<div class="btn-row mt8">${G_KPI_PACKS.map(p=>`<button class="btn ghost sm" onclick="gAddPack('${p.id}')">${p.em} ${p.nome}</button>`).join('')}</div>`;
  const rows=g.kpis.map((k,i)=>{
    const f=gFarol(k);
    return `<tr>
      <td style="min-width:190px"><input class="in" style="margin:0" value="${escAttr(k.nome)}" onchange="gKpiSet(${i},'nome',this.value)"></td>
      <td><select class="in" style="margin:0" onchange="gKpiSet(${i},'freq',this.value)">
        <option value="semanal" ${k.freq==='semanal'?'selected':''}>Semanal</option>
        <option value="mensal" ${k.freq==='mensal'?'selected':''}>Mensal</option></select></td>
      <td><input class="in" style="margin:0;width:90px" inputmode="decimal" value="${escAttr(k.meta??'')}" placeholder="meta" onchange="gKpiSet(${i},'meta',this.value)"></td>
      <td><input class="in" style="margin:0;width:90px" inputmode="decimal" value="${escAttr(k.real??'')}" placeholder="atual" onchange="gKpiSet(${i},'real',this.value)"></td>
      <td><input class="in" style="margin:0;width:90px" inputmode="decimal" value="${escAttr(k.ant??'')}" placeholder="anterior" onchange="gKpiSet(${i},'ant',this.value)"></td>
      <td style="text-align:center"><input type="checkbox" ${k.inv?'checked':''} title="Menor é melhor (inverte o farol)" onchange="gKpiSet(${i},'inv',this.checked)" style="accent-color:var(--amber)"></td>
      <td>${gFarolChip(f)}</td>
      <td><button class="btn ghost sm" title="Remover" onclick="gKpiDel(${i})">✕</button></td>
    </tr>`;
  }).join('');
  return `
  <div class="card pad-lg">
    <div style="display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end">
      <div>
        <p class="eyebrow">Sua empresa em uma tela</p>
        <h2 class="sec" style="margin:6px 0 0">Painel de Indicadores com Farol</h2>
        <p class="muted tiny mt8">Entre 4 e 6 números por área. Painel grande deixa de ser controle — o gestor para de olhar. Meta definida a dois; o farol acende sozinho.</p>
      </div>
      <label class="fld" style="margin:0"><span>Período de referência</span><input class="in" style="margin:0" value="${escAttr(g.periodo)}" placeholder="Ex.: Julho 2026" onchange="G().periodo=this.value;save()"></label>
    </div>
    <p class="tiny muted mt16">Comece por um pacote pronto (edite tudo depois) ou adicione indicador em branco:</p>
    ${packs}
    <div style="overflow-x:auto;margin-top:18px">
      <table style="width:100%;border-collapse:collapse;font-size:13px;min-width:820px">
        <tr style="color:var(--mute);font-size:11px;letter-spacing:.08em;text-transform:uppercase;text-align:left">
          <th style="padding:6px 8px">Indicador</th><th>Frequência</th><th>Meta</th><th>Realizado</th><th>Anterior</th><th title="Menor é melhor">↓ melhor</th><th>Farol</th><th></th></tr>
        ${rows || `<tr><td colspan="8" style="padding:22px;text-align:center;color:var(--mute-2)">Nenhum indicador ainda. Adicione um pacote acima para começar.</td></tr>`}
      </table>
    </div>
    <div class="btn-row mt16">
      <button class="btn sage sm" onclick="gKpiAdd()">＋ Indicador em branco</button>
      <button class="btn ghost sm" onclick="gPainelPrint()">Imprimir painel A4</button>
    </div>
    <p class="tiny muted mt8">Semanal entra no RSG. Mensal só no PTM. Sem meta, o farol fica apagado — e sem cobrança.</p>
  </div>`;
}
function gKpiAdd(){ G().kpis.push({nome:'',fonte:'',freq:'semanal',inv:false,meta:'',real:'',ant:''}); save(); renderGestao(); }
function gKpiDel(i){ G().kpis.splice(i,1); save(); renderGestao(); }
function gKpiSet(i,f,val){ const k=G().kpis[i]; if(!k) return; k[f]=val; save();
  if(f==='meta'||f==='real'||f==='inv'){ renderGestao(); }
  const g=G(); if(g.kpis.some(x=>x.meta!==''&&x.real!=='')){ gXpOnce('painel_first',40,'Painel de Indicadores ativo'); grantTrophy('gestao_farol'); }
}
function gAddPack(id){
  const p=G_KPI_PACKS.find(x=>x.id===id); if(!p) return;
  p.kpis.forEach(k=>G().kpis.push({nome:k.nome,fonte:k.fonte,freq:k.freq,inv:k.inv,meta:'',real:'',ant:''}));
  save(); renderGestao();
  toast(p.em,'Pacote adicionado',p.nome+' — agora defina as metas com quem executa.');
}
function gPainelPrint(){
  const g=G();
  const rows=g.kpis.map(k=>{const f=gFarol(k);return [escapeHtml(k.nome||'—'),escapeHtml(k.freq||''),escapeHtml(String(k.meta||'—')),escapeHtml(String(k.real||'—')),escapeHtml(String(k.ant||'—')),gFarolPrint(f)];});
  gPrint('','Painel de Indicadores — '+(g.periodo||'período atual'),
    `<h5>Escala: VERDE ≥100% · AMARELO 90–99,9% · VERMELHO &lt;90% — indicadores “menor é melhor” invertem sozinhos</h5>`+
    gPrintTable(['Indicador','Freq.','Meta','Realizado','Anterior','Farol'],rows)+
    `<p style="font-size:10px;color:#8a8a8e">Meta definida a dois no início do ciclo · Revisão trimestral: indicador que não gerou decisão sai do painel.</p>`);
}

/* ===================================================================
   ABA 3 — RSG (REPORT SEMANAL DE GESTÃO)
   =================================================================== */
function gRsgHtml(){
  const g=G(); const d=g.drafts.rsg||{};
  const sem=g.kpis.filter(k=>k.freq==='semanal');
  const kpiTable = sem.length
    ? `<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px;min-width:520px">
        <tr style="color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.08em;text-align:left"><th style="padding:5px 8px">Indicador</th><th>Realizado</th><th>Meta</th><th>Farol</th></tr>
        ${sem.map(k=>{const f=gFarol(k);return `<tr><td style="padding:7px 8px;border-top:1px solid var(--line-soft)">${escapeHtml(k.nome)}</td><td>${escapeHtml(String(k.real||'—'))}</td><td>${escapeHtml(String(k.meta||'—'))}</td><td>${gFarolChip(f)}</td></tr>`;}).join('')}
      </table></div><p class="tiny muted mt8">Os números vêm do seu Painel (aba ). Atualize lá antes de fechar o report.</p>`
    : `<p class="muted tiny">Você ainda não tem indicadores <b>semanais</b> no Painel. Monte o painel primeiro — o RSG puxa os números de lá.</p>`;
  return `
  <div class="grid g-2" style="grid-template-columns:1.4fr 1fr;align-items:start">
    <div class="card pad-lg">
      <p class="eyebrow">1 página · toda segunda até 12h</p>
      <h2 class="sec" style="margin:6px 0 10px">RSG — Report Semanal de Gestão</h2>
      <div class="grid g-2">
        <label class="fld"><span>Semana de referência</span><input class="in" id="rsgSemana" value="${escAttr(d.semana||'')}" placeholder="Ex.: 14 a 20/07" onchange="gRsgDraft()"></label>
        <label class="fld"><span>Área / unidade · gestor</span><input class="in" id="rsgArea" value="${escAttr(d.area||'')}" placeholder="Ex.: Comercial · Ana" onchange="gRsgDraft()"></label>
      </div>
      <h5 style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin:14px 0 8px">Bloco 1 · Números da semana</h5>
      ${kpiTable}
      <label class="fld mt16"><span>Bloco 2 · Destaque positivo — um fato, com o número que comprova</span><textarea class="in" id="rsgDestaque" rows="2" placeholder='Ex.: "Conversão subiu de 21% para 26% após o rodízio de atendimento."' onchange="gRsgDraft()">${escapeHtml(d.destaque||'')}</textarea></label>
      <label class="fld"><span>Bloco 3 · Alerta — o que saiu do esperado, número e causa provável (ou “nenhum”)</span><textarea class="in" id="rsgAlerta" rows="2" onchange="gRsgDraft()">${escapeHtml(d.alerta||'')}</textarea></label>
      <label class="fld"><span>Bloco 4 · Bloqueios — o que está travado e QUEM destrava (ou “nenhum”)</span><textarea class="in" id="rsgBloqueios" rows="2" onchange="gRsgDraft()">${escapeHtml(d.bloqueios||'')}</textarea></label>
      <label class="fld"><span>Bloco 5 · Foco da próxima semana — até 3 prioridades (onde vai sua atenção, não lista de tarefas)</span><textarea class="in" id="rsgFoco" rows="2" onchange="gRsgDraft()">${escapeHtml(d.foco||'')}</textarea></label>
      <div class="btn-row mt16">
        <button class="btn primary" onclick="gRsgSalvar()">Fechar RSG da semana</button>
        <button class="btn ghost" onclick="gRsgPrint(null)">Imprimir A4</button>
      </div>
    </div>
    <div>
      <div class="card pad-lg">
        <p class="eyebrow">Histórico</p>
        ${g.rsg.length? g.rsg.map((r,i)=>`
          <div style="display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-soft)">
            <div><b style="font-size:14px">Semana ${escapeHtml(r.semana||'?')}</b><div class="tiny muted">${escapeHtml(r.area||'')} · ${new Date(r.ts).toLocaleDateString('pt-BR')}</div></div>
            <div class="btn-row"><button class="btn ghost sm" onclick="gRsgPrint(${i})">Imprimir</button><button class="btn ghost sm" onclick="gRsgDel(${i})">✕</button></div>
          </div>`).join('') : '<p class="muted tiny">Nenhum report fechado ainda. O primeiro vale <b>+80 XP</b>.</p>'}
      </div>
      <div class="card mt16">
        <p class="tiny" style="color:var(--steel);line-height:1.7;margin:0"><b>Regra da casa:</b> quem anota o número na hora leva 15 minutos para montar o report. Quem deixa para depois leva duas horas — e erra. Silêncio da direção depois do envio significa “segue em frente”.</p>
      </div>
    </div>
  </div>`;
}
function gRsgDraft(){
  const g=G();
  g.drafts.rsg={semana:gVal('rsgSemana'),area:gVal('rsgArea'),destaque:gVal('rsgDestaque'),alerta:gVal('rsgAlerta'),bloqueios:gVal('rsgBloqueios'),foco:gVal('rsgFoco')};
  save();
}
function gRsgSalvar(){
  gRsgDraft(); const g=G(); const d=g.drafts.rsg;
  if(!d.semana){ toast('⚠️','Falta a semana','Preencha a semana de referência.'); return; }
  const snap=g.kpis.filter(k=>k.freq==='semanal').map(k=>({nome:k.nome,real:k.real,meta:k.meta,inv:k.inv,f:gFarol(k)}));
  g.rsg.unshift({...d, kpis:snap, ts:Date.now()});
  if(g.rsg.length>60) g.rsg.length=60;
  g.drafts.rsg={};
  save(); grantTrophy('gestao_pulso');
  if(!g.xpFlags.rsg_first){ g.xpFlags.rsg_first=1; addXp(80,'Primeiro RSG fechado'); } else addXp(25,'RSG da semana fechado');
  renderGestao();
}
function gRsgDel(i){ G().rsg.splice(i,1); save(); renderGestao(); }
function gRsgPrint(i){
  const g=G();
  let r;
  if(i==null){ gRsgDraft(); const d=g.drafts.rsg; r={...d,kpis:g.kpis.filter(k=>k.freq==='semanal').map(k=>({nome:k.nome,real:k.real,meta:k.meta,inv:k.inv,f:gFarol(k)}))}; }
  else r=g.rsg[i];
  if(!r) return;
  const tb=r.kpis&&r.kpis.length? gPrintTable(['Indicador','Realizado','Meta','Farol'], r.kpis.map(k=>[escapeHtml(k.nome||''),escapeHtml(String(k.real||'—')),escapeHtml(String(k.meta||'—')),gFarolPrint(k.f||gFarol(k))])) : '<p>—</p>';
  const blk=(t,c)=>`<h5>${t}</h5><p>${escapeHtml(c||'nenhum')}</p>`;
  gPrint('','RSG — Report Semanal de Gestão',
    `<p style="font-size:11px;color:#8a8a8e">Semana de <b>${escapeHtml(r.semana||'—')}</b> · ${escapeHtml(r.area||'')}</p>
     <h5>Bloco 1 · Números da semana</h5>${tb}
     ${blk('Bloco 2 · Destaque positivo',r.destaque)}
     ${blk('Bloco 3 · Alerta',r.alerta)}
     ${blk('Bloco 4 · Bloqueios',r.bloqueios)}
     ${blk('Bloco 5 · Foco da próxima semana',r.foco)}`);
}

/* ===================================================================
   ABA 4 — PTM (PARECER TÉCNICO MENSAL)
   =================================================================== */
function gPtmRows(d,key,n,cols){
  const arr=(d[key]||[]);
  let h='';
  for(let i=0;i<n;i++){
    const row=arr[i]||{};
    h+=`<div class="grid" style="grid-template-columns:${cols.map(c=>c.w).join(' ')};gap:8px;margin-bottom:8px">`+
      cols.map(c=>`<input class="in" style="margin:0" id="ptm_${key}_${i}_${c.k}" value="${escAttr(row[c.k]||'')}" placeholder="${escAttr(c.p)}" onchange="gPtmDraft()">`).join('')+`</div>`;
  }
  return h;
}
function gPtmHtml(){
  const g=G(); const d=g.drafts.ptm||{};
  const painel = g.kpis.length
    ? `<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px;min-width:560px">
        <tr style="color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.08em;text-align:left"><th style="padding:5px 8px">Indicador</th><th>Realizado</th><th>Meta</th><th>Anterior</th><th>Var.</th><th>Farol</th></tr>
        ${g.kpis.map(k=>{const f=gFarol(k);const vr=gVarPct(k);return `<tr><td style="padding:7px 8px;border-top:1px solid var(--line-soft)">${escapeHtml(k.nome)}</td><td>${escapeHtml(String(k.real||'—'))}</td><td>${escapeHtml(String(k.meta||'—'))}</td><td>${escapeHtml(String(k.ant||'—'))}</td><td>${vr}</td><td>${gFarolChip(f)}</td></tr>`;}).join('')}
      </table></div><p class="tiny muted mt8">Bloco 2 é o painel — sem comentário. A análise vem nos blocos 3 e 4.</p>`
    : `<p class="muted tiny">Monte o Painel (aba Painel · Farol) — o PTM injeta todos os indicadores automaticamente.</p>`;
  return `
  <div class="card pad-lg">
    <p class="eyebrow">2 páginas + painel · até o 5º dia útil</p>
    <h2 class="sec" style="margin:6px 0 10px">PTM — Parecer Técnico Mensal</h2>
    <div class="grid g-2">
      <label class="fld"><span>Mês de referência</span><input class="in" id="ptmMes" value="${escAttr(d.mes||'')}" placeholder="Ex.: Julho 2026" onchange="gPtmDraft()"></label>
      <label class="fld"><span>Área / unidade · gestor</span><input class="in" id="ptmArea" value="${escAttr(d.area||'')}" placeholder="Ex.: Financeiro · Você" onchange="gPtmDraft()"></label>
    </div>
    <label class="fld"><span>Bloco 1 · Resumo executivo — até 10 linhas: o mês foi bom ou ruim, por quê, e a ÚNICA coisa que precisa ser decidida. Escreva por último.</span><textarea class="in" id="ptmResumo" rows="4" onchange="gPtmDraft()">${escapeHtml(d.resumo||'')}</textarea></label>
    <h5 style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin:14px 0 8px">Bloco 2 · Painel de indicadores (do seu Painel)</h5>
    ${painel}
    <h5 style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin:18px 0 8px">Bloco 3 · O que funcionou — máx. 3, cada um com o número que comprova</h5>
    ${gPtmRows(d,'funcionou',3,[{k:'oque',p:'O que foi feito',w:'2fr'},{k:'num',p:'Número que comprova',w:'1.4fr'},{k:'rep',p:'Repetível? Onde?',w:'1fr'}])}
    <h5 style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin:18px 0 8px">Bloco 4 · O que NÃO funcionou — máx. 3, com causa raiz (sintoma não vale)</h5>
    ${gPtmRows(d,'nao',3,[{k:'oque',p:'O que aconteceu',w:'2fr'},{k:'num',p:'Número que piorou',w:'1.2fr'},{k:'causa',p:'Causa raiz',w:'1.4fr'}])}
    <h5 style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin:18px 0 8px">Bloco 5 · Dificuldades e bloqueios — de quem é e qual o impacto</h5>
    ${gPtmRows(d,'bloq',3,[{k:'desc',p:'Dificuldade / bloqueio',w:'2fr'},{k:'dono',p:'Dono do bloqueio',w:'1fr'},{k:'imp',p:'Impacto (nº ou prazo)',w:'1fr'}])}
    <h5 style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin:18px 0 8px">Bloco 6 · Dúvidas e decisões — pergunta SEM recomendação é devolvida</h5>
    ${gPtmRows(d,'duv',3,[{k:'perg',p:'Pergunta / decisão necessária',w:'1.6fr'},{k:'opc',p:'Opções que enxergo',w:'1.2fr'},{k:'rec',p:'Minha recomendação',w:'1.2fr'},{k:'prazo',p:'Responder até',w:'.7fr'}])}
    <h5 style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin:18px 0 8px">Bloco 7 · Plano de ação — máx. 5; ação sem dono e data é inválida</h5>
    ${gPtmRows(d,'plano',5,[{k:'oque',p:'O que será feito',w:'1.8fr'},{k:'quem',p:'Responsável',w:'.9fr'},{k:'prazo',p:'Até quando',w:'.7fr'},{k:'ind',p:'Indicador que deve mover',w:'1.2fr'},{k:'depara',p:'De → Para',w:'.8fr'}])}
    <div class="btn-row mt16">
      <button class="btn primary" onclick="gPtmSalvar()">Emitir parecer do mês</button>
      <button class="btn ghost" onclick="gPtmPrint(null)">Imprimir A4</button>
    </div>
    ${g.ptm.length?`<div class="divider"></div><p class="eyebrow">Pareceres emitidos</p>${g.ptm.map((p,i)=>`
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-soft)">
        <div><b style="font-size:14px">${escapeHtml(p.mes||'?')}</b><div class="tiny muted">${escapeHtml(p.area||'')} · emitido em ${new Date(p.ts).toLocaleDateString('pt-BR')}</div></div>
        <div class="btn-row"><button class="btn ghost sm" onclick="gPtmPrint(${i})">Imprimir</button><button class="btn ghost sm" onclick="gPtmDel(${i})">✕</button></div>
      </div>`).join('')}`:''}
  </div>`;
}
function gVarPct(k){
  const r=parseFloat(k.real), a=parseFloat(k.ant);
  if(isNaN(r)||isNaN(a)||a===0) return '<span class="muted">—</span>';
  const v=((r-a)/Math.abs(a))*100;
  const good = k.inv ? v<0 : v>0;
  return `<span style="color:${good?'var(--sage)':'var(--coral)'};font-family:var(--mono);font-size:12px">${v>0?'+':''}${v.toFixed(1)}%</span>`;
}
function gPtmCollectRows(key,n,fields){
  const out=[];
  for(let i=0;i<n;i++){
    const row={}; let filled=false;
    fields.forEach(f=>{ const val=gVal(`ptm_${key}_${i}_${f}`); row[f]=val; if(val) filled=true; });
    if(filled) out.push(row);
  }
  return out;
}
function gPtmDraft(){
  const g=G();
  g.drafts.ptm={
    mes:gVal('ptmMes'), area:gVal('ptmArea'), resumo:gVal('ptmResumo'),
    funcionou:gPtmCollectRows('funcionou',3,['oque','num','rep']),
    nao:gPtmCollectRows('nao',3,['oque','num','causa']),
    bloq:gPtmCollectRows('bloq',3,['desc','dono','imp']),
    duv:gPtmCollectRows('duv',3,['perg','opc','rec','prazo']),
    plano:gPtmCollectRows('plano',5,['oque','quem','prazo','ind','depara']),
  };
  save();
}
function gPtmSalvar(){
  gPtmDraft(); const g=G(); const d=g.drafts.ptm;
  const err=[];
  if(!d.mes) err.push('mês de referência');
  d.nao.forEach((r,i)=>{ if(r.oque&&!r.causa) err.push(`causa raiz no bloco 4 (item ${i+1})`); });
  d.duv.forEach((r,i)=>{ if(r.perg&&!r.rec) err.push(`recomendação no bloco 6 (item ${i+1}) — pergunta sem recomendação é devolvida`); });
  d.plano.forEach((r,i)=>{ if(r.oque&&(!r.quem||!r.prazo)) err.push(`dono e data no bloco 7 (ação ${i+1}) — sem os dois é intenção`); });
  if(err.length){ toast('↩️','Parecer devolvido','Falta: '+err[0]); return; }
  const snap=g.kpis.map(k=>({nome:k.nome,real:k.real,meta:k.meta,ant:k.ant,inv:k.inv,f:gFarol(k)}));
  g.ptm.unshift({...d, kpis:snap, ts:Date.now()});

  if(st===0){ gFlow.step = sim ? 1 : 'nivel3'; }
  else if(st===1){ gFlow.step = sim ? 2 : 'nivel2'; }
  else if(st===2){ gFlow.step = sim ? 'nivel1' : 'nivel4'; }
  renderGestao();
}
function gDecisaoAdd(){
  const oque=gVal('gdcOque'); if(!oque){ toast('⚠️','Falta a decisão','Diga o que foi decidido.'); return; }
  const g=G();
  g.decisoes.unshift({oque, nivel:gVal('gdcNivel'), res:gVal('gdcRes'), porque:gVal('gdcPorque'), ts:Date.now()});
  if(g.decisoes.length>80) g.decisoes.length=80;
  save(); addXp(15,'Decisão registrada'); renderGestao();
}
function gDecisaoDel(i){ G().decisoes.splice(i,1); save(); renderGestao(); }

/* ---------- importar backup (contrapartida do exportData) ---------- */
function importData(file){
  const rd=new FileReader();
  rd.onload=async e=>{
    try{
      const obj=JSON.parse(e.target.result);
      if(!obj || typeof obj!=='object' || !('xp' in obj)) throw new Error('formato');
      S={...defaultState(),...obj};
      await Store.set(KEY, JSON.stringify(S));
      toast('','Progresso importado','Bem-vindo(a) de volta.');
      renderTop(); go('home');
    }catch(err){ toast('⚠️','Arquivo inválido','Selecione um backup exportado pela própria plataforma.'); }
  };
  rd.readAsText(file);
}

/* ---------- estado ---------- */
function Bst(){
  if(!S.bussola) S.bussola={};
  const B=S.bussola;
  if(B.norte===undefined)B.norte='';
  if(B.diag===undefined)B.diag=null;
  if(B.diagAt===undefined)B.diagAt=null;
  if(!B.diagHistory)B.diagHistory=[];
  if(!B.seen)B.seen={};
  if(!B.worked)B.worked=[];
  if(B.dayCard===undefined)B.dayCard=null;
  if(!B.trilhas)B.trilhas={};
  if(B.pacto===undefined)B.pacto=null;
  if(!B.ritual)B.ritual=[];
  if(!B.interrupts)B.interrupts=[];
  if(!B.kpis)B.kpis=[];
  if(!B.provas)B.provas=[];
  if(!B.stateLog)B.stateLog=[];
  return B;
}
/* mapa naipe -> módulo de negócio que trabalha o mesmo tema "por fora" */
const BMOD={ direcao:'Raio-X Estratégico', plano:'Raio-X Estratégico', resultados:'Blindagem Financeira', mente:'Descompressão & Pessoas', forcas:'Descompressão & Pessoas', identidade:'Liderança', execucao:'Engenharia de Processos', padroes:'Engenharia de Processos', sabotagem:'Descompressão & Pessoas', lideranca:'Liderança' };
let bTab='hoje', bOpenTrilha=null, bFilter='todos', bDiagTmp={};
function bPad(n){return String(n).padStart(3,'0');}
function bFind(naipe,part){return BCARDS.findIndex(c=>c.n===naipe&&c.t.indexOf(part)>=0);}
function bMarkSeen(idx){ Bst().seen[idx]=Date.now(); }
function bMarkWorked(idx){ const B=Bst(); if(!B.worked.includes(idx)) B.worked.push(idx); }
function bEixoScore(e){ const B=Bst(); const v=e.naipes.map(k=>B.diag[k]??0); return v.reduce((a,b)=>a+b,0)/v.length; }
function bWeakest(){ const B=Bst(); let mk=null,mv=99; BNAIPES.forEach(n=>{const s=B.diag[n.k]; if(s!==undefined&&s<mv){mv=s;mk=n.k;}}); return {k:mk,v:mv,n:BNMAP[mk]}; }
function bSuggest(nk){ const map={direcao:'clareza',plano:'operacional',resultados:'clareza',mente:'medo',forcas:'lideranca',identidade:'teto',execucao:'execucao',padroes:'teto',sabotagem:'medo',lideranca:'lideranca'}; return BTRILHAS.find(t=>t.id===map[nk]); }

/* ---------- sorteio inteligente e adaptativo ---------- */
function bPriority(k){ const B=Bst(); const s=B.diag?B.diag[k]:undefined; if(s===undefined) return 1; return 1+(5-s)/5*2.4; }
function bWeight(idx){
  const c=BCARDS[idx], B=Bst(); let w=bPriority(c.n);
  w*=(0.75+c.lv[1]/12); if(c.s) w*=1.12;
  if(B.worked.includes(idx)) w*=0.22;
  const seen=B.seen[idx];
  if(seen){ const dd=(Date.now()-seen)/86400000; if(dd<3) w*=0.30; else if(dd<7) w*=0.7; }
  const openN=(S.plan||[]).filter(p=>!p.done&&p.bnaipe===c.n).length;
  const doneN=(S.plan||[]).filter(p=>p.done&&p.bnaipe===c.n).length;
  if(openN) w*=(1+openN*0.6);
  if(doneN&&!seen) w*=(1+doneN*0.2);
  return Math.max(w,0.02);
}
function bPick(rng){ const ws=BCARDS.map((c,i)=>bWeight(i)); const tot=ws.reduce((a,b)=>a+b,0); let r=rng()*tot; for(let i=0;i<BCARDS.length;i++){ r-=ws[i]; if(r<=0) return i; } return BCARDS.length-1; }
function bMul(seed){ let t=seed>>>0; return function(){ t+=0x6D2B79F5; let x=Math.imul(t^(t>>>15),1|t); x^=x+Math.imul(x^(x>>>7),61|x); return ((x^(x>>>14))>>>0)/4294967296; }; }
function bStrSeed(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function bCardOfDay(){ const B=Bst(); const t=dayKey(Date.now()); if(B.dayCard&&B.dayCard.day===t) return B.dayCard.idx; const rng=bMul(bStrSeed(t+'|'+(B.norte||'')+'|'+(B.diag?Object.values(B.diag).join(''):''))); const idx=bPick(rng); B.dayCard={day:t,idx}; bMarkSeen(idx); save(); return idx; }
function bReason(idx,isDay){
  const c=BCARDS[idx], nz=BNMAP[c.n], B=Bst();
  if(!B.diag) return 'Carta de fundação para iniciar. Trabalhe-a com atenção e faça seu diagnóstico para o sistema te guiar com precisão.';
  const w=bWeakest(), sc=B.diag[c.n], pre=isDay?'A carta de hoje é ':'Esta carta é ';
  const openN=(S.plan||[]).filter(p=>!p.done&&p.bnaipe===c.n).length;
  if(openN>0) return pre+'<b>'+nz.nome+'</b>, e você tem <b>'+openN+'</b> compromisso(s) deste eixo em aberto. O padrão pede consciência: o sistema insiste aqui até você resolver.';
  if(c.n===w.k) return pre+'<b>'+nz.nome+'</b> porque é o seu eixo de menor força ('+sc+'/5) — sua maior alavanca. Não é acaso: o mapa te trouxe aqui.';
  if(sc<=3) return pre+'<b>'+nz.nome+'</b> ('+sc+'/5): um ponto que o seu mapa pede para desenvolver agora.';
  return pre+'<b>'+nz.nome+'</b> para consolidar uma força ('+sc+'/5) e transformá-la em vantagem.';
}

function bPb(n){ return BPLAY[n]||BPLAY.direcao; }

const BNIVEL=[

];
let bPlan={idx:null, lvl:'novo'};

/* Sugestões prontas e editáveis — o aluno escolhe, não inventa do zero. */
function bPlanSugs(c,lvl){
  const pb=bPb(c.n);
  if(lvl==='forte')  return [pb.eleva, c.x, 'Ensinar isso a uma pessoa do time e combinar como vocês vão cobrar isso.'];
  if(lvl==='oscilo') return [pb.cadencia, pb.micro, c.x];
  return [pb.micro, c.x, 'Fazer uma vez e registrar em 3 linhas o que mudou depois.'];
}
const BGATILHOS=['amanhã, às 8h, antes de abrir o e-mail','hoje, antes de fechar o notebook','toda segunda, no primeiro café'];

/* ---------- 1) A CARTA (face de carta de verdade) ---------- */

/* ---------- 2) O CONSTRUTOR DE PLANO (tudo pré-preenchido) ---------- */
function bPlanStart(idx){
  bPlan={idx, lvl:bPlan.idx===idx?bPlan.lvl:'novo'};
  const c=BCARDS[idx], nz=BNMAP[c.n], pb=bPb(c.n);
  modal(`<div class="bo bp" style="--sc:${nz.hue}">
    <p class="eyebrow" style="color:${nz.hue}">${nz.nome} · carta ${bPad(idx+1)}</p>
    <h3>Plano de ação — ${escapeHtml(c.t)}</h3>
    <p class="bp-lead">Três respostas e seu plano fica pronto. Já deixei tudo sugerido — <b>ajuste o que quiser</b>, nada aqui começa em branco.</p>

    <div class="bp-step">
      <span class="bp-num">1</span>
      <div class="bp-body">
        <b class="bp-q">Onde você está nessa carta hoje?</b>
        <div class="bp-lvls" id="bpLvls">${BNIVEL.map(n=>`<button type="button" class="bp-lvl${n.k===bPlan.lvl?' on':''}" onclick="bPlanLvl('${n.k}')"><b>${n.t}</b><small>${n.d}</small></button>`).join('')}</div>
        <p class="tiny muted" style="margin:8px 0 0">O plano muda conforme a sua resposta — quem está começando recebe um passo mínimo; quem já faz bem recebe um passo de nível.</p>
      </div>
    </div>

    <div class="bp-step">
      <span class="bp-num">2</span>
      <div class="bp-body">
        <b class="bp-q">Qual vai ser a sua ação?</b>
        <div class="bp-sugs" id="bpSugs">${bPlanSugHtml(c,bPlan.lvl)}</div>
        <textarea class="in bp-act" id="bpAct" style="min-height:66px">${escapeHtml(bPlanSugs(c,bPlan.lvl)[0])}</textarea>
      </div>
    </div>

    <div class="bp-step">
      <span class="bp-num">3</span>
      <div class="bp-body">
        <b class="bp-q">Quando e onde? <span class="tiny muted">(o gatilho — é isso que faz a ação acontecer)</span></b>
        <div class="bp-chips">${BGATILHOS.map(g=>`<button type="button" class="bp-chip" onclick="bPlanWhen('${escapeAttrB(g)}')">${escapeHtml(g)}</button>`).join('')}</div>
        <input class="in" id="bpWhen" placeholder="Ex.: amanhã, às 8h, antes de abrir o e-mail…" value="${escapeAttrB(BGATILHOS[0])}">
        <label class="fld" style="margin-top:10px"><span>Prazo do marco</span><select class="in" id="bpPrazo">
          <option value="2">48 horas</option><option value="7" selected>7 dias</option>
          <option value="15">15 dias</option><option value="30">30 dias</option></select></label>
      </div>
    </div>

    <details class="bp-more">
      <summary>Medição, risco e protocolo de recaída <span class="tiny muted">— já preenchidos, abra só se quiser mudar</span></summary>
      <label class="fld"><span>Como vou saber que funcionou</span><input class="in" id="bpMetrica" value="${escapeAttrB(pb.metrica)}"></label>
      <label class="fld"><span>O que vai me atrapalhar</span><input class="in" id="bpRisco" value="${escapeAttrB(pb.risco)}"></label>
      <label class="fld"><span>Se eu recair, eu interrompo assim</span><input class="in" id="bpInter" value="${escapeAttrB(pb.interrupt)}"></label>
    </details>

    <div class="btn-row" style="margin-top:18px">
      <button class="btn primary" onclick="bPlanGo(${idx})">Gerar meu plano de ação →</button>
      <button class="btn ghost" onclick="openCard(${idx})">‹ Voltar à carta</button>
    </div>
  </div>`);
}
function bPlanSugHtml(c,lvl){
  return bPlanSugs(c,lvl).map(s=>`<button type="button" class="bp-sug" onclick="bPlanPick(this)">${escapeHtml(s)}</button>`).join('');
}
function bPlanLvl(k){
  bPlan.lvl=k; const c=BCARDS[bPlan.idx];
  $$('#bpLvls .bp-lvl').forEach((b,i)=>b.classList.toggle('on', BNIVEL[i].k===k));
  const box=$('#bpSugs'); if(box) box.innerHTML=bPlanSugHtml(c,k);
  const ta=$('#bpAct'); if(ta) ta.value=bPlanSugs(c,k)[0];
}
function bPlanPick(btn){
  $$('#bpSugs .bp-sug').forEach(b=>b.classList.remove('on')); btn.classList.add('on');
  const ta=$('#bpAct'); if(ta){ ta.value=btn.textContent.trim(); ta.focus(); }
}
function bPlanWhen(g){ const i=$('#bpWhen'); if(i){ i.value=g; } $$('.bp-chip').forEach(b=>b.classList.toggle('on', b.textContent.trim()===g)); }

/* ---------- 3) O PLANO PRONTO (imprimir · baixar · PDCA · Plano 30d) ---------- */
let bLastPlan=null;
function bPlanGo(idx){
  const c=BCARDS[idx], nz=BNMAP[c.n], pb=bPb(c.n);
  const act=(($('#bpAct')&&$('#bpAct').value)||'').trim();
  if(!act){ toast('⚠️','Escolha ou escreva a ação','Um plano precisa de uma ação concreta.'); return; }
  const when=(($('#bpWhen')&&$('#bpWhen').value)||'').trim();
  const days=+(($('#bpPrazo')&&$('#bpPrazo').value)||7);
  const metrica=(($('#bpMetrica')&&$('#bpMetrica').value)||'').trim()||pb.metrica;
  const risco=(($('#bpRisco')&&$('#bpRisco').value)||'').trim()||pb.risco;
  const inter=(($('#bpInter')&&$('#bpInter').value)||'').trim()||pb.interrupt;
  const lvl=BNIVEL.find(n=>n.k===bPlan.lvl)||BNIVEL[0];
  const compromisso = when ? `Quando ${when}, eu vou ${act}` : act;
  const marco=`Até ${bDataBR(Date.now()+days*86400000)}: ${metrica.toLowerCase()}`;
  /* sequência sem repetição: a ação escolhida pode coincidir com o passo de
     10 min ou com a cadência (depende do nível) — cada linha pega a primeira
     opção ainda não usada. */
  const nrm=t=>(t||'').trim().toLowerCase().replace(/[.\s]+$/,'');
  const usados=new Set();
  const pega=(...cands)=>{ for(const x of cands){ const v=(x||'').trim();
    if(v && !usados.has(nrm(v))){ usados.add(nrm(v)); return v; } } return null; };
  const seq=[];
  const s1=pega(pb.micro, act, c.x);
  if(s1) seq.push({t:'Hoje — 10 minutos', d:s1});
  const s2=pega(act, c.x, 'Repetir e registrar em 3 linhas o que mudou.');
  if(s2) seq.push({t:'Primeiros 3 dias', d:s2});
  const s3=pega(pb.cadencia, 'Repetir no mesmo horário e marcar o dia no plano.');
  if(s3) seq.push({t:'Ritmo que sustenta', d:s3});
  seq.push({t:'Marco do '+days+'º dia', d:marco});
  const passo1=`Hoje, em 10 minutos: ${s1||pb.micro}`;
  const passo2=`Nos 3 primeiros dias: ${s2||act}`;
  const passo3=`No ${days}º dia: revisar — funcionou? o que travou? o que mantenho?`;

  /* registra de verdade: Plano 30d (com naipe), protocolo, XP, troféu */
  S.plan.push({id:'p'+Date.now(), text:compromisso, due:Date.now()+days*86400000, done:false,
    src:'Bússola · '+nz.nome+': '+c.t, bnaipe:c.n, bcard:idx});
  const B=Bst();
  B.interrupts.unshift({naipe:c.n, card:c.t, text:inter, t:Date.now()});
  if(B.interrupts.length>40) B.interrupts.length=40;
  bMarkWorked(idx); addXp(25,'Plano de ação criado a partir da carta'); grantTrophy('planner'); save();

  const body=`
    <div class="pl-head">
      <div class="pl-badge">${nz.g}</div>
      <div>
        <p class="pl-kicker">${nz.nome} · carta ${bPad(idx+1)} · ${escapeHtml(c.dim)}</p>
        <h4 class="pl-title">${escapeHtml(c.t)}</h4>
      </div>
    </div>
    <div class="pl-pattern"><b>O padrão em jogo</b> ${escapeHtml(pb.padrao)}</div>
    <div class="pl-row"><span>Ponto de partida</span><div>${escapeHtml(lvl.t)} — ${escapeHtml(lvl.d)}</div></div>
    <div class="pl-commit"><span>Meu compromisso</span><b>${escapeHtml(compromisso)}</b></div>
    <div class="pl-seq">${seq.map((s,i)=>`<div class="pl-s"><i>${i===seq.length-1?'\u2713':i+1}</i><div><b>${escapeHtml(s.t)}</b>${escapeHtml(s.d)}</div></div>`).join('')}</div>
    <div class="pl-grid">
      <div class="pl-box ok"><span>Como vou saber que funcionou</span>${escapeHtml(metrica)}</div>
      <div class="pl-box warn"><span>O que vai me atrapalhar</span>${escapeHtml(risco)}</div>
      <div class="pl-box gold"><span>Se eu recair, eu interrompo assim</span>${escapeHtml(inter)}</div>
    </div>
    <div class="pl-check"><span>Marque os 7 dias</span><div class="pl-days">${[1,2,3,4,5,6,7].map(d=>`<i>${d}</i>`).join('')}</div></div>
    <p class="pl-sign">✦ Seus padrões de comportamento definem seus acontecimentos. — Carla Caroline</p>`;

  bLastPlan={title:'Plano de ação — '+c.t, body, card:c, naipe:nz, compromisso,
    passos:[passo1,passo2,passo3], seq, metrica, risco, inter, marco, days, lvl:lvl.t, pb};

  modal(withResultActions({
    eyebrow:'Seu plano está pronto',
    title:'Plano de ação — '+c.t,
    bodyHtml:body,
    actions:[compromisso, passo1, passo2, passo3],
    pdcaTitle:'Carta: '+c.t,
    diaryText:compromisso,
    extra:`<div class="btn-row" style="margin-top:12px">
        <button class="btn primary sm" onclick="bPlanDownload()">Baixar plano</button>
        <button class="btn ghost sm" onclick="openCard(${idx})">‹ Ver a carta</button>
        <button class="btn ghost sm" onclick="closeModal()">Fechar</button>
      </div>
      <p class="tiny muted" style="margin-top:10px">Já adicionei o compromisso ao seu <b>Plano 30d</b>. Use os botões acima para imprimir em A4, baixar o arquivo, abrir um <b>ciclo PDCA</b> ou jogar na <b>Agenda</b>.</p>`
  }));
}

function bOpenT(id){ bOpenTrilha=id; renderBussola(); window.scrollTo({top:120,behavior:'smooth'}); }

function bTrilhaDetail(id){
  const t=BTRILHAS.find(x=>x.id===id), B=Bst(), done=(B.trilhas[id]&&B.trilhas[id].done)||[];
  const current=t.steps.findIndex((s,i)=>!done.includes(i));
  const rows=t.steps.map((s,i)=>{
    const idx=bFind(s[0],s[1]), c=BCARDS[idx], nz=BNMAP[c.n];
    const isDone=done.includes(i), isCur=(i===current);
    const action=isCur?`<div class="btn-row" style="margin-top:8px"><button class="btn ghost xs" onclick="openCard(${idx})">Abrir carta</button><button class="btn sage xs" onclick="bConclude('${id}',${i})">Concluir passo →</button></div>`:'';
    return `<div class="b-step ${isDone?'done':isCur?'cur':'lock'}"><div class="b-node">${isDone?'✓':(i+1)}</div><div><div class="tiny" style="color:${nz.hue}">${nz.g} ${nz.nome}</div><b style="font-family:var(--serif)">${escapeHtml(c.t)}</b>${action}</div></div>`;
  }).join('');
  const pct=Math.round(done.length/t.steps.length*100);
  return `<a class="tiny muted" style="cursor:pointer" onclick="bCloseT()">← Todas as trilhas</a>

      <div class="b-stepper" style="margin-top:18px">${rows}</div>
      ${pct===100?`<div class="callout mt16"><span class="ic"></span><div>Trilha completa. Refaça seu diagnóstico no Espelho para ver a evolução — e escolha a próxima.</div></div>`:''}
    </div>`;
}
function bConclude(id,i){
  const B=Bst(), t=BTRILHAS.find(x=>x.id===id);

  if(!B.trilhas[id].done.includes(i)) B.trilhas[id].done.push(i);
  bMarkWorked(bFind(t.steps[i][0],t.steps[i][1])); addXp(12,'Passo de trilha concluído'); save(); renderBussola();
}

function bReportBody(){

  h+=`<p><b>A ponte para o negócio:</b> enquanto ${w.n.nome} estiver fraco, no dia a dia isso aparece como <b>${w.n.sintoma}</b>. Não é um problema de estratégia — é o padrão por trás dela.</p>`;
  h+=`<p><b>Prescrição do ciclo — nas duas frentes:</b> <b>por dentro</b>, ${tr?'siga a trilha <b>'+tr.nome+'</b>':'trabalhe as cartas de <b>'+w.n.nome+'</b>'} e cumpra os compromissos; <b>por fora</b>, aprofunde o módulo <b>${BMOD[w.k]}</b>. Uma mudança pequena aqui gera o maior salto — e o Placar vai provar isso em número.</p>`;

  h+=`<p class="b-rquote">Seus padrões de comportamento definem seus acontecimentos. Você já os enxerga — agora é escolher diferente.</p>`;
  return h;
}

/* ---------- PLACAR DE BLINDAGEM (KPI do negócio × evolução do padrão) ---------- */
function bFmt(n){ if(n==null||isNaN(n))return '—'; return (Math.round(n*100)/100).toLocaleString('pt-BR'); }
function bBehaviorSeries(){ const B=Bst(); return (B.diagHistory||[]).map(h=>({t:h.at, avg:BNAIPES.reduce((a,n)=>a+(h.scores[n.k]??0),0)/10})); }
function bSpark(vals,min,max,color){
  if(!vals.length) return '';
  const W=300,H=64,pad=7,n=vals.length,rng=(max-min)||1;
  const pts=vals.map((v,i)=>{ const x=pad+(n===1?(W-2*pad)/2:(i/(n-1))*(W-2*pad)); const y=H-pad-((v-min)/rng)*(H-2*pad); return [x,y]; });
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=`M${pts[0][0].toFixed(1)} ${H-pad} `+pts.map(p=>'L'+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')+` L${pts[n-1][0].toFixed(1)} ${H-pad} Z`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:64px" preserveAspectRatio="none"><path d="${area}" fill="${color}" opacity="0.12"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/>${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="${color}"/>`).join('')}</svg>`;
}
function bPlacarHtml(){
  const B=Bst();
  const beh=bBehaviorSeries();
  const intro=`<p class="muted" style="max-width:66ch">Aqui a tese vira prova. Escolha um número do seu negócio — faturamento, propostas fechadas, decisões que o time tomou sozinho, avaliações 5★ — e acompanhe. O sistema mostra a sua <b>evolução comportamental</b> ao lado do <b>resultado</b>. Quando o padrão muda por dentro, o número muda por fora.</p>`;
  const behCard = (beh.length)? `<div class="card"><p class="eyebrow" style="color:var(--amber)">Por dentro</p><h3 style="margin:2px 0 8px">Evolução do seu padrão</h3>${bSpark(beh.map(p=>p.avg),0,5,'var(--amber)')}<div class="tiny muted" style="margin-top:6px">Média do Mapa (0–5) a cada diagnóstico.${beh.length<2?' Refaça o diagnóstico ao longo do tempo para ver a linha crescer.':''}</div></div>`
    : `<div class="card"><p class="eyebrow">Por dentro</p><h3 style="margin:2px 0 8px">Evolução do seu padrão</h3><p class="tiny muted">Faça o <b>Diagnóstico</b> para começar a linha comportamental.</p></div>`;
  const kpiCards=(B.kpis||[]).map(bKpiCard).join('');
  return `${intro}<div class="grid g-2" style="margin-top:14px">${behCard}${kpiCards}</div>
    <div class="btn-row mt16"><button class="btn primary" onclick="bAddKpi()">+ Acompanhar um número do negócio</button></div>
    ${bCorrelation()}`;
}
function bKpiCard(k){
  const vals=k.entries.map(e=>e.v);
  const last=vals.length?vals[vals.length-1]:null, first=vals.length?vals[0]:null;
  const delta=(vals.length>1)?(last-first):null;
  const min=Math.min.apply(null,vals.concat(k.alvo!=null?[k.alvo]:[])), max=Math.max.apply(null,vals.concat(k.alvo!=null?[k.alvo]:[]));
  return `<div class="card"><div style="display:flex;align-items:baseline;gap:8px"><p class="eyebrow" style="margin:0;color:var(--sage)">Por fora</p><span class="tiny" style="margin-left:auto;cursor:pointer;color:var(--mute-2)" onclick="bDelKpi('${k.id}')">remover</span></div>
    <h3 style="margin:2px 0 2px">${escapeHtml(k.nome)}</h3>
    <div style="display:flex;align-items:flex-end;gap:10px;margin:2px 0 8px"><div class="stat-num" style="color:var(--sage)">${last!=null?bFmt(last):'—'}</div><div class="tiny muted">${escapeHtml(k.unidade||'')}${k.alvo!=null?' · alvo '+bFmt(k.alvo):''}${delta!=null?' · '+(delta>=0?'▲ +':'▼ ')+bFmt(delta):''}</div></div>
    ${vals.length?bSpark(vals,min,max,'var(--sage)'):'<div class="tiny muted">Sem registros ainda.</div>'}
    <div class="btn-row" style="margin-top:10px"><button class="btn sage sm" onclick="bLogKpi('${k.id}')">Registrar valor de hoje</button></div></div>`;
}
function bCorrelation(){
  const B=Bst(); const beh=bBehaviorSeries(); const kpi=(B.kpis||[]).find(k=>k.entries.length>1);
  if(beh.length<2||!kpi) return '';
  const bDelta=beh[beh.length-1].avg-beh[0].avg;
  const kDelta=kpi.entries[kpi.entries.length-1].v-kpi.entries[0].v;
  const same=(bDelta>=0)===(kDelta>=0);
  return `<div class="callout mt16" style="border-color:${same?'var(--sage)':'var(--amber)'}66"><span class="ic">${same?'':''}</span><div>${same?`<b>A prova está na sua frente.</b> Sua média comportamental ${bDelta>=0?'subiu':'recuou'} ${Math.abs(bDelta).toFixed(1)} e, no mesmo período, <b>${escapeHtml(kpi.nome)}</b> ${kDelta>=0?'subiu':'recuou'} ${bFmt(Math.abs(kDelta))}. O padrão e o resultado andam juntos — exatamente como a bússola diz.`:`Comportamento e <b>${escapeHtml(kpi.nome)}</b> ainda apontam para lados diferentes. É normal no começo: o número segue o padrão com atraso. Mantenha os compromissos — a virada vem.`}</div></div>`;
}

  card.id='afJornada'; card.className='card pad-lg af-jornada';
  card.innerHTML=`<div class="af-jhead">
      <div><p class="eyebrow">Comece por aqui</p><h2 class="sec" style="margin:4px 0 0">Sua jornada, passo a passo</h2></div>
      <div class="af-jprog"><div class="af-jpct">${doneN}<span>/${st.length}</span></div><div class="af-jbar"><i style="width:${pct}%"></i></div></div></div>
    <p class="lead" style="margin:10px 0 16px">Não precisa saber por onde começar — eu te guio. Faça um passo de cada vez; cada botão leva você direto ao lugar certo.</p>
    <div class="af-steps">${rows}</div>
    <div class="af-jfoot"><a onclick="afReset()">Limpar meus dados e recomeçar do zero</a></div>`;
  v.insertBefore(card, v.firstChild);
}
function afReset(){
  if(!confirm('Isto apaga TODAS as informações salvas neste aparelho — diagnósticos, cartas, compromissos, plano, progresso e pacto — e recomeça do zero.\n\nNão dá para desfazer. Deseja continuar?')) return;
  try{ localStorage.removeItem('operacaoblindada:state:v1'); }catch(e){}
  try{ localStorage.clear(); }catch(e){}
  try{ if(window.OB && OB.signOut){ /* hospedado: encerra sessão para não re-sincronizar */ } }catch(e){}
  location.reload();
}


/* ===================================================================
   BOOT
   =================================================================== */
async function boot(){
  const raw=await Store.get(KEY);
  if(raw){ try{ S=JSON.parse(raw); }catch(e){ S=defaultState(); } }
  else S=defaultState();
  // migrate missing keys
  S={...defaultState(),...S};
  S.modules=S.modules||{}; S.trophies=S.trophies||{}; S.surveys=S.surveys||{}; S.tools=S.tools||{}; S.log=S.log||[]; S.visited=S.visited||{};
  S.diary=S.diary||[]; S.plan=S.plan||[]; S.notifs=S.notifs||[]; S.notes=S.notes||{}; S.deepTests=S.deepTests||{};
  S.pdca=S.pdca||[]; S.agenda=S.agenda||[]; S.suggestions=S.suggestions||[]; S.referrals=S.referrals||[]; S.unlocks=S.unlocks||{}; S.results=S.results||[];
  S.gestao=S.gestao||null; // inicializado sob demanda por G()
  S.streak=S.streak||0; S.bussola=S.bussola||null;
  S.level=levelForXp(S.xp);

  renderTabs();
  if(!S.name){
    appnavShow(false);
    renderOnboard();
    $('#view-onboard').classList.add('active');
  } else {
    appnavShow(true);
    touchStreak();
    renderTop();
    go('home');
  }
}
window.addEventListener('resize', ()=>{ if(current==='lesson') renderLesson(); });
OB.start().then(boot).then(function(){ if(window.obCheckUpdates) obCheckUpdates(); });
</script>
